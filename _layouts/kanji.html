---
layout: default
---
<article class="kanji-entry">
  <header class="kanji-header">
    {%- comment -%}
      大きな字形表示（必須要件）
      ・ページの front matter に `char: 憧` のように1文字を入れておく
      ・include で `<span class="kanji-glyph">字</span>` を出力
    {%- endcomment -%}
    {% include glyph.html c=page.char %}
    <h1 class="kanji-title">{{ page.char }} <small class="code">{{ page.unicode }}</small></h1>
  </header>

  {% include metadata-table.html %}

  <section class="kanji-notes">
    {{ content }}
  </section>
</article>
