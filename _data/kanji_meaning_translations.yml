塩:
  しお。: 소금.
  しおづけにする。: 소금에 절이다.
  気体元素の一つ。塩素。またその略。: 기체 원소의 하나. 염소. 또 그 준말.
  酸と塩基の中和で生じる化合物。塩類。: 산과 염기의 중화로 생기는 화합물. 염류.
