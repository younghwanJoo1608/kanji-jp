name: Build and Deploy Jekyll

on:
  push:
    branches: ["feat"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, pages: write, id-token: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }  # 커밋 기록 필요

      # 커밋 시간 수집 → _data/lastmod.json 생성
      - name: Generate lastmod data (commit times)
        run: |
          mkdir -p _data
          echo "{" > _data/lastmod.json
          first=1
          # 컬렉션 경로에 맞춰 필요 시 패턴 조정
          for f in $(git ls-files "_kanji/*.md"); do
            ts=$(git log -1 --pretty=format:%cI -- "$f" || true)
            # Jekyll 컬렉션 기본 permalink에 맞춰 URL 생성
            slug="$(basename "$f" .md)"
            url="/kanji/${slug}/"
            [ $first -eq 0 ] && echo "," >> _data/lastmod.json
            first=0
            printf '  "%s": "%s"\n' "$url" "$ts" >> _data/lastmod.json
          done
          echo "}" >> _data/lastmod.json

      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: _site
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
