---
歯:
  歯:
    ? "①動物の口の中に上下に並んではえ、食物をかみくだく器官。 ②①の形をしたもの。また、似たはたらきをするもの。 ③げたの裏にある垂直な二枚の板。"
    : "(1) 동물의 입안에 위아래로 나며 음식을 씹어 부수는 기관. (2) 이와 같은 모양이거나 비슷한 기능을 하는 것. (3) 나막신 밑바닥에 붙은 두 장의 세로판."
    "①年齢。とし。 ②年配。年ごろ。": "(1) 나이. 연령. (2) 연배. 나이 무렵."
  歯列:
    ? "① 口にある歯の並びぐあい、およびその列。歯ならび。歯なみ。② 歯が並んでいるように並ぶこと。転じて、同列に並ぶこと。〔布令必用新撰字引（1869）〕 〔史記‐陳杞世家〕"
    : "(1) 입안의 치아 배열과 그 줄. 치열. (2) 이가 늘어선 것처럼 나란히 서는 것. 나아가 같은 줄에 늘어섬."
  歯朶:
    シダ植物の総称。 羊歯(しだ): "[생물] 양치식물의 총칭."
  歯牙:
    "①歯ときば。 ②歯。 ③口さき。言論。": "(1) 이와 엄니. (2) 이. (3) 입끝. 말."
  歯齦:
    "「歯茎(はぐき)」に同じ。": 잇몸과 같음.
  羊歯:
    ? シダ植物の総称。正月の飾りに用いるウラジロを指すことが多い。シノブ・ワラビ・ゼンマイなどを含め、世界に約一万種。新年
    : "[생물] 양치식물의 총칭. 새해 장식에 쓰는 우라지로를 가리키는 경우가 많다."
  歯垢:
    ? 歯の表面にこびりついたよごれ。多くは、食物のかすを栄養にする微生物からなる。虫歯の原因になり、歯石の母体ともなる。歯くそ。
    : 치아 표면에 달라붙은 때. 대개 음식 찌꺼기를 영양으로 삼는 미생물로 이루어지며, 충치의 원인이 되고 치석의 바탕이 되기도 한다.
  歯序:
    年齢をもとにした順序。としの順。: 나이를 기준으로 한 순서. 나이순.
  歯槽膿漏:
    ? 炎症などによって歯の周囲の組織が破壊され、歯茎からうみや血が出たり、歯がぐらつく疾患の総称。口臭や抜け歯の原因になる。
    : 염증 등으로 치아 주위 조직이 파괴되어 잇몸에서 고름이나 피가 나거나 이가 흔들리는 질환의 총칭. 입 냄새와 치아 탈락의 원인이 된다.
  歯石:
    歯の表面についた歯垢(シコウ)が石灰化したもの。歯塩。: 치아 표면에 붙은 치태가 석회화된 것. 치석.
  鋸歯:
    ? "①のこぎり状の歯。 ②植物で葉のふちが、のこぎり状に細かく切れこみとがっていること。ケヤキ・ヤマザクラなど。"
    : "① 톱니 모양의 이. ② [생물] 식물의 잎 가장자리가 톱니처럼 잘게 갈라져 뾰족한 것."
  齲・齲歯:
    口内の細菌が作り出した乳酸によって歯の組織が侵食される病気。また、その歯。: "입안의 세균이 만들어 낸 젖산으로 치아 조직이 침식되는 병. 또는 그 치아."
  歯固め:
    ? "①昔、長寿を願って正月三が日の間、ダイコン・ウリ・押し鮎(あゆ)・イノシシの肉・鏡餅(かがみもち)などを食べた行事。近世には鏡餅を保存しておいて六月一日に食べる行事にもいう。 ②まだ歯の生えない乳児が、嚙(か)んだりしゃぶったりして歯茎をかためる玩具(ガング)。"
    : "① 옛날에 장수를 빌며 정월 초사흘 동안 무, 참외, 눌러 말린 은어, 멧돼지 고기, 가가미모치 등을 먹던 행사. 근세에는 가가미모치를 보관해 두었다가 6월 1일에 먹는 행사도 이른다. ② 아직 이가 나지 않은 영아가 물거나 빨며 잇몸을 단단하게 하는 장난감."
  歯嚙み:
    "①歯を強くかみ合わせること。 ②残念がること。はぎしり。": "① 이를 세게 악무는 것. ② 분해서 이를 악무는 것. 이를 갈기."
  歯痒い:
    思いどおりにならなくて、いらだたしい。じれったい。もどかしい。: 뜻대로 되지 않아 초조하고 답답하다. 안타깝다.
  歯軋り:
    ? "①睡眠中、歯を強くこすり合わせて音をたてること。 ②くやしくて歯を強くかみ合わせること。はがみ。"
    : "① 잠자는 동안 이를 세게 맞비벼 소리를 내는 것. ② 분해서 이를 세게 악무는 것."
  歯切れ:
    "①歯で食べ物をかみ切るときの感じ。 ②言い方の明確さの度合。": "① 이로 음식을 씹어 끊을 때의 느낌. ② 말투가 분명한 정도."
  歯茎:
    歯の根を包む筋肉で、粘膜におおわれている層。歯齦(シギン)。: 치아의 뿌리를 감싸는 조직으로, 점막에 덮여 있는 층. 잇몸.
死:
  死ぬ:
    ? "①生命がおわる。 ②生気がない。 ③役に立たなくなる。 ④勝負事で、相手にとられたりアウトになったりする。"
    : "(1) 생명이 끝나다. (2) 생기가 없다. (3) 쓸모없게 되다. (4) 승부에서 상대에게 잡히거나 아웃이 되다."
  死骸:
    死体。しかばね。: 시체. 주검.
  死刑:
    犯罪者の生命を絶つ、最も重い刑罰。: 범죄자의 생명을 끊는 가장 무거운 형벌.
  死去:
    人が死ぬこと。死んでこの世を去ること。死亡。 逝去: 사람이 죽는 것. 죽어서 세상을 떠나는 것. 사망.
  死守:
    命がけで守ること。必死に守ること。: 목숨을 걸고 지키는 것. 필사적으로 지키는 것.
  死期:
    "①死ぬとき。 ②命を投げだすべきとき。": "① 죽을 때. ② 목숨을 내놓아야 할 때."
  死活:
    死ぬことと生きること。死ぬか生きるか。: 죽는 것과 사는 것. 생사가 걸린 일.
  死灰復然:
    ? 一度衰えた勢力が再び盛り返すたとえ。また、一度収束したことが再発するたとえ。火の気のなくなった灰が再び燃えだす意から。「然」は「燃」に同じ。〈『史記』〉 寒灰復然
    : 한때 쇠퇴한 세력이 다시 살아나는 비유. 또는 한 번 가라앉은 일이 다시 일어나는 비유.
  死線:
    ? "①生きるか死ぬかの境。 ②牢獄(ロウゴク)などの周りに設けられ、越えると銃殺されるという限界の線。"
    : "① 생사의 갈림길. ② 감옥 등 주변에 설치되어 넘으면 총살된다는 한계선."
  死角:
    ? "①障害物のため見通しのきかない範囲。 ②鉄砲の構造上の理由や障害物のため、射程内でも弾丸の届かない区域。"
    : "① 장애물 때문에 보이지 않는 범위. ② 총기의 구조나 장애물 때문에 사정거리 안에서도 탄환이 닿지 않는 구역."
  死語:
    ? "①使われなくなった言葉。廃語。 活語 ②過去に使用された言語で、今では一般には使用されなくなったもの。古代ギリシャ語など。"
    : "① 더 이상 쓰이지 않게 된 말. 폐어. ② 과거에 쓰였으나 지금은 일반적으로 쓰이지 않는 언어."
  黒死病:
    ? ペスト菌の感染によっておこる感染症。ネズミについたノミにより媒介される。高熱を出し、死亡率が高い。
    : "[생물] 페스트균 감염으로 일어나는 감염병. 쥐에 붙은 벼룩이 매개하며, 고열이 나고 치명률이 높다."
氷:
  氷:
    ? "①水が冷えて氷点下の温度で固体になったもの。 ②「氷水」の略。 ①を削ってシロップなどをかけた食べ物。①②夏"
    : "(1) 물이 차가워져 빙점 아래에서 고체가 된 것. (2) 빙수의 준말. 얼음을 갈아 시럽 등을 끼얹은 음식."
    "①こおり。水がこおったもの。 ②ひょう。あられ。また、氷雨(ひさめ)。": "(1) 얼음. 물이 언 것. (2) 우박. 싸락눈. 또는 찬비."
  氷る:
    水分などが冷えて固まる。 冬: 수분 등이 차가워져 굳다. 얼다.
  氷室:
    天然の氷を夏までたくわえておくための部屋や穴。夏: 천연 얼음을 여름까지 저장해 두기 위한 방이나 구덩이.
  氷柱:
    水滴が次々にこおって垂れ下がり、棒状になったもの。垂氷(たるひ)。冬: 물방울이 차례로 얼어 아래로 늘어져 막대 모양이 된 것. 고드름.
  氷河:
    ? 高緯度の地方や高山の固まった万年雪が氷となり、低地に向かって流れるもの。大陸氷河と山岳氷河がある。
    : 고위도 지방이나 높은 산의 굳은 만년설이 얼음이 되어 낮은 곳으로 흘러내리는 것. 대륙빙하와 산악빙하가 있다.
  氷魚:
    アユの稚魚。体長約二～三(センチメートル)で半透明。琵琶(ビワ)湖産が有名。: "[생물] 은어의 치어. 몸길이는 약 2~3센티미터이고 반투명하다."
  氷州:
    大西洋北極圏付近の共和国。氷河・火山・温泉が多い。首都はレイキャビク。: "[나라] 대서양 북극권 부근의 공화국. 빙하, 화산, 온천이 많으며 수도는 레이캬비크."
  氷枕:
    氷をゴム製の袋に入れて、枕とするもの。水枕: 얼음을 고무 주머니에 넣어 베개로 쓰는 것. 얼음베개.
  氷菓子:
    牛乳・卵黄・砂糖・香料などをかきまぜ、空気を含ませながらこおらせた菓子。夏: 우유, 달걀노른자, 설탕, 향료 등을 섞어 공기를 머금게 하면서 얼린 과자.
  氷解:
    氷がとけるように、疑問や不満などがなくなること。: 얼음이 녹듯이 의문이나 불만 따위가 사라지는 것.
  氷雨:
    "①ひょう。夏 ②みぞれ。みぞれのような冷たい雨。あられ。冬": "① 우박. ② 진눈깨비. 진눈깨비처럼 차가운 비. 싸락눈."
決:
  決まる:
    ? "① 物事がある状態に定まって、変わらないようになる。決定する。決着がつく。② ( 「…にきまっている」の形で用いる ) 当然である。きっと…である。③ 態度や服装などがきちんとする。かしこまる。④ 物の型などがきちんとかっこうよくできる。ぴたりとはまる。⑤ 歌舞伎の演技や踊りなどで、最高潮に達したり、一区切りついたりしたとき、演者が動きを一瞬停止して、形をつける。⑥ 相撲、柔道、剣道などで、しかけたわざが相手にうまくかかる。勝負がきまる。⑦ 野球で、投手の投げたボールが思ったところに行く。⑧ 男女の仲がうまく成立する。安永～天明（一七七二‐八九）頃の江戸の流行語。⑨ きちんと無駄のない仕方である。つつましく暮らす。"
    : "(1) 일이 어떤 상태로 정해져 변하지 않게 되다. 결정되다. 결착이 나다. (2) 당연하다. 틀림없다. (3) 태도나 복장 등이 반듯해지다. (4) 형태나 자세가 보기 좋게 들어맞다. (5) 연기나 춤에서 절정이나 구분점에 이르러 동작을 멈추고 자세를 잡다. (6) 경기나 무도에서 건 기술이 제대로 걸리다. (7) 야구에서 투수가 던진 공이 의도한 곳으로 가다. (8) 남녀 관계가 잘 이루어지다. (9) 빈틈없이 절도 있는 방식이다."
  決める:
    "①決定する。明確に定める。 ②そうと思いこむ。判断する。 ③覚悟する。 ④決着をつける。": "(1) 결정하다. 분명하게 정하다. (2) 그렇게 여기다. 판단하다. (3) 각오하다. (4) 결말을 짓다."
  石決明:
    ミミガイ科の巻貝の総称。 鮑(あわび): "[생물] 전복류의 총칭."
  合決:
    ? 板を接(は)ぎ合わせるとき、板の端の厚みの半分ずつをけずり取って張り合わせる方法。ちがいはぎ。
    : 판자를 맞붙일 때 판자 끝 두께의 절반씩을 깎아 서로 맞물려 붙이는 방법.
  決別:
    いとまごいをしてきっぱり別れること。 「訣別」の書きかえ字。: 작별 인사를 하고 단호히 헤어지는 것.
  決壊:
    堤防などが破れてくずれること。また、切りくずすこと。 「決潰」の書きかえ字。: 제방 등이 터져 무너지는 것. 또는 잘라 무너뜨리는 것.
  決意:
    意志をしっかりと決めること。また、その覚悟。決心。: 뜻을 굳게 정하는 것. 또는 그 각오. 결심.
  決断:
    "①きっぱり決めること。 ②事の善し悪しを裁くこと。": "① 단호히 결정하는 것. ② 일의 옳고 그름을 판단하는 것."
  決然:
    覚悟を決めたさま。思いきったようす。: 각오를 굳힌 모양. 결연한 모습.
  決裂:
    切れさけること。意見がまとまらず、物別れに終わること。: 갈라져 터지는 것. 의견이 모이지 않아 결렬되는 것.
  決議:
    会議において、物事を決めること。また、決まった事柄。議決: 회의에서 일을 결정하는 것. 또는 결정된 사항.
  決起:
    決心して行動をおこすこと。 「蹶起」の書きかえ字。: 결심하고 행동을 일으키는 것. 궐기.
  溢決:
    川などの水があふれ、堤が切れること。: 강 등의 물이 넘쳐 제방이 터지는 것.
油:
  大殿油:
    宮殿などでともす灯火用の油。また、その灯火。: 궁전 등에서 켜는 등불용 기름. 또는 그 등불.
  油:
    ? "①燃えやすく水に溶けにくい液状の物質。石油やガソリン・植物油など。 ②活動の原動力になるもののたとえ。特に、酒を指す。"
    : "(1) 타기 쉽고 물에 잘 녹지 않는 액체 물질. 석유·가솔린·식물유 등. (2) 활동의 원동력이 되는 것을 비유하는 말. 특히 술을 가리킨다."
  油照り:
    薄曇りで風がなく、じりじりと照りつけて蒸し暑い天気。夏: 엷게 흐리고 바람이 없으며 햇볕이 내리쬐어 무더운 날씨.
  油凪:
    海面が、油を流したように波がなく平らになった状態。べたなぎ。: 해면이 기름을 흘린 듯 파도 없이 평평해진 상태. 아주 잔잔한 바다.
  油染みる:
    油や人体から出る脂肪などが染みついて汚れる。: 기름이나 사람 몸에서 나온 지방 등이 배어 더러워지다.
  油桃:
    モモの一品種。: "[생물] 복숭아의 한 품종."
  油点草:
    ユリ科の多年草。: "[생물] 백합과의 여러해살이풀."
  油然:
    盛んにわき起こるさま。: 힘차게 솟아오르는 모양.
  油田:
    石油を埋蔵・産出している地域。: 석유를 매장하고 산출하는 지역.
  油絵:
    油絵の具で画布や板に描いた絵。油彩。水彩画: 유화 물감으로 캔버스나 판에 그린 그림. 유채화.
  油菜:
    ? アブラナ科の二年草。古く中国から渡来し、栽培されてきた。春に黄色い花が咲き、種子からは菜種油をとる。若葉は食用。花は「菜の花」と呼ばれる。
    : "[생물] 배추과의 두해살이풀. 봄에 노란 꽃이 피고 씨에서는 유채기름을 얻으며 어린잎은 식용한다."
  油蟬:
    ? セミ科の昆虫。最も一般的なセミで、体は黒く、はねは褐色で、油の染みついたような斑紋(ハンモン)がある。木の上で「ジージー」とやかましく鳴く。夏
    : "[생물] 매미과의 곤충. 몸은 검고 날개는 갈색이며 기름이 밴 듯한 무늬가 있다."
波:
  乱波:
    "①乱暴者。あらくれ者。無頼漢。 ②忍びの者。スパイ。透波(すっぱ)": "(1) 난폭한 사람. 거친 사람. 무뢰한. (2) 숨어 활동하는 사람. 첩자."
  余波:
    "①風がやんだのちもしばらく静まらない波。 ②潮が引いてもまだ波打ち際に残る海水。": "(1) 바람이 그친 뒤에도 한동안 가라앉지 않는 물결. (2) 조수가 빠진 뒤에도 물가에 남아 있는 바닷물."
  波:
    ? "①水面に起こる起伏運動。 ②振動が伝わる現象。波動。 ③物事の動向に変化や動揺の起こる状態。 ④①の形に似た連続した起伏。"
    : "(1) 수면에 일어나는 기복 운동. (2) 진동이 전해지는 현상. 파동. (3) 사물의 동향에 변화나 동요가 일어난 상태. (4) 물결 모양과 비슷한 연속된 기복."
  波蘭:
    ヨーロッパ東部、バルト海の南岸にある共和国。首都はワルシャワ。: "[나라] 유럽 동부, 발트해 남쪽 연안에 있는 공화국. 수도는 바르샤바."
  透波:
    "①戦国時代、武家が野盗などを雇い使ったスパイ。間者。 ②盗人。すり。 ③うそ。うそつき。": "(1) 전국시대에 무가가 도적 등을 고용해 쓰던 첩자. 간자. (2) 도둑. 소매치기. (3) 거짓말. 거짓말쟁이."
  阿波:
    旧国名の一つ。現在の徳島県全域にあたる。阿州。: "[지명] 옛 국명의 하나. 현재의 도쿠시마현 전역에 해당한다."
  鯨波:
    ? "①昔、合戦のとき、戦闘開始を知らせるために全軍で発した合図の声。また、戦勝のときに発する喜びの声。 ②多くの人が一度に発する声。"
    : "(1) 옛날 전투 때 전투 시작을 알리기 위해 전군이 지르던 함성. 또는 승전 때 지르는 기쁨의 함성. (2) 많은 사람이 한꺼번에 지르는 소리."
  小波:
    水面に立つ小さい波。さざれなみ。: 수면에 이는 작은 물결. 잔물결.
  波斯:
    イランの旧称。: "[나라] 이란의 옛 이름."
  波路:
    船の通る道。航路・船路: 배가 지나는 길. 항로.
  波長:
    ? "①波動の隣り合う山と山、谷と谷の距離。位相の等しい二点間の距離。 ②考え方・感じ方の調子。"
    : "① 파동에서 이웃한 마루와 마루, 골과 골 사이의 거리. 위상이 같은 두 점 사이의 거리. ② 생각이나 느낌의 조화."
  波頭:
    "① 波の上。海上。② なみがしら。": "① 파도 위. 해상. ② 파도의 머리 부분."
  波風:
    "①波と風。風によって波が立つこと。 ②苦労の多いたとえ。また、もめごとのたとえ。": "① 파도와 바람. 바람 때문에 파도가 이는 것. ② 고생이 많음을 비유하는 말. 또는 분쟁의 비유."
注:
  注ぐ:
    "①液体が流れこむ。液体をつぎ入れる。 ②集中する。向ける。": "(1) 액체가 흘러 들어가다. 액체를 부어 넣다. (2) 집중하다. 향하게 하다."
    液体をそそぎ入れる。流しこむ。: 액체를 부어 넣다. 흘려 넣다.
  注す:
    "①液体をそそぎこむ。つぐ。 ②加え入れる。": "(1) 액체를 부어 넣다. 따르다. (2) 더하여 넣다."
  注解:
    本文に注をつけて、解釈すること。また、その解釈したもの。注釈 「註解」の書きかえ字。: 본문에 주를 달아 해석함. 또는 그 해석한 것. 주석.
  注記:
    "①注釈をつけること。また、その注釈。 ②物事を記録すること。": "(1) 주석을 붙임. 또는 그 주석. (2) 사물을 기록함."
  注射:
    血管などに針を刺し、薬液を体内に入れること。: 혈관 등에 바늘을 찔러 약액을 몸 안에 넣는 것.
  注意:
    ? "①心にとめること。気を配って集中すること。注目・留意 ②相手に気をつけるように言うこと。 ③危険に対する用心。警戒。"
    : "① 마음에 두는 것. 신경을 쓰고 집중하는 것. ② 상대에게 조심하라고 말하는 것. ③ 위험에 대비해 조심함. 경계."
  注文:
    ? "①品物をあつらえること。種類・数・寸法などを指定して作らせたり、送らせたりすること。 ②依頼のとき、希望や条件を示すこと。また、その希望や条件。 「註文」の書きかえ字。"
    : "① 물건을 주문하는 것. 종류, 수량, 치수 등을 지정해 만들게 하거나 보내게 하는 것. ② 의뢰할 때 희망이나 조건을 제시하는 것. 또는 그 희망이나 조건."
  注脚:
    本文中に小さく二行で挿入した注釈。割り注。: 본문 속에 작은 글씨 두 줄로 끼워 넣은 주석. 할주.
  注視:
    じっと見つめること。注目: 가만히 뚫어지게 보는 것. 주시.
  注連縄:
    神前や神事の場所にけがれが入らないように、張り巡らす縄。: 신 앞이나 신사 의식 장소에 부정한 것이 들어오지 못하도록 둘러치는 새끼줄.
  注連飾り:
    正月などに、門や神棚に注連縄を張って飾ること。また、その飾り。新年: 새해 등에 문이나 신단에 금줄을 쳐 장식하는 것. 또는 그 장식.
泳:
  泳ぐ:
    ? "①手足やひれなどを動かして、水面や水中を進む。 ②およいでいるような動作をする。 ③障害などをかきわけてたくみに進む。"
    : "(1) 손발이나 지느러미 등을 움직여 수면이나 물속을 나아가다. (2) 헤엄치는 듯한 동작을 하다. (3) 장애물 등을 헤치며 능숙하게 나아가다."
  競泳:
    一定の距離をきめられた泳法で泳いで、その速さをきそう競技。水泳の競争。夏: 일정한 거리를 정해진 영법으로 헤엄쳐 속도를 겨루는 경기. 수영 경기.
  背泳:
    ? 泳法の一つ。あおむけになり、両手を交互に頭上にまわして水をかき、両足はばた足で進む。せおよぎ。バックストローク。
    : 영법의 하나. 누운 자세로 양손을 번갈아 머리 위로 돌려 물을 젓고, 두 발은 발차기로 나아간다. 배영.
  遊泳:
    "①泳ぐこと。水泳 夏 ②世渡りのたとえ。処世": 헤엄치는 것. 수영.
  泳者:
    泳ぐ人。泳ぎ手。: 헤엄치는 사람. 수영하는 사람.
  游泳:
    "①およぐこと。水泳 夏 ②世渡りのたとえ。処世": "① 헤엄치는 것. 수영. ② 세상을 살아가는 일의 비유. 처세."
  遠泳:
    海や川などで、長距離を泳ぎ続けること。また、その競技。: 바다나 강 등에서 긴 거리를 계속 헤엄치는 것. 또는 그 경기.
洋:
  東洋:
    ? "① ウラル山脈、カスピ海、黒海、地中海、紅海を結ぶ線以東のアジア諸国の総称。特にその東部および南部、すなわち日本・朝鮮・中国・インド・インドネシアなどの称。⇔西洋。② 中国で、特に日本をさしていう語。"
    : "(1) 우랄산맥ㆍ카스피해ㆍ흑해ㆍ지중해ㆍ홍해를 잇는 선 동쪽의 아시아 여러 나라를 통틀어 이르는 말. 특히 일본ㆍ한국ㆍ중국ㆍ인도ㆍ인도네시아 등 동부와 남부 지역을 가리킨다. (2) 중국에서 특히 일본을 가리키던 말."
  洋弓:
    ? "①西洋で始まり発達した弓術。また、その弓。西洋式の弓。 ②①を使って矢を標的に当て、得点を争う競技。アーチェリー。"
    : "(1) 서양에서 시작되어 발달한 궁술. 또는 그 활. 서양식 활. (2) 그 활로 화살을 표적에 맞혀 점수를 겨루는 경기. 양궁."
  洋灯:
    "①石油などに灯心をひたして燃やす照明器具。 ②電灯。あかりの総称。": "(1) 석유 등에 심지를 담가 태우는 조명 기구. (2) 전등. 등불의 총칭."
  洋傘:
    金属性の細い骨に布やビニールを張り、持ち手をつけた雨傘。こうもりがさ。: 금속제 가는 살에 천이나 비닐을 씌우고 손잡이를 붙인 우산.
  洋墨:
    文字を書いたり印刷したりするときに用いる色のついた液体。インキ。: 글씨를 쓰거나 인쇄할 때 쓰는 색이 있는 액체. 잉크.
  洋妾:
    明治時代、日本に来ていた西洋人の妾(めかけ)になった女性をさげすんでいった語。: 메이지 시대에 일본에 온 서양인의 첩이 된 여성을 낮잡아 이르던 말.
  洋杯:
    水などを飲むための、円筒形でガラス製の容器。: 물 등을 마시기 위한 원통형 유리 용기. 컵.
  洋洋:
    ? "①水があふれんばかりに豊かで、果てしなく広がっているさま。 ②前途がひらけて、将来が希望に満ちているさま。"
    : "① 물이 넘칠 만큼 풍부하고 끝없이 넓게 펼쳐진 모양. ② 앞길이 열려 장래가 희망으로 가득한 모양."
  洋琴:
    ? 鍵盤(ケンバン)楽器の一種。大きな箱の中に金属の弦をはり、鍵盤をたたくとハンマーが弦を打って音を出す楽器。
    : 건반악기의 한 종류. 큰 상자 안에 금속 현을 치고, 건반을 누르면 해머가 현을 쳐 소리를 내는 악기.
  洋酒:
    ? オオムギ・ライムギなどを発酵させた液に、ネズの果実で香りをつけたアルコール度の高い蒸留酒。多く、カクテルの材料に用いる。
    : 보리나 호밀 등을 발효시킨 액에 주니퍼 열매로 향을 낸 도수가 높은 증류주. 주로 칵테일 재료로 쓴다.
  洋銀:
    ? "①銅・ニッケル・亜鉛からなる合金。銀白色でさびにくく、食器・装飾品・医療機器などに使用。 ②幕末に日本に入ってきた西洋の銀貨。"
    : "① 구리, 니켈, 아연으로 이루어진 합금. 은백색이고 녹슬기 어려워 식기, 장식품, 의료 기기 등에 쓰인다. ② 막말기에 일본에 들어온 서양 은화."
  洋風:
    西洋風。洋式。和風: 서양풍. 서양식.
  遠洋:
    陸地から遠く離れた海。: 육지에서 멀리 떨어진 바다. 원양.
  洋刀・洋剣:
    西洋風の細身の刀。第二次世界大戦まで、軍人や警官が腰に下げていた。: 서양식의 가느다란 칼. 제2차 세계대전 무렵까지 군인이나 경찰이 허리에 차고 다녔다.
流:
  一流:
    ? "①一つの分野で第一等の地位。他より抜きんでてすぐれていること。 ②他に類のない独特な流儀。 ③学問・芸術・武道などの一つの流派。"
    : "(1) 한 분야에서 첫째가는 지위. 남보다 뛰어나게 훌륭한 것. (2) 남다른 독특한 방식. (3) 학문ㆍ예술ㆍ무도 등의 한 유파."
  流す:
    ? "①流れさせる。 ②たらす。 ③浮かべただよわす。 ④広める。 ⑤洗い落とす。 ⑥気にとめないようにする。 ⑦タクシーなどが客を求めて走る。 ⑧質に入れたものなどの所有権を捨てる。 ⑨流罪にする。 ⑩流産させる。 ⑪ひそかに横流しする。 ⑫計画などを成立させない。 ⑬軽く運動をする。"
    : "(1) 흐르게 하다. (2) 흘리다. (3) 물에 띄워 떠가게 하다. (4) 널리 퍼뜨리다. (5) 씻어 내리다. (6) 마음에 두지 않다. (7) 택시 등이 손님을 찾아 돌아다니다. (8) 전당 잡힌 물건 등의 소유권을 포기하다. (9) 유배 보내다. (10) 유산시키다. (11) 몰래 빼돌리다. (12) 계획 등을 성립하지 못하게 하다. (13) 가볍게 운동하다."
  流れる:
    ? "①低いほうに移動する。 ②垂れる。 ③ただよい動く。 ④通過する。 ⑤経過する。 ⑥伝わる。 ⑦さすらう。 ⑧それる。 ⑨姿勢がくずれる。 ⑩傾く。 ⑪質に入れたものなどの所有権がなくなる。 ⑫だめになる。中止する。 ⑬流産する。"
    : "(1) 낮은 곳으로 이동하다. (2) 흘러내리다. (3) 떠다니며 움직이다. (4) 통과하다. (5) 시간이 지나가다. (6) 전해지다. (7) 떠돌다. (8) 빗나가다. (9) 자세가 흐트러지다. (10) 기울다. (11) 전당 잡힌 물건 등의 소유권이 없어지다. (12) 무산되다. 중지되다. (13) 유산되다."
  海流:
    一定の方向に移動する海水の大きな流れ。暖流と寒流がある。: 일정한 방향으로 이동하는 바닷물의 큰 흐름. 난류와 한류가 있다.
  嫡流:
    本家の血筋。正統の家系。嫡統庶流: 본가의 혈통. 정통 가계.
  流会:
    会合がとりやめになること。: 회합이 취소되는 것.
  流儀:
    ? "①物事の独特のやり方。しきたり。 ②家や流派などに古くから伝えられている特有の型や方法。"
    : "① 사물의 독특한 방식. 관습. ② 집안이나 유파 등에 오래전부터 전해지는 고유한 형식이나 방법."
  流刑:
    罪人を遠い土地や離れ島に追放する昔の刑罰。流罪: 죄인을 먼 땅이나 외딴섬으로 추방하던 옛 형벌. 유배.
  流弾:
    ながれだま。それだま。流丸。: 빗나가 날아온 탄환. 유탄.
  流暢:
    言葉がすらすらと出て、とどこおらないこと。また、そのさま。: 말이 술술 나와 막힘이 없는 것. 또는 그런 모양.
  流民:
    故郷や故国を離れて、さすらい歩く人々。流浪(ルロウ)の民。流氓(リュウボウ): 고향이나 고국을 떠나 떠돌아다니는 사람들. 유랑민.
  流水:
    "① 流れる水。水の流れ。地学では河川を流れる水。川。② 「くるま（車）」の異称。": "① 흐르는 물. 물의 흐름. 지학에서는 하천을 흐르는 물. 강. ② 수레의 다른 이름."
  流行:
    その時々にもてはやされている物事。その時代の人々の好みや風潮。: 그때그때 유행하는 사물. 그 시대 사람들의 취향이나 풍조.
    "①社会に一時的に広く行われること。また、そのもの。 ②病気などが一時的に広がること。": "① 사회에 일시적으로 널리 퍼지는 것. 또는 그 자체. ② 병 등이 일시적으로 널리 퍼지는 것."
  流言:
    根拠のないうわさをいいふらすこと。また、そのうわさ。ねなしごと。浮言。流説。るげん。: 근거 없는 소문을 퍼뜨리는 것. 또는 그 소문. 유언비어.
消:
  消える:
    ? "①見えなくなったり聞こえなくなったりする。 ②目の前からいなくなる。 ③感情がおさまる。 ④火が燃えなくなる。"
    : "(1) 보이지 않거나 들리지 않게 되다. (2) 눈앞에서 없어지다. (3) 감정이 가라앉다. (4) 불이 타지 않게 되다."
  消す:
    "①存在をなくす。見えなくしたり聞こえなくしたりする。 ②スイッチを切る。 ③殺す。": "(1) 존재를 없애다. 보이지 않거나 들리지 않게 하다. (2) 스위치를 끄다. (3) 죽이다."
  消渇:
    "①のどがかわき、尿の出ない病気。かちの病(やまい)。 ②女性の淋病(リンビョウ)の俗称。": "(1) 목이 마르고 소변이 나오지 않는 병. (2) 여성 임질의 속칭."
  消火:
    火や火事を消すこと。 鎮火(チンカ): 불이나 화재를 끄는 것.
  消化:
    ? "①体内に取り入れた食物を分解し、吸収しやすい状態に変えるはたらき。 ②読んだり聞いたりしたものを理解して、自分のものとすること。 ③物事を残さず処理すること。"
    : "① 몸 안에 들어온 음식을 분해해 흡수하기 쉬운 상태로 바꾸는 작용. ② 읽거나 들은 것을 이해해 자기 것으로 만드는 것. ③ 일을 남김없이 처리하는 것."
  消夏:
    夏の暑さをしのぐこと。 避暑 夏 「銷夏」の書きかえ字。: 여름 더위를 피하거나 견디는 것. 피서.
  消失:
    消えてなくなること。失(う)せること。: 사라져 없어지는 것. 소실.
  消梨:
    ナシの一品種。果汁がきわめて多い。: "[생물] 배의 한 품종. 과즙이 매우 많다."
  消極:
    自ら進んで行動を起こさないこと。控えめであること。 積極: 스스로 나서서 행동하지 않는 것. 소극적인 것.
  消炎:
    患部の炎症を抑え、とり去ること。: 환부의 염증을 억제하고 없애는 것.
  消閑:
    ひまをしのぐこと。ひまつぶし。: 한가한 시간을 달래는 것. 심심풀이.
  雪消・雪解:
    雪がとけ、消えること。雪どけ。: 눈이 녹아 사라지는 것. 눈 녹음.
深:
  深い:
    ? "①表面や外から底や奥までの距離が長いさま。 ②程度がひととおりでなく大きいさま。 ③色、濃度などが濃いさま。 ④物事の奥まで理解し、十分なさま。 ⑤密に生えている。 ⑥特別に親交のあること。 ⑦時がたけなわなこと。"
    : "(1) 표면이나 바깥에서 바닥이나 안쪽까지의 거리가 긴 모양. (2) 정도가 보통이 아니고 큰 모양. (3) 색이나 농도 등이 짙은 모양. (4) 사물의 깊은 데까지 이해해 충분한 모양. (5) 빽빽하게 나 있다. (6) 특별히 친분이 깊다. (7) 때가 한창이다."
  深ける:
    その時や季節になってから、だいぶ時が過ぎる。たけなわになる。: 그때나 계절이 된 뒤 시간이 꽤 지나 한창이 되다.
  深まる:
    物事の程度が深くなること。: 사물의 정도가 깊어지는 것.
  深める:
    "[ 文語形 ]ふか・む 深くする。思いを深くする。心深く思う。": 깊게 하다. 생각이나 마음을 깊게 하다.
  深淵:
    "①深いふち。川などの深み。 深(シンタン) ②物事の奥深いところ。": "(1) 깊은 못. 강 등의 깊은 곳. (2) 사물의 매우 깊은 곳."
  深紅:
    濃い赤色。まっか。: 짙은 붉은색. 새빨간 색.
  深遠:
    内容や意味が奥深くてはかり知れないさま。 深奥・高遠: 내용이나 의미가 깊고 헤아리기 어려운 모양.
  深交:
    深い交際。また、つきあいが深くかたいこと。: 깊은 교제. 또는 사귐이 깊고 굳건함.
  深刻:
    ? "①事態が差し迫って重大なこと。程度がはなはだしく重大なこと。 ②強く心にきざみつけられること。"
    : "① 사태가 절박하고 중대한 것. 정도가 몹시 심각한 것. ② 마음에 강하게 새겨지는 것."
  深化:
    物事の程度などが深まること。深めること。また深刻になること。: 사물의 정도 등이 깊어지는 것. 깊게 하는 것. 또는 심각해지는 것.
  深奥:
    奥深いさま。また物事の奥深いところ。 深遠: 깊고 그윽한 모양. 또는 사물의 깊숙한 곳.
  深更:
    夜更け。真夜中。 深夜: 깊은 밤. 한밤중.
  深海:
    "①深い海。海の深いところ。 ②水深二〇〇(メートル)以上の深い海。 ①②浅海": "① 깊은 바다. 바다의 깊은 곳. ② 수심 200미터 이상의 깊은 바다."
  深手・深傷:
    深い傷。大きなけが。傷が大きいこと。重傷。: 깊은 상처. 큰 부상. 상처가 큰 것. 중상.
  深山:
    奥山。人里はなれた奥深い山。: 깊은 산. 인가에서 멀리 떨어진 깊숙한 산.
  深山颪:
    奥深い山から吹きおろす強い風。: 깊은 산에서 아래로 세차게 불어 내려오는 바람.
  深山樒:
    ? ミカン科の常緑低木。山地に自生し、春に白い小花をつける。球形の実は赤く熟し美しいが有毒。
    : "[생물] 운향과의 상록 관목. 산지에 자생하며 봄에 흰 작은 꽃이 피고, 둥근 열매는 붉게 익어 아름답지만 독이 있다."
温:
  微温湯:
    "①低い温度の湯。 ②刺激や緊張のない状態のたとえ。": "(1) 온도가 낮은 물. 미지근한 물. (2) 자극이나 긴장이 없는 상태의 비유."
  温い:
    心地よくあたたかい。ぬくもりを感じる。 春: 기분 좋게 따뜻하다. 온기를 느끼다.
    "①適度な温度から少し低い。 ②対処がゆるやかだ。手ぬるい。": "(1) 알맞은 온도보다 조금 낮다. (2) 대처가 느슨하다. 미온적이다."
  温か:
    ? "① 外気や物の温度が低くないさま。熱があるさま。(イ) 寒くなくて気持のよいさま。また、冷たくなくて気持のよいさま。気候や温度が程よいさま。《 季語・春 》(ロ) あついさま。熱気、暑気のあるさま。(ハ) 衣類などが、それを身につけたとき、体をあたためて心地よさそうであるさま。② 財産が豊かであるさま。経済的にゆとりがあるさま。③ 物事がおだやかにすらすらとゆくさま。④ いい気なさま。人を馬鹿にしたさま。ずうずうしく、こしゃくなさま。⑤ 相手への態度がきびしくないさま。また、愛情がこまやかなさま。思いやりがあるさま。⑥ 色あいがやわらかく、冷たい感じがしないさま。"
    : "(1) 바깥 공기나 물건의 온도가 낮지 않은 모양. 춥거나 차갑지 않아 기분 좋은 모양. 또는 열기나 더위가 있는 모양. (2) 재산이 넉넉하고 경제적으로 여유가 있는 모양. (3) 일이 온화하고 순조롭게 진행되는 모양. (4) 태도가 뻔뻔하고 건방진 모양. (5) 상대를 대하는 태도가 엄하지 않고, 애정과 배려가 있는 모양. (6) 색감이 부드러워 차가운 느낌이 나지 않는 모양."
  温かい:
    ? "①物の温度がほどよい高さである。 ②愛情が満ちていて情け深い。 ①②冷たい ③金銭が満足できるほどにある。寒い"
    : "(1) 물건의 온도가 알맞게 높다. (2) 애정이 가득하고 인정이 깊다. (3) 돈이 넉넉할 만큼 있다."
  温ねる:
    復習する。よみがえらせる。（温故知新）(ふる): 복습하다. 되살려 익히다.
  温まる:
    ? "① 熱を帯びる。あたたかくなる。② ( ふところがあたたかくなるの意から ) 物や金銭が豊かになる。また、他動詞的に用いて、金品などを手に入れる。"
    : "(1) 따뜻해지다. 온기가 돌다. (2) 돈 등이 들어와 넉넉해지다."
    ? "① あたたまる。あたたかくなる。ぬくとまる。ぬくもる。ぬくむ。② 金銭などが手にはいり豊かになる。ぬくもる。"
    : "(1) 따뜻해지다. 온기가 돌다. (2) 돈 등이 들어와 넉넉해지다."
  温める:
    ? "①物の温度を適度な高さまで上げる。冷ます・冷やす ②途絶えていたつきあいを回復する。 ③こっそりと自分のものにする。 ④しばらく自分の手もとにおく。"
    : "(1) 물건의 온도를 알맞은 높이까지 올리다. (2) 끊어졌던 교제를 회복하다. (3) 몰래 자기 것으로 삼다. (4) 한동안 자기 손에 두다."
    あたためる。: 따뜻하게 하다.
  微温い:
    "①少しあたたかい。 ②ゆるやかであるさま。きびしくない。": "① 조금 따뜻하다. 미지근하다. ② 느슨한 모양. 엄격하지 않다."
  温厚:
    ? "① 人あたりがやわらかくてまじめなさま。おだやかで情け深いさま。② おだやかでおちついたさま。"
    : "① 사람을 대하는 태도가 부드럽고 성실한 모양. 온화하고 인정이 깊은 모양. ② 온화하고 차분한 모양."
  温州:
    中国浙江(セッコウ)省南部の都市。絹織物などが特産で、茶やミカンの集散地。: "[지명] 중국 저장성 남부의 도시. 견직물 등이 특산이며 차와 귤의 집산지."
  温州蜜柑:
    ミカンの一品種。日本原産。一般にミカンと呼ばれているもの。酸味と種が少なく、美味。: "[생물] 귤의 한 품종. 일본 원산으로, 일반적으로 귤이라 부르는 것. 산미와 씨가 적고 맛이 좋다."
  温床:
    ? "①生長を早めるため、人工的に温度を高めた苗床(なえどこ)。冷床 ②よくない物事や風潮が発生しやすい環境。"
    : "① 생장을 빠르게 하려고 인공적으로 온도를 높인 모판. ② 좋지 않은 일이나 풍조가 생기기 쉬운 환경."
  温故:
    ? "( 「論語‐為政」の「温レ故而知レ新、可二以為一レ師矣」による。「故(ふる)きを温(たず)ねる」の意 ) 昔のことを調べること。歴史、由来を求めること。"
    : 옛일을 살펴보는 것. 역사나 유래를 찾아보는 것.
  温気:
    むっとするようなあたたかい空気。むし暑い空気。: 후텁지근하게 따뜻한 공기. 무더운 공기.
港:
  桑港:
    アメリカ合衆国のカリフォルニア州にある港湾都市。: "[지명] 미국 캘리포니아주에 있는 항만 도시."
  港:
    湾や河口につくられた、船が安全に出入り・停泊できる所。船着き場。: 만이나 하구에 만들어진, 배가 안전하게 드나들고 정박할 수 있는 곳. 선착장.
  要港:
    軍事・交通・輸送などの面で、重要なみなと。: 군사ㆍ교통ㆍ수송 등의 면에서 중요한 항구.
  香港:
    ? 中国の特別行政区。広東(カントン)省の南にある九竜(カオルン)半島と対岸の香港島などからなる。貿易・金融・観光業が盛ん。一九世紀半ば以降イギリスの直轄植民地だったが一九九七（平成九）年、中国に返還された。
    : "[지명] 중국의 특별행정구. 광둥성 남쪽의 주룽반도와 그 맞은편 홍콩섬 등으로 이루어지며, 무역ㆍ금융ㆍ관광업이 발달했다. 19세기 중반 이후 영국 직할 식민지였으나 1997년에 중국에 반환되었다."
  定繫港:
    その船舶が、おもに繫留する港。船籍港。: 그 선박이 주로 계류하는 항구. 선적항.
  帰港:
    船が出発した港に戻ること。出港: 배가 출발했던 항구로 돌아오는 것. 귀항.
  星港:
    シンガポール共和国の首都。貿易港・工業都市として発展。: "[지명] 싱가포르 공화국의 수도. 무역항이자 공업 도시로 발전했다."
  母港:
    その船が出発した港。また、本拠地とする港。: 그 배가 출발한 항구. 또는 본거지로 삼는 항구.
  河港:
    河口または川岸に造られた港。河口港。海港: 하구 또는 강가에 만든 항구. 하항.
  港口:
    港の出入り口。みなとぐち。: 항구의 출입구.
  港湾:
    船が停泊し、乗客の乗り降りや荷物のあげおろしの設備がある海域。: 배가 정박하고 승객의 승하선이나 화물 하역 시설이 있는 해역.
  空港:
    航空輸送のため公共の用に供する場所。エアポート。〔現代語大辞典（1932）〕: 항공 수송을 위해 공공용으로 제공되는 장소. 공항.
  築港:
    交通や運輸の便をはかるために、船舶を停泊させる港をきずくこと。: 교통과 운수의 편의를 위해 선박을 정박시킬 항구를 만드는 것.
  鎖港:
    ? 港を閉じて船の出入りをさせないこと。また、外国船の出入りを禁止し、外国との貿易をしないこと。 開港
    : 항구를 닫아 배가 드나들지 못하게 하는 것. 또는 외국 선박의 출입을 금지하고 외국과 무역하지 않는 것.
湖:
  湖:
    陸に囲まれたくぼ地に水をたたえた所。池や沼よりも大きく深い。: 육지로 둘러싸인 움푹한 곳에 물이 괸 곳. 연못이나 늪보다 크고 깊다.
  湖畔:
    湖のほとり。湖の水際。湖のあたり。: 호수의 물가. 호숫가.
  鹹湖:
    ? 塩分を含んだ湖。水一(リットル)中に五〇〇(ミリグラム)以上の塩分を含むもの。鹹水湖。塩湖淡水湖
    : 염분을 포함한 호수. 물 1리터 중 염분이 500밀리그램 이상 들어 있는 것. 염수호.
  江湖:
    世の中。世間。社会。: 세상. 세간. 사회.
  湖沼:
    湖と沼。: 호수와 늪.
  湖海の士:
    在野の豪快な気性をもつ人物。〈『三国志』〉: 재야에 있으면서 호방한 기질을 지닌 인물.
湯:
  微温湯:
    "①低い温度の湯。 ②刺激や緊張のない状態のたとえ。": "(1) 온도가 낮은 물. 미지근한 물. (2) 자극이나 긴장이 없는 상태의 비유."
  湯:
    "①水を沸かして熱くしたもの。 ②銭湯。風呂(フロ)。 ③温泉。いでゆ。": "(1) 물을 끓여 뜨겁게 한 것. (2) 대중목욕탕. 목욕탕. (3) 온천."
  湯女:
    "①温泉宿で客の接待をする女。 ②江戸時代、湯屋にいた遊女。": "(1) 온천 여관에서 손님을 접대하는 여자. (2) 에도 시대 목욕탕에 있던 유녀."
  湯帷子:
    ? 昔、入浴の時に身につけた単衣(ひとえ)の着物。のちに入浴後も水気を取るために着るようになった。ゆかた。湯具・湯巻 夏
    : 옛날에 목욕할 때 몸에 걸치던 홑겹 옷. 뒤에는 목욕 뒤 물기를 닦기 위해 입게 되었으며, 유카타의 원형이 되었다.
  湯治:
    温泉に入って、病気などの療養をすること。: 온천에 들어가 병 등을 요양하는 것.
  蕎麦湯:
    "①そばをゆでたあとの湯。そばつゆに入れて飲む。 ②そば粉を熱湯で溶いた飲み物。冬": "(1) 메밀국수를 삶은 뒤의 물. 장국에 넣어 마신다. (2) 메밀가루를 뜨거운 물에 푼 음료."
  探湯:
    ? 古代の裁きの方法。神に誓って、熱湯に手を入れさせ、火傷(やけど)をしたものは邪、火傷をしなかったものは正とした。
    : 고대의 재판 방법. 신에게 맹세하게 한 뒤 끓는 물에 손을 넣게 하여, 화상을 입으면 그르다고 하고 입지 않으면 옳다고 판정했다.
  湯治場:
    病気やけがなどの療養をする温泉場。: 병이나 상처 등을 요양하는 온천장.
  白湯:
    水を沸かしただけで何も加えない湯。: 물만 끓이고 아무것도 넣지 않은 더운물.
  盟神探湯:
    ? 古代、神に誓約してから熱湯に手を入れさせ、火傷(やけど)を負ったものを邪とし、火傷を負わないものを正とした裁きの方法。
    : 고대에 신에게 맹세한 뒤 끓는 물에 손을 넣게 하여, 화상을 입으면 그르다고 하고 입지 않으면 옳다고 판정하던 재판 방법.
  素湯:
    水を沸かしただけで何も入れていない、飲むための湯。: 물만 끓이고 아무것도 넣지 않은, 마시기 위한 더운물.
  誓湯:
    ? 古代の裁判の方法。神に誓約して熱湯に手を入れさせ、火傷(やけど)を負ったものを邪とし、負わないものを正とした。くがたち。
    : 고대의 재판 방법. 신에게 맹세하고 끓는 물에 손을 넣게 하여, 화상을 입으면 그르다고 하고 입지 않으면 옳다고 판정했다.
  湯浴み:
    風呂(フロ)に入ること。入浴。湯に入り、体を温め洗うこと。: 목욕탕에 들어가는 것. 입욕. 더운물에 들어가 몸을 데우고 씻는 것.
漢:
  漢:
    ? "①中国の古称。中国古代の王朝名から。 ②中国やその他の外国から渡来したことを表す語。接頭語的に用いる。"
    : "(1) 중국의 옛 이름. 중국 고대 왕조 이름에서 온 말. (2) 중국이나 그 밖의 외국에서 건너왔음을 나타내는 말. 접두어처럼 쓴다."
  漢人:
    古代、中国から渡来した人々。また、その子孫。漢氏(あやうじ)。: 고대에 중국에서 건너온 사람들. 또는 그 자손.
  漢学:
    ? "① 日本で、伝統的な中国文化すべてを研究対象とする学問の総称。② 中国、漢・唐時代の学問および学風。後漢の鄭玄(じょうげん)によって大成され、訓詁(くんこ)を重んじ、実証的な学風をもつ。清の恵棟、戴震などによって復興され、考証学の基礎となった。⇔宋学"
    : "(1) 일본에서 전통 중국 문화 전반을 연구 대상으로 삼는 학문의 총칭. (2) 중국 한ㆍ당 시대의 학문과 학풍. 훈고를 중시하고 실증적인 학풍을 지닌다."
  漢才:
    漢学の才能。漢学に通じること。: 한학의 재능. 한학에 통달함.
  漢織:
    雄略天皇の時代に、中国から渡来したといわれる機織りの技術者。: 유랴쿠 천황 시대에 중국에서 건너왔다고 전해지는 직조 기술자.
  悪漢:
    悪事をはたらく男。わるもの。: 나쁜 짓을 하는 남자. 악한.
  没分暁漢:
    道理をわきまえない人。がんこで聞き分けのない人。: 도리를 모르는 사람. 완고하고 말을 알아듣지 않는 사람.
  漢口:
    ? 中国、湖北省武漢市の一地区。漢水が長江へ合流する地点の北岸に位置し、天津条約により開港した貿易港。京広鉄道が通じる。武漢三鎮の一つ。漢。
    : "[지명] 중국 후베이성 우한시의 한 지역. 한수가 장강에 합류하는 지점의 북안에 있는 무역항."
  漢堡:
    ドイツ北部の工業都市。エルベ川下流にあり、貿易港としても有名。: "[지명] 독일 북부의 공업 도시. 엘베강 하류에 있으며 무역항으로도 유명하다."
  漢竹:
    中国から渡来したタケ。カンチク・マダケ・ハチクなど。: "[생물] 중국에서 전래된 대나무. 한죽, 왕대, 솜대 등을 이른다."
  漢音:
    ? 漢字の音の一種。唐代の長安付近の音が、遣唐使などによって伝えられたもの。「日」を「ジツ」、「兄」を「ケイ」と読む類。
    : 한자음의 한 종류. 당나라 장안 부근의 발음이 견당사 등을 통해 전해진 것.
  羅漢松:
    ? マキ科の常緑高木。暖地に自生。葉は線形で先がとがる。秋、球形で白緑色の果実をつける。果実の下には球形の花床が赤紫色に熟し、食べられる。
    : "[생물] 나한송과의 상록 교목. 따뜻한 지방에 자라며, 가을에 둥근 흰녹색 열매를 맺는다."
  羅漢柏:
    ヒノキ科の常緑高木。: "[생물] 편백나무과의 상록 교목."
  雲漢:
    あまのがわ。銀河。天漢・天河: 은하수.
炭:
  炭:
    "①木材をむし焼きにして作った燃料。木炭。 ②木が燃え残って黒くなったもの。冬": "(1) 목재를 찌듯이 구워 만든 연료. 목탄. (2) 나무가 타다 남아 검게 된 것."
  炭坑:
    石炭を掘り出すために掘ったあな。石炭坑。: 석탄을 캐내기 위해 판 구덩이. 탄갱.
  炭塵:
    炭坑内の空気中にただよう、細かい石炭の粉末。: 탄갱 안의 공기 중에 떠다니는 미세한 석탄 가루.
  炭水化物:
    ? 炭素・水素・酸素の三元素からなる化合物で、糖類・でんぷん・セルロースなどの総称。動物の主要な栄養素の一つ。含水炭素。
    : 탄소ㆍ수소ㆍ산소 세 원소로 이루어진 화합물로, 당류ㆍ녹말ㆍ셀룰로스 등의 총칭. 동물의 주요 영양소 중 하나.
  薪炭:
    たきぎと、すみ。燃料。: 땔나무와 숯. 연료.
  採炭:
    石炭を掘ってとること。石炭を採掘すること。: 석탄을 파내어 캐는 것. 석탄을 채굴하는 것.
  炭疽病:
    ? 炭疽菌が原因で発病する感染症。ウシ・ウマ・ヒツジなどに多く発生するが、人間にも感染する。内臓がはれ、敗血症を起こす。炭疽。
    : "[생물] 탄저균 때문에 발병하는 감염병. 소, 말, 양 등에 많이 발생하지만 사람에게도 감염된다."
  炭礦:
    炭鉱: 탄광.
  炭素:
    ? 高温では燃えて二酸化炭素となる元素。天然には石炭・ダイヤモンドなどが単体として存在する。
    : 고온에서 타면 이산화탄소가 되는 원소. 자연계에는 석탄이나 다이아몬드 등으로 단체 상태로 존재한다.
  炭酸:
    二酸化炭素が水にとけてできる弱い酸。: 이산화탄소가 물에 녹아 생기는 약한 산.
  炭鉱:
    石炭を採掘する鉱山。 「炭礦」の書きかえ字。: 석탄을 채굴하는 광산. 탄광.
  褐炭:
    質のよくない暗褐色の石炭。燃やすとすすが多く出る。: 질이 좋지 않은 암갈색 석탄. 태우면 그을음이 많이 난다.
  炭取・炭斗:
    炭を小出しにしておく容器。すみいれ。: 숯을 조금씩 꺼내 쓰도록 담아 두는 그릇.
物:
  物:
    ? "①触ったり見たりできる形を備えた対象。物体や物質。また、その品質。 ②動作の対象を漠然という語。 ③取り立てていう価値のある対象。 ④神仏・鬼・悪霊など、超人間的な存在。 ⑤道理。"
    : "(1) 만지거나 볼 수 있는 형태를 갖춘 대상. 물체나 물질. 또는 그 품질. (2) 동작의 대상을 막연히 이르는 말. (3) 특별히 말할 만한 가치가 있는 대상. (4) 신불ㆍ귀신ㆍ악령 등 인간을 초월한 존재. (5) 도리."
  物理:
    ? "①物事の道理。 ②「物理学」の略。物質の構造・性質・運動、熱・光・エネルギーなどの作用を研究する学問。化学"
    : "(1) 사물의 이치. (2) 물리학의 준말. 물질의 구조ㆍ성질ㆍ운동과 열ㆍ빛ㆍ에너지 등의 작용을 연구하는 학문."
  物議:
    世間の論議。世間の取り沙汰(ザタ)。世評。: 세상의 논의. 세간의 화제나 평판.
  人物:
    "①ひと。 ②ひとがら。人品。 ③人格が高く、能力のすぐれた人。": "① 사람. ② 사람됨. 인품. ③ 인격이 높고 능력이 뛰어난 사람."
  作物所:
    平安時代、宮中の調度品の製造や修理を司(つかさど)った所。: 헤이안 시대 궁중의 집기 제작과 수리를 맡던 곳.
  物体:
    ? "① 具体的な形をもって存在しているもの。物質が集合してある形体をなしている物。② 哲学で、三次元的な空間的形成物。空間を占めるもの。哲学体系によってさまざまに解釈され、たとえば、認識的実在論では意識から独立した存在をさし、客観的現象論では形而上学的自体存在が現象したものをさす。"
    : "① 구체적인 형태를 가지고 존재하는 것. 물질이 모여 일정한 형체를 이룬 것. ② 3차원적 공간 형성물. 공간을 차지하는 것."
  物情:
    "①物の性質やありさま。 ②世間の様子。世人の心情。": "① 사물의 성질이나 모습. ② 세상의 형편. 세상 사람들의 심정."
  物情騒然:
    ? 世の中が騒がしくなり、人心が不安な状態になること。「物情」は世の中の様子。「騒然」は騒がしいさま。物議騒然
    : 세상이 소란해지고 사람들의 마음이 불안해지는 것.
  物我一体:
    物と我とが一つになること。また、物と心、他者と自己、客観と主観との対立を超えること。: 사물과 자아가 하나가 되는 것. 또는 사물과 마음, 타자와 자기, 객관과 주관의 대립을 넘어서는 것.
  物故:
    人が死ぬこと。死去。: 사람이 죽는 것. 사망.
  物納:
    租税などを物品でおさめること。金納: 조세 등을 물품으로 바치는 것. 물납.
  物色:
    "①多くのなかから適当な人物や事物を探すこと。 ②物の色や形。": "① 많은 것 가운데 적당한 사람이나 사물을 찾는 것. ② 사물의 빛깔이나 모양."
  果物・果:
    木や草にできる果実で食用となるもの。水菓子。: 나무나 풀에 맺히는 열매 가운데 먹을 수 있는 것. 과일.
  物洗貝:
    モノアラガイ科の巻貝。各地の池沼や小川の水草に付着。殻は卵形で半透明。殻口が広い。: "[생물] 물달팽이과의 권패류. 각지의 못이나 늪, 개울의 수초에 붙어 살며, 껍데기는 달걀 모양이고 반투명하며 입구가 넓다."
  物忌み:
    ? "①神をまつるとき、一定期間、飲食や行いなどを慎み、心身を清めて家にこもること。 ②不吉として、ある種の物事を避けること。縁起かつぎ。"
    : "① 신을 모실 때 일정 기간 음식이나 행동을 삼가고 몸과 마음을 깨끗이 하여 집에 머무는 것. ② 불길하다고 여겨 어떤 일을 피하는 것. 길흉을 따지는 일."
  物憂い:
    おっくうで、何をするにも気がすすまない。何となくゆううつで、けだるい。: 귀찮고 무엇을 하든 내키지 않다. 어쩐지 우울하고 나른하다.
  物怖じ:
    物事に対し、恐れること。おじけること。: 어떤 일에 대해 겁을 내는 것. 주눅 드는 것.
球:
  天球:
    地球上の観測者を中心として、天体の座標を球面に描いた仮想の球体。: 지구상의 관측자를 중심으로 천체의 좌표를 구면에 그린 가상의 구체.
  球:
    "①丸い形状のもの。地球・電球など。 ②まり。ボール。": "(1) 둥근 모양의 것. 지구ㆍ전구 등. (2) 공. 볼."
  蹴球:
    ? サッカーやラグビー・アメリカンフットボールなど、ボールを足でけって行う球技。ふつうはサッカーを指す。
    : 축구ㆍ럭비ㆍ미식축구 등 공을 발로 차서 하는 구기. 보통은 축구를 가리킨다.
  剛球:
    野球で、投手の投げる球が速くて重いこと。: 야구에서 투수가 던지는 공이 빠르고 묵직한 것.
  卓球:
    中央にネットを張った長方形の台をはさんで、ラケットで小球を打ち合う競技。ピンポン。: 가운데에 네트를 친 직사각형 탁자를 사이에 두고 라켓으로 작은 공을 주고받는 경기. 탁구.
  地球:
    ? 太陽の惑星で、太陽系の内側から三番目にある。水と大気があり、人類をはじめとした各種生物が生存する。自転しながら、一年に一回太陽のまわりを公転し、衛星として月をもつ。
    : 태양의 행성으로 태양계 안쪽에서 세 번째에 있다. 물과 대기가 있으며 인류를 비롯한 여러 생물이 산다.
  好球:
    球技で、打ちやすく、受けやすく、蹴(け)りやすい、よいたま。: 구기에서 치기 쉽고 받기 쉽고 차기 쉬운 좋은 공.
  気球:
    空気より軽い気体や熱した空気を入れ、空に高く揚げる球形の袋。宣伝・観測用など。: 공기보다 가벼운 기체나 데운 공기를 넣어 하늘 높이 띄우는 공 모양의 주머니.
  球団:
    野球やサッカーのプロチームをつくり、その試合を見せるのを事業とする団体。: 야구나 축구 프로팀을 만들어 그 경기를 보여 주는 일을 사업으로 하는 단체.
  球戯:
    "①ボールを用いてする遊び。 ②たまつき。ビリヤード。": "① 공을 사용해 하는 놀이. ② 당구."
  球技:
    ボールを使って行う競技の総称。野球・サッカー・テニスなど。: 공을 사용해 하는 경기의 총칭. 야구, 축구, 테니스 등.
  球根:
    ? 多年生植物の地下にある根や茎などが、養分を蓄えるために球状になったもの。ユリ・ダリアなど。
    : "[생물] 여러해살이식물의 땅속 뿌리나 줄기 등이 양분을 저장하기 위해 공 모양이 된 것."
由:
  理由:
    ある結果が生じた原因。わけ。: 어떤 결과가 생긴 원인. 까닭.
  由:
    "①物事の事情やいわれ。理由。 ②方法。手段。 ③伝聞を表す語で、…とのこと。次第。": "(1) 사물의 사정이나 유래. 이유. (2) 방법. 수단. (3) 전해 들은 내용을 나타내는 말."
  由る:
    ? "①由来やよりどころとなる。のっとる。 ②物事の性質や内容に左右される。応じる。したがう。"
    : "(1) 유래나 근거가 되다. 따르다. (2) 사물의 성질이나 내용에 좌우되다. 응하다. 따르다."
  由由しい:
    そのままにできないほど重大なようす。容易ではないようす。: 그대로 둘 수 없을 만큼 중대한 모양. 쉽지 않은 모양.
  自由:
    "①他から干渉や束縛を受けない状態。 ②思いのままであるさま。": "(1) 다른 데서 간섭이나 구속을 받지 않는 상태. (2) 마음대로인 모양."
  事由:
    "①物事の理由。わけ。 ②法律用語で、直接の理由・原因となっている事実。": "① 사물의 이유. 까닭. ② 직접적인 이유나 원인이 되는 사실."
  由来:
    "①物事の経てきた過程や道筋。いわれ。来歴 ②もともと。元来・本来": "① 사물이 거쳐 온 과정이나 내력. 유래. ② 본래. 원래."
  由無い:
    "①根拠や理由がない。つまらない。 ②手段や方法がない。仕方がない。": "① 근거나 이유가 없다. 보잘것없다. ② 수단이나 방법이 없다. 어쩔 수 없다."
  由緒:
    ? "①物事のいわれ・起こり。物事の経てきた筋道。由来 ②筋道の正しいりっぱな来歴。また、名誉ある歴史。"
    : "① 사물의 유래나 기원. 사물이 거쳐 온 내력. ② 내력이 바르고 훌륭한 역사. 또는 명예로운 역사."
  由縁:
    物事のゆかり。由来: 사물의 연고. 유래.
  経由:
    "①ある地点を通って目的地に行くこと。 ②ある機関をへて事を行うこと。": "① 어떤 지점을 지나 목적지로 가는 것. ② 어떤 기관을 거쳐 일을 하는 것."
  縁由:
    "①ゆかり。縁故 ②法律で、人が意志を決定するに至った理由。動機。": "① 인연. 연고. ② 사람이 의사를 결정하게 된 이유. 동기."
申:
  壬申:
    干支(えと)の一つ。みずのえさる。: 간지의 하나. 임신.
  庚申:
    ? "①干支(えと)の一つで、かのえさる。 ②「庚申待(まち)」の略。庚申の日に、寝ないで神仏をまつり夜明けを待つ行事。中国の道教に由来する。 ③②の祭神。特に、青面金剛(ショウメンコンゴウ)。"
    : "(1) 간지의 하나. 경신. (2) 경신일에 잠자지 않고 신불을 모시며 새벽을 기다리는 행사. 중국 도교에서 유래했다. (3) 그 행사의 제신. 특히 청면금강."
  申:
    ? "①十二支の九番目。 ②昔の時刻で、現在の午後四時ころ。また、その前後二時間。 ③昔の方角の名。西南西。"
    : "(1) 십이지의 아홉째. (2) 옛 시각으로 지금의 오후 네 시쯤. 또는 그 전후 두 시간. (3) 옛 방위 이름. 서남서."
  申す:
    ? "①「言う」の謙譲語。動作の及ぶ相手を敬っていう。また、丁寧語。 ②「お」や「ご」のついた動詞などにつき、「する」の謙譲語。"
    : "(1) 「말하다」의 겸양어. 동작이 미치는 상대를 높여 이른다. 또는 정중어. (2) 공손 표현 접두사가 붙은 동사 등에 붙어 「하다」의 겸양어로 쓰인다."
  申楽:
    ? "①奈良時代に、中国から伝来した散楽(サンガク)をもとにしてつくられた演芸。後世の能・狂言のもととなった、室町時代までのものまねや曲芸など。 ②能楽の旧称。"
    : "(1) 나라 시대에 중국에서 전래한 산악을 바탕으로 만들어진 예능. 후대의 노와 교겐의 바탕이 된, 무로마치 시대까지의 흉내 내기와 곡예 등. (2) 노가쿠의 옛 이름."
  上申:
    上役や上の機関に、意見や事情を申し述べること。: 윗사람이나 상급 기관에 의견이나 사정을 말씀드리는 것.
  具申:
    上の人に意見や事情などを詳しく申し述べること。上申・進言: 윗사람에게 의견이나 사정 등을 자세히 말씀드리는 것.
  庚申塚:
    青面金剛(ショウメンコンゴウ)をまつった塚。多く、道ばたの石塚。: 청면금강을 모신 무덤 모양의 돌무더기. 대개 길가의 돌무더기이다.
  申告:
    国民が必要な事項を国・役所などに申し出ること。: 국민이 필요한 사항을 국가나 관청 등에 신고하는 것.
  申請:
    官庁などへ許可や認可を願い出ること。: 관청 등에 허가나 인가를 신청하는 것.
  申達:
    上級の官庁から下級の官庁に、文書で指令を出すこと。: 상급 관청에서 하급 관청에 문서로 지령을 내리는 것.
界:
  下界:
    ? "①天上から見た、人間の住む世界。人間界・娑婆(シャバ)天上界 ②山や飛行機など高い所から見おろした地上。"
    : "(1) 하늘에서 본 인간이 사는 세계. (2) 산이나 비행기 등 높은 곳에서 내려다본 지상."
  界:
    二つに分けたわかれめの部分。物と物とが接している部分。しきりめ。くぎり。: 둘로 나뉘는 갈림 부분. 사물과 사물이 맞닿는 부분. 경계. 구분.
  界雷:
    寒冷前線に伴う強い上昇気流によって発生する雷。前線雷。: 한랭 전선에 따른 강한 상승 기류로 발생하는 천둥. 전선뢰.
  境界:
    "①土地などのさかい目。境域②物事のさかい目。": "① 토지 등의 경계선. 경계 영역. ② 사물의 경계."
  学界:
    学問や学者の世界。: 학문이나 학자의 세계. 학계.
  業界:
    同じ業種・商売に従事する人々の社会。同業者仲間。: 같은 업종이나 장사에 종사하는 사람들의 사회. 동업자 세계.
  界域:
    境域。字通「界」の項目を見る。: 경계 안의 영역. 경역.
  界繫:
    ? 迷いの世界である、欲界・色界・無色界の三界(サンガイ)のいずれかに束縛され、自由にならないこと。
    : "[불교] 미혹의 세계인 욕계, 색계, 무색계의 삼계 가운데 어느 하나에 얽매여 자유롭지 못한 것."
  界隈:
    そのあたり一帯。近所。近辺・付近: 그 부근 일대. 근처. 주변.
  疆界:
    土地の境界。境域。さかい。: 토지의 경계. 경계 영역. 경계.
  眼界:
    "①目に見える範囲。視界 ②考えの及ぶ範囲。": "① 눈에 보이는 범위. 시야. ② 생각이 미치는 범위."
  花柳界:
    芸者や遊女の社会。いろまち。遊里。花柳の巷(ちまた)。: 기생이나 유녀의 사회. 유흥가. 화류계.
  角界:
    相撲の社会。: 스모계.
病:
  疫病:
    "①流行病の昔の言い方。 ②おこり。マラリアのような熱病。": "(1) 유행병의 옛말. (2) 학질. 말라리아와 같은 열병."
  病:
    "①病気。患(わずら)い。いたつき。 ②悪いくせ。欠点。": "(1) 병. 앓음. (2) 나쁜 버릇. 결점."
  病む:
    "①病気にかかる。 ②ひどく気にかける。心配する。": "(1) 병에 걸리다. (2) 몹시 마음에 두다. 걱정하다."
  疫病草:
    リンドウの古名。: "[생물] 용담의 옛 이름."
  病害:
    農作物や家畜の病気によってこうむる害。: 농작물이나 가축의 병으로 입는 피해.
  病根:
    "①病気のもと。病原・病因 ②悪い習慣の根本原因。": "① 병의 근원. 병원. 병인. ② 나쁜 습관의 근본 원인."
  病気:
    ? "① 生体が正常と異なった形態または機能を示す状態。多くの場合に自ら健康感の喪失ないし苦痛を覚える。体内の異常によるものとしては動脈硬化、血栓、心筋梗塞、腫瘍などがあり、外部からの侵襲によるものとしては外傷や感染症などがある。やまい。わずらい。いたつき。疾病。② 人の、悪いくせや行状。"
    : "① 생체가 정상과 다른 형태나 기능을 보이는 상태. 질병. ② 사람의 나쁜 버릇이나 행실."
  病痾:
    長びいていつまでも治らない病気。宿痾: 오래 끌며 좀처럼 낫지 않는 병. 숙환.
  病臥:
    病気で床につくこと。: 병으로 자리에 누움.
  病葉:
    ? 病気や害虫のために、変色したり枯れたりした葉。特に、夏のうちに赤や黄に色づいて縮まった葉。夏
    : 병이나 해충 때문에 변색되거나 마른 잎. 특히 여름에 붉거나 노랗게 물들어 오그라든 잎.
  病院:
    病人やけが人を収容し、医師が治療する施設。医院・診療所: 환자나 부상자를 수용하고 의사가 치료하는 시설. 병원.
  稲熱病:
    ? いもち病菌の寄生によるイネの病害の一つ。葉・茎に褐色の小さな斑点(ハンテン)ができて種子がつかなくなる。
    : "[생물] 도열병균의 기생으로 생기는 벼 병해의 하나. 잎과 줄기에 갈색의 작은 반점이 생기고 씨가 맺히지 않게 된다."
  黒死病:
    ? ペスト菌の感染によっておこる感染症。ネズミについたノミにより媒介される。高熱を出し、死亡率が高い。
    : "[생물] 페스트균 감염으로 일어나는 감염병. 쥐에 붙은 벼룩이 매개하며, 고열이 나고 치명률이 높다."
発:
  新発意:
    仏門に入って間もない者。: "[불교] 불문에 들어간 지 얼마 되지 않은 사람."
  発く:
    土を掘りおこし、埋めた物を取り出す。外にさらけ出す。: 흙을 파헤쳐 묻힌 것을 꺼내다. 밖으로 드러내다.
  発つ:
    出発する。出かける。: 출발하다. 떠나다.
    矢を射たり鉄砲を撃ったりする。発射させる。: 화살을 쏘거나 총을 쏘다. 발사하게 하다.
  愛発関:
    ? 越前(えちぜん)（現在の福井県東部）の愛発山の近辺にあった関所。古代北陸道の要衝で、鈴鹿(すずか)・不破(ふわ)とともに三関と呼ばれた。
    : "[지명] 에치젠의 아라치산 부근에 있던 관문. 고대 호쿠리쿠도의 요충지로 스즈카, 후와와 함께 삼관이라 불렸다."
  発射:
    "①弾丸・ロケットなどを撃ち出すこと。 ②矢を射ること。": "① 탄환이나 로켓 등을 쏘아 내는 것. ② 화살을 쏘는 것."
  発生:
    新たに生じること。生まれること。また、物事が始まること。: 새로 생기는 것. 태어나는 것. 또는 일이 시작되는 것.
  発表:
    表向きに知らせること。: 공개적으로 알리는 것. 발표.
  発見:
    それまで知られていなかった事物を、はじめて見つけ出すこと。: 그때까지 알려지지 않았던 사물을 처음 찾아내는 것.
  発覚:
    悪事や陰謀などが人に知られること。秘密がばれること。露見: 나쁜 일이나 음모 등이 남에게 알려지는 것. 비밀이 드러나는 것.
  発車:
    止まっていた汽車・電車・自動車などが動き出すこと。停車: 멈춰 있던 기차, 전차, 자동차 등이 움직이기 시작하는 것. 발차.
  発達:
    ? "①成長して、より完全なものになっていくこと。 ②技術などが進歩すること。また、規模が次第に大きくなること。"
    : "① 성장하여 더 완전한 것이 되어 가는 것. ② 기술 등이 진보하는 것. 또는 규모가 차츰 커지는 것."
  発条:
    ? "①鋼鉄などを巻いたり曲げたりして、弾力をもたせたもの。スプリング。 ②人の跳躍力や弾力性のたとえ。"
    : "① 강철 등을 감거나 구부려 탄력을 갖게 한 것. 스프링. ② 사람의 도약력이나 탄력성을 비유하는 말."
  発船:
    船が港を出発すること。船出。: 배가 항구를 출발하는 것. 출항.
登:
  登る:
    下方から上方へだんだんと行く。高い所へ上がる。: 아래쪽에서 위쪽으로 차츰 가다. 높은 곳에 오르다.
  登攀:
    高山や岩崖などをよじのぼること。: 높은 산이나 바위 절벽 등을 기어오르는 것.
  登坂:
    車両が坂道をのぼって走ること。: 차량이 비탈길을 올라 달리는 것.
  登場:
    舞台や映画・小説などの場面に人物が現れること。退場: 무대, 영화, 소설 등의 장면에 인물이 나타나는 것. 등장.
  登壇:
    壇に上がること。演壇にのぼること。降壇: 단에 오르는 것. 연단에 오르는 것.
  登山:
    ? "①山にのぼること。山登り ②山上の寺に参詣(サンケイ)すること。 ③修行するために、僧・修験者などが山にこもること。 ①～③下山"
    : "① 산에 오르는 것. 등산. ② 산 위의 절에 참배하는 것. ③ 수행을 위해 승려나 수행자가 산에 들어가는 것."
  登校:
    授業を受けるため、生徒・児童が学校に行くこと。下校: 수업을 받기 위해 학생이나 아동이 학교에 가는 것. 등교.
  登用:
    ? 人をひきあげ用いること。人材を官職などにあげ、また、高い地位などにひきあげ用いること。とよう。
    : 사람을 발탁하여 쓰는 것. 인재를 관직이나 높은 지위에 올려 쓰는 것.
  登記:
    民法上の権利などを公示するため、一定の事項を登記簿に記載すること。: "민법상의 권리 등을 공시하기 위해 일정한 사항을 등기부에 기재하는 것."
  登載:
    "①文章などを、新聞・雑誌などにのせること。掲載 ②帳簿・台帳などに公式に記すこと。記載": "① 글 등을 신문이나 잡지 등에 싣는 것. 게재. ② 장부나 대장 등에 공식적으로 적는 것. 기재."
  登録:
    "①帳簿に記載すること。 ②一定の事項を公簿に記載すること。": "① 장부에 기재하는 것. ② 일정한 사항을 공적인 장부에 기재하는 것."
  登頂:
    山などの頂上にのぼること。: 산 등의 정상에 오르는 것.
皮:
  梅花皮:
    ? "①ウメの花形の粒状の突起がある魚の皮。刀の柄(つか)や鞘(さや)の装飾用。 ②表面が①のような陶磁器。"
    : "(1) 매화 모양의 알갱이 같은 돌기가 있는 생선 껍질. 칼자루나 칼집 장식용으로 쓴다. (2) 표면이 그와 같은 도자기."
  皮:
    ? "①動植物の外面をおおい包むもの。 ②物の外側を包んでいるもの。 ③本質や本性などをおおい隠しているもの。"
    : "(1) 동식물의 겉면을 덮고 감싸는 것. (2) 물건의 바깥쪽을 감싸는 것. (3) 본질이나 본성을 덮어 감추는 것."
  厚皮香:
    ツバキ科の常緑高木。: "[생물] 차나무과의 상록 교목."
  檜皮:
    ? "①ヒノキの皮。 ②「檜皮葺(ぶ)き」の略。 ③襲(かさね)の色目の一つ。昔、衣服を重ねるときの色合いで表は黒ずんだ紅色、裏は淡い藍色(あいいろ)。"
    : "① 편백나무 껍질. ② 편백나무 껍질로 지붕을 이는 방식의 준말. ③ 옛 의복 배색의 하나."
  檜皮色:
    "①黒みがかった赤紫の染め色。 ②縦糸は浅葱(あさぎ)色、横糸には赤色を用いた織り色。": "① 검은빛이 도는 적자색 물감색. ② 세로실은 옅은 남색, 가로실은 붉은색을 쓴 직물색."
  牛皮凍:
    アカネ科のつる性多年草。: "[생물] 꼭두서니과의 덩굴성 여러해살이풀."
  生皮苧:
    ? 繭から生糸をとるときに出る糸くずなどを、集めて乾燥させたもの。絹糸紡績などの原料とする。
    : 고치에서 생사를 뽑을 때 나오는 실찌꺼기 등을 모아 말린 것. 견사 방적 등의 원료로 쓴다.
  皮相:
    "①上っ面。うわべ。 ②見方や考え方が浅く、本質をとらえていないさま。": "① 겉면. 겉모습. ② 보는 방식이나 생각이 얕아 본질을 파악하지 못한 모양."
  皮膚:
    動物の体の表面をおおい包んでいる組織。はだ。: 동물의 몸 표면을 덮고 감싸는 조직. 피부.
  皮茸:
    イボタケ科のキノコ。 革茸(こうたけ): "[생물] 굴뚝버섯과의 버섯."
  秦皮:
    ? モクセイ科の落葉高木。山地に自生。春、淡緑色の小花をつけ、翼のある実を結ぶ。材は弾力に富み、家具・バットなどにする。
    : "[생물] 물푸레나무과의 낙엽 교목. 산지에 자라며 재목은 탄력이 있어 가구나 배트 등에 쓴다."
  豆腐皮:
    豆乳(トウニュウ)を煮立て、表面に張った薄い皮をすくい上げて作った食品。うば。: 두유를 끓여 표면에 생긴 얇은 막을 건져 만든 식품. 유바.
皿:
  皿:
    ? "① 平たく浅い器。食物を盛るのに用い、陶器、漆器、金属およびガラス製などがある。② ①に盛って、饗膳(きょうぜん)などに出す肴(さかな)。③ 仏具の一つ。銅に錫(すず)・鉛を加えた合金で作る。盆のような形で、読経の時に打ち鳴らす。④ 秤皿(はかりざら)。⑤ 物を盛るもの。⑥ 人間の骨で、平たくて①に似た形のものを俗にいう。(イ) 膝蓋骨(しつがいこつ)。(ロ) 頭蓋骨(ずがいこつ)の頂上の部分。⑦ 処女の女陰。⑧ 漢字の脚(あし)の一つ。「盃」「盆」「盛」などの「皿」の部分をいう。この脚をもつ字の大部分は、字典で皿部に属する。〔落葉集（1598）〕"
    : "(1) 납작하고 얕은 그릇. 음식을 담는 데 쓰며 도기ㆍ칠기ㆍ금속ㆍ유리 제품 등이 있다. (2) 접시에 담아 대접상 등에 내는 안주. (3) 불구의 하나. 구리에 주석과 납을 더한 합금으로 만들며, 쟁반 같은 모양으로 독경할 때 쳐서 울린다. (4) 저울 접시. (5) 물건을 담는 것. (6) 사람의 뼈 중 납작하고 접시와 비슷한 모양의 것을 속되게 이르는 말. 무릎뼈나 머리뼈의 정수리 부분. (7) 처녀의 음부. (8) 한자 부수 위치 중 발의 하나. 「盃」ㆍ「盆」ㆍ「盛」 등의 아래쪽 「皿」 부분을 이른다."
  器皿:
    食べ物を盛る皿や小鉢。食器。: 음식을 담는 접시나 작은 사발. 식기.
  皿鉢:
    浅い大きな磁器の皿。: 얕고 큰 자기 접시.
相:
  盛相:
    飯を盛って量をはかる器。また、飯を一人分ずつ盛る器。: 밥을 담아 양을 재는 그릇. 또는 밥을 한 사람분씩 담는 그릇.
  相:
    生来のありさまや姿。外に現れているようす。: 타고난 모습이나 자태. 겉으로 드러난 모양.
    ? "［音］ソウ（サウ）（呉）　ショウ（シャウ）（漢）　［訓］あい［学習漢字］3年〈ソウ〉１ 物の姿・ようす。「相貌そうぼう／形相ぎょうそう・血相・死相・色相・実相・諸相・真相・瑞相ずいそう・世相・人相・皮相・貧相・滅相・面相・様相」２ 物のありさまを見てその実相を判断する。「相術・相場そうば・相馬・相法」３ たがいに。「相違・相関・相互・相思・相似・相談・相当」４ 一方から他方へ。次から次と。「相承・相続・相伝」５ 相模さがみ国。「相州／武相」〈ショウ〉１ 君主を助ける大臣。「外相・宰相・首相・丞相じょうしょう・名相」２ そばに付き添う。「相伴」〈あい〉「相性あいしょう・相手・相宿／入相いりあい」［名のり］あう・さ・すけ・たすく・とも・はる・み・みる［難読］相模さがみ・相撲すもう・相応ふさわしい"
    : "① 사물의 모습이나 상태. ② 사물의 상태를 보고 실상을 판단하는 것. ③ 서로. ④ 한쪽에서 다른 쪽으로, 또는 차례차례. ⑤ 사가미국. ⑥ 군주를 돕는 대신. ⑦ 곁에서 따르는 것."
  相ける:
    そばで補佐する。目下の者が相談にのって手助けする。: 곁에서 보좌하다. 아랫사람이 상담에 응해 도와주다.
  相好:
    顔つき。表情。: 얼굴 생김새. 표정.
  相州:
    相模国（神奈川県）の別称。〔黒本本節用集（室町）〕: "[지명] 사가미국, 곧 가나가와현의 별칭."
  相撲:
    ? 二人の男が土俵内で組み合い、相手を倒すか土俵外に出すかで勝負を決める競技。裸に褌(ふんどし)だけつけて行う。日本の国技とされる。 秋
    : 두 남자가 씨름판 안에서 맞붙어 상대를 넘어뜨리거나 밖으로 밀어내 승부를 정하는 경기. 일본의 국기로 여겨진다.
  相模:
    旧国名の一つ。現在の神奈川県の大部分。相州(ソウシュウ)。: "[지명] 옛 나라 이름의 하나. 현재 가나가와현의 대부분."
  首相:
    首席の大臣。日本では内閣総理大臣。: 수석 대신. 일본에서는 내각총리대신.
  相人:
    人相を見る人。人相見。相者。相工(そうこう)。: 사람의 관상을 보는 사람. 관상가.
  相合傘:
    一本のかさを二人でさすこと。おもに、仲の良い男女にいう。あいがさ。: 우산 하나를 두 사람이 함께 쓰는 것. 주로 사이좋은 남녀에게 이른다.
  相愛:
    互いに愛し合うこと。: 서로 사랑하는 것.
  相続:
    受け継ぐこと。特に、財産上の権利・義務を受け継ぐこと。: 이어받는 것. 특히 재산상의 권리와 의무를 이어받는 것.
  相部屋:
    旅館や寮などで、他の人と同じ部屋になること。: 여관이나 기숙사 등에서 다른 사람과 같은 방을 쓰게 되는 것.
  眉相:
    "①まゆ。 ②まゆとまゆとの間。眉間(ミケン)。": "① 눈썹. ② 눈썹과 눈썹 사이. 미간."
県:
  県:
    ? "①古代、諸国にあった朝廷の直轄地。のちに、豪族の領地の意にも用いる。 ②中世、地方官。また、その任国。 ③いなか。地方。"
    : "(1) 고대 여러 지방에 있던 조정 직할지. 뒤에는 호족의 영지라는 뜻으로도 쓰였다. (2) 중세의 지방관. 또는 그 임지. (3) 시골. 지방."
  県召:
    "「県召の除目(ジモク)」の略。平安時代に行われた、地方官を任命する儀式。": 헤이안 시대에 행해진 지방관 임명 의식.
  県主:
    諸国にあった朝廷の領地の監督官。県を統治する地方長官。: 여러 지방에 있던 조정 영지의 감독관. 현을 다스리는 지방 장관.
  県令:
    "①県の長官。 ②旧制で県知事が出した命令。": "① 현의 장관. ② 구제도에서 현지사가 내린 명령."
  県営:
    県が経営、または設置・管理していること。: 현이 경영하거나 설치·관리하는 것.
  県政:
    県の行政。県の政治。県治。: 현의 행정. 현의 정치.
真:
  真:
    "①本当。真実。 ②正確な。まさに。本当の。 ③まじり気がなく純粋なさま。": "(1) 참. 진실. (2) 정확한. 바로. 진짜의. (3) 섞인 것이 없이 순수한 모양."
    うそいつわりのない本当のこと。また、その心。まごころ。誠意。: 거짓이 없는 참된 것. 또는 그런 마음. 진심. 성의.
  真田紐:
    木綿の太い糸で厚く平らに編んだひも。: 굵은 무명실로 두껍고 납작하게 짠 끈.
  真面目:
    ? "①本気であること。真剣なさま。 不真面目・出鱈目(でたらめ) ②まごころがあること。誠実なさま。"
    : "(1) 진지함. 성실한 모양. (2) 진심이 있음. 성실한 모양."
  猿真似:
    深く考えることなく、うわべだけ他人のまねをすること。: 깊이 생각하지 않고 겉모습만 남을 흉내 내는 것.
  真字:
    "① 楷書。真書。しん。② かなに対して漢字、また仮名混じり文に対して漢文をいう。まな。": "① 해서. 진서. ② 가나에 대한 한자, 또는 가나 섞인 글에 대한 한문."
  真実:
    "①本当のこと。うそいつわりのないこと。 虚偽 ②本当に。まったく。まことに。": "① 참된 것. 거짓이 없는 것. 진실. ② 정말로. 참으로."
  真性:
    ? "①生まれついた性質。 天性・天賦 ②疑いなく本当であること。多く、医学で用いられる語。 擬似・仮性"
    : "① 타고난 성질. 천성. ② 의심할 여지 없이 참된 것. 주로 의학에서 쓰는 말."
  真東風:
    真東から吹いてくる風。 春: 정동쪽에서 불어오는 바람.
  真田虫:
    ジョウチュウの別称。: "[생물] 촌충의 다른 이름."
  真砂:
    細かな砂。いさご。: 고운 모래.
  真葛:
    ? モクレン科のつる性常緑低木。暖地の山野に自生。葉は厚くてつやがある。夏、黄白色の花をつけ、赤い実を球状に結ぶ。ビナンカズラ。 秋
    : "[생물] 오미자과의 덩굴성 상록 관목. 따뜻한 지방의 산야에 자란다."
  真風:
    南または南西の風。まぜ。 夏: 남풍 또는 남서풍.
  真っ赤:
    "①非常に赤いさま。 ②まったく。まるっきり。まぎれもない。": "① 매우 붉은 모양. 새빨강. ② 완전히. 전적으로. 틀림없이."
着:
  着く:
    ? "①移動や運動の結果、ある場所に至る。達する。 ②荷物や郵便物などが送り先に届く。到着する。 ③位置を占める。身を置く。"
    : "(1) 이동이나 운동의 결과 어떤 장소에 이르다. 도달하다. (2) 짐이나 우편물 등이 보낸 곳에 도착하다. (3) 자리를 차지하다. 몸을 두다."
  着ける:
    "①身にまとう。きる。 ②ある場所に到着させる。至らせる。 ③場所を占めさせる。": "(1) 몸에 걸치다. 입다. (2) 어떤 장소에 도착하게 하다. 이르게 하다. (3) 장소를 차지하게 하다."
  着せる:
    ? "[ 文語形 ]き・す ① 衣服などを身にまとわせる。着させる。② 物を肩や背などに載せる。置く。つける。③ 能面などをつけさせる。④ 物に何かを包みかぶせる。包みおおう。また、鍍金する。⑤ こうむらせる。受けさせる。負わせる。⑥ くらわす。打つ。たたく。"
    : "(1) 옷 등을 몸에 걸치게 하다. 입히다. (2) 물건을 어깨나 등에 얹다. 놓다. 붙이다. (3) 노가면 등을 쓰게 하다. (4) 물건에 무엇인가를 싸서 덮다. 또는 도금하다. (5) 입게 하다. 받게 하다. 떠맡기다. (6) 먹이다. 치다. 때리다."
  着る:
    "①衣類を身にまとう。 ②身に受ける。負う。": "(1) 옷을 몸에 걸치다. (2) 몸에 받다. 떠맡다."
  着尺:
    大人の和服一枚分の反物の長さと幅。また、その反物。羽尺(はジャク): 성인용 일본 옷 한 벌분의 옷감 길이와 폭. 또는 그 옷감.
  着色:
    色をつけること。また、その色。脱色: 색을 입히는 것. 또는 그 색.
  着衣:
    衣服を身につけること。また、その衣服。着服脱衣: 옷을 몸에 입는 것. 또는 그 옷.
  為着せ:
    ? "①季節ごとに使用人に衣服を与えること。また、その衣服。 ②一方的に与えられる事柄。会社や上司から与えられるきまりきった仕事など。"
    : "① 계절마다 사용인에게 의복을 주는 것. 또는 그 의복. ② 일방적으로 주어지는 일. 회사나 상사가 주는 판에 박힌 일 등."
  着実:
    落ちついて確実なこと。まじめで危なげのないこと。堅実・地道: 침착하고 확실한 것. 성실하고 위태로움이 없는 것. 착실함.
  着工:
    工事に取り掛かること。起工竣工(シュンコウ)・完工: 공사에 착수하는 것. 착공.
  着席:
    席につくこと。座席にすわること。着座。: 자리에 앉는 것. 착석.
  着心地:
    衣服を着た際の感じ。着ぐあい。: 옷을 입었을 때의 느낌. 착용감.
  着衣始:
    江戸時代、正月三が日中に日を選んで新しい衣服を着始めること。また、その儀式。新年: 에도 시대에 정월 초사흘 안에서 날을 골라 새 옷을 처음 입던 일. 또는 그 의식.
  着順:
    目的地点、目標などに到着した順序。: 목적지나 목표 등에 도착한 순서.
  表着:
    最も外側に着る衣服。下着: 가장 바깥쪽에 입는 옷. 겉옷.
短:
  短い:
    ? "①端から端までの距離が小さい。 ②ある時点からある時点までの時の経過が少ない。 ③せっかちである。"
    : "(1) 한쪽 끝에서 다른 끝까지의 거리가 작다. (2) 어떤 시점에서 다른 시점까지의 시간 경과가 적다. (3) 성급하다."
  短期:
    短い期間。長期: 짧은 기간.
  短気:
    我慢が足りなくて、すぐにいらついたり怒ったりすること。また、そのさま。きみじか。: 참을성이 부족해 곧 짜증을 내거나 화를 내는 것. 또는 그런 모양.
  短所:
    劣っているところ。欠点長所: 뒤떨어지는 점. 결점.
  短手:
    神道の葬儀で、音を出さないように打つ柏手(かしわで)。: 신도의 장례에서 소리가 나지 않도록 치는 박수.
  短檠:
    丈の短い灯火具。また、それにともす灯火。: 키가 낮은 등잔 기구. 또는 거기에 켜는 등불.
  短歌:
    和歌で五・七・五・七・七の五句三一音からなる歌体。みそひともじ。長歌: 와카에서 5·7·5·7·7의 다섯 구, 서른한 음으로 이루어진 노래 형식. 단가.
  短褐:
    麻や木綿でつくった丈の短い着物。身分の低い人や貧しい人が着た衣服。: 삼베나 무명으로 만든 길이가 짧은 옷. 신분이 낮거나 가난한 사람이 입던 옷.
  短褐穿結:
    ? 貧しい人や卑しい人の衣服。貧者の粗末な身なりのようす。「穿結」は、破れていたり、結び合わせていたりすること。〈陶潜の文〉短褐不完
    : 가난하거나 신분이 낮은 사람의 옷. 가난한 사람의 초라한 차림을 이르는 말.
  短見:
    思慮の足りない、つまらない意見。未熟な考え。あさはかな考え。浅見: 사려가 부족한 보잘것없는 의견. 미숙하고 얕은 생각.
  短資:
    "「短期資金」の略。通常、一年以内の貸付資金。": "「단기 자금」의 준말. 보통 1년 이내의 대출 자금."
  短軀:
    背丈の低いこと。また、そのからだ。短身。長軀: 키가 작은 것. 또는 그런 몸. 단구.
研:
  研く:
    "①物をこすって表面をなめらかにし、つやを出す。 ②学問や技能の上達につとめる。": "(1) 물건을 문질러 표면을 매끄럽게 하고 윤을 내다. (2) 학문이나 기능이 나아지도록 힘쓰다."
  研ぐ:
    ? "①刃物を石や革などでみがいて鋭くする。 ②すりみがいて、つやを出す。 ③水の中でこすり洗う。"
    : "(1) 칼날을 돌이나 가죽 등으로 갈아 날카롭게 하다. (2) 문질러 닦아 윤을 내다. (3) 물속에서 문질러 씻다."
  研修:
    "①学問や技術を修め、みがくこと。 ②仕事の執務能力を養成すること。": "① 학문이나 기술을 익히고 닦는 것. ② 직무 수행 능력을 기르는 것."
  研学:
    学問を深く修め、みがきをかけること。: 학문을 깊이 닦고 갈고닦는 것.
  研究:
    物事や問題をよく調べ考えて真理をつきつめること。また、その結論。: 사물이나 문제를 잘 조사하고 생각하여 진리를 파고드는 것. 또는 그 결론.
  研鑽:
    学問などを深くきわめること。地道に研究を続けること。: 학문 등을 깊이 파고드는 것. 꾸준히 연구를 계속하는 것.
  薬研:
    薬の材料を粉砕するための舟形の器具。金属性でおもに漢方で用いる。薬おろし。: 약재를 잘게 부수기 위한 배 모양의 기구. 주로 한방에서 쓰는 금속제 기구.
  研北:
    ? 硯北。書状の脇付けに使う。読書・著述の場所。宋・晁補之〔事に感ず〕詩　干戈(かんくわ)牆東の客と作(な)ると雖も　疾ほ存す、北の身字通「研」の項目を見る。
    : 벼루의 북쪽. 편지에서 수신인 이름 곁에 덧붙이는 말. 독서나 저술을 하는 자리.
礼:
  無礼:
    無作法なさま。: 예의가 없는 모양.
  礼儀:
    社会生活の秩序を保つために、人が守るべき行動や作法。人がふみ行うべき規律。礼法・礼節: 사회생활의 질서를 지키기 위해 사람이 지켜야 할 행동과 예법. 사람이 따라야 할 규율.
  礼典:
    "①礼に関するきまり。また、それを書き記した書物。礼法 ②礼法にのっとった儀式。": "(1) 예에 관한 규정. 또는 그것을 적은 책. (2) 예법에 따른 의식."
  礼拝:
    合掌したりひざまずいたりして、敬い拝むこと。特に、仏教でいう語。: 합장하거나 무릎 꿇고 공경하여 절하는 것. 특히 불교에서 쓰는 말.
  礼節:
    社会生活の秩序を保つために必要とされる行儀や作法。礼儀と節度。: 사회생활의 질서를 지키는 데 필요한 행실과 예법. 예의와 절도.
  礼金:
    "①謝礼として出す金銭。 ②部屋や家を借りるときに、家主に謝礼として払う一時金。": "(1) 사례로 내는 돈. (2) 방이나 집을 빌릴 때 집주인에게 사례로 내는 일시금."
  礼式:
    "①礼儀を表す法式。礼儀作法。マナー。礼法 ②礼意を表すために贈る品。": "① 예의를 나타내는 형식. 예법. ② 감사나 예의를 나타내기 위해 주는 물품."
  礼状:
    謝礼の手紙。感謝の意を記した書状。: 감사의 편지. 감사의 뜻을 적은 서장.
  礼盤:
    寺院で、導師が着座して読経(ドキョウ)する本尊の前の高い壇。: 절에서 도사가 앉아 독경하는 본존 앞의 높은 단.
  礼装:
    儀式に出るとき、礼式にかなった服装をすること。また、その服装。礼服: 의식에 나갈 때 예식에 맞는 복장을 하는 것. 또는 그 복장. 예복.
  礼賛:
    ? "［名］(スル)１ すばらしいものとして、ほめたたえること。また、ありがたく思うこと。「先人の偉業を礼賛する」「健康を礼賛する」２ 仏語。仏・法・僧の三宝さんぼうを礼拝らいはいし、その功徳くどくをたたえること。また、その行事。"
    : "① 훌륭한 것으로 칭송하는 것. 또는 고맙게 여기는 것. ② [불교] 불·법·승 삼보를 예배하고 그 공덕을 찬탄하는 것. 또는 그 의식."
  礼遇:
    礼儀を尽くした待遇。厚いもてなし。厚遇: 예의를 다한 대우. 후한 대접.
神:
  三狐神:
    農家でまつる田の神。みけつかみ。: 농가에서 모시는 논의 신.
  御神酒:
    "①神前に供える酒。 ②酒のことをしゃれていう語。": "(1) 신 앞에 바치는 술. (2) 술을 익살스럽게 이르는 말."
  神:
    人間を超えた存在として、宗教や民俗的信仰の対象となるものの総称。: 인간을 초월한 존재로서 종교나 민속 신앙의 대상이 되는 것의 총칭.
    ? "① 宗教的、民俗的信仰の対象。世に禍福を降し、人に加護や罰を与えるという霊威。古代人が、天地万物に宿り、それを支配していると考えた存在。自然物や自然現象に神秘的な力を認めて畏怖し、信仰の対象にしたもの。② 神話上の人格神。③ 天皇、または天皇の祖先。④ 人為を越えて、人間に危害を及ぼす恐ろしいもの。特に蛇や猛獣。⑤ 神社。また、神社にまつられた信仰の対象。死後に神社などにまつられた霊や、死者の霊魂などをもいう。⑥ ( [英語] God の訳語 ) キリスト教で、宇宙と人間の造主であり、すべての生命と知恵と力との源である絶対者をいう。⑦ 雷。なるかみ。いかずち。⑧ ( 比喩的に ) 恩恵を与え、助けてくれる人、ありがたいものなどをいう。「救いの神」⑨ 他人の費用で妓楼に上り遊興する者。とりまき。転じて、素人の太鼓持。江戸がみ。⑩ 六をいう青物市場の符丁。神の語誌( 1 )同音語である「上」と同一語源と考える説と、別語源と考える説がある。同一語源説は、カミの元来の意味は「上」であり、「上方」という方向性を指し示す語であったものが、カミの毛（髪）、カミの存在（神）、というように用いられ、それが、カミだけで表わされるようになったとする。別語源説は、上代特殊仮名遣いにおける仮名の違い（神のカミのミは乙類、上のカミのミは甲類）と、上代における意味の類縁性の希薄さを根拠に、同一語源とは考え難いとする。( 2 )アイヌ語で「神」をさすカムイは、上代以前「カミ」が kamï の音をもっていた時代に日本語から借用したものか。( 3 )⑥の英語 God の訳語としての近代語「神」の成立には、聖書翻訳の問題が関わっている。中国でのキリスト教宣教師たちの God の訳語に関する議論では、「上帝」と「神」とで意見が分かれ、それぞれの訳語による聖書翻訳が行なわれた。「神」を採用したブリッジマンおよびカルバートソン訳の中国語訳聖書が、明治初期に来日したアメリカ人宣教師によって日本に持ち込まれ、これが God をカミと和訳するのに、決定的な影響力を持った。"
    : "① 종교적·민속적 신앙의 대상. 세상에 화복을 내리고 사람에게 가호나 벌을 준다고 여겨지는 영적 존재. ② 신화상의 인격신. ③ 천황 또는 천황의 조상. ④ 인간의 힘을 넘어 해를 끼치는 두려운 존재. ⑤ 신사 또는 신사에 모셔진 신앙 대상. ⑥ 기독교에서 우주와 인간의 창조주이며 모든 생명과 지혜와 힘의 근원인 절대자. ⑦ 천둥. 번개. ⑧ 비유적으로 은혜를 베풀고 도와주는 사람이나 고마운 것."
  神巫:
    死者の霊を自分にのりうつらせ、死者の考えなどを語る女性。口寄せ。: 죽은 사람의 영을 자기 몸에 들여 그 생각 등을 말한다는 여성. 구치요세.
  神楽:
    "①神を祭るために神前で奏する舞楽。 冬 ②歌舞伎(カブキ)や芝居の囃子(はやし)の一つ。": 신을 제사하기 위해 신 앞에서 연주하는 무악.
  神経:
    ? "①動物の体にある繊維状の器官。体の機能を統率し、各部からの刺激を脳に伝える刺激伝達の経路。 ②ものを感じたり考えたりする心のはたらき。"
    : "(1) 동물 몸에 있는 섬유 모양의 기관. 몸의 기능을 통솔하고 각 부분의 자극을 뇌로 전달하는 경로. (2) 사물을 느끼거나 생각하는 마음의 작용."
  主神:
    "①神の実体。神の正体。神体。 ②神事をつかさどる人。神主。": "① 신의 실체. 신의 본체. 신체. ② 신사를 맡아 제사를 주관하는 사람. 신관."
  惟神:
    神のみこころのままに。神のおぼしめしのままに。: 신의 뜻 그대로. 신의 뜻에 따라.
  灰神楽:
    火の気がある灰の中に湯や水などをこぼしたとき、勢いよく舞い上がる灰けむり。: 불기가 남은 재에 물이나 뜨거운 물을 쏟았을 때 세차게 피어오르는 재 연기.
  産土神:
    生まれた土地の守護神。鎮守(チンジュ)の神。うぶすな。 氏神(うじがみ): 태어난 땅의 수호신. 진수의 신.
  産霊神:
    "①自然界におけるすべてのものを生みだす神。むすひのかみ。 ②縁結びの神。": "① 자연계의 모든 것을 낳는 신. ② 인연을 맺어 주는 신."
  皇神:
    "①皇室の先祖にあたる神の尊称。 ②神の尊称。": "① 황실의 선조에 해당하는 신의 존칭. ② 신의 존칭."
  神技:
    ふつうの人には考えられないきわめてすぐれたわざ。非凡な技術。かみわざ。: 보통 사람으로서는 생각할 수 없을 만큼 뛰어난 재주. 비범한 기술.
  神社:
    ? 日本人固有の信仰対象となっている神をまつり、法的に存立を認められた礼拝施設。明治以降、国家の祭祀として特別の保護、監督を受けてきたが、第二次世界大戦後は宗教法人令による宗教法人となり、その大半（約八万社）が神社本庁の包括下にある。やしろ。みや。
    : 일본 고유의 신앙 대상인 신을 모시는 예배 시설. 신사.
  阪神:
    ? "[ 一 ] 大阪と神戸。[ 二 ] 「はんしんちほう（阪神地方）」の略。[ 三 ] 「はんしんでんきてつどう（阪神電気鉄道）」の略。"
    : "① [지명] 오사카와 고베. ② 한신 지방의 준말. ③ 한신 전기철도의 준말."
祭:
  祭り:
    "①神や先祖の霊をまつること。祭礼。祭祀(サイシ)。 夏 ②祝賀・記念などのにぎやかな行事。": 신이나 조상의 영을 모시는 것. 제례. 제사.
  祭る:
    ? "①神や先祖の霊に供え物をして、なぐさめるための儀式を行う。 ②神としてあがめて、一定の場所に安置する。"
    : "(1) 신이나 조상의 영에게 제물을 바치고 위로하는 의식을 행하다. (2) 신으로 받들어 일정한 곳에 모시다."
  祭祀:
    神や祖先の霊をまつること。また、その儀式や祭り。 祭典・祭礼: 신이나 조상의 영을 모시는 것. 또는 그 의식이나 제사.
  学園祭:
    "⇒学祭": 학교 축제. 학원제.
  慰霊祭:
    死んだ人の魂をなぐさめるための祭り。: 죽은 사람의 영혼을 위로하기 위한 제사.
  祭典:
    ? "①神霊をまつる儀式。祭礼。 祭祀(サイシ)・祭儀 ②大がかりで華やかな行事。フェスティバル。"
    : "① 신령을 모시는 의식. 제례. ② 규모가 크고 화려한 행사. 축제."
  祭司:
    ? "①宗教上の儀式・典礼を執行する神官。 ②ユダヤ教で、エルサレムの神殿に奉仕して宗教上の職務を専門に司る人。"
    : "① 종교상의 의식과 전례를 집행하는 신관. ② 유대교에서 성전에 봉사하며 종교 직무를 맡은 사람."
  祭壇:
    祭事を行う高い壇。神霊をまつり、供え物をささげる高い壇。: 제사를 지내는 높은 단. 신령을 모시고 제물을 바치는 높은 단.
  祭政一致:
    ? 宗教上の祭事と政治が一体であるという考え。また、そのような政治形態。 政教一致 祭政分離・政教分離
    : 종교상의 제사와 정치가 하나라는 생각. 또는 그러한 정치 형태.
  祭文:
    ? "①祭祀(サイシ)のとき、神霊に告げる文章。 ②「歌(うた)祭文」の略。江戸時代、芸人などが三味線に合わせて世間の事件をおもしろく歌ったもの。"
    : "① 제사 때 신령에게 고하는 글. ② 에도 시대에 세상의 사건을 샤미센에 맞추어 흥미롭게 노래하던 것."
  祭礼:
    神社の祭り。祭りの儀式。祭典。 祭儀: 신사의 제사. 축제 의식. 제전.
  祭神:
    その神社にまつってある神。: 그 신사에 모셔져 있는 신.
  芋茎祭:
    ? 京都の北野天満宮で一○月一日～四日に行われる神事。ずいきで屋根をふき、野菜・米・麦などで飾った神輿(みこし)を担いで回る。
    : 교토 기타노텐만구에서 10월 1일부터 4일까지 열리는 신사 의식.
福:
  福い:
    しあわせ。幸福。〈班固(ハンコ)の文〉禍(わざわ)い: 행복. 복.
  福寿草:
    ? キンポウゲ科の多年草。山野に自生。早春、キンセンカに似た黄金色の花をつける。めでたい花とされ、盆栽にして正月の飾りにする。根と茎は有毒。ガンジツソウ。新年
    : "[생물] 미나리아재비과의 여러해살이풀. 산야에 자생하며 이른 봄에 금잔화와 비슷한 황금색 꽃을 피운다. 길한 꽃으로 여겨 분재로 만들어 정월 장식에 쓴다. 뿌리와 줄기는 유독하다."
  福徳:
    "①善行とそれによって得る福利。 ②幸福と利益。また、それらに恵まれること。": "(1) 선행과 그로 얻는 복리. (2) 행복과 이익. 또는 그것들을 누리는 것."
  福茶:
    ? 黒豆・昆布・山椒(サンショウ)などを加えて、煎(セン)じ出した茶。正月・節分などに縁起物として飲む。新年
    : 검은콩ㆍ다시마ㆍ산초 등을 더해 달인 차. 정월이나 절분 등에 길한 음료로 마신다.
  福助:
    ? "①幸福を招くという男の人形。童顔で大きな頭にちょんまげを結い、裃(かみしも)を着て正座した人形。 ②①のように、頭がたいそう大きい人のたとえ。"
    : "① 행복을 부른다고 하는 남자 인형. ② 머리가 몹시 큰 사람의 비유."
  福引:
    商店の客寄せなどのために、くじ引きで景品を与えること。また、そのくじ。新年: 상점에서 손님을 끌기 위해 추첨으로 경품을 주는 것. 또는 그 추첨.
  福徳円満:
    財力も心の満足も、すべてが備わっていること。円満具足(グソク): 재물의 힘과 마음의 만족이 모두 갖추어져 있는 것.
  福相:
    いかにも幸福に恵まれているような人相。ふくぶくしい人相。貧相: 행복을 타고난 듯한 인상. 복스러운 얼굴.
  福祉:
    社会の構成員に等しくもたらされるべき幸福。特に、生活環境を安定させるもの。: 사회 구성원에게 고르게 주어져야 할 행복. 특히 생활환경을 안정시키는 것.
  福神漬:
    ? 漬物の一種。ダイコン・ナス・ナタマメなど七福神になぞらえた七種の野菜を細かく刻んで塩づけし、醬油(ショウユ)やみりんで煮つめたもの。
    : 무, 가지, 칼콩 등 일곱 가지 채소를 잘게 썰어 절인 뒤 간장과 미림으로 졸인 절임의 한 종류.
  福運:
    めでたい運命。しあわせな運。: 경사스러운 운명. 행복한 운.
  福音:
    ? "①キリスト教で、キリストが人類を救い、神の国を実現するという教え。ゴスペル。 ②喜ばしい知らせ。"
    : "① 기독교에서 그리스도가 인류를 구원하고 하느님의 나라를 실현한다는 가르침. 복음. ② 기쁜 소식."
秒:
  秒読み:
    ? "①時間の経過を一秒ずつ数えること。特に、残っている時間を一秒ずつ読み上げて数えること。 ②事が起こる瞬間などが間近に迫った状態にあること。"
    : "(1) 시간의 경과를 1초씩 세는 것. 특히 남은 시간을 1초씩 소리 내어 세는 것. (2) 일이 일어나는 순간 등이 눈앞에 닥친 상태."
  分秒:
    一分一秒。きわめて短い時間。: 일분일초. 매우 짧은 시간.
  寸秒:
    非常に短い時間。 寸刻・寸時: 매우 짧은 시간. 촌각.
  秒速:
    運動するものの速度を、一秒あたりに進む距離で表したもの。一秒間に進む速さ。: 움직이는 물체의 속도를 1초 동안 나아가는 거리로 나타낸 것. 초속.
究:
  究める:
    最後までつきつめる。深く研究して本質をつかむ。: 마지막까지 파고들다. 깊이 연구하여 본질을 파악하다.
  学究:
    学問研究に専念すること。また、その人。: 학문 연구에 전념하는 것. 또는 그런 사람.
  探究:
    物事の真の姿や本質などを深く調べ、明らかにすること。: 사물의 참모습이나 본질 등을 깊이 조사해 밝히는 것.
  攻究:
    学問や芸術などをおさめきわめること。研究: 학문이나 예술 등을 닦아 깊이 파고드는 것. 연구.
  研究:
    物事や問題をよく調べ考えて真理をつきつめること。また、その結論。: 사물이나 문제를 잘 조사하고 생각하여 진리를 파고드는 것. 또는 그 결론.
  究明:
    道理・真理などを、つきつめ調べて明らかにすること。: 도리나 진리 등을 끝까지 조사해 밝히는 것.
  究極:
    物事をつきつめて、最後に行き着くところ。つまるところ。究竟(クッキョウ): 사물을 끝까지 파고들어 마지막에 이르는 곳. 궁극.
  究理:
    物事の道理をきわめること。: 사물의 도리를 끝까지 탐구하는 것.
  究竟:
    "①最上の境地。無上。 ②「究竟(クッキョウ)」に同じ。": "① [불교] 가장 높은 경지. 무상. ② 궁극."
    ? "①物事をきわめて尽くすこと。つまるところ。結局。畢竟(ヒッキョウ) ②もっともすぐれているさま。 ③非常に都合のよいこと。"
    : "① 사물을 끝까지 파고드는 것. 결국. ② 가장 뛰어난 모양. ③ 매우 형편이 좋은 것."
  考究:
    物事を深く考えて、研究すること。深いところまで考えきわめること。: 사물을 깊이 생각하여 연구하는 것. 깊은 곳까지 생각해 파고드는 것.
章:
  回章:
    "①「回文(カイブン)①」に同じ。 ②返事の手紙。回書": "(1) 회문과 같음. (2) 답장."
  徽章:
    記章: 신분ㆍ소속ㆍ공적 등을 나타내기 위해 몸에 다는 표식.
  憲章:
    "①国家などが、ある理想にそって定めた基本原則。重要なおきて。 ②憲法の典章。": "(1) 국가 등이 어떤 이상에 따라 정한 기본 원칙. 중요한 규범. (2) 헌법의 전장."
  章:
    ひとまとまりを他と区別して表す目じるしや模様。目立つしるし。: 한 덩어리를 다른 것과 구별하여 나타내는 표식이나 무늬. 눈에 띄는 표식.
  章魚:
    頭足類八腕目の軟体動物の総称。 蛸(たこ): "[생물] 두족류 팔완목 연체동물의 총칭. 문어."
  印章:
    印。はんこ。印形(インギョウ)。印判。: 도장. 인장.
  周章てる:
    "①思いがけないことに出くわしてまごつく。うろたえる。 ②びっくりして急ぐ。": "① 뜻밖의 일을 만나 당황하다. 허둥대다. ② 놀라서 서두르다."
  文章:
    ? いくつかの文を連ね、まとまりのある思想や感情を表したもの。ふつうは、韻文に対する散文をいう。
    : 여러 문장을 이어 하나로 정리된 사상이나 감정을 나타낸 것. 보통 운문에 대한 산문을 이른다.
  玉章:
    "①相手の手紙に対する敬称。玉書 ②すぐれて美しい詩文。": "① 상대의 편지를 높여 이르는 말. ② 뛰어나고 아름다운 시문."
  章句:
    "①文章の章や句。 ②文章の段落や区切り。": "① 문장의 장과 구. ② 문장의 단락이나 구분."
  章程:
    規則・法度(ハット)を集めた箇条書き。おきて。のり。: 규칙이나 법도를 모아 조목조목 쓴 것. 규정.
  章節:
    論文など長い文章の、章や節の区切り。: 논문 등 긴 글의 장이나 절의 구분.
  表章:
    ? "① あらわして明らかにすること。ほめあらわすこと。② あることがらを、具体的・象徴的にあらわしている事物。"
    : "① 드러내어 밝히는 것. 칭송하여 나타내는 것. ② 어떤 일을 구체적·상징적으로 나타내는 사물."
  記章:
    ? "①身分・職業などを示すため、衣服や帽子などに付けるしるし。校章・社章などのバッジ。 ②記念として関係者に渡すしるし。メダル。 ①「徽章」の書きかえ字。"
    : "① 신분이나 직업 등을 나타내기 위해 옷이나 모자 등에 다는 표지. 배지. ② 기념으로 관계자에게 주는 표지. 메달."
童:
  河童:
    ? "①想像上の動物。体は人間の四～五歳ほどで、甲羅をつけ、頭に水を入れた皿がある。 ②泳ぎのうまい人。 ③①の好物とされることから、キュウリのこと。"
    : "(1) 상상의 동물. 몸은 네다섯 살 아이만 하고 등딱지가 있으며 머리에 물이 담긴 접시가 있다고 한다. (2) 헤엄을 잘 치는 사람. (3) 그 상상의 동물이 좋아한다고 여겨지는 오이."
  童:
    "「童(わらわ)」に同じ。": 어린아이.
    ? "①一〇歳前後の元服前の子ども。わらべ。 ②子どもの召使い。童男(わらわお)・童女(わらわめ)。①②童子"
    : "(1) 열 살 전후의, 성인식을 치르기 전 아이. (2) 어린 시종."
  童子:
    "「童(わらわ)」に同じ。": 어린아이.
  童形:
    昔の、元服・結髪する前の子どもの姿。また、その子ども。稚児(チご)姿。: 옛날 성인식이나 결발을 하기 전 아이의 모습. 또는 그런 아이.
  童画:
    "①子ども向けの絵。 ②子どもが描いた絵。児童画。": "(1) 어린이용 그림. (2) 어린이가 그린 그림. 아동화."
  小童:
    子どもや年少者をののしっていう語。: 어린아이나 나이 어린 사람을 낮잡아 이르는 말.
  尸童:
    祈禱(キトウ)師が神霊を招き寄せ、乗り移らせる童子や人形。: 기도사가 신령을 불러 내려 붙게 하는 아이나 인형.
  御河童:
    少女の髪形の一つ。前髪はまゆの上で、後ろ髪は耳の下あたりで切りそろえたもの。: 소녀 머리 모양의 하나. 앞머리는 눈썹 위, 뒷머리는 귀 아래쯤에서 가지런히 자른 것.
  童男:
    男の子。少年。おのわらわ。: 남자아이. 소년.
  童謡:
    ? 古代、政治や社会を風刺、または予言したはやり歌。神が子どもの口を借りて歌わせると考えられた。上代歌謡の一種。
    : 고대에 정치나 사회를 풍자하거나 예언하던 유행가. 신이 아이의 입을 빌려 부르게 한다고 여겨졌다.
  童顔:
    "①子どもの顔。 ②子どものような顔つき。": "① 아이의 얼굴. ② 아이 같은 얼굴."
第:
  第一印象:
    人や物事に接して、最初に受けた感じ。: 사람이나 사물을 접하고 처음 받은 느낌.
  第三者:
    その事件や事柄に、直接関係のない人。当事者以外の人。当事者: 그 사건이나 일에 직접 관계가 없는 사람. 당사자 이외의 사람.
  聚楽第:
    一五八七（天正一五）年、豊臣秀吉(とよとみひでよし)が京都に建てた豪華な建物。: "[지명] 1587년에 도요토미 히데요시가 교토에 세운 호화로운 건물."
  及第:
    試験などに合格すること。一定の条件を満たすこと。落第: 시험 등에 합격하는 것. 일정한 조건을 충족하는 것.
  次第:
    ? "①順序。 ②由来。なりゆき。 ③…によって決まる。 ④なりゆきにまかせること。なるがまま。 ⑤…するとすぐ。"
    : "① 순서. ② 유래. 경위. ③ …에 따라 결정됨. ④ 형편에 맡김. 되는 대로. ⑤ …하자마자."
  第一:
    ? "①順序のいちばん初め。最初。 ②最も重要なこと。 ③最もすぐれていること。 ④何よりもまず。さしあたり。"
    : "① 순서의 맨 처음. 최초. ② 가장 중요한 것. ③ 가장 뛰어난 것. ④ 무엇보다 먼저. 우선."
  第一人者:
    ある社会や分野で、最もすぐれていると認められるほどの人。: 어떤 사회나 분야에서 가장 뛰어나다고 인정받는 사람.
  第一線:
    ? "①戦場で、敵に最も近い前線。最前線。 ②ある方面の重要なことが活発に行われているところ。"
    : "① 전장에서 적과 가장 가까운 전선. 최전선. ② 어떤 분야의 중요한 일이 활발히 이루어지는 곳."
  第三国:
    当面する事件や事柄に、直接関係のない国。当事国: 당면한 사건이나 사안에 직접 관계가 없는 나라. 제삼국.
  第六感:
    ? 五感（視覚・聴覚・嗅覚(キュウカク)・味覚・触覚）のほかにあると思われる感覚。理屈では説明できない、物事の本質を鋭く感じとる心のはたらき。直感。勘。
    : 오감 이외에 있다고 여겨지는 감각. 이치로 설명할 수 없이 사물의 본질을 날카롭게 느끼는 마음의 작용. 직감.
  第宅:
    大きくてりっぱな家。やしき。: 크고 훌륭한 집. 저택.
  邸第:
    "「邸宅」に同じ。第宅(テイタク)": 저택과 같음.
筆:
  土筆:
    スギナの胞子茎。早春、茶褐色で筆形の穂をつける。食用。つくづくし。すぎなぼうず。春: "[생물] 쇠뜨기의 포자줄기. 이른 봄에 다갈색의 붓 모양 이삭이 나오며 식용한다."
  筆:
    ? "①タヌキやウマなどの毛を束ねて軸に取りつけ、墨や絵の具を含ませて文字や絵画をかくのに用いる道具。また、筆記用具。 ②①を用いてかくこと。また、そのかいた書や絵画。 ③文章。"
    : "(1) 동물의 털을 묶어 자루에 붙이고 먹이나 물감을 묻혀 글자나 그림을 그리는 데 쓰는 도구. 또는 필기구. (2) 붓으로 쓰는 것. 또는 그렇게 쓴 글이나 그림. (3) 문장."
  筆力:
    "①ふでの勢いや力。筆勢 ②文章によって人に訴える力。文章の表現力。": "(1) 붓의 기세나 힘. (2) 글로 사람에게 호소하는 힘. 문장의 표현력."
  筆舌:
    ふでと舌。文章と話し言葉。: 붓과 혀. 문장과 말.
  筆記:
    書き記すこと。書き取ること。また、書き記したもの。: 글로 적는 것. 받아 적는 것. 또는 적어 놓은 것.
  筆頭菜:
    スギナの胞子茎。: "[생물] 쇠뜨기의 포자줄기."
  筆墨:
    ふでと墨。また、それで書き記したもの。: 붓과 먹. 또는 그것으로 써 적은 것.
  筆忠実:
    手紙や文章を面倒がらずに書くこと。また、その人。筆不精: 편지나 글을 귀찮아하지 않고 자주 쓰는 것. 또는 그런 사람.
  筆禍:
    ? 自分が書いて発表した文章が原因で、法律的・社会的に制裁や非難を受けること。また、その災難。舌禍
    : 자신이 써서 발표한 글 때문에 법적·사회적으로 제재나 비난을 받는 것. 또는 그 재난.
  筆談:
    口で話すかわりに、用件や意志を文字や文章に書いて伝え合うこと。: 말 대신 용건이나 의사를 글자로 써서 주고받는 것. 필담.
  筆陣:
    ? "①文章による鋭い論戦をすること。また、そのような文章。論陣 ②筆者の顔ぶれ。筆者の陣容。"
    : "① 글로 날카로운 논전을 벌이는 것. 또는 그런 글. ② 필자들의 구성."
  運筆:
    筆づかい。字や絵をかく筆などの動かし方。また、筆の運び方。: 붓놀림. 글씨나 그림을 쓸 때 붓 등을 움직이는 방식.
  筆遣い:
    "①ふでの運び方・つかい方。": "① 붓을 움직이는 방식. 붓을 쓰는 법."
等:
  等:
    ? "①それ以外の類するものの存在を示す語。 ②謙遜(ケンソン)や強意の意を表す語。 ③表現をやわらげていう語。"
    : "(1) 그 밖의 비슷한 것이 있음을 나타내는 말. (2) 겸손이나 강조의 뜻을 나타내는 말. (3) 표현을 부드럽게 하는 말."
    ? "①複数を表す語。 ②人の代名詞について謙遜(ケンソン)・軽視などを表す語。 ③方向・場所などをおおよそに示す語。"
    : "(1) 복수를 나타내는 말. (2) 사람의 대명사에 붙어 겸손이나 경시 등을 나타내는 말. (3) 방향이나 장소 등을 대략 나타내는 말."
  等しい:
    "①複数の物事で数量・性質などの同じであるさま。 ②そろっているさま。一斉であるさま。": "(1) 여러 사물의 수량이나 성질 등이 같은 모양. (2) 가지런한 모양. 일제히 같은 모양."
  等閑:
    "「等閑(なおざり)」に同じ。": 소홀히 함.
    おろそかにするさま。いい加減にしておくさま。: 소홀히 하는 모양. 대충 해 두는 모양.
  此方人等:
    おれたち。おれ。「自分たち」「自分」をぞんざいにいう語。: 우리들. 나. 「우리」나 「나」를 거칠게 이르는 말.
  等価:
    価値や価格がひとしいこと。また、その価値・価格。: 가치나 가격이 같은 것. 또는 그 가치나 가격.
  等分:
    "①ひとしく分けること。同じ分量で分けること。また、その分量。均分 ②同じ程度。": "① 똑같이 나누는 것. 같은 분량으로 나누는 것. 또는 그 분량. ② 같은 정도."
  等号:
    二つの数や式などの間にはさんで、両方が等しいことを表す記号。イコール。不等号: 두 수나 식 사이에 넣어 양쪽이 같음을 나타내는 기호. 등호.
  等温:
    温度がひとしいこと。同じ温度。: 온도가 같은 것. 같은 온도.
  等級:
    上下や優劣の段階。階級: 상하나 우열의 단계. 등급.
  等高線:
    ? "「等高曲線」の略。地図上で、高度や傾斜など、地形を表すために、標準海面からの高さがひとしい点を結んだ線。同高線。水平曲線。等深線"
    : 등고곡선의 준말. 지도에서 지형을 나타내기 위해 표준 해면으로부터 높이가 같은 점을 이은 선. 등고선.
  郎等:
    ? "① ( 現代は「ろうとう」とも ) 従者。身分的に主人に隷属する従僕。② 平安末期・鎌倉時代の武家社会で、主人と血縁関係のない従者。主人と血縁関係のある家の子とは区別していう。郎従。③ 一般に、武士の家来。従僕。召使い。④ 婚礼の時の花嫁の介添役を、長野県や千葉県君津郡でいう。①の意であったが、平安時代末からの武家社会では、②のように使われた。( 3 )江戸時代初期に開合の区別が失われたため、「とう（等）」と「たう（党）」がトウと同音になった結果、この時期以降「郎等」に加え「郎党」の表記も現われた。"
    : "① 종자. 신분적으로 주인에게 예속된 종복. ② 헤이안 말기·가마쿠라 시대 무가 사회에서 주인과 혈연관계가 없는 종자. ③ 일반적으로 무사의 가신이나 하인."
箱:
  箱:
    ? "[ 1 ] ① 物をおさめるための器。多く蓋(ふた)と身とから成る。木、紙、金属、皮革、プラスチックなどで作り、直方体のものが多い。② 大便を受ける容器。しのはこ。転じて、大便。糞。→はこ（箱）する。③ 三味線を入れる容器。転じて、三味線。また、三味線を入れた容器を持って芸者に従って行く男や芸者をもいう。はこや。④ 「はさみばこ（挟箱）」の略。⑤ ＝くるまばこ（車箱）⑥ 鉄道の客車や路面電車の車両。⑦ 四角形。箱形。⑧ 川床の両側が切り立った岩になっている地形。⑨ 「はこいり（箱入）③」の略。⑩ 「はこいりむすめ（箱入娘）」の略。①の形をしたものを数えるのに用いる語。"
    : "(1) 물건을 담기 위한 그릇. 대개 뚜껑과 몸체로 이루어지며 나무ㆍ종이ㆍ금속ㆍ가죽ㆍ플라스틱 등으로 만들고 직육면체가 많다. (2) 대변을 받는 용기. 나아가 대변. (3) 샤미센을 넣는 용기. 나아가 샤미센이나, 그 용기를 들고 게이샤를 따라다니는 사람. (4) 끼워 넣는 상자의 준말. (5) 차량의 객실. (6) 철도 객차나 노면전차의 차량. (7) 사각형. 상자 모양. (8) 강바닥 양쪽이 깎아지른 바위가 된 지형. (9) 특기의 준말. (10) 얌전히 자란 딸의 준말. (11) 상자 모양의 것을 세는 말."
  箱枕:
    箱形の台の上にくくり枕をのせたもの。日本髪を結ったときなどに使う。: 상자 모양 받침 위에 묶은 베개를 올린 것. 일본식 머리를 했을 때 등에 쓴다.
  重箱:
    積み重ねられるように作られた、料理を詰める四角い箱。: 겹쳐 쌓을 수 있게 만든, 요리를 담는 네모난 상자.
  巾箱:
    ? "①書物などをいれておく布張りの小さな箱。 ②「巾箱本(キンソウボン)」の略。携帯用の小さな本。"
    : "① 책 등을 넣어 두는 천을 댄 작은 상자. ② 휴대용 작은 책."
  清箱:
    便器。大壺(おおつぼ)。おまる。: 변기. 요강.
  箱入り:
    ? "①箱に入っていること。また、入っているもの。 ②大事にすること。また、その人や物。 ③得意な物事。おはこ。"
    : "① 상자에 들어 있는 것. 또는 들어 있는 물건. ② 소중히 여기는 것. 또는 그런 사람이나 물건. ③ 잘하는 일. 장기."
  箱師:
    列車・電車など、乗り物のなかで専門にかせぐ掏摸(すり)。: 열차나 전차 등 탈것 안에서 전문적으로 소매치기하는 사람.
  箱書:
    ? 書画・器物などを収めた箱に、その中身の名称を書いたもの。また、作者や鑑定人などが、その品が本物であることを証明して署名・押印したもの。
    : 서화나 기물을 넣은 상자에 그 내용물의 이름을 쓴 것. 또는 작가나 감정인이 진품임을 증명해 서명·날인한 것.
  箱梯子:
    下部の空間を利用して、戸棚や引き出しなどを設けた階段。はこばし。: 아래쪽 공간을 이용해 찬장이나 서랍 등을 만든 계단.
  箱船:
    "①長方形の船。 ②『旧約聖書』のなかの「ノアの箱船」のこと。": "① 직사각형 배. ② 구약성서의 노아의 방주."
級:
  級:
    くらい。順序。次第。段階。: 등급. 순서. 차례. 단계.
  首級:
    "「首級(しるし)」に同じ。": 전투에서 베어 얻은 적의 머리.
  冪級数:
    ある変数の累乗(ルイジョウ)の定数倍から成り立つ、無限級数。: 어떤 변수의 거듭제곱에 상수를 곱한 항들로 이루어진 무한급수. 멱급수.
  原級:
    ? "①進級できず、再び履修する学年。 ②欧米語の文法で、形容詞・副詞の比較級・最上級に対する基本の形。"
    : "① 진급하지 못해 다시 이수하는 학년. ② 서양어 문법에서 형용사·부사의 비교급·최상급에 대한 기본형."
  学級:
    学校で、授業のために、生徒を一定の人数に組分けしたもの。クラス。組。: 학교에서 수업을 위해 학생을 일정 인원으로 나눈 집단. 반.
  特級:
    一級より上の等級。最高級。また、そのもの。: 1급보다 위의 등급. 최고급. 또는 그런 것.
  等級:
    上下や優劣の段階。階級: 상하나 우열의 단계. 등급.
  級友:
    学校で同じ級の友だち。同級生。クラスメート。: 학교에서 같은 반인 친구. 동급생. 반 친구.
  級数:
    ? 数学で、法則にしたがって一定の順に並べた数を和の記号（加法記号）で順に結んだもの。等差級数・等比級数など。
    : "법칙에 따라 일정한 순서로 배열한 수를 더하기 기호로 차례로 연결한 것. 급수."
  超弩級:
    大きさや強さが、同類の物よりずば抜けていること。: 크기나 강함이 같은 종류의 것보다 월등히 뛰어난 것.
  階級:
    "①地位・身分などの等級・段階。 ②社会における家柄・身分・財産などが同じ集団。階層": "① 지위나 신분 등의 등급·단계. ② 사회에서 가문, 신분, 재산 등이 같은 집단. 계층."
  飛び級:
    成績優秀者が、正規の課程をとび越えて、例外的により上の学年や課程に進級すること。: 성적 우수자가 정규 과정을 건너뛰어 예외적으로 더 높은 학년이나 과정으로 진급하는 것.
  首級・首:
    戦で討ち取った敵の首。: 전쟁에서 베어 얻은 적의 목.
  級差:
    ? しな。等級。漢・揚雄〔大鴻臚の箴〕人に材能り、寮に差り。能をし官を授くるに、各宜しき攸(ところ)り。字通「級」の項目を見る。
    : 품등. 등급.
終:
  終う:
    "①おえる。おわりにする。 ②やめる。": "(1) 끝내다. 마치다. (2) 그만두다."
  終える:
    ? "［動ア下一］［文］を・ふ［ハ下二］１ 続けてきたことを済ませる。終わらせる。⇔始める。２ 続いてきたことが終わる。"
    : 그때까지 계속해 온 일을 마치다. 끝내다. 다 이루다.
    ? "[ 文語形 ]を・ふ （その時まで続けてきたことを）すませる。終わらせる。極めつくす。果たす。しとげる。(ヲ)へることが出来」〈国木田独歩〉下)"
    : 그때까지 이어 오던 일을 마치다. 끝내다. 끝까지 해내다. 완수하다.
  終に:
    "①とうとう。最後に。結局。 ②ずっと。最後まで。ついぞ。多く、打ち消しの語を伴う。": "(1) 마침내. 마지막에. 결국. (2) 줄곧. 끝까지. 흔히 부정어를 동반한다."
  終わる:
    ? "①それまで続いていたものが完結する。また、しまいにする。 ②不本意な結果になる。 ③死ぬ。"
    : "(1) 그때까지 이어지던 것이 완결되다. 또는 끝내다. (2) 바라지 않던 결과가 되다. (3) 죽다."
  終日:
    "「終日(シュウジツ)」に同じ。〈与謝蕪村(よさぶそん)の句〉 終夜(よもすがら)": 하루 종일.
    一日中。朝から晩までずっと。 終夜(シュウヤ): 하루 종일. 아침부터 밤까지 줄곧.
    "「終日(シュウジツ)」に同じ。 終夜(よもすがら)": 하루 종일.
  終焉:
    "①死にぎわ。臨終。転じて、物事の終わり。 ②身の落ち着く所。晩年を静かに過ごすこと。": "(1) 죽음에 임박한 때. 임종. 나아가 사물의 끝. (2) 몸이 머무를 곳. 만년을 조용히 보내는 것."
  弥終:
    いちばんあと。最後。最終。: 가장 마지막. 최후. 최종.
  終夜:
    "「終夜(シュウヤ)」に同じ。": 밤새. 온밤.
  終業:
    "①その日の仕事が終わること。 ②学校で、一定期間の授業が終わること。 ①②始業": "① 그날의 일이 끝나는 것. ② 학교에서 일정 기간의 수업이 끝나는 것."
  終演:
    芝居や映画などの上演が終わること。はね。 開演: 연극이나 영화 등의 상연이 끝나는 것. 종연.
  終点:
    一番最後となる所。特に電車やバスの路線の終着駅。 起点・始点: 가장 마지막이 되는 곳. 특히 전철이나 버스 노선의 종착역.
緑:
  緑:
    ? "①青と黄の中間色で、光の三原色の一つ。草木の葉の色。 ②濃い藍(あい)色。 ③草木。特に、新芽や若葉。 夏"
    : "(1) 파랑과 노랑의 중간색으로 빛의 삼원색 중 하나. 풀과 나무 잎의 색. (2) 짙은 남색. (3) 풀과 나무. 특히 새싹이나 어린잎."
  緑内障:
    ? 眼球の圧力が異常に高くなり、目が痛み視力が減退する病気。ひとみが緑色をおび、失明することもある。あおそこひ。
    : 안구 압력이 비정상적으로 높아져 눈이 아프고 시력이 떨어지는 병. 동공이 초록빛을 띠며 실명할 수도 있다.
  緑茶:
    ? チャの若葉を蒸してもみ、緑色を失わないように作った茶。煎茶(センチャ)・抹茶など。日本茶。
    : 차나무의 어린잎을 쪄서 비비고 초록색을 잃지 않도록 만든 차. 전차ㆍ말차 등. 일본차.
  緑啄木鳥:
    ? キツツキ科の鳥。日本特産で、本州以南の森林にすむ。背は緑色で、腹は白地に暗褐色の斑点(ハンテン)がある。雄は頭頂部全体、雌は後頭部が赤い。
    : "[생물] 딱따구리과의 새. 일본 특산으로 혼슈 이남의 숲에 산다."
  緑地:
    草木の茂っている土地。: 풀과 나무가 우거진 땅. 녹지.
  緑肥:
    草などを青いまま土中に敷きこんで肥料とするもの。草肥(くさごえ) 夏: 풀 등을 푸른 상태로 흙 속에 묻어 비료로 삼는 것. 녹비.
  緑藻類:
    ? 緑色をした藻類の総称。葉緑素をもち、光合成を行う。淡水に見られるのはヒビミドロ・クラミドモナスなど、海水ではミル・アオノリなど。緑藻植物。
    : "[생물] 녹색을 띤 조류의 총칭. 엽록소가 있어 광합성을 한다."
  緑酒:
    緑色の酒。上質の酒。うまい酒。: 녹색 술. 좋은 술. 맛있는 술.
  緑野:
    草や木が青々と茂った野原。: 풀과 나무가 푸르게 우거진 들판.
  緑風:
    初夏に、青葉を吹きわたるさわやかな風。夏: 초여름에 푸른 잎 사이로 불어오는 상쾌한 바람.
  緑鳩:
    ? ハト科の鳥。山地の森林にすむ。背は緑色で、胸は黄色。尺八のような哀調をおびた鳴き声を出す。
    : "[생물] 비둘기과의 새. 산지 숲에 살며 등은 녹색, 가슴은 노란색이다."
練:
  練る:
    ? "①混ぜ合わせてこねる。 ②よりよい状態にする。 ③経験や修養を積む。 ④生糸や絹布を灰汁(あく)などで煮て柔らかくする。 ⑤ゆっくり進む。"
    : "(1) 섞어 반죽하다. (2) 더 좋은 상태로 만들다. (3) 경험이나 수양을 쌓다. (4) 생사나 견직물을 잿물 등으로 삶아 부드럽게 하다. (5) 천천히 나아가다."
  練若:
    僧の修行に適した静かな場所。また、修行僧の住む粗末な家や寺院。阿蘭若(アランニャ): "[불교] 승려의 수행에 적합한 조용한 곳. 또는 수행승이 사는 초라한 집이나 절."
  練乳:
    ? 牛乳を煮詰めて濃縮したもの。無糖をエバミルク、加糖をコンデンスミルクという。 「煉乳」の書きかえ字。
    : 우유를 졸여 농축한 것. 무당은 에바밀크, 가당은 연유라고 한다.
  練兵:
    兵士を訓練すること。戦闘の練習をすること。: 병사를 훈련하는 것. 전투 연습을 하는 것.
  練墨:
    眉(まゆ)をかくのに用いる、練った墨。まゆずみ。: 눈썹을 그리는 데 쓰는 개어 만든 먹. 눈썹 먹.
  練成:
    技や心身をりっぱに鍛え上げること。錬磨育成。: 기술이나 심신을 훌륭하게 단련하여 기르는 것.
  練武:
    武道を練習すること。また、その練習。: 무도를 연습하는 것. 또는 그 연습.
  練炭:
    ? 石炭や木炭などの粉末をねり固めた燃料。太い円筒形で、燃焼効率を上げるため、縦に数個の穴があいている。 「煉炭」の書きかえ字。
    : 석탄이나 목탄 등의 가루를 개어 굳힌 연료. 굵은 원통형으로 세로 구멍이 여러 개 뚫려 있다.
  練熟:
    経験豊かで上手なこと。熟練: 경험이 풍부하고 능숙한 것. 숙련.
  練糸:
    ? 生糸の膠質（セリシン）を除去して、特有の光沢と手触りを出した絹糸。除去の程度により半練糸、本練糸にわける。
    : 생사의 교질을 제거해 특유의 광택과 촉감을 낸 견사.
  練習:
    学問や技芸が上達するように、繰り返し学習すること。稽古(ケイコ): 학문이나 기예가 늘도록 반복해 익히는 것. 연습.
  練達:
    習熟して高い水準に達すること。熟達: 익숙해져 높은 수준에 이르는 것. 숙달.
  手足れ・手練:
    腕前がすぐれていること。また、その人。: 기량이 뛰어난 것. 또는 그런 사람.
羊:
  山羊:
    ? ウシ科の哺乳(ホニュウ)動物。家畜として飼育。ヒツジに似るが首が長い。多くは二本の角をもち、雄はあごひげがある。乳・肉を利用。
    : "[생물] 소과의 포유동물. 가축으로 기른다. 양과 비슷하지만 목이 길고, 대개 두 개의 뿔이 있으며 수컷은 턱수염이 있다. 젖과 고기를 이용한다."
  羊:
    ? ウシ科の哺乳(ホニュウ)動物。古くから家畜として世界各地で飼育。草食で性質はおとなしく、体には灰白色の巻き縮れた長い毛が生えている。毛・肉・乳・皮と用途が広い。メンヨウ。
    : "[생물] 소과의 포유동물. 예로부터 가축으로 세계 각지에서 길렀다. 초식성이며 성질이 온순하고 몸에는 회백색의 길고 곱슬곱슬한 털이 난다. 털ㆍ고기ㆍ젖ㆍ가죽 등 쓰임이 넓다."
  羊栖菜:
    褐藻類ホンダワラ科の海藻。 鹿尾菜(ひじき): "[생물] 갈조류 모자반과의 해조."
  羊歯:
    ? シダ植物の総称。正月の飾りに用いるウラジロを指すことが多い。シノブ・ワラビ・ゼンマイなどを含め、世界に約一万種。新年
    : "[생물] 양치식물의 총칭. 새해 장식에 쓰는 우라지로를 가리키는 경우가 많다. 고사리ㆍ고비 등을 포함해 세계에 약 1만 종이 있다."
  羊羹:
    あんに砂糖や寒天を加えて、練ったり蒸したりして固めた菓子。: 팥소에 설탕이나 한천을 더해 반죽하거나 쪄서 굳힌 과자.
  野羊:
    ウシ科の哺乳(ホニュウ)動物。: "[생물] 소과의 포유동물. 염소."
  山羊鬚:
    ヤギのひげのように、あごの下に生やした長いひげ。: 염소 수염처럼 턱 아래에 기른 긴 수염.
  羊乳:
    ? キキョウ科のつる性多年草。山野に自生。つるや葉を切ると白い乳液が出る。根はチョウセンニンジンに似る。夏、淡緑色で、内側に紫褐色の斑点(ハンテン)のある鐘形の花をつける。
    : "[생물] 초롱꽃과의 덩굴성 여러해살이풀. 줄기나 잎을 자르면 흰 유액이 나온다."
  羊毛:
    羊や山羊(やぎ)などからとった毛。毛糸・毛織物の原料とする。: 양이나 염소 등에서 얻은 털. 털실이나 모직물의 원료로 쓴다.
  羊裘垂釣:
    ? 隠者の姿のこと。ヒツジの皮ごろもを着て釣り糸を垂れる意から。「裘」は獣の毛皮で作った服のこと。〈『後漢書(ゴカンジョ)』〉
    : 은자의 모습을 이르는 말. 양가죽 옷을 입고 낚싯줄을 드리운다는 뜻에서 온 말.
  羊質虎皮:
    ? 外見はりっぱだが中身がないたとえ。見かけだおし。実際はヒツジなのにトラの皮をかぶっている意から。〈『後漢書(ゴカンジョ)』〉
    : 겉보기는 훌륭하지만 속은 보잘것없음을 비유하는 말. 겉만 번지르르함.
  羊蹄:
    タデ科の多年草。原野に自生。夏、淡黄緑色の花を節ごとにつける。春: "[생물] 마디풀과의 여러해살이풀. 들판에 자라며 연한 황록색 꽃을 피운다."
  羊駝:
    ? ラクダ科の哺乳(ホニュウ)動物。南米のアンデス山地で家畜として飼育。背にこぶはなく、体高は一・二(メートル)ほど。荷物の運搬に用いる。肉は食用。アメリカラクダ。リャマ。
    : "[생물] 낙타과의 포유동물. 남미 안데스 산지에서 가축으로 기르며 짐 운반에 쓴다. 라마."
美:
  美い:
    "( 「うつくしい」の変化した語 ) きれいだ。かわいい。": 곱다. 귀엽다.
  美しい:
    ? "①形・色・音などがこころよく感じられる。きれいなさま。 ②行動や性質などが心を打つさま。感心だ。"
    : "(1) 모양ㆍ색ㆍ소리 등이 기분 좋게 느껴지는 모양. 아름다운 모양. (2) 행동이나 성질 등이 마음을 울리는 모양. 훌륭하다."
  美人:
    ? "① 美しい人。容貌が他にすぐれて美しい人。(イ) 容貌の美しい女。美女。佳人。(ロ) 容貌の美しい男子。美男子。② 常に敬慕する君主または、賢人。探し求めている理想の君主、賢人。③ 中国で女官の名。漢代から明代まで置かれ、漢代には一四等中の第五等。〔史記‐藺相如伝〕④ 「にじ（虹）」の異称。〔釈名‐釈天〕"
    : "(1) 아름다운 사람. 용모가 특히 아름다운 사람. (2) 늘 경모하는 군주나 현인. 찾고 있는 이상적인 군주나 현인. (3) 중국의 여관 이름. (4) 무지개의 다른 이름."
  美作:
    旧国名の一つ。現在の岡山県の北東部。作州(サクシュウ)。: "[지명] 옛 나라 이름의 하나. 현재 오카야마현 북동부."
  美称:
    ? 飾ったりほめたりする言い方。また、その語。「御酒(みき)」を「豊(とよ)御酒」、「霰(あられ)」を「玉(たま)霰」というなど。
    : 꾸미거나 칭찬하여 부르는 말. 또는 그런 말.
  美顔術:
    ? 顔の美しさを保ち、あるいは増すための、皮膚(ヒフ)の生理機能を高める美容法。マッサージ・化粧法など。
    : 얼굴의 아름다움을 유지하거나 높이기 위해 피부의 생리 기능을 높이는 미용법. 마사지ㆍ화장법 등.
  美し国:
    よい国。すばらしい国。美しい国。: 좋은 나라. 훌륭한 나라. 아름다운 나라.
  美人局:
    女が夫や情夫と共謀し、他の男を誘惑して、それを口実に金品をゆすり取ること。: 여자가 남편이나 정부와 공모해 다른 남자를 유혹하고, 그것을 구실로 금품을 갈취하는 것.
  美化:
    "①美しく変えること。 ②実際以上に美しく認識したり、表現したりすること。": "① 아름답게 바꾸는 것. ② 실제보다 아름답게 인식하거나 표현하는 것."
  美味い:
    飲食物の味がよい。美味である。おいしい。不味(まず)い: 음식 맛이 좋다. 맛있다.
  美味しい:
    飲食物の味がよい。美味である。うまい。不味(まず)い: 음식 맛이 좋다. 맛있다.
  美感:
    美しいと感じる気持ち。美に対しての感覚。: 아름답다고 느끼는 마음. 아름다움에 대한 감각.
  美果:
    "①味がよい果物。 ②よい結果。": "① 맛이 좋은 과일. ② 좋은 결과."
  美点:
    美しい点。よい点。すぐれた所。長所。: 아름다운 점. 좋은 점. 뛰어난 점. 장점.
  美観:
    美しいながめ。美景: 아름다운 경관. 미관.
  美酒:
    味のよい酒。うまい酒。うまさけ。: 맛이 좋은 술. 좋은 술.
習:
  習う:
    "①何度も練習して身につける。 ②教えを受ける。学ぶ。": "(1) 여러 번 연습해 몸에 익히다. (2) 가르침을 받다. 배우다."
  習作:
    芸術や文芸などの分野において、練習のために作った作品。エチュード。: 예술이나 문예 등의 분야에서 연습을 위해 만든 작품. 에튀드.
  習慣:
    ? "①長い間くり返すうちに、自然と身についた決まりごと。 ②古くからならわしとして行われている事柄。風習。しきたり。"
    : "(1) 오랫동안 되풀이하는 사이 자연스럽게 몸에 밴 규칙이나 행동. (2) 예부터 관습으로 행해지는 일. 풍습. 관례."
  寒復習:
    寒中の早朝などに芸事の復習や練習をすること。寒げいこ。冬: 한겨울 이른 아침 등에 예능을 복습하거나 연습하는 것. 한중 연습.
  復習う:
    教えられたことを繰り返して練習する。復習する。: 배운 것을 되풀이해 연습하다. 복습하다.
  習俗:
    ある時代や地域などで、社会的に行われている習慣や風俗。 慣習・風習: 어떤 시대나 지역 등에서 사회적으로 행해지는 습관이나 풍속.
  習合:
    異なる教義や主義などを取り入れて、一つにまとめること。: 서로 다른 교의나 주의 등을 받아들여 하나로 합치는 것.
  習字:
    ? 文字をならうこと。文字を、正しく、美しく、速く書くための学習。現在、小・中学校では書写といい、硬筆と毛筆によって指導され、毛筆中心の高等学校書道とは区別されている。
    : 글씨를 배우는 것. 글자를 바르고 아름답고 빠르게 쓰기 위한 학습. 습자.
  習得:
    技術などをならって覚え、身につけること。: 기술 등을 배워 익히고 몸에 익히는 것.
  習性:
    "①習慣で身についた特有の性質。くせ。 ②動物の行動に現れるきまった性質。": "① 습관으로 몸에 밴 특유의 성질. 버릇. ② [생물] 동물의 행동에 나타나는 일정한 성질."
  習熟:
    習ったことを十分に身につけていること。慣れて上手になっていること。 熟練・熟達: 배운 것을 충분히 몸에 익힌 것. 익숙해져 능숙해진 것.
  習癖:
    身についてしまっているくせ。特に、悪いくせをいうことが多い。 性癖: 몸에 배어 버린 버릇. 특히 나쁜 버릇을 이르는 경우가 많다.
  習練:
    よく習い、練習を続けること。: 잘 배우고 계속 연습하는 것.
者:
  尸者:
    葬儀で、死者に代わって弔問を受ける人。: 장례에서 죽은 사람을 대신해 조문을 받는 사람.
  影武者:
    ? "①敵を欺くため、大将などと同じ服装をさせた身代わりの武士。 ②表に出ず、裏で実際に指図する人。黒幕"
    : "(1) 적을 속이기 위해 대장 등과 같은 복장을 시킨 대역 무사. (2) 겉으로 나서지 않고 뒤에서 실제로 지휘하는 사람."
  者:
    人を指していう語。自分を謙遜(ケンソン)するときや、目下の人を指すときの語。: 사람을 가리켜 이르는 말. 자신을 낮추거나 아랫사람을 가리킬 때 쓰는 말.
  覚者:
    自ら真理をさとっていて、他者をもさとらせる者。: 스스로 진리를 깨닫고 다른 사람도 깨닫게 하는 사람.
  今者:
    "( 「者」は漢文で用いる助辞 ) いま。このごろ。今時。現今。今般。": 지금. 요즘. 현재. 금번.
  作者:
    ? "① ある詩歌、文章、絵画、彫刻などの芸術作品を作った人。また、古くは、広く物を作る人をいった。② 特に、勅撰集などに歌をえらばれた歌人。③ 特に、脚本を書く人。芝居狂言を作る人。④ 計画する人。陰謀などをはからう人。"
    : "① 시가, 문장, 회화, 조각 등 예술 작품을 만든 사람. 작자. ② 특히 각본을 쓰는 사람. ③ 계획하거나 음모를 꾸미는 사람."
  前者:
    並べて述べた二つのものの前のほう。 後者: 나란히 말한 두 가지 중 앞의 것. 전자.
  呆気者:
    愚か者。ぼんやりしている者。のろま。: 어리석은 사람. 멍한 사람. 굼뜬 사람.
  啞者:
    言葉の不自由な人。言葉が話せない人。: 말을 자유롭게 하지 못하는 사람. 말을 할 수 없는 사람.
  強者:
    "①非常に強い兵士。勇士。 ②ある方面で非常にすぐれている人。猛者。": "① 매우 강한 병사. 용사. ② 어떤 방면에서 매우 뛰어난 사람."
  従者:
    主人につきしたがう者。ともびと。: 주인을 따라다니는 사람. 수행원.
  易者:
    ? 算木・筮竹(ゼイチク)などを使い、易で占うことを職業とする人。 八卦見(ハッケみ)・占い師・売卜者(バイボクシャ)
    : 산가지나 시초 등을 써서 역점으로 점치는 일을 직업으로 하는 사람. 점쟁이.
  猛者:
    勇猛ですぐれた技をもち、精力的に活動する人。: 용맹하고 뛰어난 기술을 지녀 활발히 활동하는 사람.
  陳者:
    ? 申し上げますが。さて。候文(そうろうブン)の手紙で挨拶(アイサツ)のあと、本文に入るときに用いる語。
    : 말씀드리자면. 자, 이제. 옛 편지글에서 인사 뒤 본문으로 들어갈 때 쓰는 말.
育:
  教育:
    社会で生活するための学問や知識を教え育てること。: 사회에서 살아가기 위한 학문이나 지식을 가르쳐 기르는 것.
  育つ:
    ? "[ 1 ] ① 生物が生まれてから一人前になるまでの過程を進む。生きものが、時間とともに成長する。おいたつ。大きくなる。② 能力などがのびる。内容などが豊かになる。[ 2 ] 養う。そだてる。"
    : "(1) 생물이 태어나 한 사람 몫을 하게 될 때까지의 과정을 지나가다. 시간이 지나며 성장하다. (2) 능력 등이 늘다. 내용 등이 풍부해지다. (3) 기르다. 양육하다."
  育てる:
    "①小さいものが成長して大きくなるように世話をする。 ②才能や資質を伸ばすよう教え導く。": "(1) 작은 것이 성장해 커지도록 돌보다. (2) 재능이나 자질이 자라도록 가르쳐 이끌다."
  育む:
    ? "①親鳥が羽の中にひなを抱いて育てる。 ②大切に育てる。養育する。 ③物事が発展するように守り育てる。"
    : "(1) 어미 새가 날개 안에 새끼를 품어 기르다. (2) 소중히 기르다. 양육하다. (3) 사물이 발전하도록 지키고 기르다."
  化育:
    天地自然が、万物をつくり育てること。: 천지자연이 만물을 만들고 기르는 것.
  成育:
    人や動物などが育つこと。生まれ育つこと。育って成熟すること。また、育てること。: 사람이나 동물 등이 자라는 것. 태어나 자라 성숙하는 것. 또는 기르는 것.
  矜育:
    子どもなどをあわれんで育てる。: 아이 등을 가엾이 여겨 길러 주다.
  紐育:
    ? アメリカ合衆国の北東部にある大西洋に面した州。また、その州にあるアメリカ最大の都市。国連本部があり、世界経済の中心地。
    : "[지명] 미국 북동부 대서양 연안의 주. 또는 그 주에 있는 미국 최대 도시. 뉴욕."
  育成:
    一人前に育てあげること。養成: 어엿하게 자라도록 길러 내는 것. 육성.
  育苗:
    苗床(なえどこ)で、農作物や草花の苗や苗木を育てること。: 모판에서 농작물이나 화초의 모 또는 묘목을 기르는 것.
  育英:
    ? "①才能ある青少年を教育すること。 ②青少年が学業に専心できるように経済上の援助をすること。"
    : "① 재능 있는 청소년을 교육하는 것. ② 청소년이 학업에 전념할 수 있도록 경제적으로 지원하는 것."
  鞠育:
    養い育てること。大切に育てること。鞠養・養育: 기르고 키우는 것. 소중히 기르는 것.
  阿育王・阿輸迦王:
    ? インドのマガダ国のマウリア朝第三代の王。紀元前三世紀ころ、初めてインドを統一。仏教を保護し広めた。
    : "인도 마가다국 마우리아 왕조의 제3대 왕. 기원전 3세기 무렵 인도를 처음 통일하고 불교를 보호하여 널리 퍼뜨렸다."
苦:
  苦い:
    "①舌にいやな味を感じる。 ②不快であるさま。おもしろくない。 ③つらい。くるしい。": "(1) 혀에 불쾌한 맛을 느끼다. (2) 불쾌한 모양. 재미없다. (3) 괴롭다. 힘들다."
  苦しい:
    ? "①心や体が疲れたり痛んだりしてつらい。 ②無理があるさま。困窮しているようす。 ③…しにくい。…するのがつらい。"
    : "(1) 마음이나 몸이 지치거나 아파서 괴롭다. (2) 무리가 있는 모양. 곤궁한 모습. (3) …하기 어렵다. …하는 것이 힘들다."
  苦しむ:
    "①肉体に痛みを感じる。 ②思い悩む。つらい思いをする。 ③困る。窮する。": "(1) 육체에 아픔을 느끼다. (2) 고민하다. 괴로운 생각을 하다. (3) 곤란하다. 궁하다."
  苦しめる:
    ? "[ 文語形 ]くるし・む ① 体や心に苦痛を与える。苦労や心配をかける。② 相手が処置に困るようにする。閉口させる。"
    : "(1) 몸이나 마음에 고통을 주다. 고생이나 걱정을 끼치다. (2) 상대가 처리하기 곤란하게 만들다. 난처하게 하다."
  苦る:
    不愉快な顔をする。にがにがしいようすになる。: 불쾌한 얼굴을 하다. 못마땅한 표정이 되다.
  苦参:
    ? マメ科の多年草。山野に自生。夏、黄色の蝶(チョウ)形花を総状につける。根は漢方薬にする。秋
    : "[생물] 콩과의 여러해살이풀. 산야에 자생하며 여름에 노란 나비 모양 꽃이 총상으로 핀다. 뿌리는 한약재로 쓴다."
  苦境:
    追いつめられて、苦しく困難な環境。苦しい立場や境遇。逆境・窮地: 궁지에 몰려 괴롭고 어려운 환경. 괴로운 처지나 상황.
  苦学:
    苦労して学ぶこと。働いて学資を稼ぎながら勉強すること。: 고생하며 공부하는 것. 일해서 학비를 벌면서 공부하는 것.
  苦竹:
    イネ科のタケ。古く中国から渡来し各地に野生。竹の子は食用。材は細工・建築用。: "[생물] 벼과의 대나무. 오래전 중국에서 전래되어 각지에 야생한다."
  苦菜:
    ? キク科の多年草。山野に自生。夏、黄色い頭花を多数つける。茎や葉は切ると苦い乳液が出る。
    : "[생물] 국화과의 여러해살이풀. 줄기나 잎을 자르면 쓴 유액이 나온다."
    ? キク科の二年草。道端に自生。葉や茎を切ると乳液が出る。春から夏、黄色の頭花をつける。ケシアザミ。
    : "[생물] 국화과의 두해살이풀. 길가에 자라며 봄부터 여름에 노란 두상화를 피운다."
  苦言:
    厳しい忠告の言葉。耳が痛いが、ためになる忠言。甘言: 엄한 충고의 말. 듣기에는 거북하지만 도움이 되는 충언.
  苦棟樹・苦木:
    ? ニガキ科の落葉小高木。山地に自生。枝や葉はにがく、その樹液を駆虫薬や健胃薬にする。クボク。
    : "[생물] 니가키과의 낙엽 소교목. 산지에 자생하며 가지와 잎은 쓰고, 그 수액은 구충제나 건위제로 쓴다."
荷:
  稲荷:
    ? "①五穀をつかさどる神。また、その神をまつる神社。 ②キツネの別称。 ③油揚げ。また、「いなり寿司」の略。"
    : "(1) 오곡을 맡는 신. 또는 그 신을 모신 신사. (2) 여우의 별칭. (3) 유부. 또는 유부초밥의 준말."
  荷:
    "①運び移す品物。にもつ。 ②責任。負担。": "(1) 운반하는 물품. 짐. (2) 책임. 부담."
  荷う:
    "①かつぐ。肩にかけて運ぶ。 ②自分の責任として引き受ける。": "(1) 메다. 어깨에 걸어 나르다. (2) 자기 책임으로 맡다."
  荷葉:
    "①ハスの葉。 ②練り香の一種。ハスの花の香りに似せて作った香料。": "(1) 연잎. (2) 반죽 향의 한 종류. 연꽃 향과 비슷하게 만든 향료."
  荷葉座:
    仏像を安置するハスの葉の形をした台座。: "[불교] 불상을 안치하는 연잎 모양의 대좌."
  敗荷:
    葉のやぶれたハス。やれはちす。秋: 잎이 찢어진 연꽃.
  荷担:
    ? "①仲間になり、力を貸して助けること。加勢・左袒(サタン) ②荷物をになうこと。荷をかつぐこと。"
    : "① 한편이 되어 힘을 보태 돕는 것. 가담. ② 짐을 지는 것."
  荷拵え:
    荷作りをすること。: 짐을 꾸리는 것. 포장.
  荷轄:
    波の当たりを和らげるために、和船の船べりを覆うもの。むしろ・縄などで作る。: 파도의 충격을 줄이기 위해 일본식 배의 뱃전을 덮는 것. 거적이나 줄 등으로 만든다.
  荷重:
    ? "①トラックなどの貨物の重さ。 ②構造物や機械に外部から加わる力。また、構造物がたえられる限界の重さ。"
    : "① 트럭 등 화물의 무게. ② 구조물이나 기계에 외부에서 가해지는 힘. 또는 구조물이 견딜 수 있는 한계 무게."
  荷駄:
    ウマで運ぶ荷物。: 말로 나르는 짐.
  集荷:
    商品などの荷物を一か所に集めること。また、その荷物。 「蒐荷」の書きかえ字。: 상품 등의 짐을 한곳에 모으는 것. 또는 그 짐.
  荷物:
    "①持ち運んだり、運送したりする品物。に。 ②多くの形で、負担になるもの。やっかいもの。": "① 들고 다니거나 운송하는 물건. 짐. ② 부담이 되는 것. 성가신 것."
  荷役:
    船の貨物などの上げ下ろしをすること。また、その仕事に携わる人。: 배의 화물 등을 싣고 내리는 일. 또는 그 일에 종사하는 사람.
  入荷:
    店や市場に商品が入ること。: 가게나 시장에 상품이 들어오는 것. 입하.
落:
  洒落:
    ? "①掛詞(かけことば)や機知に富んだこっけいな文句。 地口(ジぐち) ②美しい装いや、気の利(き)いた身なりをすること。"
    : "(1) 말장난이나 재치 있는 우스운 문구. (2) 아름답게 꾸미거나 세련된 차림을 하는 것."
    さっぱりしていて物事にこだわらないこと。 洒脱(シャダツ): 산뜻하고 사물에 얽매이지 않는 것. 소탈함.
  群落:
    "①多くの村落。 ②同一地域内に、同じ生育条件を好む植物が群がって生えること。": "(1) 많은 마을. (2) [생물] 같은 지역 안에서 같은 생육 조건을 좋아하는 식물이 무리 지어 자라는 것."
  落ちる:
    ? "①人や物が、自然の力によって上から下へ移る。落下する。 ②程度が下がる。劣った状態になる。 ③付着していたものがとれる。 ④不合格になる。 ⑤選にもれる。落選する。 ⑥いやしくなる。 ⑦最終的な所属や結果が決まる。"
    : "(1) 사람이나 물건이 자연의 힘으로 위에서 아래로 이동하다. 낙하하다. (2) 정도가 낮아지다. 뒤떨어진 상태가 되다. (3) 붙어 있던 것이 떨어지다. (4) 불합격하다. (5) 선발에서 빠지다. 낙선하다. (6) 비천해지다. (7) 최종적인 소속이나 결과가 정해지다."
  落とす:
    ? "①物などを上から下へ支えずに移す。落下させる。 ②程度を下げる。低くする。 ③付いているものを取り去る。 ④なくす。失う。 ⑤悪い状況にする。 ⑥落第させる。 ⑦選から外す。 ⑧最終の状態に行き着かせる。手に入れる。"
    : "(1) 물건 등을 위에서 아래로 떨어뜨리다. (2) 정도를 낮추다. (3) 붙어 있는 것을 떼어 내다. (4) 없애다. 잃다. (5) 나쁜 상황으로 만들다. (6) 낙제시키다. (7) 선발에서 제외하다. (8) 최종 상태에 이르게 하다. 손에 넣다."
  落城:
    "①城を敵に攻め落とされること。 ②口説かれて承知すること。": "(1) 성이 적에게 공격받아 함락되는 것. (2) 설득을 받아 승낙하는 것."
  落成:
    大規模な建築物ができあがること。土木工事が終わること。竣工(シュンコウ): 대규모 건축물이 완성되는 것. 토목 공사가 끝나는 것.
  落第:
    ? "①試験や検査に受からないこと。及第 ②成績が悪くて、上の学年や学校に進めないこと。留年 春 ③一定の基準に達しないこと。"
    : "(1) 시험이나 검사에 합격하지 못하는 것. (2) 성적이 나빠 위 학년이나 학교로 올라가지 못하는 것."
  落花:
    花が散ること。また、散り落ちた花。: 꽃이 지는 것. 또는 져서 떨어진 꽃.
  落手:
    "①手紙や品物などを受け取ること。落掌 ②碁や将棋で、やりそこなった手。悪手(アクシュ)": "① 편지나 물품 등을 받는 것. ② 바둑이나 장기에서 잘못 둔 수. 악수."
  落莫:
    もの寂しいさま。寂寞(セキバク): 쓸쓸한 모양. 적막함.
  落魄:
    おちぶれること。零落: 몰락하는 것. 영락.
葉:
  紅葉:
    ? "①秋の終わりに草木の葉が黄色や赤色になること。また、その葉。秋 ②カエデの別称。また、その葉。 楓(かえで)"
    : 가을 끝 무렵 풀과 나무의 잎이 노랗거나 붉게 되는 것. 또는 그 잎.
  肺葉:
    ? 哺乳類の肺を形成する部分の称。人間の肺は右は上中下の三つに、左は上下の二つに分かれている。このそれぞれを肺葉といい、上肺葉、中肺葉、下肺葉と呼ぶ。
    : "포유류의 폐를 이루는 부분. 사람의 폐는 오른쪽이 상ㆍ중ㆍ하 세 부분, 왼쪽이 상ㆍ하 두 부분으로 나뉘며 각각을 폐엽이라 한다."
  葉:
    ? 植物の枝や茎につく器官。形は一様でないが、ふつう扁平(ヘンペイ)で緑色をしている。呼吸作用や炭酸同化作用などを行う。はっぱ。
    : "[생물] 식물의 가지나 줄기에 붙는 기관. 형태는 일정하지 않지만 보통 납작하고 초록색이며, 호흡 작용과 탄산 동화 작용 등을 한다."
  葉脈:
    葉の中を走っている維管束。水分や養分の通路となる。: 잎 속을 지나가는 관다발. 수분과 양분의 통로가 된다.
  黄葉:
    "①「黄葉(コウヨウ)」に同じ。秋 ②カエデの別称。また、その葉。 楓(かえで)": 단풍. 특히 노랗게 물든 잎.
  一葉:
    ユリ科の多年草。: "[생물] 백합과의 여러해살이풀."
  七葉樹:
    トチノキ科の落葉高木。: "[생물] 칠엽수과의 낙엽 교목."
  全手葉椎:
    ブナ科の常緑高木。 馬刀葉椎(まてばしい): "[생물] 참나무과의 상록 교목."
  前葉:
    ? "① 本の、前の紙面。前ページ。② 大脳の底部にある脳下垂体の前の部分。〔人体の機能（1952）〕"
    : "① 책의 앞쪽 지면. 앞 페이지. ② [생물] 뇌하수체의 앞부분."
  大葉藻:
    ? ヒルムシロ科の多年草。浅い海底に群生。葉はひも状で長さ一(メートル)にもなる。昔、製塩に用いたことから「藻塩草(もしおぐさ)」ともいう。ウミヤナギ。アジモ。
    : "[생물] 거머리말과의 여러해살이풀. 얕은 바다 밑에 무리 지어 자란다."
  山梗葉:
    キキョウ科の多年草。: "[생물] 초롱꽃과의 여러해살이풀."
  末葉:
    "①時代の終わりのころ。末期(マッキ) ②祖先から遠い子孫。末裔(マツエイ)・末孫": "① 시대가 끝날 무렵. 말기. ② 조상으로부터 먼 후손. 말예."
  紅葉狩り:
    山野に出かけて紅葉を観賞すること。もみじみ。観楓(カンプウ) 秋: 산야에 나가 단풍을 감상하는 것. 단풍놀이.
  酸模・酸葉:
    ? タデ科の多年草。道端に自生。全体に赤紫色を帯びる。初夏、淡緑色の小花を多数つける。若い茎や葉は食用になる。スカンポ。
    : "[생물] 마디풀과의 여러해살이풀. 길가에 자생하며 전체가 붉은 자주색을 띤다. 초여름에 연한 황록색 작은 꽃이 많이 피고, 어린 줄기와 잎은 식용한다."
薬:
  薬:
    ? "①病気や傷の治療・予防のために、飲んだり塗ったり注射したりするもの。 ②化学的な効果のある薬品。火薬・農薬・焼き物の釉(うわぐすり)など。 ③体を害する薬物。 ④心や体に役立つ物事。"
    : "(1) 병이나 상처의 치료ㆍ예방을 위해 먹거나 바르거나 주사하는 것. (2) 화학적 효과가 있는 약품. 화약ㆍ농약ㆍ도자기 유약 등. (3) 몸을 해치는 약물. (4) 마음이나 몸에 도움이 되는 일."
    ? キンポウゲ科の多年草。アジア北東部原産。初夏、茎頂にボタンに似た大形で美しい紅・白色の花を開く。観賞用。根は薬用。 夏
    : "[생물] 미나리아재비과의 여러해살이풀. 초여름에 모란을 닮은 큰 홍색 또는 흰색 꽃을 피우며 뿌리는 약용한다. 작약."
  薬草:
    薬になる植物。薬用植物。: "[생물] 약이 되는 식물. 약용 식물."
  薬餌:
    "①薬と食べ物。また、薬になるような滋養物。 ②薬。": "(1) 약과 음식. 또는 약이 될 만한 영양물. (2) 약."
  典薬頭:
    ? 律令(リツリョウ)制で、宮中の医療や医薬・薬園などをつかさどった典薬寮(テンヤクリョウ)の長官。
    : 율령제에서 궁중의 의료, 의약, 약원 등을 맡던 전약료의 장관.
  当薬:
    リンドウ科の二年草。: "[생물] 용담과의 두해살이풀."
  火薬:
    熱・衝撃・摩擦などのわずかな刺激によって爆発する薬物。: 열, 충격, 마찰 등의 작은 자극으로 폭발하는 약물. 화약.
  薬剤:
    調合された薬。薬品: 조제된 약. 약품.
  薬害:
    ? 薬剤により、人畜や植物などに有害な作用があること。薬の副作用などによって健康をそこなったり、ほかの病気に感染したりすることなど。
    : 약제로 인해 사람, 가축, 식물 등에 해로운 작용이 생기는 것. 약의 부작용 등으로 건강을 해치는 일.
  薬殺:
    毒薬で殺すこと。毒殺: 독약으로 죽이는 것. 독살.
  薬食い:
    冬、滋養をつけるためにシカやイノシシ・クジラなどの肉を食べること。冬: 겨울에 몸을 보하기 위해 사슴, 멧돼지, 고래 등의 고기를 먹는 것.
  野山薬:
    ヤマノイモ科のつる性多年草。: "[생물] 마과의 덩굴성 여러해살이풀."
  鹿薬:
    ? ユリ科の多年草。山地の樹陰に自生。葉はササに似る。初夏、白い小花を円錐(エンスイ)状につける。若芽は食用。
    : "[생물] 백합과의 여러해살이풀. 산지의 나무 그늘에 자라며 어린싹은 식용한다."
血:
  生血:
    まだ乾かないねばりけのある血。血糊(ちのり)。: 아직 마르지 않은 끈적한 피.
  血:
    "①体内を流れる血液。 ②同じ祖先への血筋。血統。 ③血気。情熱。": "(1) 몸속을 흐르는 혈액. (2) 같은 조상으로 이어지는 혈통. (3) 혈기. 열정."
  血圧:
    血管の壁に血液の流れがおよぼす圧力。: 혈관 벽에 혈액의 흐름이 미치는 압력.
  血族:
    ? 同じ先祖から出て、血筋の続いている人々。法律上はこれと同じように認められた養親子なども含む。血縁の一族。
    : 같은 조상에서 나와 혈통이 이어진 사람들. 법률상으로는 이와 같이 인정된 양친자 등도 포함한다. 혈연 일족.
  血気:
    "①激しい意気。盛んな勢い。ちのけ。 ②血液と気力。生命維持力。": "(1) 격한 기세. 왕성한 기운. (2) 혈액과 기력. 생명 유지력."
  血縁:
    "①親子・兄弟などの血のつながり。血脈・血筋 ②血のつながった人々。血族地縁": "(1) 부모와 자식, 형제 등 피의 이어짐. (2) 피가 이어진 사람들."
  地血:
    アカネ科のつる性多年草。: "[생물] 꼭두서니과의 덩굴성 여러해살이풀."
  血塗ろ:
    "①一面血に染まるさま。血まみれ。 ②苦闘するさま。": "① 온통 피로 물든 모양. 피투성이. ② 고투하는 모양."
  血戦:
    血まみれになるほど、激しく戦うこと。また、その戦い。激戦・死闘: 피투성이가 될 만큼 격렬히 싸우는 것. 또는 그런 싸움.
  血液:
    ? 動物の血管内を循環する体液。脊椎動物ではヘモグロビンという色素を含み赤く見え、軟体動物、節足動物などの無脊椎動物では淡青色を呈する。組織に酸素、栄養物質、ホルモンなどを供給し、炭酸ガス、老廃物などの排出物を運び去る。また、免疫抗体を含み、体内にはいった病原菌を殺すなど病害から動物を保護する。脊椎動物では液状の血漿(けっしょう)と固形の血球からなる。
    : "[생물] 동물의 혈관 안을 순환하는 체액. 조직에 산소와 영양분 등을 공급하고 노폐물을 운반한다."
  血税:
    ? "①血の出るような苦労をして納めた税金。重い税金。 ②兵役義務。身を国にささげて税とする意から。"
    : "① 피나는 고생을 하여 낸 세금. 무거운 세금. ② 병역 의무."
  血肉:
    "①血と肉。 ②血筋のつながっている者。親子・兄弟。骨肉": "① 피와 살. ② 혈연으로 이어진 사람. 부모 자식이나 형제."
  血脈:
    師から弟子へ受けつがれる仏法の伝統。法統: "[불교] 스승에게서 제자에게 이어지는 불법의 전통. 법통."
  血合:
    ブリ・カツオなどに見られる魚肉の血を含んだ黒ずんだ部分。: "[생물] 방어·가다랑어 등에서 보이는, 피를 포함한 검붉은 살 부분."
  血忌日:
    暦法の一つ。出血や狩猟などを忌む日。: 역법의 하나. 출혈이나 사냥 등을 꺼리는 날.
  血煙:
    人を切ったときなどの、血が飛び散るようすをけむりにたとえた語。ちけぶり。: 사람을 베었을 때 피가 흩뿌려지는 모습을 연기에 비유한 말.
  血潮・血汐:
    "①流れ出る血。 ②熱情。": "① 흘러나오는 피. ② 뜨거운 열정."
  血筋:
    "①親子・兄弟などの血のつながり。": "① 부모와 자식, 형제 등으로 이어지는 혈연."
表:
  備後表:
    広島県の尾道・福山付近で産出する上質の畳表(たたみおもて)。: "[지명] 히로시마현 오노미치ㆍ후쿠야마 부근에서 나는 상질의 다다미 겉대."
  表:
    ? "①物の表面・外側・上面・前面。 ②家屋などの正面・前面。奥 ③戸外や屋外。内・中 ④人のうわべ。見かけ。 ⑤正式。おおやけ。 ⑥野球で、イニングの前半。 ①②⑤⑥裏"
    : "(1) 물건의 표면ㆍ바깥쪽ㆍ윗면ㆍ앞면. (2) 집 등의 정면ㆍ앞면. (3) 집 밖이나 야외. (4) 사람의 겉모습. 외견. (5) 공식. 공적임. (6) 야구에서 이닝의 전반."
  表す:
    ? "①感情・意志・思想などを言葉や色・形・音、または表情・行動などで示す。 ②内容を示す。象徴する。"
    : "(1) 감정ㆍ의지ㆍ사상 등을 말이나 색ㆍ형태ㆍ소리, 또는 표정ㆍ행동 등으로 보이다. (2) 내용을 보이다. 상징하다."
  表方:
    劇場などで、観客に関する業務を行う人。支配人・案内係・切符係など。裏方: 극장 등에서 관객 관련 업무를 맡는 사람. 지배인ㆍ안내원ㆍ매표원 등.
  表白:
    言葉や文章で表し述べること。: 말이나 글로 나타내어 말하는 것.
  儀表:
    手本。模範。: 본보기. 모범.
  図表:
    数量的な関係を線や数字などで見やすく表したもの。グラフ。: 수량적 관계를 선이나 숫자 등으로 보기 쉽게 나타낸 것. 그래프.
  表札:
    戸口や門などに掲げて、居住者の氏名を表示するふだ。門標: 현관이나 문 등에 걸어 거주자의 성명을 표시하는 패. 문패.
  表沙汰:
    ? "①事柄が世間に公然と知れわたること。 ②公開された争い。訴訟や裁判沙汰。公沙汰(おおやけザタ)内沙汰"
    : "① 일이 세상에 공개적으로 알려지는 것. ② 공개된 다툼. 소송이나 재판 문제."
  表現:
    ? 精神的なものを、表情・身振り・言語・文字・色・音・形などで表すこと。また、表されたもの。表出
    : 정신적인 것을 표정, 몸짓, 언어, 문자, 색, 소리, 형태 등으로 나타내는 것. 또는 나타난 것.
  表着:
    最も外側に着る衣服。下着: 가장 바깥쪽에 입는 옷. 겉옷.
  表紙:
    ? "① 巻物を巻いた時、表になる部分に貼る布帛や紙。また、掛絵の表装。表具。② 書籍や帳簿の中身の保護、内容表示、装飾のため外側につける覆い。紙製のほか革・布・合成樹脂製等があり、上製本用表紙、くるみ表紙等の種類がある。③ 書画軸の表装に使用される紙。"
    : "① 책이나 장부의 내용을 보호하고 표시·장식하기 위해 바깥쪽에 붙이는 덮개. 표지. ② 족자나 서화의 겉장식에 쓰는 종이."
  表芸:
    "①たしなみとして習得すべき技芸。 ②専門とする技芸。本業の技芸。裏芸": "① 교양으로 익혀야 할 기예. ② 전문으로 삼는 기예. 본업의 기예."
詩:
  漢詩:
    ? 中国の詩。また、それをまねて作った詩。多く五言または七言で、平仄(ヒョウソク)・押韻(オウイン)などの規則がある。絶句・律詩・古詩など。唐歌(からうた)大和歌(やまとうた)
    : 중국의 시. 또는 그것을 본떠 지은 시. 대개 오언 또는 칠언으로, 평측ㆍ압운 등의 규칙이 있다. 절구ㆍ율시ㆍ고시 등.
  詩歌:
    "①漢詩と和歌。 ②詩や短歌・俳句などの総称。": "(1) 한시와 와카. (2) 시ㆍ단가ㆍ하이쿠 등의 총칭."
  詩仙:
    "①天才的な大詩人。 ②漢詩で、特に李白(リハク)を指す。": "① 천재적인 대시인. ② 한시에서 특히 이백을 가리키는 말."
  詩伯:
    すぐれた詩人。特に漢詩の大家。 詩宗(シソウ)・詩豪: 뛰어난 시인. 특히 한시의 대가.
  詩吟:
    漢詩の訓(よ)み下し文に節をつけてうたうこと。また、そのうた。: 한시의 훈독문에 가락을 붙여 읊는 것. 또는 그 노래.
  詩囊:
    詩人の作詩のもとになる思想や感情。詩想。: 시인이 시를 짓는 바탕이 되는 사상이나 감정. 시상.
  詩情:
    "①詩のもっているような情緒。詩的な味わい。 詩趣 ②詩を作りたい気分。 詩興": "① 시와 같은 정취. 시적인 맛. ② 시를 짓고 싶은 기분."
  詩歌管弦:
    ? 詩歌を吟じ、楽器を奏でること。また、風雅な文学と音楽。「管弦」は管楽器と弦楽器。広く音楽のこと。
    : 시가를 읊고 악기를 연주하는 것. 또는 풍아한 문학과 음악.
  詩箋:
    詩を書きしるす紙。: 시를 적는 종이.
  詩聖:
    "①非常にすぐれた大詩人。 ②漢詩で、特に杜甫(トホ)を指す。": "① 매우 뛰어난 대시인. ② 한시에서 특히 두보를 가리키는 말."
  詩興:
    ? "①詩を作りたいと思う気持ち。また、詩を読んで呼び覚まされる興味。 詩情 ②詩のおもしろみ。 詩趣"
    : "① 시를 짓고 싶어지는 마음. 또는 시를 읽고 일어나는 흥취. ② 시의 재미."
  詩趣:
    "①詩に表された味わい。詩のおもしろみ。 詩興 ②詩のような味わい。詩情。": "① 시에 드러난 맛. 시의 정취. ② 시와 같은 맛."
調:
  調:
    ? "①律令(リツリョウ)制の租税の一つ。穀物以外の現物納。 ②属国が支配国の君主に、服従のしるしとして献上する財物。みつぎ物。"
    : "(1) 율령제 조세의 하나. 곡물 이외의 현물납. (2) 속국이 지배국 군주에게 복종의 표시로 바치는 재물. 공물."
  調う:
    ? "［動ワ五（ハ四）］１ 必要なものがすべてそろう。２ きちんとまとまった状態や形になる。調和がとれる。３ 交渉や相談がまとまる。［動ハ下二］「ととのえる」の文語形。[補説]多く、2は「整う」、1・3は「調う」と書く。"
    : "(1) 질서 있는 상태가 되다. 조화가 잡히다. 균형이 잡히다. 악기 등의 음조가 맞다. (2) 부족함 없이 갖추어지다. 완비되다. 준비되다. (3) 상태가 좋아지다. 바라던 대로 완성되다. 성립하다."
    ? "[ 1 ] ① 秩序のある状態になる。調和がとれる。均整がとれる。きちんとする。また、楽器などの調子が合う。② 不足なくそろう。完備する。備わる。そろう。また、用意ができる。③ ぐあいのよい状態になる。望むようにしあがる。うまくいく。できあがる。成立する。"
    : "① 질서 있는 상태가 되다. 조화가 잡히다. 균형이 맞다. 반듯해지다. 또 악기 등의 음이 맞다. ② 부족함 없이 갖추어지다. 완비되다. 준비가 되다. ③ 상태가 좋아지다. 바라던 대로 이루어지다. 잘되다. 성립하다."
  調える:
    ? "①整理された状態にする。適度な状態にする。 ②調子をよくする。 ③不足のないように、そろえる。備える。 ④まとめる。"
    : "(1) 정리된 상태로 만들다. 알맞은 상태로 만들다. (2) 상태나 음조를 좋게 하다. (3) 부족함이 없도록 갖추다. 준비하다. (4) 정리해 마무리하다."
  調べる:
    ? "①調査・研究・点検などをする。 ②尋問する。問いただす。 ③音律を合わせととのえる。 ④演奏する。かなでる。"
    : "(1) 조사ㆍ연구ㆍ점검 등을 하다. (2) 심문하다. 캐묻다. (3) 음률을 맞추어 고르다. (4) 연주하다."
  調印:
    条約・交渉などで、双方の代表が文書の内容を確認して署名・捺印(ナツイン)すること。: 조약이나 교섭 등에서 양측 대표가 문서 내용을 확인하고 서명ㆍ날인하는 것.
  調和:
    具合よくととのっていること。つりあうこと。バランス。: 알맞게 잘 갖추어져 있는 것. 균형을 이루는 것. 밸런스.
  調子:
    ? "①音律の高低。音調。 ②声の強弱・緩急などの具合。口調。 ③文章表現や言い回しの具合。 ④動き具合。はたらき具合。 ⑤勢い。はずみ。 ⑥相手に応じた態度。"
    : "(1) 음률의 높낮이. 음조. (2) 목소리의 강약ㆍ완급 등의 상태. 말투. (3) 문장 표현이나 말투의 상태. (4) 움직임이나 작동 상태. (5) 기세. 탄력. (6) 상대에 맞춘 태도."
  調布:
    昔、みつぎ物として朝廷に納めた手織りの布。: 옛날 공물로 조정에 바친 손으로 짠 베.
  曲調:
    音楽のふしまわし。調子。曲節。〔文明本節用集（室町中）〕: 음악의 가락. 곡조.
  調剤:
    二種類以上の薬剤を調合して薬を作ること。調薬: 두 종류 이상의 약제를 조합하여 약을 만드는 것. 조제.
  調合:
    二種類以上の薬品を、定まった分量で混ぜ合わせること。調薬・調剤: 두 종류 이상의 약품을 정해진 분량으로 섞는 것. 조합.
  調教:
    ウマ・イヌ・猛獣などを慣らしたり、芸を仕こむなどの訓練をすること。: 말, 개, 맹수 등을 길들이거나 재주를 가르치는 훈련을 하는 것.
  調査:
    物事の実態や事実を明確にするために調べること。: 사물의 실태나 사실을 분명히 하기 위해 조사하는 것.
  調貢:
    諸侯や外国の使者が、朝廷にみつぎ物を献上すること。また、そのみつぎ物。: 제후나 외국 사신이 조정에 공물을 바치는 것. 또는 그 공물.
談:
  怪談:
    幽霊やばけものを扱った、恐ろしくて不思議な話。: 유령이나 요괴를 다룬 무섭고 불가사의한 이야기.
  談る:
    "①静かに話す。 ②さかんに話す。ものがたる。議論をする。": "(1) 조용히 말하다. (2) 활발히 말하다. 이야기하다. 논의하다."
  談合:
    ? "①話し合うこと。相談 ②競争入札の前に複数の業者が話し合い、価格などを決めておくこと。談合行為。"
    : "(1) 서로 의논하는 것. (2) 경쟁 입찰 전에 여러 업자가 서로 이야기해 가격 등을 정해 두는 것. 담합 행위."
  会談:
    公的に会って話し合うこと。: 공식적으로 만나 의논하는 것. 회담.
  縁談:
    縁組みの相談。特に、結婚の縁組みをすすめるための相談。: 혼인 인연을 맺기 위한 상담. 특히 결혼을 추진하는 이야기.
  談判:
    物事の決着をつけたり取り決めをしたりするため、相手方と話し合うこと。かけあい。交渉: 일을 결말짓거나 약정을 하기 위해 상대와 의논하는 것. 교섭.
  談笑:
    笑いなどを交えて楽しく会話すること。歓談: 웃음을 섞어 즐겁게 이야기하는 것. 환담.
  談言微中:
    ? 物事をはっきりと言わず、それとなく遠回しに人の急所や弱みを突く話しぶりのこと。〈『史記』〉
    : 사물을 분명히 말하지 않고 은근히 에둘러 남의 급소나 약점을 찌르는 말투.
  談話:
    "①話を交わすこと。会話 ②形式ばらずに見解などを述べること。": "① 이야기를 주고받는 것. 회화. ② 격식을 차리지 않고 견해 등을 말하는 것. 담화."
  談論風発:
    ? 談話や議論がきわめて活発に行われること。「風発」は風が吹きまくるような盛んな勢いの意。議論百出・談論風生・百家争鳴(ヒャッカソウメイ)
    : 담화나 의논이 매우 활발하게 이루어지는 것.
豆:
  大角豆:
    ? マメ科の一年草。中央アフリカ原産。夏、淡紫色の蝶(チョウ)形の花が咲き、長いさやをつける。種子と若いさやは食用。秋
    : "[생물] 콩과의 한해살이풀. 중앙아프리카 원산. 여름에 연한 자주색 나비 모양 꽃이 피고 긴 꼬투리를 맺는다. 씨와 어린 꼬투리는 식용한다."
  小豆:
    ? マメ科の一年草。古く中国から渡来し、各地で栽培。夏、黄色い花をつけ、細長いさやの中に暗赤色の小さな種子を結ぶ。種子はあん・甘納豆・赤飯などに用いる。 秋
    : "[생물] 콩과의 한해살이풀. 오래전 중국에서 전래되어 각지에서 재배된다. 여름에 노란 꽃이 피고 가늘고 긴 꼬투리 안에 암적색 작은 씨가 맺힌다. 씨는 팥소ㆍ아마낫토ㆍ팥밥 등에 쓴다."
  小豆粥:
    ? 小豆を入れたかゆ。粥柱(かゆばしら)（餅(もち)）を入れることが多い。一年の邪気を除くといわれ、一月一五日の朝に食べる。 新年
    : 팥을 넣은 죽. 떡을 넣는 경우가 많으며, 한 해의 사기를 없앤다고 하여 1월 15일 아침에 먹는다.
  小豆餡:
    小豆を煮てすりつぶし、砂糖や塩などで味をつけたもの。こしあん・つぶしあんなど。: 팥을 삶아 으깨고 설탕이나 소금 등으로 맛을 낸 것. 고운 팥소ㆍ알갱이 팥소 등.
  豆:
    ? "①マメ科の植物で食用にするものの総称。また、その種子。五穀の一つ。ダイズ・アズキ・エンドウなど。 ②特に、ダイズのこと。"
    : "[생물] 콩과 식물 중 식용하는 것의 총칭. 또는 그 씨. 오곡의 하나. 대두ㆍ팥ㆍ완두 등. 특히 대두를 이르기도 한다."
  豆州:
    伊豆国の異称。: "[지명] 이즈국의 다른 이름."
  豆腐:
    ? 大豆を加工した食品。水に浸した大豆をすりつぶして煮た汁をしぼり、かすを取り去ったものににがりを加え、固めたもの。
    : 대두를 가공한 식품. 물에 불린 대두를 갈아 끓인 즙을 짜고 찌꺼기를 제거한 뒤 간수를 넣어 굳힌 것.
  大豆粕:
    ダイズから油をしぼりとった残りのかす。肥料や飼料に用いる。: 콩에서 기름을 짜낸 뒤 남은 찌꺼기. 비료나 사료로 쓴다.
  水豆児:
    ? タヌキモ科の多年生食虫植物。池沼や水田に浮かぶ。葉は糸状に分かれ、多数の捕虫袋をもち、全体にタヌキの尾のような形をなす。夏、黄色い唇形花をつける。
    : "[생물] 통발과의 여러해살이 식충식물. 못이나 논에 떠서 자라며 벌레잡이 주머니를 가진다."
  烏豆:
    ダイズの一種。豆の皮が黒いもの。正月料理などに用いる。秋: "[생물] 콩의 한 종류. 껍질이 검은 콩. 검은콩."
  菜豆:
    マメ科のつる性一年草。 隠元豆(インゲンまめ): "[생물] 콩과의 덩굴성 한해살이풀. 강낭콩."
  蚕豆:
    ? マメ科の二年草。世界各地で栽培。春、白色または紫色の蝶(チョウ)形花が咲き、長楕円(ダエン)形で大きなさやをつける。種子は食用。 夏
    : "[생물] 콩과의 두해살이풀. 봄에 흰색 또는 자주색 꽃이 피며 씨는 식용한다. 잠두."
  鵲豆:
    ? マメ科のつる性一年草。熱帯原産で広く栽培される。夏から秋、フジに似た紫色や白色の花をつける。若いさやと熟した種子は食用。 秋
    : "[생물] 콩과의 덩굴성 한해살이풀. 어린 꼬투리와 익은 씨를 식용한다."
負:
  背負子:
    荷物を背負うため、背に当てる木製の長方形の枠。せおいばしご。: 짐을 등에 지기 위해 등에 대는 나무 직사각형 틀.
  負う:
    ? "①人や物を背中に乗せる。背負う。 ②自身で引き受ける。また、身に受ける。 ③恩恵や利益などを受ける。 ④評判に値する。"
    : "(1) 사람이나 물건을 등에 올리다. 등에 지다. (2) 스스로 맡다. 또는 몸에 받다. (3) 은혜나 이익 등을 받다. (4) 평판에 걸맞다."
  負かす:
    相手を負けさせる。相手をやぶる。: 상대를 지게 하다. 상대를 이기다.
  負ける:
    ? "①力や技能が相手に及ばずにやぶれる。また、相手より劣る。 ②欲求や欲望に抵抗できずに、楽なほうに流される。 ③肌がかぶれる。 ④大目にみる。また、店側が値段を安くしたり、おまけをしたりする。"
    : "(1) 힘이나 기능이 상대에게 미치지 못해 지다. 또는 상대보다 뒤떨어지다. (2) 욕구나 욕망에 저항하지 못하고 쉬운 쪽으로 흐르다. (3) 피부가 짓무르다. (4) 너그럽게 봐주다. 또는 가게 쪽이 값을 깎거나 덤을 주다."
  靫負:
    ? "①古代、矢を入れる靫(ゆぎ)を背負い宮廷を守った武力集団。 ②衛門府(エモンフ)とその武官の別称。"
    : "(1) 고대에 화살통을 등에 지고 궁정을 지키던 무력 집단. (2) 에몬후와 그 무관의 별칭."
  勝負:
    "①「勝敗」に同じ。 ②勝ち負けを決めること。": "① 승패와 같음. ② 이기고 짐을 결정하는 것. 승부."
  自負:
    自分で自分の才能や功績などに自信をもち、誇ること。 自慢・自賛: 스스로 자신의 재능이나 공적 등에 자신을 가지고 자랑스럽게 여기는 것. 자부.
  負んぶ:
    "①背負うこと。 ②人に頼ること。特に、費用を人に払ってもらうこと。": "① 업는 것. ② 남에게 의지하는 것. 특히 비용을 남에게 부담하게 하는 것."
  負債:
    他から金銭を借りること。また、借りた金銭。債務。: 남에게서 돈을 빌리는 것. 또는 빌린 돈. 채무.
  負傷:
    けがをすること。傷を負うこと。: 다치는 것. 상처를 입는 것.
  負数:
    零より小さい数。マイナスの数。⇔正数。〔数学ニ用ヰル辞ノ英和対訳字書（1889）〕: "0보다 작은 수. 음수."
  負笈:
    ? 本を入れたかごを背負うこと。転じて、遠い土地へ遊学すること。笈(おい)を負う。〈『抱朴子(ホウボクシ)』〉
    : 책을 넣은 상자를 지는 것. 나아가 먼 곳으로 유학 가는 것.
  負荊:
    自分の罪を深くわびること。: 자신의 죄를 깊이 사죄하는 것.
  負荷:
    "①荷物をかつぐこと。転じて、責任を負うこと。 ②機械を動かして実際に仕事をする量。": "① 짐을 지는 것. 나아가 책임을 지는 것. ② 기계를 움직여 실제로 하는 일의 양. 부하."
起:
  起きる:
    "①立ち上がる。 ②目を覚ます。 ③「起こる」に同じ。": "① 일어나다. ② 잠에서 깨다. ③ 발생하다."
  起こす:
    "①立たせる。 ②目を覚まさせる。 ③掘り返す。 ④はじめる。生じさせる。": "① 일으켜 세우다. ② 잠을 깨우다. ③ 파헤치다. ④ 시작하다. 생기게 하다."
  起こる:
    はじまる。発する。生じる。: 시작되다. 발생하다. 생기다.
  起つ:
    "①立ち上がる。身を起こす。 ②行動を起こす。 ③出発する。飛び立つ。": "① 일어서다. 몸을 일으키다. ② 행동을 시작하다. ③ 출발하다. 날아오르다."
  起工:
    工事などを始めること。着工竣工(シュンコウ)・完工: 공사 등을 시작함.
  起因:
    ある事柄を起こす直接の原因となること。また、その原因。起こり。: 어떤 일을 일으키는 직접 원인이 되는 것. 또는 그 원인.
  起居:
    "①立つことと座ること。立居振る舞い。挙止・挙措 ②日々の生活。起臥(キガ)": "① 서고 앉는 일. 몸가짐. ② 일상생활."
  起床:
    寝床から起き出すこと。床を離れること。起きること。: 잠자리에서 일어나는 것. 기상.
  起案:
    もとになる案や文を作ること。原案を作ること。発案・起草: 바탕이 되는 안이나 글을 만드는 것. 원안을 작성하는 것.
  起稿:
    原稿を書き始めること。起草脱稿: 원고를 쓰기 시작하는 것.
  起臥:
    起きることと寝ること。日々の生活。起き伏し。起居: 일어나고 눕는 것. 일상생활.
  起龕:
    禅宗の葬儀で、棺(ひつぎ)を送り出すこと。また、その儀式。: "[불교] 선종 장례에서 관을 내보내는 것. 또는 그 의식."
路:
  路:
    ? "［音］ロ（漢）　［訓］じ　みち［学習漢字］3年〈ロ〉１ 通り道。道筋。「路地・路上・路線・路傍・路面／隘路あいろ・悪路・往路・回路・街路・岐路・空路・経路・行路・航路・進路・水路・線路・通路・道路・遍路・迷路・陸路」２ 旅行。「路銀・路程・路用」３ 筋道。「活路・語路・世路・販路・末路・理路」４ 重要な地位。「当路・要路」〈じ〉「東路あずまじ・家路・小路こうじ・旅路・夢路」［名のり］のり・ゆく"
    : "① 길이라는 뜻을 나타내는 말. ② 지명에 붙어 그 지방으로 가거나 그 지방을 지나는 길을 나타내며, 나아가 그 지방 자체를 이르기도 함. ③ 날짜 수에 붙어 그만큼 걸리는 노정임을 나타냄."
    "①人や車などが通行する所。 ②ふみ行うべき道。 ③方法や手段。やり方。": "① 사람이나 차 등이 다니는 곳. ② 마땅히 따라야 할 도리. ③ 방법이나 수단."
  路傍:
    "「路頭」に同じ。": 길가. 노변.
  路肩:
    道路の両側の有効幅の外側部分。特に、端のがけのようになった部分。: 도로 양쪽 유효 폭의 바깥 부분. 특히 가장자리의 비탈진 부분.
  黄泉路:
    黄泉の国へ行く道。あの世への道。また、黄泉の国。冥土(メイド)。: 황천으로 가는 길. 저승길. 또는 황천.
  五十路:
    "①「五十(いそ)」に同じ。 ②五〇年。五〇歳。": "① 쉰. ② 50년. 50세."
  八十路:
    "①八〇。 ②八〇歳。": "① 여든. ② 80세."
  岐路:
    "①本通りから分かれた細い道。 ②物事の本筋を外れること。また、外れたところ。": "① 큰길에서 갈라진 좁은 길. ② 사물의 본줄기에서 벗어나는 것. 또는 벗어난 곳."
  当路:
    重要な地位にいること。また、その人。: 중요한 지위에 있는 것. 또는 그런 사람.
  海路:
    海上の船の通る道。航路。うみじ。陸路(くがじ): 바다 위에서 배가 지나는 길. 항로.
  理路:
    物事の道理。考えや話などの筋道。→理路整然。: 사물의 도리. 생각이나 말의 논리적 흐름. 이치.
  路加伝:
    "『新約聖書』の四福音書(フクインショ)の第三番目の書。ルカ福音書。": "신약성서의 네 복음서 가운데 세 번째 책. 루카 복음서."
  長道・長路:
    長く遠い道のり。遠路。: 길고 먼 거리. 먼 길.
  天路・天道:
    ? "①天上にあるというみち。また天にのぼるみち。 ②六道の一つで、天上にあるとされる世界。天上界。"
    : "① 하늘 위에 있다고 하는 길. 또는 하늘로 올라가는 길. ② [불교] 육도 가운데 하나로, 하늘 위에 있다고 여겨지는 세계. 천상계."
  十字路:
    十文字に交差している道。四つつじ。四つかど。: 십자 모양으로 교차하는 길. 네거리.
身:
  匹如身:
    財産も家族もなく、身一つであること。また、その人。: 재산도 가족도 없이 몸 하나뿐임. 또는 그런 사람.
  身:
    "①体。 ②自分自身。 ③身分。立場。 ④誠意。 ⑤骨や皮に対して肉。": "① 몸. ② 자기 자신. ③ 신분. 처지. ④ 성의. ⑤ 뼈나 껍질에 대한 살."
  黄身時雨:
    白あんに卵黄と砂糖を加え、糯米(もちごめ)の粉を混ぜて蒸した和菓子。: "흰 팥소에 달걀노른자와 설탕을 넣고 찹쌀가루를 섞어 찐 화과자."
  刀身:
    刀の、鞘(さや)におさまっている部分。刀のなかみ。〔五国対照兵語字書（1881）〕: 칼에서 칼집에 들어가는 부분. 칼날.
  文身:
    ? "①肌に針や刃物で傷をつけて色素を入れ、文字・模様・絵などを彫りつけること。彫り物。仕事師や遊び人などの間で行われた。 ②顔や腕に墨汁を刺し入れて、前科者の印としたもの。"
    : "① 살갗에 바늘이나 칼로 상처를 내 색소를 넣어 문자, 무늬, 그림 등을 새기는 것. 문신. ② 얼굴이나 팔에 먹물을 넣어 전과자의 표시로 삼던 것."
  正身:
    まさしくその人。本人。当人。: 바로 그 사람. 본인. 당사자.
  現身:
    この世に存在している身。生き身。現人(うつせみ): 이 세상에 존재하는 몸. 살아 있는 몸.
  自身:
    "①自分。 ②そのもの自体。": "① 자기 자신. ② 그 자체."
  身体:
    ? "①頭・胴・手足など、肉体のすべてをまとめていう語。五体。 ②胴の部分。 ③肉体の健康状態。"
    : "① 머리, 몸통, 팔다리 등 육체 전체. 몸. ② 몸통 부분. ③ 육체의 건강 상태."
  身動ぎ:
    体を少し動かすこと。みうごき。: 몸을 조금 움직이는 것. 몸짓.
  身柱:
    ? "①灸点(キュウテン)の一つ。えりくびの下で両肩の中央部分。 ②頭に血がのぼる幼児の病気。疳(カン)。"
    : "① 뜸자리의 하나. 목덜미 아래 양어깨 중앙 부분. ② 머리에 피가 몰리는 유아의 병."
  古身・古刃:
    昔つくられた刀。古刀。: 옛날에 만들어진 칼. 고도.
  身屋・身舎:
    "①寝殿造で、家屋の中央の間。 ②離れや物置に対して住居として用いる建物。おもや。": "① 신덴즈쿠리 건축에서 집의 중앙 방. ② 별채나 창고에 상대하여 주거로 쓰는 건물. 안채."
  身請け:
    ? 芸者や遊女の前借金を代わりに支払って、年季のすまないうちに、その勤めをやめさせて引き取ること。
    : 게이샤나 유녀의 선불 빚을 대신 갚아, 계약 기간이 끝나기 전에 일을 그만두게 하고 데려가는 것.
転:
  転がす:
    ? "( 「ころがる（転）」の他動詞 )① 物体に力を加えて、ある物の上や地面の上を、回転面に接するように回転させる。② 安定して立っているものを倒す。③ 値段をつり上げるため、商品を二つ以上の業者の間で転売をかさねる。④ 俗に、人力車や、自動車を運転する。⑤ 道具などを雑然と置きっぱなしにする。⑥ いい声で歌を口に出す。"
    : "① 물체에 힘을 가해 바닥이나 다른 물체 위에서 회전하며 나아가게 하다. ② 서 있는 것을 넘어뜨리다. ③ 값을 올리기 위해 상품을 여러 업자 사이에서 되팔다. ④ 인력거나 자동차를 몰다. ⑤ 도구 등을 어지럽게 내버려 두다. ⑥ 좋은 목소리로 노래를 부르다."
  転がる:
    ? "①回転しながら進む。 ②ころぶ。転倒する。 ③横になる。からだを横にする。 ④ありふれていて、どこにでもある。"
    : "① 회전하면서 나아가다. ② 넘어지다. 쓰러지다. ③ 눕다. 몸을 옆으로 하다. ④ 흔해서 어디에나 있다."
  転ける:
    ころぶ。倒れてころがる。転倒する。: 넘어지다. 쓰러져 구르다.
  転げる:
    ? "① ＝ころがる（転）①② ＝ころがる（転）②③ ＝ころがる（転）③④ ＝ころがる（転）④⑤ ＝ころがる（転）⑤⑥ ( 「ころげてくる」の形で ) 予期しなかった幸運がやってくる。ころがりこむ。⑦ ( 「ころげてくる」の形で ) 生活に困ったりして、他の家に入り世話になる。ころがりこむ。⑧ 声や音が流れる。"
    : "① 구르다. ② 넘어지다. ③ 눕다. ④ 흔하게 있다. ⑤ 뜻밖의 행운이 찾아오다. ⑥ 생활이 어려워 남의 집에 들어가 신세를 지다. ⑦ 목소리나 소리가 흘러가듯 울리다."
  転た:
    "①ますます。程度が進んでいよいよ。 ②ひどく。常とちがってはなはだしく。": "① 더욱더. 정도가 진행되어 한층 더. ② 몹시. 평소와 달리 심하게."
  転ぶ:
    ? "①重心を失って倒れる。 ②回転しながら進む。ころがる。 ③別の方向へ変化する。 ④弾圧に遭い、宗教の信者や社会運動家などが改宗・転向する。 ⑤威力に負ける。"
    : "① 중심을 잃고 쓰러지다. ② 회전하면서 나아가다. 구르다. ③ 다른 방향으로 변하다. ④ 탄압을 받아 종교 신자나 사회운동가 등이 개종하거나 전향하다. ⑤ 위력에 굴복하다."
    ? "① ころころと回転する。ころがる。まろぶ。② 倒れる。現代では、人などがつまずいて倒れる場合にいう。こける。③ 横になる。臥す。寝ころぶ。④ キリシタンがその信仰を捨てて仏教などに改宗する。江戸時代、弾圧を受けたキリスト教徒についていう。転じて、自己の主義、主張を捨てて転向する。⑤ 男女が私通する。⑥ 芸者、遊女、しろうと女などがひそかに売色する。⑦ 物事のなりゆきが別の方向に変わる。ある事態になる。また、ある方向に気持が移る。なびく。⑧ （「ころんでいる」の形で）何もしないでぶらぶらしている。"
    : "① 데굴데굴 회전하다. 구르다. ② 쓰러지다. 넘어지다. ③ 옆으로 눕다. 드러눕다. ④ 기리시탄이 신앙을 버리고 불교 등으로 개종하다. 나아가 자기 주의나 주장을 버리고 전향하다. ⑤ 남녀가 사통하다. ⑥ 기생, 유녀, 일반 여성이 몰래 몸을 팔다. ⑦ 사태의 추이가 다른 방향으로 바뀌다. 마음이 한쪽으로 기울다. ⑧ 아무 일도 하지 않고 빈둥거리다."
  不見転:
    ? "①あとさきを考えずに事を行うこと。 ②芸者などが金次第で、どんな相手にも容易に身をまかせること。また、そのような女性。"
    : "① 앞뒤를 생각하지 않고 일을 하는 것. ② 기생 등이 돈에 따라 어떤 상대에게도 쉽게 몸을 맡기는 것. 또는 그런 여성."
  反転:
    糸を繰る道具。: 실을 켜는 도구.
  変転:
    状態が移り変わること。: 상태가 이리저리 바뀌는 것.
  転た寝:
    寝るつもりもないのに、ついうとうとと寝ること。仮寝(かりね)。: 잘 생각이 없었는데 그만 꾸벅꾸벅 조는 것. 선잠.
  転倒:
    ? "①逆さになること。また、逆さにすること。 ②横倒しになること。ころんで倒れること。 ③びっくりしてうろたえること。 「顚倒」の書きかえ字。"
    : "① 거꾸로 되는 것. 또는 거꾸로 하는 것. ② 넘어져 쓰러지는 것. ③ 놀라서 허둥대는 것."
  転回:
    ? "①ぐるぐる回ること。また、回すこと。回転 ②大きく回って向きを変えること。大きく向きが変わること。"
    : "① 빙빙 도는 것. 또는 돌리는 것. ② 크게 돌아 방향을 바꾸는 것."
  転寝:
    寝具の準備や着がえをしないで、その場にごろっと横になって寝ること。: 침구를 준비하거나 옷을 갈아입지 않고 그 자리에서 눕고 자는 것.
  転居:
    住居を変えること。引っ越し。転宅・転住: 사는 곳을 옮기는 것. 이사.
軽:
  軽い:
    "①重量が少ない。 ②簡単な。手軽な。 ③軽率な。 ④軽快な。 ⑤身分が低い。 ⑥重要でない。": "① 무게가 적다. ② 간단하다. 손쉽다. ③ 경솔하다. ④ 경쾌하다. ⑤ 신분이 낮다. ⑥ 중요하지 않다."
  軽やか:
    軽そうなさま。軽快な。: 가벼워 보이는 모양. 경쾌함.
  軽衫:
    筒を太くゆったりとし、裾(すそ)を狭くした袴(はかま)の一種。カルサンばかま。: "통을 넓고 여유 있게 만들고 밑단을 좁힌 하카마의 한 종류."
  軽軽:
    "「軽軽(ケイケイ)」に同じ。": 아주 가벼운 모양. 가볍고 경솔한 모양.
  軽快:
    "①軽やかですばやいこと。 ②心がはずむさま。 ③病気がよくなること。": "① 가볍고 재빠른 것. ② 마음이 들뜨는 모양. ③ 병이 좋아지는 것."
  軽挙妄動:
    ? 事の是非をわきまえずかるがるしく行動すること。「軽挙」は軽率な行い、「妄動」は考えなしに動く意。
    : 일의 옳고 그름을 가리지 않고 경솔하게 행동하는 것.
  軽易:
    "①簡単でたやすいこと。手軽なこと。簡易 ②相手を軽んじてあなどること。軽侮": "① 간단하고 쉬운 것. 손쉬운 것. ② 상대를 가볍게 보고 업신여기는 것."
  軽減:
    負担や刑罰などを減らして軽くすること。: 부담이나 형벌 등을 줄여 가볍게 하는 것.
  軽率:
    よく考えずに物事を行うさま。: 깊이 생각하지 않고 일을 하는 모양. 경솔함.
  軽石:
    ? 軽く水に浮く石。溶岩が急に冷えてかたまるとき、ガスが抜けて穴が多くできた石。かかとなどをこするのに使う。
    : 가벼워 물에 뜨는 돌. 용암이 급히 식어 굳을 때 가스가 빠져 구멍이 많이 생긴 돌. 부석.
  軽裘肥馬:
    ? 富貴な人の外出の装いの形容。また、たいそう富貴なさま。「軽裘」は軽くて高級な皮ごろも。「肥馬」は肥えたウマの意。〈『論語』〉
    : 부귀한 사람의 외출 차림을 형용하는 말. 또는 매우 부귀한 모양.
  軽視:
    軽く見ること。軽んじること。みくびること。重視: 가볍게 보는 것. 얕보는 것. 경시.
農:
  農民:
    農業に従事する民。農業を生業とする人。百姓。: 농업에 종사하는 사람. 농업을 생업으로 하는 사람.
  農耕:
    田畑をたがやして農業を行うこと。また、農作物を育てること。: 논밭을 갈아 농업을 함. 또는 농작물을 기름.
  営農:
    農業をいとなむこと。: 농업을 경영하는 것.
  農事:
    農業の仕事や農業に関する事柄。: 농업의 일이나 농업에 관한 사항.
  農圃:
    農作物を育てる田畑。農業を行う田畑。: 농작물을 기르는 논밭. 농사를 짓는 논밭.
  農奴:
    ? 中世ヨーロッパ封建社会の農民。領主に隷属し、与えられた土地を耕作して、賦役などを納めた。奴隷と異なり人格は認められていたが、移転などの自由はなく束縛されていた。
    : 중세 유럽 봉건사회에서 영주에게 예속되어 토지를 경작하고 부역 등을 바치던 농민. 농노.
  農本主義:
    農業を重んじ、農業を、国を建設していくうえでの産業の基本とする考え方。: 농업을 중시하고 농업을 국가 건설의 산업적 기본으로 삼는 사상.
  農業:
    ? 土地を利用して作物を作ったり家畜を飼ったりして、人間生活に必要な食品・嗜好(シコウ)品や工業資材を生産する産業。
    : 토지를 이용해 작물을 재배하거나 가축을 길러 생활에 필요한 식품, 기호품, 공업 자재를 생산하는 산업.
  農繁期:
    一年のうち、季節的に植えつけや収穫などで農事の最も忙しい時期。農閑期: 한 해 중 계절적으로 파종이나 수확 등 농사일이 가장 바쁜 시기.
  農芸:
    "①農業と園芸。 ②農作物を育て作ること。また、農業に関する技術。": "① 농업과 원예. ② 농작물을 기르고 생산하는 것. 또는 농업에 관한 기술."
  農薬:
    農業用の薬品。殺虫・殺菌や除草などに使う。: 농업용 약품. 살충, 살균, 제초 등에 쓴다.
  農閑期:
    一年のうち、季節的に農作業のひまな時期。農繁期: 한 해 중 계절적으로 농사일이 한가한 시기.
  農隙:
    農作業の合間。農間。: 농사일의 틈. 농한.
返:
  返す:
    ? "①もとの状態に戻す。 ②もとの状態に戻る。 ③受けた行為に応じてはたらきかける。報いる。 ④向きを変える。ひっくりかえす。また、掘りおこす。たがやす。 ⑤同じ動作をする。"
    : "① 원래 상태로 되돌리다. ② 원래 상태로 돌아가다. ③ 받은 행위에 대응해 되갚다. ④ 방향을 바꾸다. 뒤집다. 또는 파헤치다. 갈다. ⑤ 같은 동작을 하다."
  返る:
    ? "［動ラ五（四）］１ 表であったものが裏になったり、上であったものが下になったりして、ものの向き・位置が反対になる。裏がえる。ひるがえる。ひっくりかえる。２ （返る）一度変化したものが、前やもとの状態になる。３ （返る）一度手を離れた物が手元に戻る。もとの所有者に戻る。４ （返る）こちらからの働きかけに対して、相手が反応する。５ 年月・季節が一巡して再びその時になる。年が改まる。〈更級〉６ 染めた色がさめる。色があせる。〈枕・二〇〇〉７ 動詞の連用形に付く。㋐すっかり…する、ひどく…する意を表す。㋑繰り返し…する意を表す。〈万・二八九〇〉"
    : "① 앞면이 뒷면이 되거나 위아래가 뒤바뀌어 방향이나 위치가 반대가 되다. ② 한 번 변한 것이 이전이나 원래 상태가 되다. ③ 손을 떠났던 물건이 수중으로 돌아오다. ④ 이쪽의 작용에 대해 상대가 반응하다. ⑤ 세월이나 계절이 한 바퀴 돌아 다시 그때가 되다. ⑥ 물든 색이 바래다. ⑦ 동사의 연용형에 붙어 완전히 또는 심하게 됨, 혹은 되풀이함을 나타내다."
  返答:
    問いかけや呼びかけに答えること。また、その答え。返事・応答: 물음이나 부름에 대답함. 또는 그 대답.
  三返:
    三度すること。三回繰り返すこと。みたび。: 세 번 하는 것. 세 차례 되풀이하는 것.
  返上:
    受け取らないこと。戻すこと。また、「返す」の謙譲語で、お返しすること。: 받지 않는 것. 돌려주는 것. 또는 「돌려드리다」의 겸양어.
  返信:
    返事の手紙や通信。 往信: 답장 편지나 회신.
  返却:
    借りた物や預かった物を戻すこと。返戻: 빌린 물건이나 맡은 물건을 돌려주는 것.
  返書:
    返事の手紙。返信・返状: 답장 편지. 회신.
  返杯:
    つがれた酒を飲みほして、相手に杯を返すこと。また、その杯。: 따라 준 술을 다 마시고 상대에게 술잔을 돌려주는 것. 또는 그 잔.
  返済:
    借りた金品を返すこと。: 빌린 돈이나 물품을 갚는 것. 변제.
  返照:
    "①光が照り返すこと。照り返し。 ②夕日の輝き。夕ばえ。夕照(セキショウ)": "① 빛이 반사되어 비치는 것. ② 석양의 빛. 저녁놀."
  返納:
    受け取ったものを、もとに返し納めること。: 받은 것을 원래 있던 곳에 돌려 바치는 것.
  返還:
    一時的に譲り受けた物や借りていた物をもとに戻すこと。: 일시적으로 넘겨받거나 빌렸던 것을 원래대로 돌려주는 것. 반환.
追:
  追う:
    ? "①先に行くものや目標に達しようとして進む。 ②あとにしたがう。 ③しりぞける。 ④せきたてる。"
    : "① 앞서 가는 것 또는 목표에 닿으려고 나아가다. ② 뒤따르다. ③ 물리치다. ④ 재촉하다."
  追憶:
    過去や亡くなった人を思い出してしのぶこと。追想・追懐: 과거나 세상을 떠난 사람을 떠올리며 그리워함.
  追風:
    おいかぜ。順風。: 뒤에서 부는 바람. 순풍.
  追儺:
    "「追儺(ツイナ)」に同じ。": 역귀를 쫓는 의식. 추나.
  追加:
    あとからつけ加えること。また、そのもの。削減・削除: 나중에 덧붙이는 것. 또는 그 자체. 추가.
  追及:
    "①逃げる相手を追いかけること。 ②追いつめて問いただすこと。": "① 달아나는 상대를 뒤쫓는 것. ② 몰아붙여 따져 묻는 것."
  追従:
    こびへつらうこと。おべっか。諫言(カンゲン): 아첨하는 것. 알랑거림.
    人につきしたがうこと。人の言うままに行うこと。追随: 남을 따라다니는 것. 남이 말하는 대로 하는 것. 추종.
  追懐:
    昔のことをなつかしく思い出すこと。追憶・追想: 옛일을 그리워하며 떠올리는 것. 추억.
  追求:
    目的物を手に入れるために、追いもとめること。: 목적물을 손에 넣기 위해 뒤쫓아 구하는 것. 추구.
  追而書:
    手紙の本文のあとにつけ加えて書くこと。また、その文章。追伸。二伸。: 편지 본문 뒤에 덧붙여 쓰는 것. 또는 그 글. 추신.
  追討:
    敵を追いかけて討つこと。追っ手をつかわして賊を討ちとること。: 적을 뒤쫓아 치는 것. 추격해 토벌하는 것.
送:
  送る:
    ? "①物や人などをある所に届ける。また、他の所へ移す。 ②順々に移していく。 ③行く人を見送る。また、去る人と惜別の思いで別れる。 ④時や年月を過ごす。 ⑤死んだ人を葬る。"
    : "① 물건이나 사람 등을 어떤 곳에 닿게 하다. 또는 다른 곳으로 옮기다. ② 차례차례 넘기다. ③ 가는 사람을 배웅하다. 또는 떠나는 사람과 아쉬워하며 헤어지다. ④ 시간이나 세월을 보내다. ⑤ 죽은 사람을 장사지내다."
  送致:
    "①送り届けること。 ②関係書類や被告人などを、ある機関から他の機関へ移すこと。": "① 보내어 닿게 함. ② 관계 서류나 피고인 등을 어떤 기관에서 다른 기관으로 넘김."
  移送:
    人や物を他の場所へ移し送ること。: 사람이나 물건을 다른 곳으로 옮겨 보내는 것.
  送信:
    無線電信や電話などで、通信を送ること。 受信: 무선 전신이나 전화 등으로 통신을 보내는 것. 송신.
  送別:
    別れて行く人を送ること。: 떠나가는 사람을 배웅하는 것. 송별.
  送故迎新:
    ? 前任者を送りだし、新任者を迎えること。人を見送り、迎えること。「故」は古い意。〈『漢書(カンジョ)』〉
    : 전임자를 보내고 신임자를 맞이하는 것. 사람을 보내고 맞이하는 것.
  送検:
    犯罪者や被疑者、また捜査の書類などを検察庁へ送ること。: 범죄자나 피의자, 수사 서류 등을 검찰청으로 보내는 것.
  送葬:
    死者をとむらい見送ること。野辺の送り。: 죽은 이를 장례 지내며 떠나보내는 것.
  送辞:
    卒業や転任などで、別れて行く人を送る言葉。 答辞: 졸업이나 전근 등으로 떠나가는 사람을 보내는 말. 송사.
  送迎:
    人を送ったり迎えたりすること。送り迎え。: 사람을 보내고 맞이하는 것. 송영.
  送還:
    人を送り返すこと。: 사람을 돌려보내는 것. 송환.
速:
  速い:
    "①速度がすみやかである。動作などにかかる時間が少ない。 ②動きや変化が急である。": "① 속도가 빠르다. 동작 등에 걸리는 시간이 적다. ② 움직임이나 변화가 급하다."
  速まる:
    ? "① （早）度を過ごして早くする。急ぎすぎる。多く、あわてたり、あせったりして、判断を誤り、軽はずみなことをすることにいう。② 時期が早くなる。速度が速くなる。「予定が二、三日早まる」 〔日葡辞書（1603‐04）〕"
    : "① 성급해지다. 서두른 나머지 판단을 그르치고 경솔한 일을 하다. ② 시기가 앞당겨지다. 속도가 빨라지다."
  速める:
    速度をはやくする。: 속도를 빠르게 하다.
  速やか:
    動作がすばやいさま。: 동작이 재빠른 모양. 신속함.
  速達:
    "「速達郵便」の略。特別料金を払い、普通郵便よりもはやく配達される郵便。": 특별 요금을 내고 보통 우편보다 빠르게 배달되는 우편.
  速写:
    写真などを、すばやく写すこと。: 사진 등을 빠르게 찍는 것.
  速射:
    銃などを、短い間隔ですばやく発射すること。: 총 등을 짧은 간격으로 빠르게 발사하는 것.
  速度:
    "①物事の進むはやさ。スピード。 ②運動する物体の、単位時間当たりの位置の変化を表す量。": "① 사물이 나아가는 빠르기. 속도. ② 움직이는 물체의 단위 시간당 위치 변화량."
  速成:
    短期間に仕上がること。急いで仕上げること。: 짧은 기간에 완성되는 것. 서둘러 완성하는 것.
  速戦即決:
    ? 戦いを長びかせず、一気に勝負を決めること。また、すみやかに物事を解決すること。 短期決戦 緩兵の計
    : 싸움을 오래 끌지 않고 단번에 승부를 내는 것. 또는 일을 신속히 해결하는 것.
  速断:
    "①すみやかに決断すること。 ②はやまった判断をすること。": "① 신속히 결단하는 것. ② 성급하게 판단하는 것."
  速歩:
    ? "①普通よりはやく歩くこと。急ぎ足。 ②ウマの歩く速度で、一分間に二一〇(メートル)進むはやさ。"
    : "① 보통보다 빠르게 걷는 것. 빠른 걸음. ② 말의 보법 중 1분에 약 210미터 나아가는 속도."
  速香:
    すぐに燃え尽きてしまうような、質の悪い香。: 금방 타 버리는 질 낮은 향.
進:
  進む:
    ? "①前に行く。前に出る。 ②はかどる。進行する。 ③上の段階に上がる。また、進歩する。 ④盛んになる。 ⑤程度がひどくなる。 ⑥積極的に行う。 ⑦時計の表示が標準時刻より早くなる。"
    : "① 앞으로 가다. 앞으로 나오다. ② 일이 잘 되어 가다. 진행하다. ③ 윗단계로 올라가다. 또는 진보하다. ④ 활발해지다. ⑤ 정도가 심해지다. ⑥ 적극적으로 하다. ⑦ 시계 표시가 표준 시각보다 빨라지다."
  進める:
    ? "[ 文語形 ]すす・む ① 前へ行かせる。前進させる。② 階級、段階をあげる。昇給、昇進させる。③ 物事の程度をよい方へ向かわせる。進歩させる。④ 物事が進行するようにする。⑤ 欲望を刺激する。そそる。⑥ 時計の時刻をさしている針を動かして、はやい時刻をさすようにする。"
    : "① 앞으로 가게 하다. 전진시키다. ② 계급이나 단계를 올리다. ③ 사물의 정도를 좋은 쪽으로 향하게 하다. 진보시키다. ④ 일이 진행되도록 하다. ⑤ 욕망을 자극하다. 부추기다. ⑥ 시계바늘을 움직여 더 이른 시각을 가리키게 하다."
  進化:
    ? "①生物が長い年月の間に、より複雑で高等かつ多種類に変化すること。 ②物事が発達し、進歩すること。 退化"
    : "① [생물] 생물이 오랜 세월에 걸쳐 더 복잡하고 고등하며 다양한 형태로 변하는 것. ② 사물이 발달하고 진보하는 것."
  進取:
    新しいことにも進んで取り組むこと。 退嬰(タイエイ): 새로운 일에도 적극적으로 나아가 임하는 것.
  進取果敢:
    積極的で決断力と行動力に富むこと。 勇猛果敢 優柔不断: 적극적이고 결단력과 행동력이 풍부한 것.
  進境:
    進歩して至った境地。また進歩や上達の程度。: 진보하여 이른 경지. 또는 진보나 향상의 정도.
  進士:
    ? "①昔の中国で、科挙の科目の一つ。また、その合格者。 ②律令(リツリョウ)制で、式部省が課した官吏登用試験。また、それに及第した人。文章生(モンジョウショウ)。"
    : "① 옛 중국 과거의 과목 중 하나. 또는 그 합격자. ② 율령제에서 관리 등용 시험 또는 그 합격자."
  進学:
    上級の学校に進むこと。 春: 상급 학교로 진학하는 것.
  進撃:
    軍隊で、敵陣に向かって進み、攻撃すること。 進攻 退却・撤退: 군대가 적진을 향해 나아가 공격하는 것. 진격.
  進攻:
    積極的に軍隊をすすめて攻撃をしかけること。 進撃 退却・撤退: 적극적으로 군대를 전진시켜 공격을 거는 것. 진공.
  進行:
    ? "①前に向かって進んで行くこと。 ②病気の経過が悪いほうに進むこと。 ③物事がはかどること。 ①③停止"
    : "① 앞으로 나아가는 것. ② 병의 경과가 나쁜 쪽으로 나아가는 것. ③ 일이 진척되는 것."
  進言:
    位や立場が上の人に意見を申し述べること。: 지위나 입장이 높은 사람에게 의견을 말씀드리는 것.
  進講:
    天皇や高貴な人の前で学問などの講義をすること。: 천황이나 고귀한 사람 앞에서 학문 등을 강의하는 것.
遊:
  遊び:
    心の向くままにする物事。なぐさみ。あそび。: 마음 내키는 대로 하는 일. 위안. 놀이.
  遊ぶ:
    ? "①旅をする。また、外国に行って勉強する。 ②仕事や学業をなまける。また、酒色・ばくちなどにふける。 ③楽しむ。 ④交際する。 ⑤場所や道具などが使われないである。"
    : "① 여행하다. 또는 외국에 가서 공부하다. ② 일이나 학업을 게을리하다. 또는 주색이나 도박 등에 빠지다. ③ 즐기다. ④ 교제하다. ⑤ 장소나 도구 등이 쓰이지 않은 채 있다."
    ? "[ 1 ] ( 動詞の連用形の下に付いて補助動詞的に用いる ) 物事の進行するなりゆきのままになる。動作、程度がはなはだしくなる。いよいよ進む。① 物事の進行するなりゆきのままになる。ある特定の方向にいよいよ進む。② 勢いが尽きて衰える。進み果てて止む。③ 心を奪われておぼれる。ゆとりがなくなって荒れる。④ 肌などがなめらかでなくなる。荒れる。すさむ。"
    : "① 흥이 나는 대로 행동하며 즐기다. ② 하고 싶은 일을 하며 마음을 달래다. ③ 시가, 관현, 춤 등을 즐기다. ④ 새나 짐승, 물고기 등이 즐거운 듯 움직이다. ⑤ 견문을 넓히거나 기분 전환을 위해 다른 곳에 가다. ⑥ 요릿집이나 유흥가에 가서 즐기다. ⑦ 일이나 공부를 하지 않고 빈둥거리다. ⑧ 돈, 도구, 장소 등이 쓰이지 않은 채 있다. ⑨ 응력을 받아야 할 물체가 받지 않거나 붙어야 할 것이 붙지 않은 상태가 되다. ⑩ 일부러 힘을 빼고 상대하다. ⑪ 무악을 행하다. 연주하다. ⑫ 사람을 놀리다."
  遊泳:
    "①泳ぐこと。水泳 夏 ②世渡りのたとえ。処世": 헤엄침. 수영.
  交遊:
    親しくつきあうこと。親しい交際。: 친하게 사귀는 것. 친밀한 교제.
  遊休:
    設備・資金などが、活用されないままにあること。: 설비나 자금 등이 활용되지 않은 채 있는 것.
  遊学:
    よその土地や国に行って学問をすること。: 다른 지방이나 나라에 가서 공부하는 것. 유학.
  遊客:
    ? "①定まった職をもたず、遊んで暮らしている人。遊び人。遊民 ②遊覧客。 ③遊郭の客。遊女を相手に遊ぶ客。嫖客(ヒョウカク)"
    : "① 일정한 직업 없이 놀며 지내는 사람. ② 유람객. ③ 유곽의 손님."
  遊牝む:
    動物の雄と雌とが交尾する。: 동물의 수컷과 암컷이 교미하다.
  遊興:
    遊び楽しむこと。特に、酒場や料理屋で楽しむこと。: 놀며 즐기는 것. 특히 술집이나 요릿집에서 즐기는 것.
  遊軍:
    ? "①待機して必要に応じて出動する予備の軍隊。 ②一定の部署につかず何か起こったときになって活動する人。"
    : "① 대기하다가 필요에 따라 출동하는 예비 군대. ② 일정한 부서에 속하지 않고 일이 생기면 활동하는 사람."
  遊閑地:
    何にも利用されていない土地。空いている土地。休閑地: 아무 데도 이용되지 않는 땅. 빈 땅.
運:
  運ぶ:
    ? "①物を移し動かす。運搬する。 ②物事を推し進める。推進する。 ③何かを使って動作をする。 ④はかどる。物事が進展する。"
    : "① 물건을 옮겨 움직이다. 운반하다. ② 일을 밀고 나가다. 추진하다. ③ 어떤 것을 써서 동작을 하다. ④ 일이 순조롭게 진행되다."
  運る:
    ぐるぐる回る。回りながら進んでいく。動き移る。: 빙빙 돌다. 돌면서 나아가다. 움직여 옮겨 가다.
  運気:
    ? "①自然現象に現れるという人間の運勢。 ②陰陽道(オンヨウドウ)や漢方で、天地・人体をつらぬいて存在するという五運と六気。"
    : "① 자연현상에 나타난다고 여겨지는 인간의 운세. ② 천지와 인체에 관통해 존재한다고 여겨지는 오운과 육기."
  運送:
    ? "① 物品を運び送ること。運搬。② 旅客または物品を、業として一定の場所から他の場所へ移し送ること。〔日葡辞書（1603‐04）〕③ 賭博の客を連れてきたり、客のところへ行って金の授受を行なったりすることをいう隠語。"
    : "① 물품을 실어 보냄. 운반. ② 여객이나 물품을 업으로 일정한 장소에서 다른 장소로 옮겨 보냄. ③ 도박 손님을 데려오거나 손님에게 가서 돈을 주고받는 일."
  運針:
    "①裁縫で針の運び方。縫い方。 ②縫い目をそろえて、まっすぐに縫うこと。": "① 바느질에서 바늘을 움직이는 법. 바느질법. ② 바늘땀을 가지런히 하여 곧게 꿰맴."
  運休:
    運転や運航をとりやめること。「運転休止」「運航休止」の略。: 운전이나 운항을 중지하는 것.
  運営:
    機構・組織などを動かしていくこと。 経営: 기구나 조직 등을 움직여 나가는 것. 운영.
  運斤成風:
    ? 神業(かみわざ)のようなすばらしい技術。また、それをもつ職人。「運斤」は斧(おの)を振るうこと。「成風」は風を起こす意。
    : 신기에 가까울 만큼 뛰어난 기술. 또는 그런 기술을 가진 장인.
  運根鈍:
    ? 成功するには、運が強いこと、根気があること、ねばり強いことの三つが必要であるという教え。
    : 성공하려면 운, 근기, 끈기의 세 가지가 필요하다는 가르침.
  運河:
    水上交通・灌漑(カンガイ)・排水などの目的で、陸地を人工的に掘って造った水路。: 수상 교통, 관개, 배수 등을 위해 육지를 인공적으로 파서 만든 수로. 운하.
  運算:
    数式のとおりに計算して、値を出すこと。演算: 수식에 따라 계산하여 값을 구하는 것. 연산.
  運航:
    船や航空機が定まった航路を進むこと。: 배나 항공기가 정해진 항로를 운행하는 것.
  運行:
    ? "①列車や路線バスが一定の道筋にしたがって動くこと。 ②天体がそれぞれきまった軌道を進むこと。"
    : "① 열차나 노선버스가 일정한 경로를 따라 움직이는 것. ② 천체가 정해진 궤도를 나아가는 것."
部:
  上達部:
    昔、宮中に仕えた大臣・大中納言・参議と三位(さんみ)以上の人の総称。: "옛날 궁중에 섬긴 대신, 대중납언, 참의와 삼위 이상의 사람을 통틀어 이르는 말."
  兄部:
    中世、寺社・宮中・武家などで力仕事をした人々の長。: "중세에 절, 신사, 궁중, 무가 등에서 힘쓰는 일을 하던 사람들의 우두머리."
  品部:
    ? "①大化改新以前、世襲的な職業をもって大和朝廷につかえた人々の組織。 ②律令(リツリョウ)制で、諸官司に配属された特殊技術者の集団。"
    : "① 다이카 개신 이전 세습 직업을 가지고 야마토 조정에 섬긴 사람들의 조직. ② 율령제에서 여러 관청에 배속된 특수 기술자 집단."
  工部:
    ? "① 中国の役所の名。六部の一つ。隋、唐の頃から始まる。営造、工作に関する仕事を受け持つ。長官は工部尚書。〔隋書‐百官志・下〕② 宮内省(くないしょう)の唐名。〔職原鈔（1340）〕③ 令制で木工寮(もくりょう)、東宮の主工署の下級職員で、技術者。令外官の兵庫寮にも置かれていた。雑色(ぞうしき)。〔令義解（718）〕④ 「こうぶだいがっこう（工部大学校）」の略。⑤ 「こうぶしょう（工部省）①」の略。〔広益熟字典（1874）〕"
    : "① 중국 관청 이름. 육부의 하나로, 영조와 공작에 관한 일을 맡았다. ② 궁내성의 중국식 명칭. ③ 율령제에서 목공료나 동궁 주공서의 하급 직원인 기술자. ④ 공부대학교의 준말. ⑤ 공부성의 준말."
  掃部:
    律令(リツリョウ)制において、宮中の清掃や儀式の設営などをつかさどった掃部寮の役人の称。: "율령제에서 궁중 청소나 의식 설영 등을 맡은 소부료 관리의 명칭."
  部:
    上代に、朝廷や豪族に属して一定の職業についた世襲的な集団。: "상고 시대 조정이나 호족에 속해 일정한 직업을 맡은 세습 집단."
  部曲:
    古代、各地の豪族が私有していた民。: "고대에 각지의 호족이 사유하던 백성."
  俱楽部:
    同じ目的や趣味をもつ人々が作った団体。また、その集会所。: 같은 목적이나 취미를 가진 사람들이 만든 단체. 또는 그 집회소. 클럽.
  相部屋:
    旅館や寮などで、他の人と同じ部屋になること。: 여관이나 기숙사 등에서 다른 사람과 같은 방을 쓰게 되는 것.
  蛸部屋:
    労働者を監禁同様に拘束して働かせた飯場。: 노동자를 감금하듯 묶어 두고 일하게 하던 합숙소.
  部品:
    "「ぶぶんひん（部分品）」の略。": 부분품의 준말. 부품.
  部数:
    "① 書物や雑誌・新聞などの数。冊数。② 出版物の発行数。③ 部類の数。": "① 책, 잡지, 신문 등의 수. 권수. ② 출판물의 발행 수. ③ 부류의 수."
  部族:
    一定の地域で生活し、共通の言語・宗教・文化などをもっている共同体。: 일정한 지역에서 살며 공통의 언어, 종교, 문화 등을 가진 공동체. 부족.
  部署:
    組織の中でそれぞれに割り当てられた役目や場所。持ち場。: 조직 안에서 각각 맡겨진 역할이나 자리. 부서.
  部領:
    ? "①一部族の長。集団を統率する者。 ②古代、春宮(とうぐう)坊の帯刀(たちはき)の官。皇太子の護衛をし、陣の事務を執った。"
    : "① 한 부족의 우두머리. 집단을 통솔하는 사람. ② 고대에 황태자를 호위하고 진의 사무를 맡던 관직."
都:
  都:
    ? "①帝王の宮殿や皇居のある土地。「宮処(みやこ)」の意から。 ②中央政府のある都市。首都。 ③人口の密集した、にぎやかなまち。都会。鄙(ひな) ④何らかの特徴をもち、人が集まる都会。また、楽しく暮らせる土地。"
    : "① 제왕의 궁전이나 황거가 있는 땅. ② 중앙 정부가 있는 도시. 수도. ③ 인구가 밀집한 번화한 도시. ④ 어떤 특징이 있고 사람이 모이는 도시. 또는 즐겁게 살 수 있는 땅."
  都て:
    みんな。何もかも。ことごとく。: 모두. 무엇이든 전부. 모조리.
  都合:
    ? "①ぐあい。折り合い。事情。 ②工面すること。やりくりすること。 ③すべて合わせること。合計すること。また、その合計。"
    : "① 형편. 사정. ② 마련함. 변통함. ③ 모두 합함. 합계함. 또는 그 합계."
  都市:
    人口が多く、その地方の政治・経済・文化の中心になっている大きなまち。都会: 인구가 많고 그 지방의 정치, 경제, 문화의 중심이 되는 큰 도시.
  都会:
    人口が密集した、にぎやかなまち。商工業の盛んな文化的設備の整った地。都市田舎: 인구가 밀집한 번화한 도시. 상공업이 활발하고 문화 시설이 갖추어진 곳.
  都営:
    東京都の経営。また、その経営になるもの。: 도쿄도가 경영하는 것. 또는 그 경영에 속한 것.
  都塵:
    都会のちり。都会のごみごみした騒々しい環境。都会の雑踏。: 도시의 먼지. 복잡하고 시끄러운 도시 환경. 도시의 혼잡.
  都府:
    みやこ。都会。都邑(トユウ): 수도. 도시.
  都度:
    毎回。そのたびごと。: 매번. 그때마다.
  都督:
    ? "①全体を統率すること。また、その人。統率者。総大将。 ②中国の官名で、地方の軍政官。転じて、大宰府(ダザイフ)の最高責任者、大宰大弐(ダイニ)の唐名。"
    : "① 전체를 통솔하는 것. 또는 그 사람. 총대장. ② 중국의 관명으로 지방 군정관."
  都鄙:
    都会と田舎。: 도시와 시골.
  都雅:
    姿や振る舞いの上品なこと。みやびやかなこと。また、そのさま。: 모습이나 행동이 품위 있는 것. 우아한 것. 또는 그런 모양.
  首都:
    その国の中央政府がある都市。首府。: 그 나라의 중앙정부가 있는 도시. 수도.
配:
  配する:
    ? "①くばる。割り当てる。 ②取り合わせる。 ③配属させる。 ④夫婦にする。めあわせる。 ⑤流刑にする。"
    : "① 나누어 주다. 할당하다. ② 배합하다. ③ 배속시키다. ④ 부부로 맺다. ⑤ 유배하다."
  配る:
    "①割り当てて渡す。分配する。 ②配達する。 ③注意を行き渡らせる。 ④配置する。": "① 할당하여 나누어 주다. 분배하다. ② 배달하다. ③ 주의를 두루 미치게 하다. ④ 배치하다."
  配合:
    二種以上のものを組み合わせること。取り合わせ。調合: 두 종류 이상의 것을 조합함. 배합.
  配給:
    割り当ててくばること。また、国が支給すること。: 할당하여 나누어 줌. 또는 국가가 지급함.
  配下:
    ある人の支配のもとにいる人。手下・部下: 어떤 사람의 지배 아래 있는 사람. 부하.
  配偶:
    "「配偶者」の略。夫婦の一方から他方をいう言葉。つれあい。": 배우자의 준말. 부부 중 한쪽이 다른 한쪽을 이르는 말.
  配剤:
    "①薬を調合すること。 ②ほどよく取り合わせること。": "① 약을 조합하는 것. ② 알맞게 배합하는 것."
  配所:
    罪をおかして流された土地。流罪の地。: 죄를 지어 유배된 땅. 유배지.
  配管:
    ガス・水道などを通すための管を取りつけること。: 가스나 수도 등을 통하게 할 관을 설치하는 것. 배관.
  配膳:
    料理の膳を客の前にくばること。また、食卓に料理を並べること。: 음식을 담은 상을 손님 앞에 나누어 놓는 것. 또는 식탁에 음식을 차리는 것.
  配色:
    いくつかの色を調和するように組み合わせること。また、その色合い。: 여러 색을 조화되게 배합하는 것. 또는 그 색의 조합.
  配達:
    物をくばり届けること。また、その人。: 물건을 나누어 배달하는 것. 또는 그 사람.
酒:
  御神酒:
    "①神前に供える酒。 ②酒のことをしゃれていう語。": "① 신전에 바치는 술. ② 술을 멋스럽게 이르는 말."
  酒:
    ? "( 複合語では、多く「さか」となる )① 米を発酵させて製するアルコール分含有の飲料。日本酒。上代は濁酒が主で、室町時代頃から清酒もつくられるようになった。現代は主に清酒をいう。古くから、さまざまな異名で呼ばれる。三輪(みわ)、三木(みき)、ささ、九献(くこん)、霞、三遅(みめぐり)、般若湯、硯水(けんずい)など。② 一般にアルコール分を含有する液体飲料をいう。合成清酒・焼酎(しょうちゅう)・みりん・ビール・果実酒類・ウイスキー類など多くの種類がある。③ さかもり。酒宴。①については、上代の「古事記」「日本書紀」「風土記」のほか、「魏志‐東夷伝」倭人条にも記事がある。その種類は判然としないが、米を原料とするものが主であったと考えられる。( 2 )令制では宮内省に造酒司が置かれ、「延喜式‐四〇・造酒司」には酒にかかわる多様な規定があり、同じく米を原料としながらも製法の異なる数種の酒の記載がある。( 3 )上代の「酒」の訓は、「サケ」の他にキ（ミキ）、クシがある。クシは明らかでないが、クスリと関係があるものと思われ、キは後代に神祭・儀礼に関するものに限られるようになった。( 4 )上代には醸造の施設と見られる「酒屋」があるが、「類聚国史‐一七三」によれば、左京・右京・山崎津・難波津に「酒家」（「三宝絵」に「さけの家」）があり、売買の行なわれたことが知られる。鎌倉時代、酒家は増え、幕府は沽酒（酒の売買のこと）を抑制する発令を行なった。室町時代、遅くとも応永年間には洛中洛外の酒屋は三百軒を超え、土倉を兼業して金融を営むものも多かった。室町幕府は明徳四年（一三九三）以降、土倉役とともに酒屋役を賦課して有力な財源とした。( 5 )室町時代には酒の製法も大きく展開し、後期には、大和、後に伊丹の産として著名な諸白(もろはく)も現われ、酒の主流として濁酒から清酒への転換を促した。"
    : "① 쌀을 발효시켜 만든 알코올 음료. 일본주. ② 일반적으로 알코올을 포함한 액체 음료. ③ 술자리. 술잔치."
    ? "①アルコール分を含む飲料の総称。 ②米・麴(こうじ)などを発酵させてつくる、日本独特の醸造酒。清酒。日本酒。"
    : "① 알코올을 포함한 음료의 총칭. ② 쌀과 누룩 등을 발효시켜 만드는 일본 특유의 양조주. 청주. 일본주."
  酒宴:
    人々が集まり、酒を飲んで楽しむうたげ。さかもり。: 사람들이 모여 술을 마시며 즐기는 잔치. 술자리.
  三鞭酒:
    炭酸の入った白ブドウ酒。祝い事などに飲む。シャンペン。: 탄산이 들어간 백포도주. 축하 자리 등에서 마시는 샴페인.
  御酒:
    酒の美称。特に、神前に供える酒。おみき。: 술의 미칭. 특히 신 앞에 바치는 술.
  掌酒:
    神に供える酒の醸造をする人。: 신에게 바치는 술을 빚는 사람.
  混合酒:
    ウイスキー・ブランデーなど数種類の洋酒に、果汁・香料などを混ぜ合わせた飲み物。: 위스키, 브랜디 등 여러 양주에 과즙이나 향료 등을 섞은 음료. 칵테일.
  火酒:
    ? ロシア原産のアルコール度の高い蒸留酒。オオムギ・ライムギ・トウモロコシなどを原料とする。
    : 러시아 원산의 도수가 높은 증류주. 보리, 호밀, 옥수수 등을 원료로 한다. 보드카.
  灰酒:
    ? 酸化を防ぐために灰汁(あく)を入れてつくる酒。糖分を多く含み、赤くてみりんに似る。飲料・調味料として用いる。熊本特産。赤酒(あかざけ)。
    : 산화를 막기 위해 잿물을 넣어 만든 술. 당분이 많고 붉으며 미림과 비슷하다.
  神酒:
    "①神に供える酒。 ②酒の美称。また、敬称。": "① 신에게 바치는 술. ② 술의 미칭 또는 존칭."
  醇酒:
    発酵させただけの、濃いどぶろく。濁(にご)り酒・煉(ね)り酒の類。: 발효만 시킨 진한 탁주. 흐린 술의 한 종류.
  酒頰・酒面:
    酒を飲んで赤くなった顔。また、酒を飲んだように赤い顔。: 술을 마셔 붉어진 얼굴. 또는 술을 마신 듯 붉은 얼굴.
重:
  重:
    重なったものや重なった回数を数える語。: 겹친 것 또는 겹친 횟수를 세는 말.
    弓の、手でにぎる部分を黒漆で塗り、その上を(トウ)でぎっしり巻いたもの。: 활에서 손으로 잡는 부분에 검은 옻을 칠하고 그 위를 등나무로 촘촘히 감은 것.
  重い:
    ? "①目方が多い。 ②程度がはなはだしい。ひどい。 ③大切である。重要である。 ④気分がうっとうしい。 ⑤動きがにぶい。"
    : "① 무게가 많이 나간다. ② 정도가 심하다. ③ 중요하다. ④ 기분이 답답하다. ⑤ 움직임이 둔하다."
  重なる:
    ? "① あるものの上に、他のものが添い加わる。② あるもののうしろに、他のものが続き加わる。物や人が次々と後方に位置して連なって見える。③ あることの上に、さらに他のことが添い加わる。また、同じ物事が繰り返される。歳月の繰り返しにもいう。④ 物事が豊かになったり、深まったりする。⑤ 二つ以上の物事が同じ時にかち合う。同時に起こる。"
    : "① 어떤 것 위에 다른 것이 더해지다. ② 어떤 것 뒤에 다른 것이 이어져 더해지다. ③ 어떤 일 위에 다시 다른 일이 더해지다. 또는 같은 일이 되풀이되다. ④ 사물이 풍부해지거나 깊어지다. ⑤ 둘 이상의 일이 같은 때에 겹치다."
  重ねる:
    "①物の上にさらに物をのせる。 ②ある事に同じ事を加える。同じ行為を繰り返す。": "① 물건 위에 다시 물건을 얹다. ② 어떤 일에 같은 일을 더하다. 같은 행위를 되풀이하다."
  重んじる:
    大事にする。たっとぶ。: 소중히 여기다. 존중하다.
  七重八重:
    数多く重なること。また、そのもの。「七重八重に包帯を巻く」: 여러 겹으로 많이 겹치는 것. 또는 그런 것.
  重任:
    "①責任の重い仕事。重要な任務。大任。 ②任期満了後も引き続き同じ任務につくこと。再任。": "① 책임이 무거운 일. 중요한 임무. ② 임기 만료 뒤에도 계속 같은 임무를 맡는 것. 재임."
  重厚:
    重々しくどっしりと落ち着いていること。また、そのさま。: 묵직하고 듬직하게 안정되어 있는 것. 또는 그런 모양.
  重心:
    物体の各部分に作用する重力の中心点。: 물체의 각 부분에 작용하는 중력의 중심점. 무게중심.
  重播:
    ? 古代の不法な行為の一つ。他人が穀物の種を播いた上にまた種を播き、穀物の生長を妨げること。
    : 고대의 불법 행위 중 하나. 남이 곡식 씨를 뿌린 곳에 다시 씨를 뿌려 곡식의 성장을 방해하는 것.
  重症:
    病気やけがの症状が重いこと。 軽症: 병이나 부상의 증상이 무거운 것. 중증.
  重視:
    重く見ること。大切なこととして注意して見ること。 軽視: 중요하게 보는 것. 소중한 일로 주의 깊게 보는 것.
  重手・重傷:
    "「重傷(ジュウショウ)」に同じ。": 중상과 같음. 심한 부상.
  重吹く:
    雨風がしきりに強く吹く。また、しぶきが飛び散る。: 비바람이 자꾸 세차게 불다. 또는 물보라가 흩날리다.
鉄:
  寸鉄:
    "①小さな刃物。 ②深い意味をもつ短い言葉。": "① 작은 칼붙이. ② 깊은 뜻을 지닌 짧은 말."
  私鉄:
    民間の企業で経営する鉄道。私有鉄道。私設鉄道。民営鉄道。: 민간 기업이 경영하는 철도. 사유 철도. 민영 철도.
  鉄:
    金属。かなもの。特に、てつ。: 금속. 쇠붙이. 특히 철.
    てつの古称。: 철의 옛 이름.
  鉄兜:
    弾丸や落下物から頭を守るための鉄製の帽子。: 총탄이나 낙하물로부터 머리를 보호하기 위한 철제 모자. 철모.
  鉄刀木:
    ? マメ科の常緑高木。インド・東南アジアに自生。花は鮮黄色で芳香があり、花後、大形のさやをつける。材は堅く黒色で、木目模様が美しい。家具や楽器などの用材。
    : "[생물] 콩과의 상록 교목. 인도와 동남아시아에 자생하며, 단단하고 검은 목재는 가구나 악기 재료로 쓰임."
  鉄漿:
    鉄片を酢などにひたして作った、おはぐろに用いる液。: "쇳조각을 식초 등에 담가 만든, 이를 검게 물들이는 데 쓰는 액체."
    ? 歯を黒く染めること。また、それに使う液。奈良時代に上流の女性の間で始まり、平安後期には貴族の男性も行った。江戸時代には既婚の女性のしるしとなった。かねつけ。
    : 이를 검게 물들이는 것. 또는 거기에 쓰는 액.
  鉄亜鈴:
    鉄の棒の両端に鉄球がついた運動用具。ダンベル。: 쇠막대 양끝에 쇠공이 붙은 운동 기구. 덤벨.
  鉄人:
    鉄のように強いからだを持った人。不死身の人。: 쇠처럼 강한 몸을 가진 사람. 불사신 같은 사람.
  鉄掃箒:
    マメ科の小低木状の多年草。: "[생물] 콩과의 작은 관목 모양 여러해살이풀."
  鉄脚梨:
    バラ科の落葉低木。: "[생물] 장미과의 낙엽 관목."
  鉄葉:
    錫(すず)でめっきした薄い鉄板。: 주석으로 도금한 얇은 철판. 양철.
  鉄鉱:
    鉄の原料となる鉱石。赤鉄鉱・磁鉄鉱など。: 철의 원료가 되는 광석. 적철광, 자철광 등.
銀:
  銀:
    ? "①銀(ギン)。銅(あかがね)・鉄(くろがね)・黄金(こがね) ②銀貨(ギンカ)。 ③「銀色(しろがねいろ)」の略。銀色。"
    : "① 은. ② 은화. ③ 은색."
    江戸初期、豪商が朱印船貿易や外国船貿易の商人を相手に行った金融。: 에도 초기 거상이 주인선 무역이나 외국선 무역 상인을 상대로 하던 금융.
  銀杏:
    ? イチョウ科の落葉高木。中国原産。街路樹に多用される。葉は扇形で、秋に黄葉し美しい。実は「ぎんなん」と呼ばれ、食用。
    : "[생물] 은행나무과의 낙엽 교목. 중국 원산으로 가로수에 많이 쓰이며, 부채꼴 잎은 가을에 노랗게 물듦. 열매는 식용."
  銀漢:
    あまのがわ。銀河 秋: 은하수. 은하.
  銀箔:
    銀をたたいて紙のように薄くのばしたもの。: 은을 두드려 종이처럼 얇게 편 것.
  銀貨:
    銀を主成分として鋳造した貨幣。銀貨幣。: 은을 주성분으로 주조한 화폐. 은화.
  銀世界:
    一面雪におおわれて、白一色になった景色。冬: 온통 눈으로 덮여 흰빛 일색이 된 풍경. 은세계.
  銀婚式:
    結婚して二五年目を祝う式。: 결혼 25주년을 기념하는 의식. 은혼식.
  銀将:
    ? 将棋の駒の一つ。前後の斜め左右と前方とに一つずつ動けるもの。敵陣の三段め以内にはいって成ると金将と同じ働きをする。銀。
    : 쇼기 말의 하나. 앞뒤 대각선과 앞쪽으로 한 칸씩 움직이며, 적진 안에서 승격하면 금장과 같은 기능을 한다.
  銀河:
    夜空に光の川のように見える星の集まり。あまのがわ。銀漢 秋: 밤하늘에 빛의 강처럼 보이는 별들의 모임. 은하수.
  銀灰色:
    銀色がかった灰色。シルバーグレイ。: 은빛이 도는 회색. 실버 그레이.
  銀鉱:
    "①銀を含む鉱石。 ②銀の出る鉱山。銀山・銀脈": "① 은을 포함한 광석. ② 은이 나는 광산."
  銀魚:
    シラウオ科の海魚。: "[생물] 뱅어과의 바닷물고기."
開:
  開かる:
    ? "①手足を大きく広げて人の前に立つ。たちふさがる。 ②着衣の合わせ目が乱れて広がり開く。はだける。"
    : "① 팔다리를 크게 벌리고 사람 앞을 막아서다. ② 옷깃이나 여밈이 흐트러져 벌어지다."
  開く:
    "①閉じていたものがひらく。 ②活動を停止していたものが動き始める。": "① 닫혀 있던 것이 열리다. ② 활동을 멈추었던 것이 움직이기 시작하다."
    ? "①閉じていたものやふさがっていたものがあく。また、あける。見通せるようになる。 ②先がひろがる。ひらける。よくなる。 ③差が大きくなる。離れる。 ④開拓する。きりひらく。 ⑤始まる。始める。開催する。 ⑥花が咲く。 ⑦数学で、平方根・立方根などを求める。 ⑧体を引いて構える。"
    : "① 닫히거나 막혀 있던 것이 열리다. 또는 열다. 시야가 트이다. ② 앞이 넓어지다. 트이다. 좋아지다. ③ 차이가 커지다. 떨어지다. ④ 개척하다. 길을 열다. ⑤ 시작되다. 시작하다. 개최하다. ⑥ 꽃이 피다. ⑦ 제곱근이나 세제곱근 등을 구하다. ⑧ 몸을 뒤로 빼고 자세를 잡다."
  開ける:
    ? "[ 1 ] [ 文語形 ]あ・く 物事の、ある期間が終わって、次の新しい状態になる。① 夜が終わって朝になる。明るくなる。→あくる。② 時が経過して、年月日や季節があらたになる。次の年になる。→あけて・あくる。③ ある一定の拘束を伴う期間が終わりになる。満期になる。① へだてや、おおいなど、ふさいであるものを除く。閉じてあるものを開く。② そこを占めているものを取り除く。(イ) ふさいでいるものを除いたり、間を広げたりして空間や時間の間隔をつくる。「四時間以上あけて服用のこと」(ロ) 中に入っているものや人を外に出す。出してからにする。また、器の中のものを他に移す。(ハ) 外出して留守にする。(ニ) 隔てを置く。また、間隔を広げる。③ 使わないようにする。(イ) 仕事をしないでいられる時間をつくる。(ア)けてあるんです」〈谷崎潤一郎〉七)(ロ) 使わない状態のままにする。④ 商売、芝居などを始める。公開する。⑤ ( 心の中が見えるようにひらく意から ) 隠さないで話す。うちあける。(ア)けて云はぬが廓の花」序幕)⑥ ( 「らちをあける」の形で ) 物事がうまく行く方法などを見つける。⑦ 芸妓などが客席から帰る意の花柳界の語。"
    : "① 닫힌 것이 벌어져 열리다. 또는 가로막는 것이 없어지다. ② 일이 시작되거나 새롭게 일어나다. ③ 알 수 없던 일이 밝혀지다. ④ 좋은 상태가 되다. 번영하거나 운이 트이다. ⑤ 사물이 진보하다."
    着衣の合わせ目などが乱れて広がり開く。また、大きくあけ広げる。はだかる。: 옷깃이나 여밈이 흐트러져 벌어지다. 또는 크게 벌려 열다.
    ? "①しまっていたもの、ふさがっていたものがあく。よい方向に向かう。 ②邪魔がなくなる。見晴らしがきくようになる。 ③文化・文明が進み近代化する。開花する。 ④世情・人情に通じ、物わかりがよい。"
    : "① 닫히거나 막혀 있던 것이 열리다. 좋은 방향으로 향하다. ② 방해물이 없어져 전망이 좋아지다. ③ 문화와 문명이 발전해 근대화하다. ④ 세상 물정과 인정에 밝고 이해가 좋다."
  開花:
    "①草木の花が咲くこと。 ②物事が熟して盛んになること。成果が現れること。": "① 풀과 나무의 꽃이 핌. ② 일이 무르익어 성해짐. 성과가 나타남."
  開運:
    いい方向に運が開けること。幸運に向かうこと。: 운이 좋은 방향으로 트임. 행운으로 향함.
  開会:
    ? "① 会議、集会、議会などを始めること。また、展覧会、博覧会など催しの会を開くこと。⇔閉会。② 団体を組織し、発足させること。"
    : "① 회의, 집회, 의회 등을 시작하는 것. 또는 전람회나 박람회 등의 행사를 여는 것. ② 단체를 조직하여 발족시키는 것."
  開化:
    人々の知識が高まり文化が進み、社会が進歩すること。開明: 사람들의 지식이 높아지고 문화가 발달하여 사회가 진보하는 것. 개화.
  開巻有益:
    読書はたいへんためになるものだということ。「開巻」は書物を開くこと。転じて、読書。: 독서는 매우 유익하다는 뜻. 책을 펼치는 것이 곧 이롭다는 말.
  開架:
    ? 図書館の閲覧形式の一つ。書棚を閲覧者に開放し、自由に本を取り出して利用できるようにしたもの。接架閉架
    : 도서관 열람 방식의 하나. 서가를 열람자에게 개방해 자유롭게 책을 꺼내 이용할 수 있게 한 것. 개가.
  開眼:
    見えなかった目が見えるようになること。また、見えるようにすること。: 보이지 않던 눈이 보이게 되는 것. 또는 보이게 하는 것.
  開豁:
    "①広々とひらけて、眺めのよいようす。 ②心が広く、さっぱりしているようす。": "① 넓게 트여 전망이 좋은 모양. ② 마음이 넓고 시원스러운 모양."
院:
  医院:
    医師が病気の診察・治療を行う所。診療所。: 의사가 병의 진찰과 치료를 하는 곳. 진료소.
  院号:
    "①上皇や皇太后などに与えられた尊称。 ②戒名で「院」の字のあるもの。": "① 상황이나 황태후 등에게 주어진 존칭. ② 계명에 원 자가 들어간 것."
  参議院:
    ? 衆議院とともに国会を構成し、国民から選ばれた議員で組織する立法機関。予算の議決や条約の承認などで衆議院より権限が劣るが、国会審議を慎重なものにする機能をもつ。
    : "중의원과 함께 일본 국회를 구성하는 입법 기관. 국민이 선출한 의원으로 조직된다."
  妓院:
    遊女屋。遊郭の茶屋。妓楼・妓館・娼家(ショウカ): 유녀가 있는 집. 유곽의 찻집. 기루.
  寺院:
    "「寺(てら)」に同じ。": 절과 같음. 사원.
  朱雀院:
    ? 平安時代の離宮の一つ。嵯峨(さが)天皇以後の歴代天皇が譲位後に住んだ。京都市内の朱雀大路にあった。
    : "[지명] 헤이안 시대의 이궁 중 하나. 사가 천황 이후 역대 천황이 양위 뒤 거주했다."
  翰林院:
    ? "①中国で唐代に設けられた官庁の一つ。初め学士院といい、学者・文人に詔勅などを作らせた。翰苑(カンエン) ②「アカデミー」の訳語。学問・芸術において指導的な役割をする人の団体。"
    : "① 중국 당대에 설치된 관청의 하나. 학자와 문인에게 조칙 등을 짓게 했다. ② 아카데미의 번역어. 학문·예술에서 지도적 역할을 하는 사람들의 단체."
  衆議院:
    ? 現行憲法下で、参議院とともに日本の国会を構成し、国民によって選挙された議員で組織する立法機関。予算の議決・条約の承認などで参議院に優越する。議員の任期は四年で参議院にはない解散がある。衆院。
    : "현행 헌법 아래 참의원과 함께 일본 국회를 구성하는 입법 기관. 국민이 선출한 의원으로 조직된다."
  院参:
    院の御所へ参上すること。: 상왕이나 법황의 거처에 나아가는 것.
  院外団:
    国会議員以外の政党員で構成され、議会外で活動を行う集団。: 국회의원이 아닌 정당원으로 구성되어 의회 밖에서 활동하는 집단.
  院宣:
    院政で、上皇や法皇の命令を文書にしたもの。院の宣旨(センジ)。: 원정에서 상왕이나 법황의 명령을 문서로 만든 것.
  院政:
    ? "①上皇や法皇が天皇に代わって自分の御所（院）で政治を行ったこと。一○八六（応徳三）年白河上皇にはじまる。 ②現役を退いた人が陰で実権を握り、実際の指示を出すこと。"
    : "① 상왕이나 법황이 천황을 대신하여 자신의 거처에서 정치를 행한 것. ② 현역에서 물러난 사람이 뒤에서 실권을 잡고 지시하는 것."
  院長:
    院の称をつけた機関、法人、施設などの長。「病院長」をいう場合が多い。: 원이라는 명칭이 붙은 기관, 법인, 시설 등의 장. 주로 병원장을 이른다.
  麴院:
    酒をつくる所。酒坊。: 술을 만드는 곳. 주조장.
陽:
  山陽:
    "[ 1 ] 山の南側。": 산의 남쪽.
  紫陽花:
    ? ユキノシタ科の落葉低木。日本でガクアジサイを品種改良したもの。初夏、小花が半球状に集まって咲く。花の色は淡青色・青紫色・淡紅色と変わる。シチヘンゲ。ヨヒラ。 夏
    : "[생물] 범의귀과의 낙엽 관목. 일본에서 산수국을 품종 개량한 것으로, 초여름에 작은 꽃이 반구 모양으로 모여 핀다."
  陽:
    "①太陽。 ②日光。太陽の光線。ひざし。": "① 태양. ② 햇빛. 태양의 광선."
  陽極:
    ? 電池など電流を発生する装置で、相対する二極のうち電位の高いほうの極。正極。プラス。陰極
    : "전지 등 전류를 발생시키는 장치에서 마주 보는 두 극 중 전위가 높은 쪽의 극. 양극. 플러스."
  陽気:
    ? "①天気。気候。 ②性格や雰囲気が快活で、明るいさま。にぎやかなさま。 ③万物を活動させる力。 ②③陰気"
    : "① 날씨. 기후. ② 성격이나 분위기가 쾌활하고 밝은 모양. 떠들썩한 모양. ③ 만물을 활동하게 하는 힘."
  陽炎:
    "①明け方、東の空にちらちら光る日の光。曙光(ショコウ)。 ②「陽炎(かげろう)」に同じ。": "① 새벽 동쪽 하늘에 반짝이는 햇빛. 서광. ② 아지랑이."
    ? 春や夏、日光に熱せられた地面から空気が炎のようにゆらゆらと立ちのぼる現象。糸遊(いとユウ)・遊糸(ユウシ) 春
    : 봄이나 여름, 햇볕에 데워진 지면에서 공기가 불꽃처럼 아른거리며 피어오르는 현상. 아지랑이.
  陽光:
    太陽の光線。日光。: 태양의 빛. 햇빛.
  陽動:
    ? 敵の注意をそらすために、わざと目立つように本来の目的とは違った動きをすること。〔五国対照兵語字書（1881）〕
    : 적의 주의를 돌리기 위해 일부러 눈에 띄게 본래 목적과 다른 움직임을 하는 것. 양동.
  陽射し:
    日光がさすこと。また、その光線。: 햇빛이 비치는 것. 또는 그 빛.
  陽春:
    "①うららかな春。暖かくなり、草木が芽ぐむ春。盛春。 春 ②陰暦一月の異名。": "① 화창한 봄. 따뜻해져 초목이 싹트는 봄. ② 음력 정월의 별명."
  陽狂:
    発狂したふりをすること。また、その人。: 미친 척하는 것. 또는 그런 사람.
  陽画:
    ? 陰画をとおして感光紙に焼き付けた写真。被写体と明暗や色彩などがそのまま現れる。ポジティブ。ポジ。陰画
    : 음화를 통해 감광지에 인화한 사진. 피사체의 명암이나 색채가 그대로 나타나는 양화. 포지티브.
  陽関三畳:
    ? 別れの歌、「陽関の曲」の第四句を三度反復してうたうこと。一説に、第二句以下の三句を二度繰り返してうたうこと。別れを繰り返し惜しむことにもいう。「畳」は繰り返す意。
    : 이별 노래인 「양관곡」을 반복해 부르는 것. 이별을 거듭 아쉬워한다는 뜻으로도 쓴다.
階:
  位階:
    ? 国家に功績のあった人に与えられる栄典の一種。一位から八位まであり、それぞれに正と従がある。官位
    : "국가에 공적이 있는 사람에게 주어지는 영전의 한 종류."
  階:
    上り降りするためにつくった段。階段。だんだん。きだはし。: 오르내리기 위해 만든 단. 계단.
    等分にわけたものや重ねたものの一つ一つ。等級。: 등분한 것 또는 겹친 것의 하나하나. 등급.
  階前:
    階段の前。また、庭先。庭前。: 계단 앞. 또는 뜰 앞.
  階段:
    ? "①建物のちがう階に行くための、段になった通路。階梯(カイテイ) ②一定の順序に沿って進む過程・等級。"
    : "① 건물의 다른 층으로 가기 위한 단 모양 통로. ② 일정한 순서에 따라 나아가는 과정이나 등급."
  地階:
    建造物で地下にある階。: 건축물에서 지하에 있는 층. 지하층.
  沿階草:
    ユリ科の多年草。: "[생물] 백합과의 여러해살이풀."
  越階:
    位階をとび越えて昇進すること。越任(オツニン)。: 위계를 뛰어넘어 승진하는 것.
  階位:
    ? "① 階級。位階。〔布令必用新撰字引（1869）〕② 仏語。発心してから悟りを得るまでの修行の階程。菩薩の五十二位、声聞の四向四果など。"
    : "① 계급. 위계. ② [불교] 발심에서 깨달음에 이르기까지의 수행 단계."
  階前万里:
    ? 遠くのことが手近にあるかのように分かること。天子が地方の政治状況を宮殿の階段の前にあるかのようによく知っていて、臣下は天子を欺くことができないこと。〈『新唐書(シントウジョ)』〉
    : 먼 곳의 일도 가까이 있는 것처럼 훤히 아는 것.
  階層:
    ? "①建物の上下の重なり。 ②社会の構成員を地位・財産・職業などで分類した場合のそれぞれの集団。階級"
    : "① 건물의 위아래 겹침. 층. ② 사회 구성원을 지위, 재산, 직업 등으로 분류했을 때의 각 집단. 계층."
  階梯:
    "①階段。はしご。 ②学問・芸術などを学ぶための順序。特に、初歩の段階。手引き。": "① 계단. 사다리. ② 학문이나 예술 등을 배우기 위한 순서. 특히 초보 단계의 안내."
  階級:
    "①地位・身分などの等級・段階。 ②社会における家柄・身分・財産などが同じ集団。階層": "① 지위나 신분 등의 등급·단계. ② 사회에서 가문, 신분, 재산 등이 같은 집단. 계층."
  音階:
    音楽に用いる音を一定の音程で高さの順に並べたもの。ドレミの類。: 음악에 쓰는 음을 일정한 음정으로 높이 순서에 따라 배열한 것. 음계.
集:
  五十集:
    ? "①魚商人。また、魚市場や海産物を売買する店。 ②江戸時代、海産物を運搬した小型の船。いさばぶね。"
    : "① 생선 장수. 또는 어시장이나 해산물을 사고파는 가게. ② 에도 시대에 해산물을 운반한 작은 배."
  集う:
    一か所に寄り合う。集合する。: 한곳에 모이다. 집합하다.
  集く:
    虫などが群がって鳴く。: 벌레 등이 떼 지어 울다.
  集まる:
    ? "① 多くの物や人が一箇所に寄り合う。集中する。むらがる。② 複数の人からの精神的な活動が、人や物事に寄せられる。"
    : "① 많은 물건이나 사람이 한곳에 모이다. 집중하다. ② 여러 사람의 정신적 활동이 사람이나 사물에 쏠리다."
  集める:
    ばらばらに散らばっている人や物を一か所に寄せる。: 흩어져 있는 사람이나 물건을 한곳으로 모으다.
  集る:
    ? "①人が大勢寄り集まる。 ②虫が群がる。 ③人をおどして金品を奪う。また、知人や先輩などにおごらせる。"
    : "① 사람이 많이 모여들다. ② 벌레가 떼 지어 모이다. ③ 사람을 위협해 금품을 빼앗다. 또는 지인이나 선배 등에게 얻어먹다."
  画集:
    絵を集めて一冊の本にしたもの。また、絵を複製印刷し、本に仕立てたもの。: 그림을 모아 한 권의 책으로 만든 것. 또는 그림을 복제 인쇄해 책으로 꾸민 것.
  集会:
    "①多くの人が集まること。また、その集まり。 ②衆徒が会合すること。": "① 많은 사람이 모이는 것. 또는 그 모임. ② 무리가 회합하는 것."
  集合:
    ? "①一か所に寄り合うこと。 解散 ②数学で、一定の条件・範囲にあてはまるものを一つの全体と見なしたもの。"
    : "① 한곳에 모이는 것. ② 일정한 조건이나 범위에 맞는 것을 하나의 전체로 본 것. 집합."
  集散:
    集まることと散らばること。: 모이는 것과 흩어지는 것.
  集結:
    一か所に集めること。また、集まること。 結集: 한곳에 모으는 것. 또는 모이는 것. 집결.
  集荷:
    商品などの荷物を一か所に集めること。また、その荷物。 「蒐荷」の書きかえ字。: 상품 등의 짐을 한곳에 모으는 것. 또는 그 짐.
  集計:
    数値を集めて合計すること。また、その数。: 수치를 모아 합산하는 것. 또는 그 수.
  集魚灯:
    ? 夜、魚が光に集まってくる習性を利用して、漁をするとき海上や海中にともす明かり。いさり火。
    : 밤에 물고기가 빛에 모이는 습성을 이용하여, 고기잡이할 때 바다 위나 물속에 켜는 등불.
面:
  仮面:
    さまざまなものの顔をかたどって作り、顔につけるもの。: 여러 가지 얼굴 모양을 본떠 만들어 얼굴에 쓰는 것. 가면.
  真面目:
    ? "①本気であること。真剣なさま。 不真面目・出鱈目(でたらめ) ②まごころがあること。誠実なさま。"
    : "① 진지함. 진심인 모양. ② 성의가 있음. 성실한 모양."
  面:
    ? "[ 1 ] ① 顔。人の顔。② 顔につけるかぶりもの。(イ) 特定人物の顔をかたどったもの。伎楽や能楽などで用いられ、多く木製。(ロ) 仮装に用いる紙などで作った仮面。(ハ) 剣道や野球などの武術・スポーツで顔をおおう防具をいう。また、剣道では頭部に打撃を加えることもいう。③ 物の外側の、ほぼ平らな、一定の広さを持つ部分をさしていう。(イ) 表面。物のおもてまたは外側。〔工学字彙（1886）〕(ロ) 数学で、広がりはあるが厚みはない図形のこと。平面と曲面。〔数学ニ用ヰル辞ノ英和対訳字書（1889）〕(ハ) 建築上の用語で、角材の稜角を削って作る部分をさしていう。柱や天井の桟、格縁(ごうぶち)などに用い、「切り面」「几帳面」「唐戸(からど)面」などの区別がある。→面を取る。④ ( 形動 ) 顔を合わせること。面接、面会すること。⑤ 紙に書かれた文章。また、その内容。⑥ ( 「この面」「他の面」などの形で ) 事柄や事態の、ある部分・方向をさしていう。方面。⑦ 朝鮮の郡県の下にある自治的共同体の組織。① 鏡を数えるのに用いる。② 琵琶などの楽器を数えるのに用いる。③ 硯(すずり)を数えるのに用いる。④ 能面・仮面などを数えるのに用いる。⑤ 碁盤などを数えるのに用いる。⑥ 盆を数えるのに用いる。⑦ 複数の紙を継ぎ合わせたものなどを数えるのに用いる。⑧ 書画などを収めた額を数えるのに用いる。⑨ カルタの一組が描かれたものを数えるのに用いる。⑩ テニスやバレーボールのコートを数えるのに用いる。"
    : "① 얼굴. 사람의 얼굴. ② 얼굴에 쓰는 덮개. 가면이나 보호구. ③ 물건 바깥쪽의 거의 평평한 부분. 표면. ④ 넓이는 있지만 두께가 없는 도형. ⑤ 각재의 모서리를 깎아 만든 부분. ⑥ 얼굴을 맞댐. 면접이나 면회. ⑦ 종이에 적힌 글이나 그 내용. ⑧ 사물이나 사태의 어떤 부분이나 방향. 방면. ⑨ 조선의 군현 아래에 있던 자치 공동체 조직. ⑩ 거울, 악기, 벼루, 가면, 바둑판, 쟁반, 종이, 액자, 카드, 코트 등을 세는 말."
    "①顔。 ②能面。仮面。 ③表面。": "① 얼굴. ② 노가면. 가면. ③ 표면."
    "①顔。 ②物の表面。 ③面目。": "① 얼굴. ② 물건의 표면. ③ 체면."
  九面芋:
    サトイモの一品種。親芋を中心に小芋がたくさんできて大きな塊となる。茎と芋は食用。秋: "[생물] 토란의 한 품종. 어미 토란을 중심으로 작은 토란이 많이 생겨 큰 덩어리가 된다."
  圧面:
    ? 能面の一つ。下あごが大きく張り、上下の唇を強く食いしばり、目をむいた形相の面。天狗(テング)や鬼神・鬼畜に扮(フン)するときに用いる。
    : 노가면의 하나. 아래턱이 크게 벌어지고 입술을 굳게 다문 험한 표정의 가면.
  地面:
    "① 土地の表面。平地の面。地上。地表。じべた。② 土地。地所。宅地。": "① 땅의 표면. 지면. ② 토지. 대지."
  正面:
    "①まっすぐ向かい合うこと。ましょうめん。 ②きちんとして正常なこと。まじめ。": "① 똑바로 마주 보는 것. 정면. ② 바르고 정상적인 것. 성실함."
  真面:
    "①まっすぐに向かい合うこと。 ②正しく、きちんとしていること。まじめ。": "① 똑바로 마주 보는 것. ② 바르고 단정한 것. 성실함."
  紙面:
    ? "① 紙のおもて。紙の表面。〔色葉字類抄（1177‐81）〕② 紙に書いた文書、手紙の類。書面。また、その文面。③ 新聞などの記事の載っている面。また、その記事。紙上。"
    : "① 종이의 표면. ② 종이에 쓴 문서나 편지. ③ 신문 등의 기사가 실린 면. 또는 그 기사."
  面相:
    人の顔つき。顔かたち。人相: 사람의 얼굴 생김새. 인상.
  面談:
    直接会って話をすること。: 직접 만나 이야기하는 것. 면담.
  酒頰・酒面:
    酒を飲んで赤くなった顔。また、酒を飲んだように赤い顔。: 술을 마셔 붉어진 얼굴. 또는 술을 마신 듯 붉은 얼굴.
  出面・出頰:
    "①顔出しすること。 ②日雇い労働者の日給。": "① 얼굴을 내미는 것. 참석하거나 모습을 보이는 것. ② 일용 노동자의 하루 품삯."
題:
  課題:
    "①問題を課すること。また、その問題。 ②解決しなくてはならない問題。 ③任務。": "① 문제를 부과함. 또는 그 문제. ② 해결해야 할 문제. ③ 임무."
  題材:
    芸術作品や学問研究などの主題や内容のもととなる材料。: 예술 작품이나 학문 연구 등의 주제와 내용의 바탕이 되는 재료.
  品題:
    経の内容を章や編に分けたもの。経の題目。: 경전의 내용을 장이나 편으로 나눈 것. 경전의 제목.
  問題:
    ? "①解答を必要とする問い。 ②解決すべき事柄。また、やっかいな事柄や争いの原因になるような事件。 ③人の注目を集めていること。論争やうわさを引き起こしている事柄。話題"
    : "① 해답이 필요한 물음. ② 해결해야 할 일. 또는 성가신 일이나 다툼의 원인이 되는 사건. ③ 사람들의 주목을 끄는 일. 화제."
  演題:
    演説や講演などの題目。: 연설이나 강연 등의 제목.
  解題:
    "①問題を解くこと。 ②書物の成立年代・著者・内容などについて解説すること。": "① 문제를 푸는 것. ② 책의 성립 연대, 저자, 내용 등을 해설하는 것."
  題名:
    題目の名。特に書物・詩文などの標題をいう。: 제목의 이름. 특히 책이나 시문 등의 표제.
  題字:
    書物や画幅、石碑などの上に題として記す文字。: 책, 그림, 비석 등에 제목으로 적는 글자.
  題画:
    絵に詩や文を書き加えたもの。また、詩や文の内容を表現した絵。: 그림에 시나 글을 덧쓴 것. 또는 시나 글의 내용을 표현한 그림.
  題目:
    ? "①書物や文章などの題名。表題。タイトル。 ②研究や討論などにおける問題点。主題。テーマ。 ③日蓮(にちれん)宗で唱える「南無妙法蓮華経(ナムミョウホウレンゲキョウ)」の七字。おだいもく。"
    : "① 책이나 글 등의 제목. 표제. ② 연구나 토론 등의 문제점. 주제. ③ [불교] 일련종에서 외는 「남묘호렌게쿄」 일곱 글자."
  題簽:
    和漢書などで、題名を書いて表紙にはる細長い紙や布。また、その題字や題名。: 일본·중국식 책 등에서 제목을 써 표지에 붙이는 길고 좁은 종이나 천. 또는 그 제목 글자.
  題詠:
    与えられた題から詩歌・俳句をよむこと。また、その詩歌・俳句。雑詠: 주어진 제목으로 시가나 하이쿠를 짓는 것. 또는 그 작품.
  題跋:
    書物・書画などの題辞と跋文(バツブン)。序文とあと書き。: 책이나 서화 등의 제사와 발문. 서문과 후기.
  題辞:
    書物の巻頭や画幅、石碑などの初めに記す言葉。題詞。題言。: 책의 첫머리나 그림, 비석 등의 처음에 적는 말. 제사.
飲:
  溜飲:
    消化不良のため飲食物が胃の中にたまり、胸やけがしたり、すっぱい液が出たりすること。: "소화불량 때문에 음식물이 위에 고여 속쓰림이 나거나 신물이 올라오는 일."
  飲ます:
    飲むようにする。飲ませる。また、酒食をごちそうする。: 마시게 하다. 또는 술과 음식을 대접하다.
  飲む:
    液体をのどに通す。特に、酒を口にする。: 액체를 목으로 넘기다. 특히 술을 마시다.
  飲料:
    飲むためのもの。飲み物。: 마시기 위한 것. 음료.
  飲酒:
    酒を飲むこと。: 술을 마심.
  痛飲:
    大いに酒を飲むこと。: 술을 실컷 마시는 것.
  長夜の飲:
    夜明けまで続けられるぜいたくな酒宴のこと。: 새벽까지 계속되는 호화로운 술잔치.
  飲水思源:
    ? 物事の基本を忘れてはならないたとえ。また、人から受けた恩を忘れてはいけないという戒め。水を飲むとき、その水源のことを思う意から。飲水懐源得魚忘筌(トクギョボウセン)
    : 사물의 근본을 잊어서는 안 된다는 비유. 또는 받은 은혜를 잊지 말라는 교훈.
  飲河満腹:
    ? 人にはそれぞれ分があり、分に応じて満足すべきことをいう。モグラが大河の水を飲んでも、小さな腹を満たしただけで満足するという意から。〈『荘子(ソウジ)』〉飲河の願い・偃鼠飲河(エンソインガ)
    : 사람에게는 각자 분수가 있어 그 분수에 맞게 만족해야 한다는 뜻.
  飲泣:
    ? 涙が流れ伝わって口にはいること。転じて、声を立てずに泣くこと。すすり泣き。しのび泣き。
    : 눈물이 흘러 입에 들어가는 것. 나아가 소리 내지 않고 우는 것. 흐느낌.
  飲灰洗胃:
    心の奥底から改心すること。灰を飲んで胃の中の汚れを洗い清める意から。: 마음속 깊은 곳에서부터 뉘우치고 고치는 것.
  飲至策勲:
    ? 勝ち戦のあと、祖先の廟(ビョウ)の前で報告し、祝杯をあげ、戦功を竹の札（策）に書き記すこと。〈『春秋左氏伝』〉
    : 승전 뒤 조상의 묘 앞에 보고하고 축배를 들며 전공을 기록하는 것.
  飲食:
    飲むことと食べること。また、食べ物と飲み物。: 마시는 것과 먹는 것. 또는 음식과 음료.
館:
  館:
    "①貴族や役人の宿舎または邸宅。 ②小さい城。": "① 귀족이나 관리의 숙소 또는 저택. ② 작은 성."
    ? "① 貴人、官吏などの宿泊する官舎。官邸。② 貴人の邸宅。やかた。③ 貴人を敬っていう語。やかた。④ 外敵を防ぐのに適当な地形などを利用して造った小規模のとりでや住居。小さな城。たて。"
    : "① 귀인이나 관리 등이 숙박하는 관사. 관저. ② 귀인의 저택. ③ 귀인을 공경해 이르는 말. ④ 외적을 막기 좋은 지형 등을 이용해 만든 소규모 요새나 주거. 작은 성."
    "①貴族・豪族などの住居。屋敷。 ②貴人や中世の大名の敬称。": "① 귀족이나 호족 등의 주거. 저택. ② 귀인이나 중세 다이묘의 경칭."
  公館:
    官庁の建物。特に、大使館・公使館・領事館など。: 관청의 건물. 특히 대사관, 공사관, 영사관 등.
  博物館:
    ? 歴史・芸術・民俗・科学などの資料を広く集めて保管・整理し、陳列して一般に公開する施設。
    : 역사, 예술, 민속, 과학 등의 자료를 널리 모아 보관·정리하고 전시하여 일반에 공개하는 시설. 박물관.
  帰館:
    やかたに戻ること。また、わが家に戻ること。帰宅: 관저나 집으로 돌아가는 것. 귀가.
  捐館:
    身分の高い人の死。: 신분이 높은 사람의 죽음.
  旅館:
    ? 人を宿泊させることを業とする家。また、旅先で泊まる家。やどや。はたごや。旅舎。旅宿。旅亭。旅店。
    : 사람을 숙박시키는 일을 업으로 하는 집. 또는 여행지에서 묵는 집. 여관.
  館第:
    ? やしき。〔唐書、韓滉伝〕石頭の五をく。～第數十を石頭に置き、井をつこと皆百尺なり。字通「館」の項目を見る。
    : 저택.
  館長:
    公民館、図書館、博物館など館と称する機関の長。: 공민관, 도서관, 박물관 등 관이라 부르는 기관의 장.
  鴻臚館:
    古代、北九州の筑紫(つくし)や平安京などに設けた、外国使節を応接する施設。: 고대에 북규슈의 쓰쿠시나 헤이안쿄 등에 설치한 외국 사절 접대 시설.
駅:
  駅:
    ? 昔、街道に沿って三〇里（一六(キロメートル)）ごとに置かれた施設。ウマや人夫をそろえて旅人の便をはかった。宿場
    : "옛날 가도를 따라 일정한 간격으로 둔 시설. 말과 인부를 갖추어 여행자의 편의를 도왔다."
  駅逓:
    ? "①宿駅から宿駅へ荷物などを輸送すること。うまつぎ。宿継(シュクつぎ)・駅伝 ②郵便の旧名。"
    : "① 역참에서 역참으로 짐 등을 운송함. 말 갈아타기. ② 우편의 옛 이름."
  駅馬:
    昔、役人が公用で旅をするとき、乗り継ぎのために各駅に用意された早馬(はやうま)。: "옛날 관리가 공무로 여행할 때 갈아타도록 각 역에 준비해 둔 빠른 말."
  宿駅:
    ? 昔、交通の要所にあって旅客の宿泊やウマ・駕籠(かご)などを乗り換える設備のあった所。宿場。
    : 옛날 교통 요지에 있어 여행객 숙박과 말·가마 교체 시설을 갖춘 곳. 역참.
  駅亭:
    "①街道にあった宿駅の建物。駅舍 ②近世の宿場のやど。旅館。": "① 가도에 있던 역참의 건물. ② 근세 숙장의 여관."
  駅伝:
    ? "①「駅伝競走」の略。長い道のりを数区間に分け、各チームが一人一区間ずつを走り、総所要時間を競う競技。 ②「駅逓①」に同じ。 ③昔、宿場間で乗り継ぎに使ったウマ。"
    : "① 긴 거리를 여러 구간으로 나누어 각 팀이 한 사람씩 한 구간을 달려 총 시간을 겨루는 경기. 역전. ② 옛 역참 제도. ③ 옛날 숙장 사이에서 갈아타던 말."
  駅員:
    鉄道の駅の従業員。: 철도역의 직원. 역무원.
  駅舎:
    "①鉄道で、駅の建物。 ②「駅亭」に同じ。": "① 철도역의 건물. 역사. ② 역정과 같음."
  駱駅:
    人馬の往来が絶え間なく続くさま。: 사람과 말의 왕래가 끊임없이 이어지는 모양.
鼻:
  犢鼻褌:
    男性が陰部をおおうのに用いる布。したおび。ふどし。: "남성이 음부를 가리는 데 쓰는 천. 훈도시."
  鼻:
    ? 哺乳(ホニュウ)類の顔の中央にある器官で、呼吸やにおいを感じ取るはたらきをし、発声を助ける。また、広く動物の嗅覚(キュウカク)をつかさどる部分。
    : "포유류 얼굴 중앙에 있는 기관으로, 호흡하고 냄새를 맡으며 발성을 돕는다. 넓게는 동물의 후각을 맡는 부분."
  鼻孔:
    鼻の穴。: 콧구멍.
  鼻息:
    "①鼻でする息。 ②人の意気込み。": "① 코로 쉬는 숨. ② 사람의 의욕이나 기세."
  鼻薬:
    ? "①鼻の病気に使用する薬。 ②少額の賄賂(ワイロ)。 ③子どもをなだめるために与える菓子の類。"
    : "① 코 질환에 쓰는 약. ② 적은 액수의 뇌물. ③ 아이를 달래기 위해 주는 과자 따위."
  鼻っ柱:
    人と張り合う気持ち。負けん気。向こう気。はなっぱし。はなばしら。: 남과 맞서려는 기질. 지기 싫어하는 마음.
  鼻元思案:
    目先だけの浅はかな考え。思いつき。: 눈앞의 일만 보는 얕은 생각. 즉흥적인 생각.
  鼻摘み:
    まわりの人からひどく嫌われること。また、その人。: 주변 사람들에게 몹시 미움을 받는 것. 또는 그런 사람.
  鼻白む:
    気おくれした顔つきや興ざめした顔つきをする。: 주눅 든 표정이나 흥이 깨진 표정을 짓다.
  鼻祖:
    物事を最初に始めた人。始祖。元祖。〈『漢書(カンジョ)』〉: 어떤 일을 처음 시작한 사람. 시조. 원조.
  鼻緒:
    下駄(ゲタ)や草履などのはき物の、足の指をかける部分。また、そのひも。: 게타나 짚신 등 신발에서 발가락을 걸치는 부분. 또는 그 끈.
  鼻茸:
    鼻の穴に、粘膜の炎症によりできるはれもの。: 코 안에 점막 염증으로 생기는 종기. 비용.
斜:
  斜:
    「斜め」に同じ。: 비스듬함. 「斜め」와 같음.
  斜め:
    "①基準となる面や方向に対してずれているさま。傾いているさま。はす。はすかい。 ②ふつうでないさま。": "① 기준이 되는 면이나 방향에서 비껴 있는 모양. 기울어진 모양. 비스듬함. ② 보통과 다른 모양."
  斜交い:
    「斜め」に同じ。また、ななめに交わること。: 비스듬함. 또는 비스듬히 교차하는 것.
  斜子:
    "①彫金技法の一つ。金属面に魚の卵のような小さな粒を刻んだもの。 ②「斜子織り」の略。": "① 금속공예 기법의 하나. 금속 표면에 물고기 알 같은 작은 알갱이를 새긴 것. ② 「斜子織り」의 준말."
  斜子織り:
    平織りの絹織物の一種。織り目が細かくななめに並び魚の卵のように粒だったもの。ななこ。: 평직 견직물의 한 종류. 올이 잘게 비스듬히 늘어서 물고기 알처럼 알갱이져 보이는 것. 나나코.
  斜視:
    眼筋の障害などにより、ものを見るとき、片方の視線が目標に正しく向かない状態。やぶにらみ。: 안근 장애 등으로 사물을 볼 때 한쪽 시선이 목표를 정확히 향하지 않는 상태. 사시.
  斜頸:
    くびの筋・神経・関節などの異常によりくびが一方に傾く病状。先天性のものが多い。: 목의 근육·신경·관절 등의 이상으로 목이 한쪽으로 기우는 병증. 선천성인 것이 많다.
  斜陽:
    "①日没近くの傾いた太陽。夕日。 ②勢いのあったものが没落すること。": "① 해질 무렵 기울어진 태양. 석양. ② 한때 세력이 있던 것이 몰락하는 것."
  狭斜:
    花柳街。遊里。いろまち。: 화류계. 유곽. 색주가.
  傾斜:
    傾いてななめになること。かたむき具合。: 기울어져 비스듬하게 되는 것. 기울어진 정도.
茅:
  茅茨:
    かやといばら。また、屋根をそれでふいた質素な家。: 띠풀과 가시나무. 또는 그것으로 지붕을 인 소박한 집.
  白茅:
    イネ科の多年草。 茅萱(ちがや): "[생물] 벼과의 여러해살이풀. 띠."
  茅:
    屋根をふく材料にする草の総称。イネ科のチガヤ・ススキ・アシ、カヤツリグサ科のカサスゲなど。: 지붕을 이는 재료로 쓰는 풀의 총칭. 벼과의 띠·억새·갈대, 사초과의 삿갓사초 등.
    イボタケ科のキノコ。 革茸(こうたけ): "[생물] 사마귀버섯과의 버섯. 코타케."
  茅萱・茅:
    イネ科の多年草。原野に群生。葉は広線形。春、絹のような光沢のある白毛をつけた花穂をつける。茎葉は屋根をふくのに用いる。根茎は消炎剤・浄血剤などに用いる。: "[생물] 벼과의 여러해살이풀. 들판에 무리 지어 자라며 잎은 넓은 선 모양이다. 봄에 비단 같은 광택이 있는 흰 털 달린 꽃이삭을 낸다. 줄기와 잎은 지붕을 이는 데 쓰고, 뿌리줄기는 소염제·정혈제 등으로 쓴다."
  青茅:
    イネ科の多年草。 刈安(かりやす): "[생물] 벼과의 여러해살이풀. 카리야스."
  茅生:
    チガヤの生えている所。: 띠풀이 자라는 곳.
  茅花:
    チガヤの花穂。春、小花をつけたあと白い穂になる。若いうちは食用になる。: 띠풀의 꽃이삭. 봄에 작은 꽃이 핀 뒤 흰 이삭이 된다. 어릴 때는 식용한다.
  茅蜩:
    セミ科の昆虫。 蜩(ひぐらし): "[생물] 매미과 곤충. 쓰르라미."
  茅潜:
    イワヒバリ科の小鳥。日本特産種。高山のハイマツ帯で繁殖し、冬は本州以南の低地に移動。全身はほぼ褐色で地味。鈴のような美しい声で鳴く。: "[생물] 바위종다리과의 작은 새. 일본 고유종. 고산의 눈잣나무 지대에서 번식하고 겨울에는 혼슈 이남 저지대로 이동한다. 온몸은 대체로 갈색으로 수수하며, 방울 같은 아름다운 소리로 운다."
  茅葺き:
    かやで屋根をふくこと。また、その屋根。: 띠풀로 지붕을 이는 것. 또는 그런 지붕.
  茅屋:
    ①かやでふいた屋根。また、その家。: ① 띠풀로 인 지붕. 또는 그런 집.
葺:
  葺く:
    屋根を、瓦(かわら)・板・茅(かや)などでおおうこと。: 지붕을 기와·널빤지·띠풀 등으로 덮는 것. 지붕을 이는 것.
  瓦葺き:
    かわらで屋根をふくこと。また、その屋根。: 기와로 지붕을 이는 것. 또는 그런 지붕.
  藁葺き:
    わらで屋根をふくこと。また、その屋根。: 짚으로 지붕을 이는 것. 또는 그런 지붕.
  草葺き:
    茅(かや)・藁(わら)などで屋根をふくこと。また、その屋根。: 띠풀·짚 등으로 지붕을 이는 것. 또는 그런 지붕.
  板葺き:
    板で屋根をふくこと。また、その屋根。: 널빤지로 지붕을 이는 것. 또는 그런 지붕.
  茅葺き:
    かやで屋根をふくこと。また、その屋根。: 띠풀로 지붕을 이는 것. 또는 그런 지붕.
啼:
  啼泣:
    声をあげて泣くこと。: 소리를 내어 우는 것.
  啼く:
    "①涙を流し、声をあげて泣き叫ぶ。 ②鳥や獣などが声を発する。": "① 눈물을 흘리며 소리 내어 울부짖다. ② 새나 짐승 등이 소리를 내다."
  啼哭:
    大きな声をあげて泣き叫ぶこと。: 큰 소리로 울부짖는 것.
  啼鳥:
    "① 鳴く鳥。さえずる鳥。② 鳴き声で他の鳥をおびき寄せるおとりの鳥。": "① 우는 새. 지저귀는 새. ② 울음소리로 다른 새를 유인하는 미끼새."
耨:
  耨耕:
    手すきで田畑の雑草を除き、耕すこと。: 손괭이로 논밭의 잡초를 없애고 갈아엎는 것.
  耨: 괭이. 풀을 베거나 김매는 데 쓰는 농기구.
  馬耨器: 말에 끌게 하여 제초하거나 흙덩이를 부수는 데 쓰는 농기구. 말괭이.
井:
  市井:
    人家が集まっている所。まち。俗世間。: 민가가 모여 있는 곳. 마을. 세속 사회.
  井井:
    物事が整って秩序あるさま。区画の正しいさま。: 사물이 반듯하게 정돈되어 질서 있는 모양. 구획이 바른 모양.
  井:
    いど。地中を流れる地下水をくみ取るための設備。: 우물. 땅속을 흐르는 지하수를 길어 올리기 위한 설비.
  井桁:
    "①井戸の縁を、木で「井」の形に組んだもの。 ②①の形や、それを図案化した模様。": "① 우물 가장자리에 나무를 우물 정자 모양으로 짜 맞춘 것. ② 그 모양이나 그것을 도안화한 무늬."
  井筒:
    "①井戸の地上の部分の周りに木や石で造った囲い。井戸側(がわ)。 ②①をかたどった模様。": "① 우물의 지상 부분 둘레에 나무나 돌로 만든 둘레. 우물테. ② 그것을 본뜬 무늬."
  井守:
    イモリ科の両生類。日本特産で、池や井戸にすむ。形はトカゲに似る。体は黒褐色で腹は赤い。アカハラ。: "[생물] 영원과의 양서류. 일본 고유종으로 연못이나 우물에 산다. 도마뱀과 비슷하며 몸은 흑갈색이고 배는 붉다."
  井然:
    "①秩序正しく整っているさま。 ②区画がきちんとしているさま。": "① 질서정연하게 정돈된 모양. ② 구획이 반듯한 모양."
  井目:
    "①碁盤の線上にしるした九つの黒い点。 ②囲碁で、ハンディをつけるため下手(したて)が①に石を一つずつ置き、上手(うわて)から打ち始めること。また、その対局。": "① 바둑판 선 위에 표시한 아홉 개의 검은 점. 화점. ② 바둑에서 접바둑을 둘 때 하수가 그 점들에 돌을 하나씩 놓고 상수가 이어 두기 시작하는 것. 또는 그런 대국."
  雲居・雲井:
    "①雲のあるあたり。転じて、空または遠い所や高い所。 ②雲。 ③禁中。宮中。": "① 구름이 있는 근처. 나아가 하늘이나 멀고 높은 곳. ② 구름. ③ 궁중."
  格天井:
    格子のように桟(サン)を組んで、板をはった天井。: 격자 모양으로 살을 짜고 판자를 댄 천장.
  鑿井:
    "①井戸を掘ること。 ②石油や温泉などを得るため、地中に深い穴を掘ること。ボーリング。": "① 우물을 파는 것. ② 석유나 온천 등을 얻기 위해 땅속 깊이 구멍을 파는 것. 보링."
  青天井:
    "①空を天井に見立てた語で、青々とした空。 ②物の値段や数量などが、どこまでも上がり続けること。": "① 하늘을 천장에 빗댄 말로, 푸른 하늘. ② 물건의 가격이나 수량 등이 끝없이 계속 오르는 것."
  井底:
    井戸の底。狭い世界をたとえてもいう。: 우물 바닥. 좁은 세계를 비유하여 이르기도 한다.
欠:
  欠落:
    抜けおちること。あるべきものが、欠けていること。: 빠져 떨어지는 것. 있어야 할 것이 결여되어 있는 것.
  欠伸・欠:
    疲労・眠気・退屈などのときに、自然に口が大きく開く深呼吸の一種。: 피로·졸음·무료함 등을 느낄 때 저절로 입이 크게 벌어지는 깊은 호흡의 일종. 하품.
  欠ける:
    "①一部がこわれてなくなる。 ②完全な形でなくなる。そろわなくなる。 ③足りない。": "① 일부가 부서져 없어지다. ② 완전한 형태가 아니게 되다. 갖추어지지 않다. ③ 모자라다."
  欠唇:
    生まれつき上くちびるがウサギの口のように縦に裂けていること。みつくち。口唇裂(コウシンレツ)。: "선천적으로 윗입술이 세로로 갈라져 있는 것. 구순열."
  欠片:
    "①物の欠けた部分。断片。 ②ほんの少しのもののたとえ。": "① 물건의 깨진 조각. 단편. ② 아주 조금인 것을 비유하는 말."
  欠餅:
    "①鏡餅を小さくくだいたもの。 ②餅を薄く切って干したもの。": "① 가가미모치를 작게 부순 것. ② 떡을 얇게 썰어 말린 것."
  欠米:
    近世、年貢米の輸送時に足りなくなった米を補充するために徴収された米。: "근세에 연공미 운송 중 부족해진 쌀을 보충하기 위해 징수한 쌀."
  欠員:
    定員に空きがあること。また、そのたりない人数。: 정원에 빈자리가 있는 것. 또는 그 부족한 인원.
  欠盈:
    月が欠けることと満ちること。月のみちかけ。: 달이 이지러지는 것과 차는 것. 달의 차고 기움.
  欠陥:
    欠けていること。機能・構造などの不備な点。: 결여되어 있는 것. 기능이나 구조 등의 불완전한 점. 결함.
  欠航:
    悪天候や事故などにより、航空・航海の定期運行を取りやめること。: 악천후나 사고 등으로 항공·항해의 정기 운항을 취소하는 것.
  欠字:
    "①あるべき文字が欠けていること。 ②昔、文章中で天皇や貴人の名などを書くとき、敬意を表すためにその上を一字か二字あけたこと。欠如。": "① 있어야 할 글자가 빠져 있는 것. ② 옛날 문장 중에 천황이나 귀인의 이름 등을 쓸 때 경의를 나타내기 위해 그 위를 한두 글자 비워 둔 것."
  欠く:
    "[ 1 ] ① 物の一部分をこわす。また、一部を削り減らす。② 度合、数量などの点で不足する。あるべきものを持たない。欠如する。(カ)くべからざるものは」〈芥川龍之介〉作家)③ そろっているはずのもの、続くはずのものの一部を抜かす。④ いいかげんにする。おろそかにする。つとめを怠る。⑤ むだにする。費やす。〔和英語林集成（再版）（1872）〕[ 2 ] ⇒かける（欠）": "① 물건의 일부를 부수다. 또는 일부를 깎아 줄이다. ② 정도나 수량 등이 부족하다. 있어야 할 것을 갖추지 못하다. ③ 갖추어져야 하거나 이어져야 할 것의 일부를 빠뜨리다. ④ 소홀히 하다. 책무를 게을리하다. ⑤ 헛되이 쓰다. 낭비하다."
  欠:
    ( 動詞「あくぶ」の名詞化 )① 倦怠、疲労、眠けなどの際に思わず口が開いて起こる一種の呼吸運動。口を大きく開いて長く一回深呼吸を行ない、続いてやや短く息を吐く動作。血液中の酸素の不足、上位脳の貧血、細菌や毒素の刺激などによって起こる。② 漢字の旁(つくり)の一つ。「欲」「欺」「歌」「歓」などの「欠」の部分をいう。欠を旁にもつ字は、多く字典の欠部に属し、意味上、口の動きに関係する。: "① 하품. 권태·피로·졸음 등으로 저절로 입이 벌어지는 호흡 운동. ② 한자의 방(旁) 가운데 하나. 「欲」, 「欺」, 「歌」, 「歓」 등의 「欠」 부분."
夫:
  夫子:
    "①長老・賢者・先生などに対する尊称。 ②中国で、男子の敬称。 ③孔子の敬称。 ④あなた。あのおかた。男性の当人を指す語。": "① 장로·현자·스승 등에 대한 존칭. ② 중국에서 남자에 대한 경칭. ③ 공자의 경칭. ④ 당신. 그분. 남성 당사자를 가리키는 말."
  夫婦:
    夫と妻。婚姻関係にある一組の男女。: 남편과 아내. 혼인 관계에 있는 한 쌍의 남녀.
    夫と妻。みょうと。: 남편과 아내. 부부.
  夫:
    夫婦の男性のほう。: 부부 가운데 남자 쪽. 남편.
    成人した男性。一人前の男子。: 성인 남성. 한 사람 몫을 하는 남자.
    そもそも。いったい。文章の冒頭や話題転換などに使われる語。: 대체로. 도대체. 문장의 첫머리나 화제 전환 등에 쓰는 말.
  鰥夫・鰥:
    妻を亡くした男。: 아내를 잃은 남자. 홀아비.
  妓夫:
    遊女屋で客引きをする者。牛太郎。妓夫太郎。: 유곽에서 손님을 끄는 사람.
  妻夫:
    夫婦。妻(つま)と夫(おっと)。みょうと。: 부부. 아내와 남편.
  樵・樵夫:
    山林から木を切り出すことを職業とする人。: 산림에서 나무를 베어 내는 일을 직업으로 삼는 사람. 나무꾼.
  丈夫:
    「丈夫(ジョウフ)」に同じ。: 훌륭한 남자. 장부.
  水夫・水手:
    船を操る人。船乗り。: 배를 다루는 사람. 뱃사람.
不:
  不安:
    心配であること。気にかかること。安心できないこと。: 걱정되는 것. 마음에 걸리는 것. 안심할 수 없는 것. 불안.
  親不知:
    "①生みの親を知らないこと。また、その人。 ②第三大臼歯(ダイキュウシ)。最も遅くはえる四本の奥歯。「親不知歯」の略。 ③親子でもお互いを気づかう余裕がないほど波が荒く危険な海岸。": "① 낳아 준 부모를 모르는 것. 또는 그런 사람. ② 제3대구치. 가장 늦게 나는 네 개의 어금니. 사랑니. ③ 부모 자식도 서로를 돌볼 여유가 없을 만큼 파도가 거칠고 위험한 해안."
  不生女:
    子を産めない女性を卑しんでいう語。: 아이를 낳지 못하는 여성을 낮잡아 이르는 말.
  不知火:
    夜、海上に多くの火の影がゆらめいて見える現象。熊本県八代(やつしろ)沖で見られるものなどが有名。漁(いさ)り火の異常屈折反射によるといわれる。: "밤에 바다 위에 많은 불빛 그림자가 흔들려 보이는 현상. 어화의 이상 굴절·반사로 생긴다고 한다."
  不器用:
    「不器用(ブキヨウ)」に同じ。: 서투름. 손재주가 없음.
  不束:
    能力や考えが足りず、行き届かないさま。不調法なさま。: 능력이나 생각이 부족하여 세심하지 못한 모양. 서투르고 부족한 모양.
  不如帰:
    ホトトギス科の鳥。 杜鵑(ほととぎす): "[생물] 두견과의 새. 두견새."
  不味い:
    "①味が悪い。おいしくない。 ②できばえや技術がへたである。 ③都合が悪い。 ④顔形が悪い。醜い。": "① 맛이 나쁘다. 맛없다. ② 솜씨나 기술이 서투르다. ③ 형편이 나쁘다. 곤란하다. ④ 얼굴 생김새가 못생기다."
  不見転:
    "①あとさきを考えずに事を行うこと。 ②芸者などが金次第で、どんな相手にも容易に身をまかせること。また、そのような女性。": "① 앞뒤를 생각하지 않고 일을 하는 것. ② 게이샤 등이 돈만 주면 누구에게나 쉽게 몸을 맡기는 것. 또는 그런 여성."
  不意:
    思いがけないこと。予期しないこと。また、突然。だしぬけ。: 뜻밖의 일. 예상하지 못한 일. 또는 갑작스러움.
  不一・不乙:
    ①手紙の終わりに書く結びの語。まだ十分に気持ちを表していない意。: ① 편지 끝에 쓰는 맺음말. 아직 마음을 충분히 다 표현하지 못했다는 뜻.
  不運:
    運が悪いこと。: 운이 나쁜 것. 불운.
氏:
  氏族:
    同一の祖先をもつ多数の家族からなる、社会集団。共通の祖先をもっている人々の一族。: 같은 조상을 둔 여러 가족으로 이루어진 사회 집단. 공통 조상을 가진 사람들의 일족.
  諸氏:
    みなさん。多くの人に対する敬称。: 여러분. 여러 사람에 대한 경칭.
  氏:
    ①家系をあらわす名称。: ① 가계를 나타내는 명칭. 씨.
  氏神:
    "①土地の守り神。鎮守の神。産土神(うぶすながみ)。 ②祖先としてまつる神。": "① 그 지역을 지키는 신. 진수신. ② 조상으로 모시는 신."
  氏子:
    "①氏神の守る土地に住み、その氏神をまつる地元民。 ②氏神の子孫。": "① 씨족신이 지키는 땅에 살며 그 신을 모시는 지역 주민. ② 씨족신의 자손."
  華氏:
    温度の目盛りの一種。一気圧における水の氷点を三二度、沸点を二一二度としたもの。記号は: 온도 눈금의 하나. 1기압에서 물의 어는점을 32도, 끓는점을 212도로 정한 것. 화씨.
  姓氏:
    ①姓(かばね)（血筋）と氏(うじ)（家柄）。: ① 성과 씨. 혈통과 가문.
  摂氏:
    温度目盛りの一種。一気圧のもと、水の氷点を〇度、沸点を一〇〇度として、その間を一〇〇等分したもの。記号は℃を用いる。: 온도 눈금의 하나. 1기압에서 물의 어는점을 0도, 끓는점을 100도로 하여 그 사이를 100등분한 것. 섭씨.
  杜氏:
    酒を造る職人。また、その長。さかとうじ。: 술을 빚는 장인. 또는 그 우두머리.
  彼氏:
    「彼(かれ)」に同じ。: 「彼」와 같음. 그 남자. 남자친구.
  某氏:
    ある人。名前がわからなかったり、ぼかしていうときに用いる。: 어떤 사람. 이름을 모르거나 일부러 흐려 말할 때 쓰는 말.
  毛野氏:
    古代の有力な氏族の名。: "고대의 유력 씨족 이름."
失:
  失望:
    "①望みをなくすこと。 ②あてがはずれて、がっかりすること。": "① 희망을 잃는 것. ② 기대가 어긋나 실망하는 것."
  失う:
    "①なくす。 ②取り逃がす。しそこなう。": "① 잃다. 없애다. ② 놓치다. 기회를 잃다."
  失せる:
    "①なくなる。消える。 ②去る。行く。多く、命令形で卑俗な言い方。": "① 없어지다. 사라지다. ② 떠나다. 가다. 명령형에서는 거친 표현으로 쓰인다."
  失声:
    声がかれて出ないこと。かれ声。: 목이 쉬어 목소리가 나오지 않는 것. 쉰 목소리.
  失意:
    思いどおりにいかず、がっかりすること。失望。: 뜻대로 되지 않아 낙담하는 것. 실망.
  失火:
    過失から火災を起こすこと。また、その火災。: 과실로 화재를 일으키는 것. 또는 그 화재.
付:
  付加:
    今あるものにさらにつけ加えること。: 현재 있는 것에 더 보태는 것. 부가.
  付託:
    他にたのみまかせること。ゆだねること。特に、議会で本会議の前に、委員会に審議をゆだねること。: 다른 데 부탁하여 맡기는 것. 특히 의회에서 본회의 전에 위원회에 심의를 맡기는 것.
  付与:
    権利・称号などをさずけ与えること。: 권리나 칭호 등을 부여하는 것.
  付く:
    "①あるものに別のものが密着する。付着する。 ②そこに位置して離れない状態になる。跡などが残る。 ③あるものが加わり、その結果が残る。 ④物事が定まる。決まる。 ⑤近くに身を置く。寄り添って従う。 ⑥感覚器官に感じられる。": "① 어떤 것에 다른 것이 달라붙다. 부착하다. ② 그곳에 자리하여 떨어지지 않는 상태가 되다. 흔적 등이 남다. ③ 어떤 것이 더해지고 그 결과가 남다. ④ 일이 정해지다. 결정되다. ⑤ 가까이에 몸을 두다. 곁에서 따르다. ⑥ 감각기관으로 느껴지다."
  付ける:
    "①あるものに別のものを密着させる。 ②あるものを加える。また、新たな状態を起こさせる。 ③それ以前の状態を終わらせる。決着する。決める。 ④人のそばにいさせる。また、見失わないようにあとを追う。 ⑤感覚器官で感じ取って、注意を向ける。": "① 어떤 것에 다른 것을 달라붙게 하다. ② 어떤 것을 더하다. 또는 새로운 상태가 생기게 하다. ③ 이전 상태를 끝내다. 결말짓다. 정하다. ④ 사람 곁에 있게 하다. 또는 놓치지 않도록 뒤쫓다. ⑤ 감각기관으로 느끼고 주의를 기울이다."
  御汁・御付:
    おつゆ。特に、味噌汁(ミソしる)。: 국물. 특히 된장국.
功:
  功績:
    手柄。大きな働き。: 공로. 큰 업적.
  功:
    名誉である手柄。すぐれた働き。功績。: 명예로운 공로. 뛰어난 업적. 공적.
  功徳:
    "①幸福をもたらすもととなる善行。 ②神仏の恵み。ご利益(リヤク)。": "① 행복을 가져오는 바탕이 되는 선행. ② 신불의 은혜. 영험."
  功力:
    修行で得た功徳(クドク)の力。効験(クゲン)。: 수행으로 얻은 공덕의 힘. 효험.
  功科:
    職務の上での功績や成績。: 직무상의 공적이나 성적.
  功罪:
    手柄と罪(つみ)。一つの物事のよい面と悪い面。: 공로와 잘못. 한 가지 일의 좋은 면과 나쁜 면.
末:
  末節:
    本質でない、ささいなつまらない事柄。: 본질이 아닌 사소하고 하찮은 일.
  末端:
    "①物のはし。さき。 ②組織や機構の中心から最も遠い部分。": "① 물건의 끝. 말단. ② 조직이나 기구의 중심에서 가장 먼 부분."
  末:
    "①物の先。はし。 ②将来。行く先。 ③子孫。 ④末っ子。 ⑤ある期間の終わり。果て。 ⑥重要でないこと。取るに足りないこと。 ⑦和歌の下の句。 ⑧道義などがすたれること。末世。": "① 물건의 끝. ② 장래. 앞날. ③ 자손. ④ 막내. ⑤ 어떤 기간의 끝. ⑥ 중요하지 않은 것. 보잘것없는 것. ⑦ 와카의 하구. ⑧ 도의 등이 쇠퇴하는 것. 말세."
  足末:
    "①足の先。 ②子孫。末裔(マツエイ)。後裔。": "① 발끝. ② 자손. 후예."
  木末:
    木の若い枝先。木の末。こずえ。: 나무의 어린 가지 끝. 나뭇가지 끝.
  末殺:
    樹木の幹の太さがこずえの辺りで急に細くなること。: 나무줄기의 굵기가 우듬지 근처에서 급격히 가늘어지는 것.
令:
  訓令:
    上位の者が下位の者に職務上の命令をくだすこと。また、その命令。: 윗사람이 아랫사람에게 직무상 명령을 내리는 것. 또는 그 명령.
  県令:
    "①県の長官。 ②旧制で県知事が出した命令。": "① 현의 장관. ② 구제도에서 현지사가 내린 명령."
  令室:
    他人の妻を敬っていう語。令夫人。: 다른 사람의 아내를 높여 이르는 말. 영부인.
  令状:
    "①命令を記した書状。 ②法律で、逮捕・勾引(コウイン)・差し押さえ・捜索など、強制処分を行うために裁判所が発する書状。": "① 명령을 적은 문서. ② 법률에서 체포·구인·압수·수색 등 강제처분을 위해 법원이 발부하는 문서. 영장."
  令色:
    人に気に入られるように、こびへつらう顔つき。: 남의 마음에 들려고 아첨하는 얼굴빛.
  仮令:
    かりに。もし。: 가령. 만일.
札:
  鑑札:
    営業や行為などを許可し、警察・役場・同業組合などが発行する証票。免許証・許可証など。: 영업이나 행위 등을 허가하고 경찰·관청·동업조합 등이 발행하는 증표. 면허증이나 허가증 등.
  高札:
    "①昔、掟(おきて)や命令、罪人の罪などを書いて人目につく場所に高く立てた札。立札。 ②入札で最も金額の高いもの。": "① 옛날 법령이나 명령, 죄인의 죄목 등을 써서 사람 눈에 띄는 곳에 높이 세운 표찰. ② 입찰에서 금액이 가장 높은 것."
  入札:
    請負や売買などで、一番有利な条件の者を契約する約束で、競争者に見積り価格を書いて出させること。: 도급이나 매매 등에서 가장 유리한 조건을 낸 사람과 계약하기로 하고 경쟁자들에게 견적 가격을 써서 내게 하는 것. 입찰.
  札:
    鉄または革でできた小さな板で、よろいやかぶとの材料となるもの。: 쇠나 가죽으로 만든 작은 판으로, 갑옷이나 투구의 재료가 되는 것.
    "①文字などを書いてしるしとするもの。小さな木片・紙片・プラスチック片・金属片などで名札や値札の類。 ②神仏の守り札。おふだ。 ③立て札・看板など。 ④かるた・トランプ・花札などの遊戯に用いる紙片。": "① 글자 등을 써서 표시로 삼는 것. 이름표나 가격표 같은 작은 나무·종이·플라스틱·금속 조각. ② 신불의 부적. ③ 표지판이나 간판 등. ④ 가루타·트럼프·하나후다 등 놀이에 쓰는 종이패."
  札片:
    紙幣。: 지폐.
  書札:
    かきもの。かきつけ。書状。手紙。: 글. 적어 둔 것. 서장. 편지.
  金札:
    "[ 1 ] ① 金の札。また、金色の札。② 帝王の書状を敬っていう語。勅書。〔日葡辞書（1603‐04）〕③ 江戸時代、諸藩が発行した金貨代用の紙幣。実際には銀札・銭札・米札が多く、金札の発行は少なかった。④ 明治元年（一八六八）から同二年に発行された太政官金札と民部省金札。⑤ 閻魔(えんま)の庁で、浄玻璃の鏡にかけて善人と悪人を見分け、善人ならその名前を記して極楽へ送るという金製の札。金紙(きんし)。⇔鉄札。⑥ 能楽で用いる小道具の一つ。将棋の駒を大きくした形の薄板に表裏ともに金箔を押したもの。能「金札」の頭にかぶる輪冠(わかんむり)の上の立物(たてもの)として、また、「羅生門」の渡辺綱が、証拠の標札として手にする時に用いる。⑦ 金色に塗った立て札。⑧ ⑦のうち、特に江戸上野の元三大師・慈眼大師は毎月三〇日夕方の七つ時（午後四時三〇分前後）限りに、三六坊を順次遷座し、一坊に一か月鎮座したが、その前に、「両大師」と書いて立てた標札。大師札。": "① 금으로 된 패. 또는 금빛 패. ② 제왕의 서장을 높여 이르는 말. 칙서. ③ 에도 시대에 여러 번이 발행한 금화 대용 지폐. ④ 메이지 초년에 발행된 태정관 금찰과 민부성 금찰. ⑤ 염라청에서 선인과 악인을 가려 선인의 이름을 적어 극락으로 보낸다는 금제 패. ⑥ 노가쿠에서 쓰는 소도구의 하나. ⑦ 금빛으로 칠한 표찰."
  改札:
    "① ( ━する ) 駅のホームへの出入口などで、乗車券、入場券などを調べてはさみを入れたり、定期乗車券の検査をしたりすること。② 「かいさつぐち（改札口）」「かいさつがかり（改札係）」の略。": "① 역 승강장 출입구 등에서 승차권이나 입장권을 확인하거나 정기권을 검사하는 것. ② 「개찰구」나 「개찰 담당」의 준말."
包:
  包囲:
    まわりをとりかこむこと。: 둘레를 에워싸는 것. 포위.
  包む:
    全体を巻くようにしてつつみこむ。巻きこむ。: 전체를 감듯이 싸 넣다. 휘감다.
    "①物をなかに入れ、外側からおおう。 ②あたりを囲む。一面をおおう。 ③心のなかにもつ。秘める。": "① 물건을 안에 넣고 바깥쪽에서 덮다. ② 주변을 둘러싸다. 온통 덮다. ③ 마음속에 품다. 감추다."
  包括:
    さまざまな物事を、ひっくるめて一つにすること。: 여러 가지 일을 통틀어 하나로 묶는 것. 포괄.
  包含:
    そのなかにつつみふくむこと。: 그 안에 감싸 포함하는 것.
  包摂:
    ある概念がより一般的な概念のなかに含まれること。また、その従属関係。: 어떤 개념이 더 일반적인 개념 안에 포함되는 것. 또는 그 종속 관계.
辺:
  海辺:
    海のほとり。海に近い所。: 바닷가. 바다 가까운 곳.
  底辺:
    "①数学で、三角形の頂点に対する辺や、台形の平行な二つの辺。 ②社会や集団の中の下層。": "① 수학에서 삼각형의 꼭짓점에 대응하는 변이나 사다리꼴의 평행한 두 변. 밑변. ② 사회나 집단의 하층."
  天辺:
    "①一番高いところ。いただき。頂上。 ②兜(かぶと)の鉢の頂上。 ③頭の頂上。": "① 가장 높은 곳. 꼭대기. 정상. ② 투구 머리 부분의 꼭대기. ③ 머리 꼭대기."
  辺地:
    都会から遠く離れ、交通などの不便な土地。: 도시에서 멀리 떨어져 교통 등이 불편한 땅. 벽지.
  辺幅:
    布地などのふち。転じて、外観。うわべ。見栄(みえ)。: 천 등의 가장자리. 나아가 외관, 겉모습, 체면.
  辺り:
    "①付近。近くの場所。また、その周囲。 ②時間・人物・場所など、だいたいの見当を表す語。": "① 부근. 가까운 곳. 또는 그 주위. ② 시간·인물·장소 등에 대해 대략적인 짐작을 나타내는 말."
必:
  必携:
    必ずもっていなければならないこと。また、そのもの。: 반드시 지니고 있어야 하는 것. 또는 그런 물건. 필휴.
  必至:
    ①必ずそうなるにちがいないこと。事態が避けられないこと。: ① 반드시 그렇게 될 것이 틀림없는 것. 사태를 피할 수 없는 것.
  必ず:
    例外なく。まちがいなく。確実に。きっと。: 예외 없이. 틀림없이. 확실히. 반드시.
  忽比烈・忽必烈:
    モンゴル帝国の第五代皇帝、フビライ－ハン。南宋(ナンソウ)を滅ぼして中国を統一し、元(ゲン)を建国して初代皇帝に即位。チンギス－ハンの孫。クビライ。: "몽골 제국의 제5대 황제 쿠빌라이 칸. 남송을 멸망시키고 중국을 통일하여 원을 세운 초대 황제. 칭기즈 칸의 손자."
  必見:
    必ず見なければならないもの。また、見るべき価値のあるもの。: 반드시 보아야 하는 것. 또는 볼 가치가 있는 것.
  必殺:
    必ず殺すこと。また、相手を倒すという意気込み。: 반드시 죽이는 것. 또는 상대를 쓰러뜨리겠다는 기세.
以:
  以来:
    その時から現在にいたるまで。: 그때부터 현재에 이르기까지.
  以て:
    "①…を用いて。 ②…の理由で。 ③意を強める言い方。 ④…を限度として。": "① …을 사용하여. …로써. ② …의 이유로. ③ 뜻을 강조하는 표현. ④ …을 한도로 하여."
  以色列:
    アジア南西部の地中海沿岸にある共和国。アラブ諸国に囲まれ紛争が絶えない。首都はエルサレム（国際的には未承認）。: "[나라] 서남아시아 지중해 연안에 있는 공화국. 아랍 여러 나라에 둘러싸여 분쟁이 계속되는 나라. 수도는 예루살렘."
  以為:
    思うことには。: 생각건대.
  所以:
    わけ。理由。いわれ。: 까닭. 이유. 유래.
  以往:
    ある時期よりあと。以後。このかた。: 어떤 시기보다 뒤. 이후. 이래.
  以心伝心:
    "① 仏語。ことばでは表わせない悟りや真理を心から心へと伝えること。主として禅家で用いる。② 無言のうちに心が互いに通じ合うこと。わざわざ口で説明しなくても、自然に相手に通じること。③ 自由恋愛、自由結婚をいう、学生仲間の隠語。〔常用モダン語辞典（1933）〕": "① [불교] 말로 표현할 수 없는 깨달음이나 진리를 마음에서 마음으로 전하는 것. 주로 선가에서 쓴다. ② 말없이도 서로 마음이 통하는 것. 굳이 말로 설명하지 않아도 자연스럽게 상대에게 통하는 것. ③ 자유연애나 자유결혼을 이르던 학생 은어."
司:
  祭司:
    "①宗教上の儀式・典礼を執行する神官。 ②ユダヤ教で、エルサレムの神殿に奉仕して宗教上の職務を専門に司る人。": "① 종교상의 의식과 전례를 집행하는 신관. ② 유대교에서 예루살렘 신전에 봉사하며 종교상의 직무를 전문적으로 맡은 사람."
  司会:
    会や番組などの進行役。: 모임이나 방송 프로그램 등의 진행자. 사회.
  司祭:
    カトリック教会の僧職の一つ。司教の下の位で洗礼・聖餐(セイサン)などの儀式をとり行う。神父。: "가톨릭교회의 성직 가운데 하나. 주교 아래 직위로 세례와 성찬 등의 의식을 집행한다. 신부."
  司:
    "①役所。官庁。 ②役人。官吏。 ③職務や官職。": "① 관청. 관아. ② 관리. 관원. ③ 직무나 관직."
  司る:
    "①職務として行う。担当する。 ②支配・管理する。とりしきる。": "① 직무로서 행하다. 담당하다. ② 지배하고 관리하다. 주관하다."
  造酒司:
    律令(リツリョウ)制で、宮内省に属し、酒や酢などの醸造をつかさどった役所。: "율령제에서 궁내성에 속해 술과 식초 등의 양조를 맡은 관청."
未:
  未知:
    まだ知らないこと。まだ知られていないこと。: 아직 알지 못하는 것. 아직 알려지지 않은 것. 미지.
  未だ:
    "①まだ。今になっても。 ②今なお。ずっと。": "① 아직. 지금이 되어도. ② 지금도 여전히. 계속."
    "①一定の段階や時期にまで至っていない。 ②今でもなお。いまだに。 ③さらに。もっと。 ④どちらかといえば。": "① 일정한 단계나 시기에 이르지 않았다. ② 지금도 여전히. 아직도. ③ 더욱. 더. ④ 어느 쪽인가 하면."
  未:
    "①十二支の八番目。 ②昔の時刻で、現在の午後二時ころ。また、その前後二時間。 ③昔の方角の名。南南西。": "① 십이지의 여덟째. 양. ② 옛 시각으로 현재의 오후 두 시 무렵, 또는 그 전후 두 시간. ③ 옛 방위 이름. 남남서."
  未通女:
    "①まだ世間をよく知らないこと。また、その人。うぶ。 ②まだ男性を知らないこと。また、そのような女性。きむすめ。": "① 아직 세상 물정을 잘 모르는 것. 또는 그런 사람. 순진함. ② 아직 남자를 모르는 것. 또는 그런 여성."
  未蘭:
    イタリア北部の商工業都市。オペラの殿堂のスカラ座やミラノ聖堂などで有名。: "[지명] 이탈리아 북부의 상공업 도시. 스칼라 극장과 밀라노 대성당 등으로 유명하다."
加:
  加える:
    "①添える。つけたす。 ②数量・程度を増す。増やす。加算する。 ③与える。及ぼす。また、施す。 ④仲間に入れる。": "① 덧붙이다. 보태다. ② 수량이나 정도를 늘리다. 더하다. ③ 주다. 미치게 하다. 베풀다. ④ 동료로 넣다."
  加わる:
    "①程度・数量がさらに増す。増える。 ②つけたされる。重なる。 ③仲間に入る。参加する。": "① 정도나 수량이 더 늘다. 증가하다. ② 덧붙다. 겹쳐지다. ③ 동료가 되다. 참가하다."
  亜米利加・亜墨利加:
    "①南北アメリカ大陸の総称。 ②アメリカ合衆国の略称。北アメリカ大陸中央部とアラスカ・ハワイを含む連邦共和国。首都はワシントン。": "① [지명] 남북 아메리카 대륙의 총칭. ② [나라] 미국의 준말. 북아메리카 대륙 중앙부와 알래스카·하와이를 포함하는 연방공화국."
  加加阿:
    アオギリ科の常緑高木。熱帯南アメリカの原産。幹に直接ウリ状の大きな実をつける。種子はココアやチョコレートの原料。: "아욱과의 상록 교목. 열대 남아메리카 원산으로, 줄기에 직접 박 모양의 큰 열매가 달리며 씨는 코코아와 초콜릿의 원료가 된다."
  加答児:
    粘膜が細菌などによって赤くただれたりして、多量の粘液を分泌する症状。: "점막이 세균 등으로 붉게 짓무르고 많은 점액을 분비하는 증상. 카타르."
  加特力:
    キリスト教の一派。カトリック教会。また、その信仰や信者。: "그리스도교의 한 교파. 가톨릭교회. 또는 그 신앙이나 신자."
  加速:
    速度を加えること。速度が増すこと。また、その速度。⇔減速。: 속도를 더하는 것. 속도가 증가하는 것. 또는 그 속도. 가속.
民:
  民権:
    人民の権利。人民が政治に参与する権利。: 인민의 권리. 인민이 정치에 참여할 권리. 민권.
  民:
    "①国家や社会を形成している人々。人民。国民。 ②君主に支配される臣民。": "① 국가나 사회를 이루는 사람들. 인민. 국민. ② 군주에게 지배되는 신민."
  民草:
    人民。民衆。たみ。: 인민. 민중. 백성.
  民意:
    国民の意思。国民の意向。: 국민의 의사. 국민의 뜻. 민의.
  民営:
    民間が経営すること。: 민간이 경영하는 것. 민영.
  民間:
    "①一般庶民の社会。世間。 ②公的機関に属していないこと。": "① 일반 서민의 사회. 세간. ② 공적 기관에 속하지 않은 것. 민간."
印:
  印契:
    指をいろいろな形に折り曲げて、宗教的理念を象徴的に表すもの。印相(インゾウ)。印(イン)。: "[불교] 손가락을 여러 모양으로 구부려 종교적 이념을 상징적으로 나타내는 것. 인상. 인."
  印刷:
    文字・絵などの版面にインクをつけ、紙・布などに刷ること。また、その技術。: 글자나 그림 등의 판면에 잉크를 묻혀 종이나 천 등에 찍는 것. 또는 그 기술. 인쇄.
  印象:
    対象物が人の心に与える感じや影響。: 대상물이 사람의 마음에 주는 느낌이나 영향. 인상.
  印:
    押しあててつけためじるし。また、他のものと区別するための符号。: 눌러 찍어 남긴 표시. 또는 다른 것과 구별하기 위한 기호.
  印す:
    しるしをつける。形跡を残す。: 표시를 하다. 자취를 남기다.
  印度:
    "①アジア南部インド半島の大部分を占める共和国。首都はニューデリー。 ②インド半島一帯の地域名。": "① [나라] 남아시아 인도반도 대부분을 차지하는 공화국. 수도는 뉴델리. ② [지명] 인도반도 일대의 지역명."
  印影:
    印章を紙などに押してできた、その跡。印形(いんぎょう)。: 도장을 종이 등에 찍어 생긴 자국. 인영.
衣:
  衣:
    衣類。着物。: 의류. 옷.
    "①体に着るもの。衣類。特に上着。 ②僧・尼の着る衣服。法衣(ホウエ)。僧衣。 ③揚げものや菓子などの外側の皮。": "① 몸에 입는 것. 의류. 특히 윗옷. ② 승려나 비구니가 입는 옷. 법의. 승의. ③ 튀김이나 과자 등의 겉껍질."
  衣被:
    サトイモの子いもを皮つきのままゆでた食べ物。: 토란의 작은 알을 껍질째 삶은 음식.
  衣魚:
    シミ科の昆虫の総称。家の中の暗い所にすむ。体長約一(センチメートル)で、銀白色。衣類や紙類などを食いあらす。シミムシ。: "[생물] 좀과 곤충의 총칭. 집 안의 어두운 곳에 살며, 몸길이는 약 1센티미터이고 은백색이다. 의류나 종이류 등을 갉아먹는다."
  垣衣:
    "①シノブ・ノキシノブなどシダ植物の別称。 ②ワスレグサの別称。": "① 넉줄고사리나 일엽초 등 양치식물의 별칭. ② 원추리의 별칭."
  居士衣:
    羽織状の隠者や僧の着る道服(ドウブク)の一種。こじごろも。: 은자나 승려가 입는 하오리 모양 도복의 한 종류.
  衣服:
    きもの。ころも。きぬ。衣装。: 옷. 의복. 의상.
  衣錦:
    にしきの衣を着ること。転じて富貴の身となること。: 비단옷을 입는 것. 나아가 부귀한 몸이 되는 것.
兆:
  兆候:
    何かが起こる前ぶれ。きざし。: 어떤 일이 일어날 전조. 조짐. 징후.
  兆し:
    物事が起こる前ぶれ。兆候。また、気配。: 일이 일어날 전조. 징후. 또는 기미.
  兆す:
    物事が起こりそうなしるしが現れる。前兆がある。: 일이 일어날 듯한 표시가 나타나다. 전조가 있다.
  卜兆:
    カメの甲やシカの骨を焼いてうらないをしたときに現れる形。うらないの結果。: 거북 등껍질이나 사슴뼈를 태워 점칠 때 나타나는 모양. 점괘.
  卦兆:
    占いに現れた形。: 점에 나타난 모양. 점괘.
  吉兆:
    よいことのある前ぶれ。めでたいきざし。: 좋은 일이 있을 전조. 길한 징조.
共:
  共:
    "①一緒。全部。みな。 ②同種の。同じ。": "① 함께. 전부. 모두. ② 같은 종류의. 같은."
  共益:
    共同の利益。: 공동의 이익. 공익.
  共演:
    映画・劇・音楽などで、主役格の人が二人以上一緒に出演すること。: 영화·연극·음악 등에서 주연급 사람이 둘 이상 함께 출연하는 것.
  共感:
    人の考えや感じ方などに自分もそのとおりだと思うこと。: 다른 사람의 생각이나 느낌 등에 자신도 그렇다고 여기는 것. 공감.
  共済:
    組織などを作り、互いに助け合うこと。また、その組織。: 조직 등을 만들어 서로 돕는 것. 또는 그 조직. 공제.
  共催:
    複数の団体や組織が共同で催し物を行うこと。: 여러 단체나 조직이 공동으로 행사를 여는 것. 공동 개최.
  共栄:
    自他ともに栄えること。互いに繁栄すること。: 자신과 남이 함께 번영하는 것. 서로 번영하는 것. 공영.
  反共:
    共産主義に反対すること。: 공산주의에 반대하는 것. 반공.
  私共:
    ( 「ども」は接尾語 ) 自称。単数・複数にかかわらず用いる。自分、または自分の家族・仲間などをへりくだっていう語で、わたくしのような価値の低い者といった気持を表現する。てまえども。: 자신을 낮추어 이르는 말. 단수와 복수 모두에 쓰며, 자신이나 자기 가족·동료 등을 겸손하게 가리킨다.
灯:
  灯下:
    ともしびのもと。あかりのそば。: 등불 아래. 불빛 곁.
  灯:
    ともしび。灯火。: 등불. 등화.
    ともしび。灯火。あかり。: 등불. 등화. 불빛.
  灯火・灯:
    ともした火。ともしたあかり。: 켜 놓은 불. 켜 놓은 등불.
  灯す:
    あかりをつける。火を燃やす。: 불을 켜다. 불을 피우다.
  鬼灯:
    ナス科の多年草。: "가지과의 여러해살이풀."
成:
  成就:
    "①なし遂げること。できあがること。 ②長年の望みや願いが実現すること。": "① 완수하는 것. 완성되는 것. ② 오랜 소망이나 바람이 실현되는 것. 성취."
  成長:
    "①人間や動物などが育って成熟すること。 ②物事が発展し、規模が大きくなること。": "① 사람이나 동물 등이 자라서 성숙하는 것. ② 사물이 발전하여 규모가 커지는 것. 성장."
  成立:
    "①物事が成り立つこと。 ②できあがること。まとまること。": "① 일이 성립하는 것. ② 완성되는 것. 정리되어 갖추어지는 것."
  成る:
    "①仕上がる。でき上がる。 ②望んだとおりになる。。 ③構成されている。 ④将棋で、駒(こま)が敵陣に入ってはたらきが変わる。": "① 완성되다. 이루어지다. ② 바라는 대로 되다. ③ 구성되어 있다. ④ 장기에서 말이 적진에 들어가 기능이 바뀌다."
  可成:
    できるだけ。なるたけ。: 될 수 있는 대로. 가능한 한.
  老成:
    "①古くなること。古くなったもの。 ②おとなびていること。ませていること。": "① 오래되는 것. 오래된 것. ② 어른스러운 것. 조숙한 것."
  成す:
    "[ 一 ] ( 生 ) 生む。出産する。また、生み出す。産出する。つくる。① ある行為をする。行なう。② ある気持をおこす。③ 物をつくる。つくりあげる。また、事をしとげる。④ あるものを別の状態のものにする。⑤ ある状態にする。ある状態をひき起こす。⑥ ある時期になるのを待つ。また、ある時になるのにまかせる。⑦ そのように考える。みなす。⑧ 官職につける。任命する。⑨ ある物を他の物であるかのように用いる。⑩ 貴人がおでましになるようにうながす。": "① 낳다. 만들어 내다. 산출하다. ② 어떤 행위를 하다. 행하다. ③ 어떤 감정을 일으키다. ④ 물건을 만들다. 완성하다. 또는 일을 이루다. ⑤ 어떤 것을 다른 상태로 만들다. ⑥ 어떤 상태가 되게 하다. 어떤 상태를 일으키다. ⑦ 어떤 시기가 되기를 기다리다. 또는 그때가 되도록 맡겨 두다. ⑧ 그렇게 생각하다. 간주하다. ⑨ 관직에 앉히다. 임명하다. ⑩ 귀인이 나오도록 재촉하다."
伝:
  伝記:
    個人の生涯の事跡を書きしるしたもの。一代記。: 개인의 생애와 행적을 적은 것. 일대기. 전기.
  伝言:
    人に頼んで、用件を相手に伝えること。また、その言葉。ことづけ。ことづて。: 남에게 부탁해 용건을 상대에게 전하는 것. 또는 그 말. 전언.
  伝道:
    教義を伝え広めること。布教活動。おもに、キリスト教でいう。: 교리를 전파하는 것. 포교 활동. 주로 기독교에서 이른다. 전도.
  伝う:
    あるものに沿って移動する。伝わる。: 어떤 것을 따라 이동하다. 타고 흐르다.
  伝える:
    "①広く言葉で知らせる。 ②言葉や物などを時をへだてて受け渡す。 ③他から持ってきて広める。 ④教え授ける。伝授する。 ⑤取り次ぐ。伝言する。 ⑥他に作用を及ぼす。": "① 말로 널리 알리다. ② 말이나 물건 등을 시간을 사이에 두고 넘겨주다. ③ 다른 곳에서 가져와 퍼뜨리다. ④ 가르쳐 전수하다. ⑤ 중개하다. 말을 전하다. ⑥ 다른 것에 작용을 미치다."
  伝・伝手:
    "①てづる。縁故。 ②ことづて。人づて。 ③ついで。便宜。": "① 연줄. 인연. ② 전언. 사람을 거쳐 전하는 말. ③ 기회. 편의."
  伝舎:
    宿駅・宿場の旅館。駅舎。: 역참이나 숙장의 여관. 역관.
  伝わる:
    "［動ラ五（四）］１ 話などが一方から他方へ通じて広がる。情報が人から人へと知らされる。２ 昔から受け継がれて、今に至る。代々受け継がれて残る。３ 海外など、よその土地から入って来る。伝来する。もたらされる。４ 熱・音などが、ある道すじを通って他方へ届く。５ 何かを仲だちにして、雰囲気などが感じ取られる。６ 物に沿って移動する。つたう。": "① 이야기나 정보 등이 한쪽에서 다른 쪽으로 퍼져 알려지다. ② 옛날부터 이어져 지금에 이르다. 대대로 전해져 남다. ③ 외국 등 다른 지역에서 들어오다. 전래되다. ④ 열이나 소리 등이 어떤 경로를 지나 다른 쪽에 닿다. ⑤ 무언가를 매개로 분위기 등이 느껴지다. ⑥ 물건을 따라 이동하다."
老:
  老化:
    年をとって、身体の機能が低下すること。転じて、時がたつにつれて物の性質やはたらきが衰えていくこと。: 나이가 들어 몸의 기능이 저하되는 것. 나아가 시간이 지나면서 물건의 성질이나 기능이 쇠퇴하는 것. 노화.
  老いる:
    年をとり、心身のはたらきが衰える。また、古くなる。: 나이가 들어 심신의 기능이 쇠하다. 또는 오래되다.
  老ける:
    年をとる。また、年をとったように見える。年よりじみる。: 나이가 들다. 또는 나이 들어 보이다. 늙어 보이다.
  海老:
    エビ科の甲殻類の総称。海または川にすむ。体は殻におおわれ、一〇本の足と四本の触角をもつ。食用。: "[생물] 새우류 갑각류의 총칭. 바다나 강에 살며, 몸은 껍질로 덮이고 다리 열 개와 더듬이 네 개가 있다. 식용."
  甘野老:
    ユリ科の多年草。山野に自生。葉はササの葉形。初夏、白色で細長い釣鐘形の花を垂れ下げる。: "비짜루과의 여러해살이풀. 산야에 자라며 잎은 조릿대 잎 모양이고, 초여름에 흰색의 가늘고 긴 종 모양 꽃이 아래로 처진다."
  走野老:
    ナス科の多年草。山中の湿地に自生。春、暗紅紫色の釣鐘形の花をつける。全草有毒。: "가지과의 여러해살이풀. 산속 습지에 자라며 봄에 어두운 홍자색의 종 모양 꽃이 핀다. 전체에 독이 있다."
仲:
  仲介:
    両方の間に入って話をまとめたり、便宜をはかったりすること。なかだち。: 양쪽 사이에 들어가 이야기를 정리하거나 편의를 도모하는 것. 중개.
  仲兄:
    二番目の兄。次兄。: 둘째 형. 차형.
  仲秋:
    "①陰暦八月の異名。秋の三か月のなかの月。 ②秋の半ば。盛秋。": "① 음력 8월의 다른 이름. 가을 석 달 가운데 가운데 달. ② 가을의 한가운데. 중추."
  仲:
    人と人との間柄。人間関係。: 사람과 사람의 사이. 인간관계.
  仲人:
    結婚する男女の仲を取り持つ人。媒酌人(バイシャクニン)。: 결혼하는 남녀 사이를 이어 주는 사람. 중매인.
  仲裁:
    争いの間に入って、双方を和解させること。: 다툼 사이에 들어가 양쪽을 화해시키는 것. 중재.
争:
  争議:
    互いに意見を主張し合い、争い論じること。: 서로 의견을 주장하며 다투어 논하는 것. 쟁의.
  争う:
    "①他と張り合う。相手に勝とうとする。競う。 ②言い合う。けんかをする。 ③否認する。": "① 남과 겨루다. 상대에게 이기려 하다. 경쟁하다. ② 말다툼하다. 싸우다. ③ 부인하다."
  争訟:
    訴訟を起こして争うこと。裁判ざた。: 소송을 일으켜 다투는 것. 재판 사건.
  争奪:
    争い合って奪い取ること。: 서로 다투어 빼앗는 것. 쟁탈.
  争端:
    争いのはじめ。もめごとの発端。: 다툼의 시작. 분쟁의 발단.
  争点:
    訴訟や論争など、争いの中心となる点。: 소송이나 논쟁 등에서 다툼의 중심이 되는 점. 쟁점.
  争臣:
    主君の非行を強くいさめる臣下。諫臣(かんしん)。〔布令必用新撰字引（1869）〕: 임금의 잘못을 강하게 간하는 신하. 간신.
好:
  好学:
    学問が好きなこと。熱意をもって学問にとりくむこと。: 학문을 좋아하는 것. 열의를 가지고 학문에 힘쓰는 것.
  好む:
    "①気に入って愛好する。 ②望む。欲する。": "① 마음에 들어 좋아하다. ② 바라다. 원하다."
  好く:
    "①興味をもつ。好みに合う。 ②愛する。好意を寄せる。": "① 흥미를 가지다. 취향에 맞다. ② 사랑하다. 호의를 품다."
  好い:
    "①このましい。 ②姿や形がすぐれている。 ③適当である。 ④むつまじい。": "① 바람직하다. 좋다. ② 모습이나 모양이 뛰어나다. ③ 적당하다. ④ 사이가 좋다."
  好:
    "①親しい交際。 ②いずれかの縁によるつながり。縁故。": "① 친한 교제. ② 어떤 인연으로 맺어진 관계. 연고."
  好意:
    "①好ましく思う気持ち。親しみの気持ち。 ②親切な心。": "① 좋게 여기는 마음. 친근한 마음. ② 친절한 마음. 호의."
各:
  各位:
    大勢の人に対して、その一人一人を敬っていう語。みなさま。みなさまがた。: 많은 사람을 상대로 그 한 사람 한 사람을 높여 이르는 말. 여러분.
  各・各各:
    めいめい。それぞれ。一人一人。: 저마다. 각각. 한 사람 한 사람.
  方済各:
    日本に初めてキリスト教を伝えた、スペイン生まれの宣教師。フランシスコ－ザビエル。: "일본에 처음으로 기독교를 전한 스페인 출신 선교사. 프란치스코 하비에르."
  各員:
    集団の中の一人一人。おのおの。: 집단 속의 한 사람 한 사람. 각자.
  各自:
    めいめい。それぞれ個人。: 저마다. 각각의 개인. 각자.
  各般:
    いろいろ。さまざま。それぞれの方面。諸般。: 여러 가지. 다양한 것. 각각의 방면. 제반.
  各:
    "[ 1 ] 多くのものそれぞれ。めいめい。各自。": "여럿 가운데 각각. 저마다. 각자."
阪:
  阪:
    "①勾配(コウバイ)のある道。 ②物事の区切りや境目のたとえ。": "① 경사가 있는 길. 비탈길. ② 사물의 구분이나 경계의 비유."
臣:
  臣下:
    主君に仕える者。けらい。家臣。: 주군을 섬기는 사람. 신하. 가신.
  臣民:
    "①君主国における国民。 ②明治憲法下の日本で、天皇・皇族以外の人民。一般国民。": "① 군주국의 국민. 신민. ② 메이지 헌법 아래 일본에서 천황과 황족 이외의 인민. 일반 국민."
  臣:
    ①主君に仕える人。けらい。: ① 주군을 섬기는 사람. 신하.
  朝臣:
    "①平安時代、五位以上の貴族につけた敬称。 ②古代の姓(かばね)の一つ。あそみ。": "① 헤이안 시대에 5위 이상의 귀족에게 붙인 경칭. ② 고대 성의 하나."
  臣従:
    臣下としてつきしたがい仕えること。: 신하로서 따라 섬기는 것. 신종.
  臣妾:
    主君に服従する者。また、召使いの男女。: 주군에게 복종하는 사람. 또는 남녀 하인.
初:
  初心:
    ①最初に思い立ったときの気持ち。: ① 처음 뜻을 세웠을 때의 마음. 초심.
  初心・初:
    "①若くて世間ずれしていない、純情なようす。 ②恋愛感情にうといさま。": "① 젊고 세상 물정에 닳지 않아 순진한 모양. ② 연애 감정에 서툰 모양."
  初める:
    …しはじめる。はじめて…する。: …하기 시작하다. 처음으로 …하다.
  初め:
    ①時間的に早いこと。早い時期。以前。: ① 시간적으로 이른 것. 이른 시기. 이전.
  初めて:
    新たに。最初に。: 새롭게. 처음으로.
  初:
    "①はじめ。最初。 ②その年・季節はじめての。": "① 시작. 처음. ② 그해나 그 계절에 처음인 것."
  初演:
    演劇、音楽などをはじめて上演、演奏すること。また、その上演・演奏。: 연극이나 음악 등을 처음으로 상연하거나 연주하는 것. 또는 그 상연·연주. 초연.
利:
  利器:
    "①役に立つ便利な道具や器械。 ②鋭い刃物や武器。": "① 쓸모 있고 편리한 도구나 기계. ② 날카로운 칼붙이나 무기."
  利発:
    賢いこと。頭の回転の速いこと。また、そのさま。: 영리한 것. 머리 회전이 빠른 것. 또는 그런 모양.
  利く:
    "①ききめがある。効果が出る。 ②機能がはたらく。 ③可能である。 ④通用する。": "① 효험이 있다. 효과가 나타나다. ② 기능이 작동하다. ③ 가능하다. ④ 통용되다."
  亜米利加・亜墨利加:
    "①南北アメリカ大陸の総称。 ②アメリカ合衆国の略称。北アメリカ大陸中央部とアラスカ・ハワイを含む連邦共和国。首都はワシントン。": "① [지명] 남북 아메리카 대륙의 총칭. ② [나라] 미국의 준말. 북아메리카 대륙 중앙부와 알래스카·하와이를 포함하는 연방공화국."
  阿利布・阿利襪:
    モクセイ科の常緑小高木。地中海沿岸原産。日本では小豆島(しょうどしま)で栽培。初夏、淡黄色で香りのよい花をつける。果実からオリーブ油をとる。: "물푸레나무과의 상록 소교목. 지중해 연안 원산으로 일본에서는 쇼도시마에서 재배한다. 초여름에 연한 노란색의 향기 좋은 꽃이 피며, 열매에서 올리브유를 얻는다."
  伊太利:
    ヨーロッパ南部の共和国。地中海に突き出した長靴形の半島と付近の島々からなる。首都はローマ。: "[나라] 유럽 남부의 공화국. 지중해로 돌출한 장화 모양 반도와 주변 섬들로 이루어지며, 수도는 로마."
  利し:
    "① ( 利・鋭 ) 鋭い。切れ味がよい。鋭利だ。② ( 疾・鋭 ) 勢いがはげしい。強烈だ。いちはやし。③ ( 敏 ) 覚りが早い。賢い。鋭敏だ。さかし。④ ( 疾・捷 ) 時間的経過の早いさま。また、さかのぼった時点であるさま。素早い。迅速だ。→とく（疾）。": "① 날카롭다. 잘 든다. 예리하다. ② 기세가 세다. 강렬하다. ③ 깨닫는 것이 빠르다. 영리하다. 민감하다. ④ 시간의 흐름이 빠르다. 재빠르다. 신속하다."
芸:
  芸術:
    美を表現しようとする創作活動。また、その作品。文学・絵画・彫刻・舞踊など。: 아름다움을 표현하려는 창작 활동. 또는 그 작품. 문학·회화·조각·무용 등.
  芸える:
    種をまく。また、草木の苗をうえつけ育てる。: 씨를 뿌리다. 또는 초목의 모종을 심어 기르다.
  芸:
    "①修得した技能。 ②遊びに関する技術。遊芸。 ③学問。芸術。": "① 익힌 기능. ② 놀이와 관련된 기술. 유예. ③ 학문. 예술."
  安芸:
    旧国名の一つ。現在の広島県西部にあたる。芸州(ゲイシュウ)。: "[지명] 옛 나라 이름의 하나. 현재의 히로시마현 서부에 해당한다. 게이슈."
  芸閣:
    書庫。また、書斎。: 서고. 또는 서재.
  芸域:
    身につけた芸の深さや広さ。芸の領域。: 몸에 익힌 기예의 깊이나 폭. 기예의 영역.
  芸植:
    "うえつけ。耕植。〔北史、鉄勒伝〕居るに恆無く、水に從ひて移す。～西邊にき、頗(すこ)ぶる植を爲す。牛多くして馬少なし。字通「芸」の項目を見る。": 심어 가꿈. 경작하여 심는 것.
  芸州:
    "[ 1 ] ( 「芸」は芸妓の意。「州」は「衆」の当て字 ) 芸妓をなれなれしくいう、江戸時代通人のことば。": 에도 시대 통인이 게이샤를 친근하게 이르던 말.
児:
  愛児:
    慈(いつく)しみ、大切に育てている子ども。いとしご。: 사랑하고 소중히 기르는 아이. 사랑하는 자식.
  健児:
    元気盛んな若者。: 기운이 왕성한 젊은이.
    "①奈良から平安時代にかけて、国府・関所などを警備した兵士。こんに。 ②武家時代の中間(チュウゲン)・足軽の呼称。「健児童(わらわ)」の略。": "① 나라 시대부터 헤이안 시대에 걸쳐 국부와 관문 등을 지키던 병사. ② 무가 시대의 중간이나 아시가루를 이르던 말."
  児童:
    "①子ども。 ②小学生。": "① 어린이. ② 초등학생."
  児:
    "①ちのみご。幼い子ども。また、子ども。 ②自分の子ども。むすこやむすめ。": "① 젖먹이. 어린아이. 또는 아이. ② 자기 자식. 아들이나 딸."
  嬰児:
    生まれて間もない子ども。ちのみご。あかんぼう。: 태어난 지 얼마 안 된 아이. 젖먹이. 아기.
良:
  良好:
    よい状態であること。好ましいこと。また、そのさま。: 좋은 상태인 것. 바람직한 것. 또는 그런 모양. 양호.
  良い:
    "①好ましい。 ②すぐれている。": "① 좋다. 바람직하다. ② 뛰어나다."
  倍良:
    ベラ科の海魚の総称。 遍羅(ベラ): "[생물] 놀래기과 바닷물고기의 총칭."
  野良:
    "①野原。野。 ②田畑。": "① 들판. 들. ② 논밭."
  良人:
    夫婦のうちの男性のほう。妻の配偶者。亭主。: 부부 가운데 남자 쪽. 아내의 배우자. 남편.
  良候:
    "①操船で、船に直進せよという命令の言葉。 ②「よろしい」の意で、船乗りが調子をつけるためのかけ声。": "① 조선에서 배에 직진하라고 명령하는 말. ② 「좋다」는 뜻으로 선원이 박자를 맞추기 위해 내는 구호."
材:
  逸材:
    すぐれた才能をもつ人。: 뛰어난 재능을 가진 사람. 인재.
  材木:
    建築・器具などの材料とするため、長さや厚さをそろえて切り整えた木。: 건축이나 기구 등의 재료로 쓰기 위해 길이나 두께를 맞추어 잘라 다듬은 나무. 목재.
  材料:
    "①物をつくり出すもとになる物。 ②研究・調査などの助けとして使われるもの。資料。 ③芸術作品などのもとになる題材。": "① 물건을 만들어 내는 바탕이 되는 것. 재료. ② 연구나 조사 등에 도움이 되는 것. 자료. ③ 예술 작품 등의 바탕이 되는 소재."
  材幹:
    物事をうまく処理する能力。うでまえ。: 일을 잘 처리하는 능력. 수완.
  材質:
    "①木材の性質。 ②材料の性質。": "① 목재의 성질. ② 재료의 성질. 재질."
  画材:
    "①絵の題材。絵をえがく対象。 ②絵をえがく道具。絵の具・筆など。": "① 그림의 소재. 그림을 그릴 대상. ② 그림을 그리는 도구. 물감이나 붓 등."
労:
  過労:
    働きすぎて疲れがたまること。: 지나치게 일해서 피로가 쌓이는 것. 과로.
  労資:
    労働者と資本家。: 노동자와 자본가. 노자.
  労働:
    体力や知力を使って働くこと。: 체력이나 지력을 써서 일하는 것. 노동.
  労来:
    ねぎらい、励ますこと。: 노고를 위로하고 격려하는 것.
  労る:
    "①心づかいをする。大切にする。 ②ねぎらう。なぐさめる。同情する。": "① 마음을 써서 돌보다. 소중히 대하다. ② 노고를 위로하다. 달래다. 동정하다."
  労う:
    物事に骨を折ってくれたことに感謝して礼をいう。骨折りを慰める。: 수고해 준 것에 감사하여 인사를 하다. 노고를 위로하다.
佐:
  佐幕:
    江戸時代の末、尊皇討幕に反対し、徳川幕府に協力したこと。また、その一派。「佐」はたすける、「幕」は幕府の意。: 에도 시대 말기에 존왕토막에 반대하고 도쿠가와 막부에 협력한 것. 또는 그 일파.
  佐:
    律令(リツリョウ)制における四等官の第二位。長官(かみ)を補佐した。: 율령제의 사등관 가운데 둘째 자리. 장관을 보좌하였다.
  佐ける:
    わきからささえる。手助けする。補佐する。: 곁에서 받치다. 거들다. 보좌하다.
  王佐:
    王の政務をたすけること。王の補佐。: 왕의 정무를 돕는 것. 왕의 보좌.
  補佐:
    人の仕事に力添えして助けること。また、その役や人。補弼(ホヒツ): 남의 일을 거들어 돕는 것. 또는 그런 직책이나 사람.
  輔佐: 보좌함. 곁에서 도와 받드는 것.
  佐州:
    佐渡国の別称。〔易林本節用集（1597）〕: "[지명] 사도국의 별칭."
改:
  改革:
    制度や習慣などの悪いところをあらため、よいものにすること。: 제도나 습관 등의 나쁜 점을 고쳐 좋게 만드는 것. 개혁.
  改める:
    "①新しいものにする。 ②悪いところをよいものに変える。改善する。 ③きちんとした態度をとる。": "① 새롭게 하다. ② 나쁜 점을 좋게 바꾸다. 개선하다. ③ 태도를 단정히 갖추다."
  改悪:
    改めた結果、かえって前よりも悪くすること。また、悪くなること。: 고친 결과 오히려 전보다 나쁘게 만드는 것. 또는 나빠지는 것.
  改印:
    印鑑を変えること。特に、役所・銀行・取引先などに届け出ている印鑑を新しいものに変えること。: 도장을 바꾸는 것. 특히 관청·은행·거래처 등에 신고한 도장을 새것으로 바꾸는 것.
  改易:
    江戸時代、官職や身分を取り上げた刑罰。武士の身分を除籍し屋敷・領地を没収した。切腹より軽く、蟄居(チッキョ)より重い。: "에도 시대에 관직이나 신분을 빼앗던 형벌. 무사 신분을 박탈하고 저택과 영지를 몰수했다."
  改元:
    元号を改めて新しくすること。: 연호를 새로 고치는 것. 개원.
  改札:
    "① ( ━する ) 駅のホームへの出入口などで、乗車券、入場券などを調べてはさみを入れたり、定期乗車券の検査をしたりすること。② 「かいさつぐち（改札口）」「かいさつがかり（改札係）」の略。": "① 역 승강장 출입구 등에서 승차권이나 입장권 등을 확인하는 것. ② 「개찰구」, 「개찰 담당자」의 준말."
  改まる:
    "① 物事が新しくなる。古いものが新しいものに替わる。新しい段階に入る。入れ替わる。変化する。② 物事が改善される。前よりもずっとよくなる。面目が一新される。③ ことさらに態度を整えてきちんとする。堅苦しい他人行儀の態度やことばつきになる。「あらたまって」の形で副詞的にも用いる。④ ( 「革」の字の訓読語として ) 病気が重くなる。容態が悪化する。危篤になる。⑤ 怠る。": "① 사물이 새로워지다. 낡은 것이 새것으로 바뀌다. 새로운 단계에 들어서다. ② 사물이 개선되다. 전보다 훨씬 좋아지다. 면모가 새로워지다. ③ 일부러 태도를 갖추어 격식을 차리다. ④ 병이 무거워지다. 상태가 악화되어 위독해지다. ⑤ 게을리하다."
完:
  完結:
    一連の作業や続き物の作品などが、すべて終わること。: 일련의 작업이나 연속 작품 등이 모두 끝나는 것. 완결.
  完全:
    欠点や不足がなにもないこと。条件がすべてそろっていること。: 결점이나 부족함이 전혀 없는 것. 조건이 모두 갖추어진 것. 완전.
  完骨:
    耳の後ろの小高い部分。また、その骨。: 귀 뒤의 조금 도드라진 부분. 또는 그 뼈.
  完工:
    工事が完了すること。工事を完成させて終わること。: 공사가 완료되는 것. 공사를 완성하여 끝내는 것.
  完済:
    借金や債務などをすべて返すこと。: 빚이나 채무 등을 모두 갚는 것. 완제.
  完熟:
    植物の果実や種子が完全に熟すこと。特に、食べられるものに対して使う。: 식물의 열매나 씨가 완전히 익는 것. 특히 먹을 수 있는 것에 대해 쓴다. 완숙.
束:
  拘束:
    "①身柄をおさえ、束縛すること。 ②行動の自由を制限すること。": "① 몸을 붙잡아 얽어매는 것. ② 행동의 자유를 제한하는 것. 구속."
  束縛:
    自由を制限すること。行動の自由を奪うこと。: 자유를 제한하는 것. 행동의 자유를 빼앗는 것. 속박.
  束髪:
    明治・大正時代に流行した、女性の西洋風の髪の結い方。: 메이지·다이쇼 시대에 유행한 여성의 서양식 머리 모양.
  束:
    一つにまとめて、くくったもの。また、くくったものを数える助数詞。: 하나로 모아 묶은 것. 또는 묶은 것을 세는 조수사.
    "①「束柱」の略。梁(はり)と棟(むね)との間や、縁側の下などに立てる短い柱。 ②製本したときの、本の厚み。": "① 「짧은 받침기둥」의 준말. 들보와 용마루 사이 또는 툇마루 아래 등에 세우는 짧은 기둥. ② 제본했을 때 책의 두께."
  束ねる:
    "①たばねる。ひとまとめにしてしばる。 ②腕を組む。こまぬく。": "① 묶다. 한데 모아 매다. ② 팔짱을 끼다."
冷:
  冷却:
    "①ひえること。また、ひやすこと。 ②高まった感情が静まること。興奮を静めること。": "① 차가워지는 것. 또는 차게 하는 것. 냉각. ② 고조된 감정이 가라앉는 것. 흥분을 가라앉히는 것."
  冷める:
    "①熱いものの温度が下がる。ぬるくなる。 ②高まった気持ちや関心が薄らぐ。熱意を失う。": "① 뜨거운 것의 온도가 내려가다. 식다. ② 고조된 마음이나 관심이 옅어지다. 열의를 잃다."
  冷たい:
    "①温度が低く、触れた感触がひやりとする。 ②人情が薄い。冷淡である。": "① 온도가 낮아 닿는 느낌이 서늘하다. 차갑다. ② 인정이 없다. 냉담하다."
  冷える:
    "①温度が下がる。寒くなる。また、そのように感じる。 ②熱意・興味・愛情などの度合が衰える。 ③景気や相場などが悪くなる。": "① 온도가 내려가다. 추워지다. 또는 그렇게 느끼다. ② 열의·흥미·애정 등의 정도가 약해지다. ③ 경기나 시세 등이 나빠지다."
  冷や:
    "①「冷や酒」の略。燗(かん)をしていない酒。冷酒。 ②「冷や水」の略。つめたい水。": "① 「찬 술」의 준말. 데우지 않은 술. ② 「찬물」의 준말."
  冷やかす:
    "①相手が気にするようなことを言ってからかう。茶化す。 ②買う気がないのに、品定めをしたり値段を聞いたりする。": "① 상대가 신경 쓸 만한 말을 하며 놀리다. ② 살 생각 없이 물건을 살피거나 값을 묻다."
  冷ます:
    "① 熱いものを冷たくする。ひやす。〔色葉字類抄（1177‐81）〕② たかまった雰囲気(ふんいき)や気持、興味などを鎮める。③ 冷淡にあしらう。つれなくする。④ 済ます。のがれる。": "① 뜨거운 것을 차게 하다. 식히다. ② 고조된 분위기나 마음, 흥미 등을 가라앉히다. ③ 냉담하게 대하다. 쌀쌀맞게 굴다. ④ 끝내다. 벗어나다."
  冷やす:
    "① ひえるようにする。つめたくする。② 心胆を寒からしめる。ぞっとさせる。③ 冷静にする。気持を落ち着かせる。④ 刀で人を斬る。また、白刃をあてる。": "① 차가워지게 하다. 차게 하다. ② 간담을 서늘하게 하다. 오싹하게 하다. ③ 냉정하게 하다. 마음을 가라앉히다. ④ 칼로 사람을 베다. 또는 칼날을 들이대다."
低:
  低い:
    "①高さが少ない。 ②音が小さい。 ③劣っている。 ④度数が小さい。": "① 높이가 작다. 낮다. ② 소리가 작거나 낮다. ③ 뒤떨어져 있다. ④ 도수가 작다."
  低める:
    低くする。下げる。: 낮게 하다. 낮추다.
  低下:
    ①低くなること。下がること。: ① 낮아지는 것. 떨어지는 것. 저하.
  低回:
    物思いにふけりながら、うろうろと行ったり来たりすること。: 생각에 잠겨 이리저리 서성이는 것.
  低減:
    "①へること。へらすこと。 ②安くなること。安くすること。": "① 줄어드는 것. 줄이는 것. ② 싸지는 것. 싸게 하는 것. 저감."
  低姿勢:
    相手に対してへりくだり、下手(したて)に出る態度。: 상대에게 몸을 낮추어 겸손하게 나오는 태도. 저자세.
  低地:
    低い土地。海抜の低い土地。また、周囲にくらべてくぼんで低くなった土地。: 낮은 땅. 해발이 낮은 땅. 또는 주변보다 움푹 패여 낮은 땅. 저지.
  低額:
    金額が少ないこと。また、少ない金額。: 금액이 적은 것. 또는 적은 금액. 저액.
  低まる:
    低くなる。: 낮아지다.
努:
  努力:
    力を尽くして行うこと。精を出すこと。: 힘을 다해 하는 것. 정성을 들이는 것. 노력.
  努める:
    努力する。はげむ。力を尽くして行う。: 노력하다. 힘쓰다. 힘을 다해 행하다.
  努:
    けっして。つとめて。気をつけて。: 결코. 부디. 조심해서.
  努努:
    けっしてけっして。必ず必ず。: 결코. 절대로. 반드시.
位:
  位階:
    国家に功績のあった人に与えられる栄典の一種。一位から八位まであり、それぞれに正と従がある。: 국가에 공적이 있는 사람에게 주는 영전의 하나. 1위부터 8위까지 있으며 각각 정위와 종위가 있다.
  位置:
    "①物の場所。 ②人の地位。立場。": "① 물건이 있는 자리. 위치. ② 사람의 지위. 입장."
  各位:
    大勢の人に対して、その一人一人を敬っていう語。みなさま。みなさまがた。: 여러 사람을 향해 그 한 사람 한 사람을 높여 이르는 말. 여러분.
  位:
    "①身分や階級。 ②人や作品などの等級。 ③十進法で一〇倍ごとにつける名称。": "① 신분이나 계급. ② 사람이나 작품 등의 등급. ③ 십진법에서 10배마다 붙이는 명칭. 자리."
  位相:
    "①言語学で、地域・職業・階級・年齢・性別などによる言葉のちがい。 ②物理学で、周期運動において、一周期のうちのある状態や位置。": "① 지역·직업·계급·나이·성별 등에 따른 말의 차이. ② 주기 운동에서 한 주기 중의 어떤 상태나 위치. 위상."
  位牌:
    死者の戒名(カイミョウ)を書いて仏壇にまつる木の札。: 죽은 사람의 계명을 적어 불단에 모시는 나무패. 위패.
岐:
  岐路:
    "①本通りから分かれた細い道。 ②物事の本筋を外れること。また、外れたところ。": "① 큰길에서 갈라진 좁은 길. 샛길. ② 사물의 본줄기에서 벗어나는 것. 또는 벗어난 곳."
    分かれ道。その選択により、大きく変わるような場面・状況。: 갈림길. 그 선택에 따라 크게 달라지는 장면이나 상황.
  岐:
    "①分かれ道。 ②分かれ目。 ③町なか。世間。 ④物事が行われる場所。": "① 갈림길. ② 갈림목. ③ 거리. 세상. ④ 일이 벌어지는 장소."
  岐れる:
    道や筋道がふたまたになる。: 길이나 이치가 두 갈래로 갈라지다.
  壱岐:
    旧国名の一つ。現在の長崎県壱岐市。九州と朝鮮半島との間に、対馬(つしま)とともに飛び石状にある島。壱州(イッシュウ)。: "[지명] 옛 나라 이름의 하나. 현재의 나가사키현 이키시에 해당한다. 규슈와 한반도 사이에 쓰시마와 함께 징검다리 모양으로 놓인 섬."
  隠岐:
    旧国名の一つ。現在の島根県の一部。日本海上の群島。隠州(オンシュウ)。: "[지명] 옛 나라 이름의 하나. 현재의 시마네현 일부에 해당한다. 동해상의 군도."
希:
  希求:
    強く願い望むこと。こい願うこと。: 강하게 바라며 원하는 것. 간절히 바라는 것. 희구.
  希釈:
    溶液に水などの溶媒を加えて濃度を薄めること。: 용액에 물 등의 용매를 더해 농도를 묽게 하는 것. 희석.
  希少:
    非常に少ないこと。めったにないこと。: 매우 적은 것. 좀처럼 없는 것. 희소.
  希う:
    強く望む。こうあってほしいと切望する。: 강하게 바라다. 이렇게 되기를 간절히 원하다.
  希:
    非常に少ないさま。めったになく珍しいこと。: 매우 적은 모양. 좀처럼 없어 드문 것.
  希臘:
    ヨーロッパ南東部の共和国。バルカン半島南端部とエーゲ海の島々からなる。古代ギリシャ文明発祥の地。首都はアテネ。: "[나라] 유럽 남동부의 공화국. 발칸반도 남단과 에게해의 섬들로 이루어지며, 고대 그리스 문명의 발상지이다. 수도는 아테네."
沖:
  沖虚:
    ①何もないこと。なかがからであること。: ① 아무것도 없는 것. 속이 비어 있는 것.
  沖積:
    氷河の流水によって運ばれた土砂が、しだいに積み重なること。: 빙하의 흐르는 물에 실려 온 토사가 차츰 쌓이는 것. 충적.
  沖天:
    "①まっすぐ空高くのぼること。 ②天にとどくほど勢力をのばすこと。": "① 곧장 하늘 높이 오르는 것. ② 하늘에 닿을 만큼 세력을 뻗치는 것."
  沖:
    海や湖の岸から遠く離れた所。: 바다나 호수의 기슭에서 멀리 떨어진 곳. 앞바다.
  沖仲仕:
    はしけを使って、港湾に停泊する本船から荷物の積み降ろしをする労働者。: 부선을 이용해 항만에 정박한 본선에서 짐을 싣고 내리는 노동자.
  沖魚汁:
    漁師がとれたての魚介を入れて作る汁物。沖汁。: 어부가 갓 잡은 어패류를 넣어 만든 국물 요리. 오키지루.
  沖合:
    "① 海、湖などの沖のほう。② 房総地方で、数隻の漁船を使って操業する大きな網漁業の漁労指揮者。おっけい。おつけどん。": "① 바다나 호수의 먼 쪽. 앞바다 쪽. ② 보소 지방에서 여러 척의 어선을 써서 조업하는 큰 그물 어업의 어로 지휘자."
別:
  格別:
    "①普通とはちがっているさま。とりわけ。格段。 ②ともかくとして。別として。": "① 보통과 다른 모양. 특히. 각별히. ② 일단 제쳐 두고. 별도로."
  区別:
    ①あるものと他のものとのちがい。: ① 어떤 것과 다른 것의 차이. 구별.
  別居:
    親子・夫婦などが、別々に住むこと。: 부모와 자식, 부부 등이 따로 사는 것. 별거.
  別件:
    別の事件や用件。ほかの事柄。: 다른 사건이나 용건. 다른 일.
  別れる:
    離れ離れになる。特に、離縁・死別する。: 서로 떨어지게 되다. 특히 이혼하거나 사별하다.
  別ける:
    "①離して別々にする。わけ隔てる。 ②区別する。また、けじめをつける。": "① 떼어 따로따로 하다. 갈라놓다. ② 구별하다. 또한 분명히 선을 긋다."
  別つ:
    "① 別々に離れさせる。また、分割する。わける。② 区域・所属・役割などを別にする。区分する。区別する。わける。③ わけて配る。無償または有償でわけ与える。わける。④ 判断して見分ける。違いをはっきりわきまえる。": "① 따로따로 떨어지게 하다. 또는 분할하다. 나누다. ② 구역·소속·역할 등을 달리하다. 구분하다. ③ 나누어 주다. 무상 또는 유상으로 나누어 주다. ④ 판단하여 구별하다. 차이를 분명히 알아차리다."
兵:
  兵火:
    ①戦争により起きる火災。: ① 전쟁으로 일어나는 화재. 병화.
  兵士:
    軍隊において士官の指揮を受け、軍務に服する者。: 군대에서 장교의 지휘를 받아 군무에 복무하는 사람. 병사.
  兵:
    武士。兵士。軍人。特に、勇ましく強い武人。: 무사. 병사. 군인. 특히 용맹하고 강한 무인.
  兵部:
    "「兵部省」の略。 ①律令(リツリョウ)制で、太政官八省の一つ。武官の人事や軍事一般をつかさどる。 ②一八六九（明治二）年に置かれた六省の一つ。陸海軍・軍備・兵学校などに関することをつかさどり、一八七二（明治五）年に陸軍省・海軍省が設けられたのに伴い廃止。": "「병부성」의 준말. ① 율령제에서 태정관 팔성의 하나. 무관 인사와 군사 전반을 맡았다. ② 1869년에 설치된 여섯 성의 하나로, 육해군·군비·병학교 등에 관한 일을 맡았으며 1872년 육군성·해군성 설치와 함께 폐지되었다."
  兵糧:
    軍隊の食糧。また、活動を支えるのに十分な食糧。: 군대의 식량. 또는 활동을 지탱하기에 충분한 식량. 병량.
  兵六玉:
    まぬけ。愚鈍な人をののしっていう語。兵六。: 어리석은 사람. 우둔한 사람을 욕하여 이르는 말.
  兵器:
    戦闘、殺傷破壊に用いる器材。いくさ道具。武器。兵械。: 전투와 살상·파괴에 쓰는 기재. 전쟁 도구. 무기.
求:
  求愛:
    異性に愛情を求めること。: 이성에게 사랑을 구하는 것. 구애.
  求職:
    仕事を探し求めること。就職先を探すこと。: 일을 찾아 구하는 것. 취직할 곳을 찾는 것. 구직.
  求める:
    "①さがす。 ②要求する。 ③望み、ほしがる。願い、自ら追う。 ④買う。": "① 찾다. ② 요구하다. ③ 바라며 원하다. 스스로 추구하다. ④ 사다."
  求刑:
    裁判で検察官が、被告に一定の刑罰を科するよう裁判官に請求すること。: 재판에서 검사가 피고에게 일정한 형벌을 내리도록 재판관에게 청구하는 것. 구형.
  求婚:
    結婚してほしいと申し込むこと。プロポーズ。: 결혼해 달라고 청하는 것. 청혼.
  求心力:
    物体が円運動しているとき、中心に向かって働く力。転じて、一つのものに他の多くのものが集まってくる力。: 물체가 원운동할 때 중심을 향해 작용하는 힘. 나아가 하나의 대상에 다른 많은 것이 모여드는 힘. 구심력.
折:
  曲折:
    "①折れ曲がっていること。 ②物事の進み方に複雑な変化があること。また、複雑な事情があること。": "① 꺾여 구부러져 있는 것. ② 사물의 진행 방식에 복잡한 변화가 있는 것. 또는 복잡한 사정이 있는 것. 곡절."
  折衝:
    利害などのくいちがう相手と話し合って問題を解決しようとすること。また、かけひき。: 이해관계 등이 엇갈리는 상대와 의논하여 문제를 해결하려는 것. 또는 흥정. 절충.
  夭折:
    わか死にすること。: 젊어서 죽는 것. 요절.
  折:
    "①折ること。折ったもの。また、折り目。 ②「折り箱」「折り詰め」の略。 ③季節。時節。 ④場合。そのとき。機会。": "① 접거나 꺾는 것. 접은 것. 또는 접힌 자국. ② 「접이식 상자」, 「도시락 상자」의 준말. ③ 계절. 시절. ④ 경우. 그때. 기회."
  折る:
    "①曲げる。 ②曲げて切り離す。 ③紙や布などを曲げて重ねる。たたむ。": "① 구부리다. 꺾다. ② 구부려 끊어 내다. ③ 종이나 천 등을 접어 겹치다."
  折れる:
    "①曲がる。曲がって重なる。 ②曲がって切り離れる。 ③進む方向を変える。道などを曲がる。 ④自分の考えを変え、相手にしたがう。譲歩する。": "① 구부러지다. 접혀 겹치다. ② 구부러져 끊어지다. ③ 나아가는 방향을 바꾸다. 길 등이 꺾이다. ④ 자기 생각을 바꾸어 상대에게 따르다. 양보하다."
  折衷:
    両方のよいところをとってほどよく調和させること。相反する意見の中ほどをとって言説を組み立てること。斟酌(しんしゃく)すること。: 양쪽의 좋은 점을 취해 적절히 조화시키는 것. 서로 반대되는 의견의 중간을 취해 논지를 세우는 것. 절충.
  折獄:
    ( 「折」は、定める、判断するの意 ) 訴えを裁決すること。判決を下すこと。また、その判決。: 소송을 판결하는 것. 판결을 내리는 것. 또는 그 판결.
的:
  劇的:
    演劇の場面のように感動させられるさま。ドラマチック。: 연극의 한 장면처럼 감동을 주는 모양. 극적.
  射的:
    "①的(まと)に向け弓矢や銃をうつこと。 ②コルクの弾の空気銃で賞品の的をねらい、うち落としたら自分のものになる遊び。": "① 과녁을 향해 활이나 총을 쏘는 것. ② 공기총으로 상품 과녁을 맞혀 떨어뜨리면 가져가는 놀이."
  的確:
    本質をぴたりとついているさま。: 본질을 정확히 찌르는 모양. 적확.
  的:
    "①矢や弾丸などをあてる標的。 ②めあて。目標。 ③攻撃や関心が集中する対象。": "① 화살이나 탄환 등을 맞히는 표적. 과녁. ② 목표. ③ 공격이나 관심이 집중되는 대상."
  的然:
    明らかなさま。はっきりとして確かなさま。: 분명한 모양. 뚜렷하고 확실한 모양.
  的中:
    ①まとや目標にあたること。: ① 과녁이나 목표에 맞는 것. 적중.
典:
  典雅:
    正しく、みやびやかなこと。整っていて上品なさま。: 바르고 우아한 것. 잘 갖추어져 품위 있는 모양. 전아.
  典型:
    同類のなかで、その種類の特徴を最もよく表しているもの。見本。模範。: 같은 부류 가운데 그 종류의 특징을 가장 잘 나타내는 것. 본보기. 모범. 전형.
  典故:
    よりどころとなる故事。典拠となる故事。典例故実。: 근거가 되는 고사. 전거가 되는 고사. 전고.
  典籍:
    書物。書籍。: 책. 서적. 전적.
  典礼:
    "①一定の儀式・儀礼。 ②儀式をつかさどる役職。": "① 일정한 의식·의례. ② 의식을 맡아보는 직책."
  典:
    "①法則。守るべき事柄。おきて。 ②手本。模範。": "① 법칙. 지켜야 할 일. 규범. ② 본보기. 모범."
  典獄:
    "① ( 「でんごく」とも ) 監獄の事務をつかさどる職。また、その人。② 旧制の、監獄の長。監獄の事務を掌り、部下職員を監督する奏任官。現在の刑務所長。": "① 감옥 사무를 맡아보는 직책. 또는 그 사람. ② 구제에서 감옥의 장. 감옥 사무를 맡고 부하 직원을 감독하던 주임관. 현재의 교도소장."
治:
  治安:
    国家・社会の秩序が保たれて、穏やかであること。: 국가와 사회의 질서가 유지되어 평온한 것. 치안.
  治める:
    "①乱れた物事をしずめる。落ち着かせる。 ②支配する。政治を行う。": "① 어지러운 일을 가라앉히다. 안정시키다. ② 지배하다. 정치를 하다. 다스리다."
  治す:
    病気やけがを治療して、健康な状態にする。: 병이나 상처를 치료하여 건강한 상태로 만들다. 고치다.
  治聾酒:
    春の社日(シャニチ)（春分・秋分に最も近い戊(つちのえ)の日）に飲む酒。: 봄의 사일, 곧 춘분이나 추분에 가장 가까운 무일에 마시는 술.
  治下:
    ある政権の支配下にあること。統治下。: 어떤 정권의 지배 아래에 있는 것. 치하.
  治国:
    国を治めること。また、よく治まっている国。〈『大学』〉: 나라를 다스리는 것. 또는 잘 다스려지는 나라.
  治まる:
    ［動ラ五（四）］１ 「収まる3」に同じ。２ 政治の秩序が行き渡る。３ 痛みや、症状などがしずまる。: "① 정리되어 제자리에 들어가다. ② 정치 질서가 두루 미치다. ③ 통증이나 증상 등이 가라앉다."
  治る:
    "① まっすぐになる。② 間違った、また、不十分な状態が改まる。修正される。また、添削されてよくなる。③ 以前の状態にもどる。(イ) 地位、身分などがもとにもどる。復帰する。(ロ) 正常なさま、望ましい状態にもどる。(ハ) くずれた気分や感情がもとにもどる。(ニ) 取引所で、相場が立ち直る。〔新時代用語辞典（1930）〕④(イ) すわるべき場所、または地位に着座する。位置を占める。位置を移る。(ロ) 特に、定められた場所にきちんとすわる。正座する。(ハ) 主人のあとを継ぐ。また、めかけ、愛人などが本妻になる。⑤ 形式が変わる。⑥ ( 治 ) 具合の悪い所がよくなる。病気や怪我などが治癒する。⑦ 死ぬことをいう斎宮の忌み詞。": "① 곧아지다. ② 잘못되거나 불충분한 상태가 고쳐지다. 수정되다. ③ 이전 상태로 돌아가다. 지위·신분이 복귀하거나, 정상·바람직한 상태로 돌아가거나, 흐트러진 기분과 감정이 회복되거나, 시세가 회복되는 것을 이른다. ④ 앉아야 할 자리나 지위에 앉다. 정해진 자리에 바르게 앉다. 주인의 뒤를 잇거나 첩·애인이 본처가 되다. ⑤ 형식이 바뀌다. ⑥ 아픈 곳이 좋아지다. 병이나 상처가 낫다. ⑦ 죽는 것을 이르는 사이구의 꺼림말."
底:
  底辺:
    "①数学で、三角形の頂点に対する辺や、台形の平行な二つの辺。 ②社会や集団の中の下層。": "① 삼각형에서 꼭짓점에 대응하는 변이나 사다리꼴의 평행한 두 변. 밑변. ② 사회나 집단 안의 하층."
  底本:
    翻訳・校訂・校合(キョウゴウ)などの基礎になる本。: 번역·교정·교합 등의 바탕이 되는 책. 저본.
  底:
    "①容器の下の部分。 ②一番下の部分。 ③物事の限界。 ④奥深いところ。 ⑤最も低い値をつけたところ。": "① 용기의 아래 부분. ② 가장 아래 부분. ③ 사물의 한계. ④ 깊숙한 곳. ⑤ 가장 낮은 값을 찍은 곳."
  鞋底魚:
    ウシノシタ科の海魚。: "[생물] 참서대과의 바닷물고기."
  青底翳:
    緑内障の俗称。: "녹내장의 속칭."
  底土:
    地面の下のほうにある土。: 지면 아래쪽에 있는 흙. 밑흙.
法:
  方法:
    目的を果たすためのやり方。てだて。: 목적을 이루기 위한 방식. 수단. 방법.
  法会:
    "①人を集めて仏法を説くこと。また、その集会。 ②死者の追善供養を行うこと。また、その仏事。": "① [불교] 사람을 모아 불법을 설하는 것. 또는 그 모임. ② [불교] 죽은 사람의 추선 공양을 하는 것. 또는 그 불사."
  法式:
    儀式などの定められたやり方。おきて。作法。: 의식 등의 정해진 방식. 법도. 작법.
  法律:
    国家が定めたきまり。特に、国会で制定された法規範。: 국가가 정한 규칙. 특히 국회에서 제정된 법규범. 법률.
  法る:
    基準・模範として、ならいしたがう。: 기준이나 모범으로 삼아 그대로 따르다.
  法:
    "①守るべき事柄。おきて。 ②手本。模範。 ③仏の教え。 ④寸法。さしわたし。": "① 지켜야 할 일. 법도. ② 본보기. 모범. ③ [불교] 부처의 가르침. ④ 치수. 가로지른 길이."
  法帖:
    先人の筆跡または碑文などを習字の手本や鑑賞用に模写、臨写したもの。また、石または木に刻み、これを石摺(いしずり)にした折本。一種類の筆跡を刻したものを単帖といい、多くの人の筆跡を集めたものを集帖という。集帖としては中国、宋の淳化閣帖、明の停雲館帖、清の三希堂帖などが有名。墨帖。法書。: 선인의 필적이나 비문 등을 글씨 연습의 본보기나 감상용으로 모사·임서한 것. 또는 돌이나 나무에 새겨 탁본으로 만든 절첩본. 법첩.
松:
  松柏:
    "①マツの木とカシワの木。また、常緑樹の総称。 ②志や操を守って変えないことのたとえ。": "① 소나무와 떡갈나무. 또는 상록수의 총칭. ② 뜻이나 절개를 지켜 변하지 않는 것의 비유."
  松:
    "①マツ科の常緑高木の総称。葉は針形で、樹皮はひび割れるものが多い。クロマツ・アカマツ・ゴヨウマツなど。節操・長寿の象徴とされる。 ②「松明(たいまつ)」に同じ。 ③門松(かどまつ)。また、門松を飾っておく期間。通常は元日から一月七日まで。": "① 소나무과 상록 교목의 총칭. 잎은 바늘 모양이고 수피가 갈라지는 것이 많다. 절개와 장수의 상징으로 여겨진다. ② 횃불과 같음. ③ 가도마쓰. 또는 가도마쓰를 장식해 두는 기간."
  偃松:
    マツ科の常緑低木。: "소나무과의 상록 관목. 눈잣나무."
  海松:
    緑藻類ミル科の海藻。浅い海の岩に生える。茎は濃い緑色の円柱形で、扇状に枝分かれしている。食用。ミルメ。: "[생물] 녹조류 청각과의 해조. 얕은 바다의 바위에 나며 식용한다."
  海松貝:
    ミルクイガイの別称。ミルクイバカガイ科の海産二枚貝。: "[생물] 미루쿠이가이의 별칭. 바카가이과의 해산 이매패."
  海松布:
    "「海松(みる)」に同じ。": 청각과 같음.
卒:
  兵卒:
    下級の兵士。: 하급 병사.
  卒わる:
    しめくくる。つきる。: 마무리되다. 다하다.
  何卒:
    "①相手に懇願するときに用いる語。どうか。どうぞ。ぜひとも。 ②どうにかして。なんとかして。": "① 상대에게 간청할 때 쓰는 말. 부디. 아무쪼록. ② 어떻게든."
  列卒:
    狩りのとき、鳥や獣を追い出したり、他へ逃げるのを防いだりする人。: 사냥할 때 새나 짐승을 몰아내거나 다른 곳으로 달아나지 못하게 막는 사람.
  卒去:
    身分の高い人が死ぬこと。特に、律令(リツリョウ)制では四位・五位の人の死。: 신분이 높은 사람이 죽는 것. 특히 율령제에서는 4위·5위 사람의 죽음.
  卒業:
    ①学校の所定の課程を、学びおわること。: ① 학교의 정해진 과정을 모두 마치는 것. 졸업.
阜:
  阜:
    土が大きく盛りあがってずんぐりと小高くなったところ。: 흙이 크게 솟아 둥그스름하게 조금 높아진 곳. 언덕.
  野阜:
    小高い所。野原の中にある丘。: 조금 높은 곳. 들판 가운데 있는 언덕.
  岡阜:
    小高いおか。「阜」もおか・つちやまの意。: 조금 높은 언덕. 「阜」도 언덕·흙산의 뜻.
  丘阜:
    "「丘陵(キュウリョウ)」に同じ。": 구릉과 같음.
周:
  周囲:
    "①物のまわり。四囲。 ②そのものをとりまく人や事柄。また、環境。": "① 물건의 둘레. 사방. ② 그것을 둘러싼 사람이나 사물. 또는 환경."
  周航:
    あちこちをめぐって航海すること。: 여러 곳을 돌아 항해하는 것. 주항.
  周知:
    広く多くの人々に知れわたること。: 널리 많은 사람에게 알려지는 것. 주지.
  周く:
    すみずみまで行き渡っているさま。: 구석구석까지 두루 미쳐 있는 모양.
  周り:
    そのものを囲んでいる外側のもの。周囲。周辺。: 그것을 둘러싼 바깥쪽. 주위. 주변.
  周る:
    ぐるりと一周する。: 빙 둘러 한 바퀴 돌다.
牧:
  牧師:
    キリスト教のプロテスタントで、信者の指導や教区・教会の管理をする職。また、その人。: "기독교 프로테스탄트에서 신자를 지도하고 교구·교회를 관리하는 직책. 또는 그 사람. 목사."
  牧場:
    ウシ・ウマ・ヒツジなどの家畜を放し飼いにする所。放牧場。まき。: 소·말·양 등의 가축을 방목하는 곳. 목장.
  牧畜:
    ウシ・ヒツジ・ブタなどの家畜を飼って繁殖させること。また、その仕事や産業。: 소·양·돼지 등의 가축을 길러 번식시키는 것. 또는 그 일이나 산업. 목축.
  牧:
    "「牧場(ボクジョウ)」に同じ。": 목장과 같음.
  牧舎:
    牧場で、ウシやウマなどの家畜を入れておく建物。: 목장에서 소나 말 등의 가축을 넣어 두는 건물. 축사.
  牧守:
    古代中国における地方長官。: "고대 중국의 지방 장관."
府:
  首府:
    国の中央政府がある都市。: 나라의 중앙정부가 있는 도시. 수도.
  政府:
    国家を統治する機関。日本では、内閣と、内閣が統轄する全行政機関。: 국가를 통치하는 기관. 일본에서는 내각과 내각이 통괄하는 모든 행정기관. 정부.
  府庫:
    文書や財貨・器物などを収容・貯蔵しておく建物。くら。: 문서나 재화·기물 등을 보관하고 저장해 두는 건물. 곳간.
  桜府:
    アメリカ合衆国カリフォルニア州の州都。農業・畜産が盛ん。: "[지명] 미국 캘리포니아주의 주도. 농업과 축산이 활발하다. 새크라멘토."
  華盛頓・華府:
    アメリカ合衆国の首都。州に入らず、コロンビア特別区をつくる。国会議事堂・ホワイトハウスなどがある。: "[지명] 미국의 수도. 어느 주에도 속하지 않고 컬럼비아 특별구를 이룬다. 국회의사당과 백악관 등이 있다. 워싱턴."
  寿府:
    スイス南西部の州都、レマン湖沿いの国際都市。赤十字国際委員会本部や多数の国際機関がある。時計の製造が盛ん。: "[지명] 스위스 남서부 레만호 연안의 국제도시. 적십자 국제위원회 본부와 많은 국제기관이 있으며 시계 제조가 활발하다. 제네바."
  府立:
    府で設立すること。また、そのもの。: 부에서 설립하는 것. 또는 그 기관.
  出府:
    地方から都府に出ること。特に、江戸時代、武家が江戸へ出ること。〔いろは字（1559）〕: 지방에서 도부로 나가는 것. 특히 에도 시대에 무가가 에도로 나가는 것.
参:
  降参:
    ①戦いや争いに負けて相手に服従すること。: ① 싸움이나 다툼에서 져서 상대에게 복종하는 것. 항복.
  参会:
    会合に出席すること。また、寄り合うこと。: 회합에 출석하는 것. 또는 모이는 것.
  参詣:
    神社や寺院に出向いてお参りすること。: 신사나 절에 가서 참배하는 것.
  参考:
    他の物事や考えなどをあれこれと比べ、自分の考えをまとめる手掛かりとすること。また、その材料。: 다른 사물이나 생각 등을 이모저모 견주어 자기 생각을 정리하는 실마리로 삼는 것. 또는 그 자료. 참고.
  参上:
    "「訪ねること」「行くこと」の謙譲語。参ること。伺うこと。": 「찾아가다」, 「가다」의 겸양어. 찾아뵙는 것.
  参る:
    "①「行く」「来る」の謙譲語。 ②「行く」「来る」の丁寧語。 ③神社・寺院などに行って拝む。 ④負ける。降参する。 ⑤弱くなる。閉口する。 ⑥死ぬ。 ⑦異性に心を奪われる。": "① 「가다」, 「오다」의 겸양어. ② 「가다」, 「오다」의 공손한 말. ③ 신사나 절 등에 가서 참배하다. ④ 지다. 항복하다. ⑤ 약해지다. 질리다. ⑥ 죽다. ⑦ 이성에게 마음을 빼앗기다."
  参差:
    "( 形動タリ )① 高さや長さが異なっていて、そろわないこと。等しくないこと。ふぞろいなこと。また、そのさま。② 互いに入り交じっていること。互いに交錯していること。また、そのさま。③ くいちがっていること。矛盾していること。また、そのさま。④ 願望・意図などがかなえられないこと、またそのさま。": "① 높이나 길이가 달라 가지런하지 않은 것. 고르지 않은 것. ② 서로 뒤섞여 있는 것. 서로 교차하는 것. ③ 어긋나거나 모순되는 것. ④ 바람이나 의도가 이루어지지 않는 것."
岡:
  岡阜:
    小高いおか。「阜」もおか・つちやまの意。: 조금 높은 언덕. 「阜」도 언덕·흙산의 뜻.
  岡:
    "①小高くなっている所で、山より低いもの。 ②かたわら。": "① 조금 높아진 곳으로 산보다 낮은 것. 언덕. ② 곁."
  岡っ引き:
    江戸時代、町奉行所の同心などの配下となって、犯人の探索や逮捕にあたった人。めあかし。: "에도 시대에 마치부교쇼 동심 등의 수하가 되어 범인을 찾거나 체포하던 사람."
  岡惚れ:
    "①他人の恋人をわきから好きになること。横恋慕(よこレンボ)。 ②相手の心がわからないのに恋すること。片思い。": "① 남의 연인을 옆에서 좋아하는 것. 횡연모. ② 상대의 마음을 알지 못한 채 사랑하는 것. 짝사랑."
  岡持ち:
    ふたと取っ手のついた平たいおけ。出前などで、食べ物や食器などを運ぶのに用いる。: 뚜껑과 손잡이가 달린 납작한 통. 배달 등에서 음식이나 식기 등을 나르는 데 쓴다.
  岡焼き:
    他の男女が仲がいいのをねたみ、焼きもちを焼くこと。おかやきもち。: 다른 남녀가 사이좋은 것을 시샘하여 질투하는 것.
  岡目:
    ( 「おか」は傍、局外の意 ) 他人の行為を脇から見ていること。局外者の立場から見ること。傍観。ほかめ。おかみ。: 남의 행동을 곁에서 보고 있는 것. 국외자의 입장에서 보는 것. 방관.
奈:
  奈辺:
    どのへん。どのあたり。どの点。どこ。: 어느 부근. 어느 근처. 어느 점. 어디.
  奈何・奈:
    "①事の次第。どうであるか。 ②どのように。": "① 일의 형편. 어떠한가. ② 어떻게."
  加奈陀:
    北アメリカ北部にある連邦共和国。国土は広いが大部分は寒冷地。公用語は英語とフランス語。首都はオタワ。: "[나라] 북아메리카 북부에 있는 연방공화국. 국토는 넓지만 대부분이 한랭지이며 공용어는 영어와 프랑스어이다. 수도는 오타와. 캐나다."
  巴奈馬:
    中央アメリカ最南端の共和国。パナマ運河が横断している。首都はパナマ。: "[나라] 중앙아메리카 최남단의 공화국. 파나마 운하가 가로지르며 수도는 파나마."
  奈落:
    ①地獄。②物事のどん底。③劇場の舞台や花道の床下の地下室。せり出しや回り舞台の仕掛けがある。: "① [불교] 지옥. ② 사물의 밑바닥. 나락. ③ 극장의 무대나 하나미치 바닥 아래의 지하 공간."
  奈良漬:
    シロウリやナスなどを酒粕(さけかす)に漬けこんだもの。: 참외나 가지 등을 술지게미에 절인 것. 나라즈케.
例:
  条例:
    "①地方公共団体が定める法規。 ②箇条書きにした法令。": "① 지방공공단체가 정하는 법규. 조례. ② 조목별로 쓴 법령."
  例会:
    日を決めて定期的に開く会。定例会。: 날짜를 정해 정기적으로 여는 모임. 정례회.
  例解:
    例をあげて解釈や説明をすること。また、その解釈や説明。: 예를 들어 해석하거나 설명하는 것. 또는 그 해석이나 설명.
  例外:
    通常の規定からはずれること。原則にあてはまらないこと。また、そのようなもの。: 보통의 규정에서 벗어나는 것. 원칙에 들어맞지 않는 것. 또는 그런 것. 예외.
  例える:
    わかりやすく説明するために、似かよった事柄や具体的な事柄を引き合いに出す。: 알기 쉽게 설명하기 위해 비슷한 일이나 구체적인 일을 끌어다 들다. 비유하다.
  例:
    以前にあった事柄。先例。また、手本。: 이전에 있었던 일. 선례. 또는 본보기.
  例えば:
    ［副］１ 前に述べた事柄に対して具体的な例をあげて説明するときに用いる語。例をあげていえば。「球技、例えば野球やテニスが好きだ」２ 多く「ようだ」「ごとし」を伴って、ある事柄を他の事にたとえるときに用いる語。あたかも。「君の勉強は、例えば春の雪のようで、一向に結果が積み重ならない」３ ある場合を仮定するときに用いる語。もしも。仮に。「例えばここが外国なら」「これは例えばの話だがね」４ てっとり早く言うと。端的に言えば。〈平家・六〉: "① 앞에서 말한 일에 대해 구체적인 예를 들어 설명할 때 쓰는 말. 예를 들면. ② 어떤 일을 다른 일에 비유할 때 쓰는 말. 마치. ③ 어떤 경우를 가정할 때 쓰는 말. 만약. ④ 간단히 말하면. 단적으로 말하면."
径:
  径行:
    思ったことをそのまま実行すること。: 생각한 일을 그대로 실행하는 것.
  径路:
    "①細い道。こみち。 ②通ってきた道筋。いきさつ。": "① 좁은 길. 오솔길. ② 지나온 길. 경위."
  口径:
    銃砲など円筒状のものの口の内側の直径。: 총포 등 원통형 물건의 입구 안쪽 지름. 구경.
  径:
    "①幅の狭い道。細道。 ②よこみち。近道。": "① 폭이 좁은 길. 오솔길. ② 샛길. 지름길."
    まっすぐな道路。ちかみち。また、てっとり早い方法。: 곧은 길. 지름길. 또는 손쉬운 방법.
  径庭:
    大きなへだたり。差異。: 큰 차이. 격차.
果:
  果実:
    "①植物の実。くだもの。 ②法律で、元物(ゲンブツ)から生じる収益物。鉱物などの天然果実、利息・家賃などの法定果実がある。": "① 식물의 열매. 과일. ② 원물에서 생기는 수익물. 천연과실과 법정과실이 있다."
  果物・果:
    木や草にできる果実で食用となるもの。水菓子。: 나무나 풀에 맺히는 열매로 먹을 수 있는 것. 과일.
  果:
    仕事などの進みぐあい。はかどりの程度。: 일 등의 진행 정도. 진척 정도.
  果たす:
    "①なしとげる。 ②殺す。しとめる。 ③すっかり…してしまう。…し尽くす。動詞の連用形について用いる。": "① 이루어 내다. 완수하다. ② 죽이다. 해치우다. ③ 완전히 …해 버리다. …을 다하다."
  果てる:
    "①終わる。きわまる。 ②死ぬ。 ③すっかり…する。…し終わる。動詞の連用形について用いる。": "① 끝나다. 다다르다. ② 죽다. ③ 완전히 …하다. …을 다 끝내다."
  果て:
    １ 果てること。終わること。また、物事の終わり。しまい。限り。すえ。「果てもない議論」「旅路の果て」２ 年月を経過したあとの状態。「なれの果て」「栄華の果て」３ 広い地域の極まるところ。いちばん端の所。「地の果て」「海の果て」４ 喪の終わり。四十九日の終わる日。また、一周忌。〈源・幻〉: "① 끝나는 것. 끝. 사물의 마지막. 한계. ② 세월이 지난 뒤의 상태. 말로. ③ 넓은 지역이 다다르는 곳. 가장 끝. ④ 상의 끝. 사십구일이 끝나는 날. 또는 일주기."
  果せる:
    ［動サ下一］［文］おほ・す［サ下二］動詞の連用形に付いて、完全に…する意を表す。成し遂げる。すっかりし終える。: 동사의 연용형에 붙어 완전히 …한다는 뜻을 나타낸다. 이루어 내다. 완전히 끝내다.
  映日果:
    クワ科の落葉小高木。 無花果(いちじく): "뽕나무과의 낙엽 소교목. 무화과."
芽:
  発芽:
    植物が、芽を出すこと。種子・胞子・枝芽などが生育を始めること。: "[생물] 식물이 싹을 내는 것. 씨앗·포자·가지눈 등이 생육을 시작하는 것. 발아."
  萌芽:
    "①草木の芽が出ること。また、その芽。芽生え。 ②物事のはじまり。きざし。": "① 초목의 싹이 나는 것. 또는 그 싹. ② 사물의 시작. 조짐."
  芽:
    "①植物の葉・枝・花に生長する部分。 ②卵の黄身のひなになる部分。胚(ハイ)。 ③発展する可能性をもつもののたとえ。": "① 식물의 잎·가지·꽃으로 자라는 부분. 싹. ② [생물] 알의 노른자에서 병아리가 되는 부분. 배. ③ 발전할 가능성을 가진 것의 비유."
  芽む:
    芽がふくらむ。芽を出しかかる。芽生える・萌(も)える・角(つの)ぐむ: 싹이 부풀다. 싹이 나려 하다. 싹트다.
  芽生える:
    "①「芽む」に同じ。 ②起こり始める。": "① 싹트다. ② 생겨나기 시작하다."
  腋芽:
    葉のつけねから出る芽。側芽の一種。わきめ。: "잎자루 밑에서 나오는 눈. 곁눈의 한 종류."
泣:
  感泣:
    深く感動して涙を流すこと。心に深く感じて泣くこと。: 깊이 감동하여 눈물을 흘리는 것. 마음 깊이 느껴 우는 것.
  泣く:
    "①涙を流す。 ②嘆き苦しむ。 ③やむをえず承知する。": "① 눈물을 흘리다. 울다. ② 탄식하며 괴로워하다. ③ 어쩔 수 없이 승낙하다."
  泣訴:
    苦しみや窮状を泣いて訴えること。: 괴로움이나 궁지를 울며 호소하는 것.
  泣涕:
    涙を流して泣くこと。: 눈물을 흘리며 우는 것.
  泣き寝入り:
    "①泣きながら眠りこむこと。 ②不当なことに対して不満に思いながらも、がまんしてあきらめること。": "① 울다가 잠드는 것. ② 부당한 일에 불만을 품으면서도 참고 단념하는 것."
  欷泣:
    すすり泣くこと。むせび泣くこと。: 흐느껴 우는 것. 목메어 우는 것.
協:
  協議:
    何人かが集まって相談すること。話し合って物事を決めること。: 여러 사람이 모여 의논하는 것. 의논하여 일을 정하는 것. 협의.
  協賛:
    催しの趣旨に賛同して、その実行に協力すること。また、その組織や団体。: 행사의 취지에 찬동하여 실행에 협력하는 것. 또는 그 조직이나 단체. 협찬.
  協う:
    多くのものが一つに合わさる。和合する。あう。: 많은 것이 하나로 합쳐지다. 화합하다. 맞다.
  協会:
    ある目的のために集まった会員たちが力を合わせ、維持・運営していく会。: 어떤 목적을 위해 모인 회원들이 힘을 합쳐 유지·운영하는 모임. 협회.
  協商:
    "①相談し、取りはからうこと。 ②二つ以上の国の間で、同盟関係にならない程度で相談し合って約束すること。": "① 의논하여 처리하는 것. ② 둘 이상의 나라 사이에서 동맹까지는 아니지만 서로 의논해 약속하는 것. 협상."
  協奏曲:
    独奏楽器と管弦楽とが合奏するよう作曲された器楽曲。コンチェルト。: "독주 악기와 관현악이 합주하도록 작곡된 기악곡. 협주곡."
  協奏:
    諸楽器を合奏する。〔宋史、楽志三〕律呂協奏する、是れを和聲と謂ふ。字通「協」の項目を見る。: 여러 악기가 합주하다.
季:
  季子:
    兄弟の中で末の子。すえっこ。: 형제 가운데 막내. 막내아이.
  季世:
    末の世。道徳・風俗などの衰えた時代。: 말세. 도덕이나 풍속 등이 쇠퇴한 시대.
  季節:
    一年を天候の推移によって分けたもの。春夏秋冬の四季や、雨季・乾季など。シーズン。: 한 해를 날씨의 변화에 따라 나눈 것. 봄·여름·가을·겨울의 사계절이나 우기·건기 등. 계절.
  季:
    "①末の子。 ②四季それぞれの三か月の終わりの月。 ③世の終わり。末年。": "① 막내아이. ② 사계절 각각의 석 달 가운데 끝 달. ③ 세상의 끝. 말년."
  節季候:
    近世、歳末から新年にかけて赤い布で頭を覆い「せきぞろござれや」とはやしながら家々を回り、米や金品を請い歩いた遊芸。: "근세에 세밑부터 새해에 걸쳐 붉은 천으로 머리를 덮고 집집을 돌며 쌀이나 금품을 청하던 유예."
  季刊:
    雑誌などを年に春夏秋冬の四回刊行すること。また、その刊行物。: 잡지 등을 한 해에 봄·여름·가을·겨울 네 번 간행하는 것. 또는 그 간행물. 계간.
官:
  官能:
    "①感覚を起こす諸器官のはたらき。 ②性的な快さの感覚。": "① 감각을 일으키는 여러 기관의 작용. 관능. ② 성적인 쾌감."
  官:
    "①役所。官庁。 ②役目。つとめ。官職。 ③役人。官吏。": "① 관청. ② 직무. 관직. ③ 관리. 관료."
  次官:
    律令(リツリョウ)制で、四等官の第二位。長官を補佐し、時に代理もする。: "율령제에서 사등관의 둘째 자리. 장관을 보좌하고 때로 대리도 한다."
  長官:
    律令(リツリョウ)制の四等官(シトウカン)の最上の官位。: "율령제 사등관 가운데 가장 높은 관위."
  判官:
    律令(リツリョウ)制で四等官の第三位。特に、検非違使(ケビイシ)の尉(じょう)。ほうがん。: "율령제에서 사등관의 셋째 자리. 특히 검비위사의 판관."
  官衙:
    役所。官庁。: 관청. 관아.
  官位:
    "① 官職と位階。つかさくらい。② ＝かんとう（官等）": "① 관직과 위계. 관위. ② 관등."
固:
  固持:
    自分の考えなどを、かたくもち続けて変えないこと。: 자기 생각 등을 굳게 지켜 바꾸지 않는 것. 고수.
  固体:
    一定の形や体積をもち、簡単に変形しない物体。: 일정한 모양과 부피를 가지고 쉽게 변형되지 않는 물체. 고체.
  固有:
    "①もとから備わっていること。 ②そのものだけにあること。特有。": "① 본래부터 갖추어져 있는 것. ② 그것에만 있는 것. 특유. 고유."
  固い:
    "①しっかりしていて丈夫である。きっちりしていて緩みがない。 ②厳重である。 ③きまじめだ。信用できる。 ④がんこで、融通がきかない。": "① 단단하고 튼튼하다. 꼭 맞아 느슨함이 없다. ② 엄중하다. ③ 성실하다. 믿을 수 있다. ④ 완고하여 융통성이 없다."
  固まる:
    "①かたい状態になる。 ②寄り集まる。 ③しっかりした状態になる。": "① 단단한 상태가 되다. 굳다. ② 한곳에 모이다. ③ 확고한 상태가 되다."
  固より:
    "①最初から。元来。 ②いうまでもなく。もちろん。": "① 처음부터. 본래. ② 말할 것도 없이. 물론."
  固める:
    "[ 文語形 ]かた・む ① 柔らかいものや液状のものに手を加えてかたくする。② ゆるんでいるものに力を加えてかたくしめる。また、しっかり縛る。堅固にする。座がだれないようにひきしめることにもいう。③ 鎧、兜などの武具や装束を身につける。④ かたく約束する。強く禁じる。⑤ かたく守る。警備する。⑥ 矢を放つとき、弓を引きしぼってそのままの状態でちょっと保つ。⑦ 国、家、会社などの状態や意見、決意など、あやふやでまとまりにくいものを、ゆるぎのない確実なものにする。しっかりしたものにする。強固にする。⑧ 一つの物ばかりで形づくる。ある好ましくない物事ばかりで事態に対処する。また、ある範囲、ある傾向の人たちばかりで構成する。⑨ 一つにまとめる。⑩ 柔道で、相手をおさえ込んで動けなくする。⑪ レスリングで、相手の両肩を同時にマットにつける。フォールする。": "① 부드러운 것이나 액체에 손을 가해 단단하게 하다. 굳히다. ② 느슨한 것을 단단히 조이거나 묶다. 견고하게 하다. ③ 갑옷이나 투구 등 무구와 복장을 갖추다. ④ 굳게 약속하다. 강하게 금하다. ⑤ 굳게 지키다. 경비하다. ⑥ 활을 당긴 상태로 잠시 유지하다. ⑦ 상태·의견·결의 등을 흔들림 없이 확실하게 만들다. ⑧ 한 가지 물건이나 일정한 범위의 사람들만으로 구성하다. ⑨ 하나로 모으다. ⑩ 유도에서 상대를 눌러 움직이지 못하게 하다. ⑪ 레슬링에서 상대의 두 어깨를 동시에 매트에 닿게 하다."
念:
  懸念:
    "①危ぶみ心にかけること。気になって心配すること。 ②ある対象に心を集中して考え続けること。": "① 염려하여 마음에 걸리는 것. 걱정하는 것. ② 어떤 대상에 마음을 집중하여 계속 생각하는 것."
  念書:
    後日の証拠として、念のために相手にわたす文書。: 훗날의 증거로 삼기 위해 상대에게 건네는 문서. 각서.
  念仏:
    仏の名、特に阿弥陀仏(アミダブツ)の名を唱えること。: "[불교] 부처의 이름, 특히 아미타불의 이름을 외는 것. 염불."
  念う:
    いつも心にかけて考える。忘れないで心に深くおもっている。: 늘 마음에 두고 생각하다. 잊지 않고 마음 깊이 생각하다.
  念願:
    いつも実現するように願っていること。願い。: 늘 실현되기를 바라는 것. 소원. 염원.
  念珠:
    念仏をとなえるときに使うじゅず。: "[불교] 염불을 외울 때 쓰는 염주."
英:
  英傑:
    才知にあふれ実行力を備えた人物。: 재치가 뛰어나고 실행력을 갖춘 인물. 영걸.
  英:
    小さな花が集まって房状に垂れさがって咲くもの。: 작은 꽃들이 모여 송이처럼 늘어져 피는 것.
  英でる:
    才能が抜きんでている。他のものより特にすぐれている。: 재능이 뛰어나다. 다른 것보다 특히 우수하다.
  英吉利:
    ヨーロッパ大陸の北西、大西洋上にあるグレート－ブリテン島とアイルランド島の北部、また付近の島々からなる立憲連合王国。首都はロンドン。: "[나라] 유럽 대륙 북서쪽 대서양상의 그레이트브리튼섬과 아일랜드섬 북부 및 주변 섬들로 이루어진 입헌연합왕국. 수도는 런던. 영국."
  英倫・英蘭土:
    イギリスのグレート－ブリテン島の中・南部を占める地方の名。同国の主要地域。: "[지명] 영국 그레이트브리튼섬의 중부와 남부를 차지하는 지방 이름. 잉글랜드."
  英斤:
    ヤード－ポンド法の質量の単位。: "[단위] 야드파운드법의 질량 단위. 파운드."
  英国:
    ( 「英」は「イギリス」のあて字「英吉利」の略 ) イギリスの別称。英。: "[나라] 영국의 별칭."
刷:
  印刷:
    文字・絵などの版面にインクをつけ、紙・布などに刷ること。また、その技術。: 문자나 그림 등의 판면에 잉크를 묻혀 종이나 천 등에 찍는 것. 또는 그 기술. 인쇄.
  刷新:
    悪い点をすべて取りのぞいて、新しくすること。: 나쁜 점을 모두 없애고 새롭게 하는 것. 쇄신.
  刷る:
    "①印刷する。 ②版木などにインク・絵の具などを塗って、紙を当ててこすり、字や絵を写し取る。": "① 인쇄하다. ② 판목 등에 잉크나 물감을 칠하고 종이를 대어 문질러 글자나 그림을 찍어 내다."
  刷く:
    はけ・筆などでこする。こするように塗る。: 솔이나 붓 등으로 문지르다. 문지르듯 바르다.
  刷毛・刷子:
    塗料やのりなどを塗ったり、ほこりを払ったりする道具。獣毛などを束ねて柄をつけたもの。ブラシ。: 칠감이나 풀 등을 바르거나 먼지를 터는 도구. 짐승 털 등을 묶어 자루를 단 것. 솔.
  刷子:
    "「刷毛(はけ)」に同じ。": 솔과 같음.
勇:
  勇退:
    後進に道を譲るため、潔く自分から地位を退くこと。: 후진에게 길을 열어 주기 위해 깨끗이 스스로 지위에서 물러나는 것.
  勇む:
    勇気がわいてきて張り切る。心が奮い立つ。: 용기가 솟아 의욕이 넘치다. 마음이 분발하다.
  勇敢・勇悍:
    勇気があり、自ら進んで困難に立ち向かうさま。: 용기가 있어 스스로 어려움에 맞서는 모양. 용감함.
  勇気:
    何物もおそれない強い心。勇ましい気力。: 어떤 것도 두려워하지 않는 강한 마음. 용기.
  勇俠:
    勇気があって、義俠に富む気性。また、そのさま。: 용기가 있고 의협심이 풍부한 기질. 또는 그런 모양.
  勇決:
    勇気をもって決めること。思いきりよく決断すること。: 용기를 가지고 결정하는 것. 과감하게 결단하는 것.
  勇敢:
    ( 形動 )( 「よう」は「勇」の漢音 ) 勇ましくて強いこと。物事に恐れず大胆なこと。勇気があって果断なこと。また、そのさま。ゆうかん。: 용맹하고 강한 것. 일을 두려워하지 않고 대담한 것. 용기가 있고 과단성 있는 것.
  勇ましい:
    "[ 文語形 ]いさまし ( 動詞「いさむ（勇）」の形容詞化。勇むさまであるのをいう )① 気乗りがしている。気が進んでいる。② 勢いが強く、しりごみしない。勇敢である。③ 様子が活気に満ちている。勇壮である。④ 女性の、不良性を帯びていたり、つつましさに欠け、大胆な行動をとったりするさま。〔特殊語百科辞典（1931）〕": "① 마음이 내키고 의욕이 있다. ② 기세가 강하고 물러서지 않는다. 용감하다. ③ 모습이 활기에 차 있다. 용장하다. ④ 여성이 불량한 기질을 띠거나 조심성이 부족해 대담하게 행동하는 모양."
要:
  要求:
    "①当然であるとして、それを強くもとめること。 ②必要とすること。": "① 당연하다고 여기며 강하게 요구하는 것. ② 필요로 하는 것."
  要撃:
    待ちぶせして敵を攻撃すること。: 매복하여 적을 공격하는 것. 요격.
  要旨:
    長い文章や談話などの重要な部分。また、それをまとめたもの。: 긴 글이나 담화 등의 중요한 부분. 또는 그것을 정리한 것. 요지.
  要所:
    ①大切な箇所。: ① 중요한 곳. 요처.
  要る:
    必要である。なくてはならない。: 필요하다. 없어서는 안 되다.
  要:
    "①扇をとじたり広げたりするため、骨の末端にはめこむくぎ。 ②最も大切なところ。 ③「要黐(かなめもち)」の略。": "① 부채를 접거나 펼치기 위해 살 끝에 끼우는 못. ② 가장 중요한 곳. 요점. ③ 가나메모치의 준말."
単:
  単独:
    ただ一人、または、一つだけであること。: 단 한 사람 또는 하나뿐인 것. 단독.
  単・単衣:
    裏地をつけない和服。ひとえもの。袷(あわせ): 안감을 대지 않은 일본옷. 홑옷.
  単寧:
    植物の樹皮や葉などに含まれる渋味の成分。インクや染料の原料。五倍子(ふし)・没食子(モッショクシ)などからとる。: 식물의 수피나 잎 등에 들어 있는 떫은맛 성분. 잉크나 염료의 원료. 타닌.
  単于:
    中国北方の遊牧騎馬民族、匈奴(キョウド)の君主の称号。: "중국 북방의 유목 기마 민족 흉노 군주의 칭호. 선우."
  単位:
    "①ものをはかるときの基準となる量。長さのメートルや重さのグラムなど。 ②全体を構成する基本となる、ひとまとまり。 ③学習量をはかるときの基準。": "① 물건을 잴 때 기준이 되는 양. ② 전체를 구성하는 기본 단위. ③ 학습량을 재는 기준. 단위."
  単一:
    ①一つ。一人。: ① 하나. 한 사람. 단일.
城:
  城:
    "「城(しろ)」に同じ。": 성과 같음.
    "①外敵を防ぐための堀や垣をめぐらせた建築物。城郭。 ②他人の介入を許さない、自分だけの領域のたとえ。": "① 외적을 막기 위해 해자나 담을 둘러친 건축물. 성곽. ② 남의 개입을 허락하지 않는 자기만의 영역의 비유."
  磯城:
    "①石で築いた砦(とりで)や城。 ②周囲を石で築いた祭場。": "① 돌로 쌓은 요새나 성. ② 둘레를 돌로 쌓은 제사 장소."
  山城・山背:
    旧国名で、五畿内(キナイ)の一つ。現在の京都府の南東部。城州(ジョウシュウ)。: "[지명] 옛 나라 이름으로 오기나이의 하나. 현재의 교토부 남동부."
  平城:
    奈良時代、平城京(へいじょうキョウ)が置かれた所。現在の奈良市付近。: "[지명] 나라 시대에 헤이조쿄가 있던 곳. 현재의 나라시 부근."
  城郭・城廓:
    "①城の外側の囲い。 ②「城(しろ)」に同じ。": "① 성의 바깥 둘레. 성곽. ② 성과 같음."
  城主:
    "① 一城の主。城将。② 江戸時代、国持と準国主以外で、居城をもっていた大名。": "① 한 성의 주인. 성주. ② 에도 시대에 구니모치와 준국주 이외로 거성을 가진 다이묘."
  城下:
    "( 古く「しょうか」とも )① 城の下。城壁の下。城壁の外。② ＝じょうかまち（城下町）③ 「じょうか（城下）の盟」の略。〔戦国策‐楚策・懐王〕": "① 성 아래. 성벽 아래. 성벽 밖. ② 성하 마을. ③ 「성하의 맹」의 준말."
  城州:
    山城(やましろ)国の別称。: "[지명] 야마시로국의 별칭."
飛:
  飛脚:
    "①昔、急ぎの用を遠くに知らせる使者。 ②江戸時代、手紙や金品などを遠くに送り届けることを職業とした人。": "① 옛날에 급한 일을 멀리 알리던 사자. ② 에도 시대에 편지나 금품 등을 먼 곳에 보내는 일을 직업으로 하던 사람."
  飛語:
    根拠のない無責任なうわさ。デマ。飛言: 근거 없는 무책임한 소문. 유언비어.
  飛行:
    空中を飛んで進むこと。: 공중을 날아 나아가는 것. 비행.
  飛散:
    飛び散ること。細かくなって散乱すること。: 흩날리는 것. 잘게 되어 흩어지는 것. 비산.
  飛車:
    縦と横にいくつでも進退できる将棋の駒(こま)。成れば竜王といい、さらに斜めに一つずつ動くことができる。: "세로와 가로로 얼마든지 움직일 수 있는 쇼기의 말. 승격하면 용왕이 되어 대각선으로도 한 칸씩 움직일 수 있다. 비차."
  飛泉:
    ①高い所から勢いよく落ちる水。滝。瀑布(バクフ)。: ① 높은 곳에서 힘차게 떨어지는 물. 폭포.
  飛州:
    飛騨国の別称。: "[지명] 히다국의 별칭."
  飛ばす:
    "① 空をとぶようにする。空を翔(かけ)らせる。また、空中にとんで見えなくなる。② 魂などを空にとび去らせる。死なせる。③ 空中にはねあげる。ひるがえす。④ 空中にちらす。散乱させる。⑤ 射る。放つ。発する。⑥ とぶように速く進ませる。馬・車などを急いで走らせる。⑦ すみやかに伝える。あまねく広める。くばる。⑧ 人を遠方の勤務地などに移す。また、下位に移す。左遷する。⑨ とびこして先へ移る。順序を越えて先へゆく。⑩ 勢いよく言葉を発する。また、遠慮なくしゃべる。(ト)ばし小手を振って引倒さうとする」〈日本青年教育会〉駒ケ嶽の凋落と太刀山の独舞台)⑭ ( 動詞に付いて ) その動作の勢いがはげしいことを表わす。「笑いとばす」": "① 하늘을 날게 하다. 공중으로 날려 보내다. ② 혼 등을 떠나게 하다. 죽게 하다. ③ 공중으로 튀어 오르게 하다. ④ 공중에 흩뜨리다. ⑤ 쏘다. 발하다. ⑥ 나는 듯이 빠르게 나아가게 하다. ⑦ 신속히 전하다. 널리 퍼뜨리다. ⑧ 사람을 먼 근무지나 낮은 자리로 보내다. 좌천하다. ⑨ 건너뛰어 앞으로 나아가다. ⑩ 기세 좋게 말을 내뱉다. ⑪ 동사에 붙어 그 동작의 기세가 세다는 뜻을 나타낸다."
  飛ぶ:
    "① 空をかける。鳥や飛行機などが空中を行く。空中を舞う。高く舞いあがる。とむ。② 空を切って行く。比喩的に勢いよく対象に向かって動作がしかけられたり、言葉が発せられたりする。(ト)んで来るのを待ってゐた」〈夏目漱石〉兄)「激しい剥きだしの呪詛の声がとんできたし」〈芝木好子〉)③ はねる。跳躍する。おどる。④ 空中に散る。空(くう)に散乱する。飛散する。⑤ ( 宙にはね上がるようにして落ちる意から ) 切れる。切られる。「首が飛ぶ」⑥ 走る。かける。速く行く。走りまわる。⑦ ( 多く「飛んで行く」「飛んで来る」「飛んで出る」などの形で用いて ) 急いで移動する。あわててやる。⑧ 飛行機などに乗って目的地へ行く。⑨ 視線や気持などが離れたところにすばやく向く。(ト)ばせた」〈徳富蘆花〉五)⑩ すぐになくなる。消えてしまう。(ト)んでしまふし」四幕)⑪ 間を越えて先へ移る。間を省略して次に行く。また、順序に従わずへだたる。他に移る。はなれる。": "① 하늘을 날다. 새나 비행기 등이 공중을 가다. ② 공중을 가르며 가다. 비유적으로 동작이나 말이 기세 좋게 대상에게 향하다. ③ 뛰다. 도약하다. ④ 공중에 흩어지다. ⑤ 끊어지다. 잘리다. ⑥ 달리다. 빠르게 가다. ⑦ 급히 이동하다. 서둘러 하다. ⑧ 비행기 등을 타고 목적지로 가다. ⑨ 시선이나 마음이 떨어진 곳으로 빠르게 향하다. ⑩ 곧 없어지다. 사라지다. ⑪ 중간을 건너뛰어 앞으로 옮겨 가다."
香:
  香気:
    よいにおい。かおり。: 좋은 냄새. 향기.
  香:
    よいにおい。かおり。: 좋은 냄새. 향기.
  香り:
    よいにおい。: 좋은 냄새. 향기.
  香る:
    よいにおいがする。香気がただよう。: 좋은 냄새가 나다. 향기가 풍기다.
  香しい:
    においがよい。: 냄새가 좋다. 향기롭다.
    "[ 文語形 ]かんばし ( 「かぐわしい（芳）」の変化した語 )① かおりが高い。においがよい。② ほまれが高い。評判がよい。りっぱである。現代では下に打消の語を伴うことが多い。③ 好ましい。望ましい。思わしい。現代では下に打消の語を伴うことが多い。": "① 향기가 짙다. 냄새가 좋다. ② 명성이 높다. 평판이 좋다. 훌륭하다. ③ 바람직하다. 좋게 여겨진다."
  鬱金香:
    ユリ科の多年草。小アジア原産。春、花茎の先に赤・白・黄色などのつりがね形の花をつける。: "백합과의 여러해살이풀. 소아시아 원산으로 봄에 꽃줄기 끝에 붉은색·흰색·노란색 등의 종 모양 꽃이 핀다. 튤립."
建:
  建議:
    ①上位の者に意見を申し立てること。また、その意見。: ① 윗사람에게 의견을 올려 말하는 것. 또는 그 의견. 건의.
  建国:
    新しく国を建てること。国家をおこすこと。: 새로 나라를 세우는 것. 국가를 일으키는 것. 건국.
  建水:
    水こぼし。茶道で、茶碗(チャワン)をすすいだ水を入れる器。: 다도에서 찻잔을 헹군 물을 담는 그릇.
  建てる:
    "①建物を建造する。 ②国家をおこす。組織をつくる。": "① 건물을 세우다. ② 국가를 일으키다. 조직을 만들다."
  建蘭:
    ラン科の多年草。中国原産。葉は厚く細長い。夏から秋、黄緑色などの芳香のある花をつける。オラン。: "난초과의 여러해살이풀. 중국 원산으로 잎은 두껍고 가늘며 길다. 여름부터 가을에 황록색 등의 향기로운 꽃이 핀다."
  建言:
    政府、官庁などに意見を申し述べること。: 정부나 관청 등에 의견을 말하는 것. 건언.
  建つ:
    ［動タ五（四）］《「立つ」と同語源》建物などがつくられる。［動タ下二］「た（建）てる」の文語形。: 건물 등이 세워지다.
浅:
  浅学:
    "①学問・知識が、まだ十分身についていないこと。 ②自分の学識の謙称。": "① 학문이나 지식이 아직 충분히 몸에 배지 않은 것. ② 자기 학식의 겸칭. 천학."
  浅い:
    "①底や奥までの距離が短い。 ②薄い。淡い。 ③程度や度合いが少ない。": "① 바닥이나 안쪽까지의 거리가 짧다. 얕다. ② 엷다. ③ 정도나 수준이 낮다."
  浅葱:
    ユリ科の多年草。山野に自生。野菜として栽培もする。葉は筒状の淡緑色でネギに似る。センボンワケギ。: "백합과의 여러해살이풀. 산야에 자생하며 채소로도 재배한다. 잎은 통 모양의 연녹색으로 파와 비슷하다."
    緑がかった薄い青色。: 녹색을 띤 옅은 파란색. 연청색.
  浅手・浅傷:
    軽い傷。: 가벼운 상처.
  浅甕:
    酒をつくるのに用いた底が浅いかめ。: 술을 빚는 데 쓰던 바닥이 얕은 항아리.
  浅海:
    "① 一般に浅い海のことをいう。② 海岸から大陸棚の外縁までの海。深さはゼロ～二〇〇メートル。": "① 일반적으로 얕은 바다. ② 해안에서 대륙붕 바깥 가장자리까지의 바다. 깊이는 0-200미터."
  浅紅:
    うすい紅色。うすくれない。ももいろ。淡紅。: 옅은 붉은색. 연분홍색. 담홍색.
約:
  誓約:
    固く約束すること。また、その約束。: 굳게 약속하는 것. 또는 그 약속. 서약.
  大約:
    おおよそ。あらまし。: 대략. 개요.
  約言:
    "①要点をかいつまんでいうこと。 ②語中に並んだ二つ以上の音節の、一つが省略されること。「さしあぐ」が「ささぐ」となる類。": "① 요점을 간추려 말하는 것. ② 단어 안에 나란히 있는 둘 이상의 음절 가운데 하나가 생략되는 것."
  約束:
    "①先のことについて、相手に対して誓うこと。また、互いに取り決めること。 ②決まりごと。ルール。 ③運命的な因縁。運命により定まっていること。": "① 앞일에 대해 상대에게 맹세하는 것. 또는 서로 정하는 것. 약속. ② 규칙. ③ 운명적인 인연. 운명으로 정해져 있는 것."
  約分:
    分数・分数式の分母と分子とを、公約数で割ること。約すこと。: "분수나 분수식의 분모와 분자를 공약수로 나누는 것. 약분."
  倹約:
    ( 形動 ) 出費をできるだけへらし、浪費しないこと。むだづかいをしないで費用を切りつめること。また、そのさま。節倹。節約。: 지출을 되도록 줄이고 낭비하지 않는 것. 헛돈을 쓰지 않고 비용을 아끼는 것. 절약.
    金や物を無駄に使わないこと。きりつめて、質素にすること。: 돈이나 물건을 헛되이 쓰지 않는 것. 아껴 쓰며 검소하게 하는 것.
  約める:
    "[ 文語形 ]つづ・む ① 長さを小さくする。短くする。ちぢめる。② 量を少なくする。内容をまとめて簡単にする。内容を要約する。③ ちぢめておさめる。小さくまとめてしまいこむ。④ 材料・費用などを節約する。質素にする。また、生活を切りつめる。": "① 길이를 작게 하다. 짧게 줄이다. ② 양을 줄이다. 내용을 간단히 요약하다. ③ 작게 줄여 넣다. ④ 재료나 비용 등을 절약하다. 검소하게 하다."
  約しい:
    ［形］［文］つま・し［シク］生活ぶりなどがぜいたくでない。地味で質素である。[派生]つましげ［形動］つましさ［名］: 생활 방식 등이 사치스럽지 않다. 수수하고 검소하다.
茨:
  茅茨:
    かやといばら。また、屋根をそれでふいた質素な家。: 띠와 가시나무. 또는 그것으로 지붕을 인 소박한 집.
  茨:
    ①とげのある低木の総称。バラ・カラタチなど。: ① 가시가 있는 관목의 총칭. 장미나 탱자나무 등.
  猿捕茨:
    ユリ科のつる性落葉低木。山野に自生。茎にとげ、葉柄に巻きひげがある。初夏、黄緑色の小花が咲き、晩秋、赤い実を結ぶ。サンキライ。カカラ。: "백합과의 덩굴성 낙엽 관목. 산야에 자생하며 줄기에 가시가 있고 잎자루에 덩굴손이 있다."
  茨棘:
    はまびしと、いばら。田舎。〔後漢書、仲長統伝〕（昌言、理乱）興りて以來、相ひ與(とも)に同じく齊民と爲る。財力を以て相ひ君長となる、世數ふる無し。而れどもの士、徒(た)だ自ら茨棘のにしみ、風俗に損する無し。字通「茨」の項目を見る。: 남가새와 가시나무. 시골.
変:
  変化:
    ①物事の性質や状態などが変わること。: ① 사물의 성질이나 상태 등이 바뀌는 것. 변화.
    ①神仏が、仮に人の姿になって現世に現れること。また、そのもの。: "① [불교] 신불이 임시로 사람의 모습이 되어 현세에 나타나는 것. 또는 그 존재."
  変則:
    ふつうの規則や規定からはずれていること。: 보통의 규칙이나 규정에서 벗어나 있는 것. 변칙.
  変わる:
    "①状態・位置・性質などが、以前と異なる状態になる。 ②ふつうとちがう。": "① 상태·위치·성질 등이 이전과 다른 상태가 되다. 바뀌다. ② 보통과 다르다."
  変位:
    物体が位置を変えること。また、その移動した変化の量。: "물체가 위치를 바꾸는 것. 또는 이동한 변화량. 변위."
  変異:
    ①ふつうでない出来事。: ① 보통이 아닌 사건. 변이.
  変える:
    ［動ア下一］［文］か・ふ［ハ下二］１ 物事を以前と違った状態・内容にする。変化させる。変更する。２ 物の位置や場所を別の所に移す。また、別の期日・時間にする。変更する。[補説]表記の使い分けについて→換える［補説］: "① 사물을 이전과 다른 상태나 내용으로 만들다. 변화시키다. 변경하다. ② 물건의 위치나 장소를 다른 곳으로 옮기다. 또는 다른 기일이나 시간으로 바꾸다."
便:
  便船:
    ちょうど都合よく出る船。また、それに乗ること。: 마침 편리하게 떠나는 배. 또는 그 배를 타는 것.
  便箋:
    手紙を書くために用いる紙。書簡箋。レターペーパー。: 편지를 쓰는 데 쓰는 종이. 편지지.
  便衣:
    ふだん着。簡単で便利な服の意から。: 평상복. 간편하고 편리한 옷이라는 뜻에서 나온 말.
  便ち:
    "①…するとすぐに。そのまま。〈『桃花源記』〉 ②つまり。言いかえると。": "① …하자마자 곧. 그대로. ② 즉. 바꾸어 말하면."
  便り:
    様子を知らせること。音信。手紙。: 형편을 알리는 것. 소식. 편지.
  便:
    たよりとなる物や人。よりどころ。: 의지가 되는 물건이나 사람. 의지할 곳.
  便所:
    "① ( 便所 ) 適当な所。適切な所。② 室町時代、将軍や貴顕の邸宅で、頭髪をととのえたり衣服をあらためたりした所。便宜所。": "① 적당한 곳. 알맞은 곳. ② 무로마치 시대에 쇼군이나 귀인의 저택에서 머리나 옷차림을 가다듬던 곳."
  便巧:
    ( 形動 ) たくみに人のきげんをとってへつらうこと。また、その人やそのさま。〔新語‐輔政〕: 교묘하게 남의 비위를 맞추어 아첨하는 것. 또는 그런 사람이나 모양.
栃:
  栃:
    トチノキ科の落葉高木。山地に自生。葉は大きな五～七枚の小葉からなる複葉で、てのひら形。実は食用。トチノキ。: "칠엽수과의 낙엽 교목. 산지에 자생하며 잎은 손바닥 모양의 겹잎이고 열매는 식용한다."
  栃麺棒:
    "①トチの実を原料とした食品の栃麺をのばす棒。 ②うろたえあわてること。また、あわて者。": "① 칠엽수 열매를 원료로 한 도치멘을 펴는 막대. ② 허둥지둥 당황하는 것. 또는 당황하는 사람."
昨:
  昨日:
    "①今日の一日前の日。 ②近い過去。": "① 오늘의 하루 전날. 어제. ② 가까운 과거."
    "「昨日(きのう)」に同じ。": 어제와 같음.
  昨今:
    このごろ。きのうきょう。近頃(ちかごろ)。近い過去から現在までを漠然というときに用いる。: 요즘. 근래. 가까운 과거부터 현재까지를 막연히 이를 때 쓰는 말.
  一昨日:
    きのうの前の日。おとつい。: 그제. 어제의 전날.
  一昨年:
    去年の前の年。前前年。: 재작년. 지난해의 전해.
  昨夜:
    昨日の夕方、または夜。昨晩。: 어제 저녁 또는 밤. 어젯밤.
軍:
  軍記:
    戦争の話を書いた書物。: 전쟁 이야기를 쓴 책. 군기.
  軍勢:
    兵隊の数などから見た軍の勢力。また、軍隊。: 병사의 수 등으로 본 군의 세력. 또는 군대.
  軍:
    "①たたかい。戦争。合戦(カッセン)。 ②兵士。軍隊。": "① 싸움. 전쟁. 전투. ② 병사. 군대."
  軍鶏:
    ニワトリの一種。くちばしが鋭く、首が長い。あしは太く大きな蹴爪(けづめ)をもつ。闘鶏(トウケイ)用。食用にもする。: "[생물] 닭의 한 종류. 부리가 날카롭고 목이 길며 다리가 굵고 큰 며느리발톱이 있다. 투계용이며 식용도 한다."
  軍役:
    "①軍人として軍務に服すること。 ②戦争。": "① 군인으로서 군무에 복무하는 것. ② 전쟁."
  軍靴:
    軍隊用のくつ。軍人のはく、革でできた丈夫なくつ。: 군대용 구두. 군인이 신는 튼튼한 가죽 신.
  救世軍:
    ( [英語] The Salvation Army の訳語 ) キリスト教プロテスタントの一派。一八六五年、ウィリアム=ブースによって、イギリスのロンドンに創始された東ロンドン伝道会に始まり、一八七八年以後、救世軍と称し、軍隊組織により伝道、教育、社会事業などを行ない、世界的に発展。明治二八年（一八九五）、日本に渡来した。: "기독교 프로테스탄트의 한 파. 1865년 영국 런던에서 시작되어 1878년 이후 구세군이라 불렸고, 군대식 조직으로 전도·교육·사회사업 등을 수행하며 세계적으로 발전했다."
省:
  省略:
    簡潔にするため一部を省くこと。: 간결하게 하기 위해 일부를 덜어 내는 것. 생략.
  省察:
    自らを振り返り、反省して考えること。: 스스로를 돌아보고 반성하여 생각하는 것. 성찰.
  省みる:
    自分の言動を振り返って善悪を考える。反省する。: 자기 언행을 돌아보고 선악을 생각하다. 반성하다.
  省く:
    不要なものを取り除いて簡潔にする。省略する。: 불필요한 것을 덜어 내어 간결하게 하다. 생략하다.
  省力:
    機械などの導入によって、人間の労力を軽減すること。: 기계 등의 도입으로 사람의 노동력을 줄이는 것. 성력.
  冠省:
    手紙において、時候のあいさつや前文などを省くこと。また、そのときに書く語。: 편지에서 계절 인사나 앞말 등을 생략하는 것. 또는 그때 쓰는 말.
  省問:
    事情を聞きとどける。〔潜夫論、述赦〕被(ひゑん)の家、～能く闕(けつ)（宮城）に至る、に數人も無し。其の省問を得る、百の一にぎず。字通「省」の項目を見る。: 사정을 들어 살피다.
栄:
  栄華:
    権力や財力をわがものとして、はなやかにさかえること。: 권력이나 재력을 차지하여 화려하게 번영하는 것. 영화.
  栄える:
    盛んになる。繁盛する。繁栄する。: 번성해지다. 번창하다. 번영하다.
    "[ 文語形 ]は・ゆ ① 光に照らされて輝く。映り輝く。反映する。② さかえる。いっそうさかんになる。(ハ)えない」〈森鴎外〉)③ 光があって見事なさまにある。見た目によくうつる。美しく見える。引き立って見える。": "① 빛을 받아 빛나다. 비쳐 빛나다. 반영하다. ② 번영하다. 더욱 번성하다. ③ 빛이 있어 훌륭하게 보이다. 아름답게 보이다. 돋보이다."
  栄え:
    名誉。ほまれ。栄光。: 명예. 영예. 영광.
  栄螺:
    リュウテンサザエ科の巻貝。日本近海の岩礁にすむ。こぶし状で、太いとげのような突起をもつものが多い。食用。: "[생물] 소라과의 고둥. 일본 근해의 암초에 살며 식용한다."
  栄蘭:
    タコノキ科の常緑小高木。 露兜樹(たこのき): "판다누스과의 상록 소교목. 타코노키."
  栄冠:
    輝かしい勝利をたたえて与えられるかんむり。: 빛나는 승리를 기려 주는 관. 영관.
  栄やす:
    "① 立派に見えるようにする。映えるようにする。引き立てる。② 賞美する。ほめそやす。": "① 훌륭하게 보이도록 하다. 돋보이게 하다. ② 찬미하다. 칭송하다."
信:
  信仰:
    神仏などを心から信じ敬うこと。また、神仏などをかたく信じる心。: "신불 등을 마음 깊이 믿고 공경하는 것. 또는 굳게 믿는 마음. 신앙."
  信号:
    "①色・音・光・電波など言葉でない符号で意思を伝達する方法。また、その符号。 ②道路などにある交通規制のための機械。": "① 색·소리·빛·전파 등 말이 아닌 부호로 뜻을 전달하는 방법. 또는 그 부호. ② 도로 등에 있는 교통 규제용 장치. 신호."
  信書:
    個人と個人の間で意思などを通ずる文書。書状。手紙。書簡。: 개인과 개인 사이에서 뜻 등을 전하는 문서. 서신. 편지.
  信:
    まごころ。誠意。うそいつわりのないこと。真実。: 진심. 성의. 거짓이 없는 것. 진실.
  信天翁:
    アホウドリ科の鳥。乱獲で減り、伊豆諸島の鳥島でのみ繁殖。翼を広げると二(メートル)をこす。全体に白色で、翼と尾羽の先端は黒褐色。特別天然記念物。国際保護鳥。: "[생물] 알바트로스과의 새. 남획으로 줄어 이즈 제도의 도리시마에서만 번식한다. 특별천연기념물이자 국제 보호조."
  信義:
    約束を守り相手に対する道義的な務めを果たすこと。: 약속을 지키고 상대에 대한 도의적 의무를 다하는 것. 신의.
    約束を果たし、人として正しい行いをすること。: 약속을 지키고 사람으로서 올바르게 행동하는 것. 신의.
  信州:
    信濃国（長野県）の異称。: "[지명] 시나노국, 곧 나가노현의 이칭."
祝:
  祝禱:
    キリスト教で、牧師または司祭が礼拝に来た人々を祝福して神に祈ること。また、その祈り。: "기독교에서 목사나 사제가 예배에 온 사람들을 축복하며 신에게 기도하는 것. 또는 그 기도."
  巫祝:
    神に仕える者。かんなぎ。みこ。: 신을 섬기는 사람. 무당. 무녀.
  祝う:
    "①めでたいことを喜ぶ。ことほぐ。 ②祝福の贈り物をする。 ③幸いを祈る。": "① 경사스러운 일을 기뻐하다. 축하하다. ② 축하 선물을 하다. ③ 행복을 빌다."
  褌祝:
    九州地方の成年式。一三歳前後に、男の子は褌(ふんどし)を、女の子は腰巻きを初めて着けて祝う。: "규슈 지방의 성년식. 열세 살 전후에 남자아이는 훈도시를, 여자아이는 허리두름을 처음 착용하며 축하한다."
  祝詞:
    神をまつり、神に祈るときの古い文体の言葉。のりとごと。: "신을 모시고 신에게 기도할 때 쓰는 고풍스러운 문체의 말. 노리토."
  祝典:
    祝いのための式典。〔英和外交商業字彙（1900）〕: 축하를 위한 식전. 축전.
  祝歌:
    祝ってうたう歌。祝ってよむ歌。: 축하하여 부르는 노래. 축하하여 읊는 노래.
孫:
  外孫:
    嫁いだ娘が生んだ子。: 시집간 딸이 낳은 아이. 외손.
  孫:
    "①子の子。 ②もとのものから一つ隔てた関係であること。": "① 자식의 자식. 손자. ② 원래 것에서 하나 떨어진 관계인 것."
  玄孫:
    孫の孫。ひまごの子。: 손자의 손자. 고손.
  公孫樹:
    イチョウ科の落葉高木。: "은행나무과의 낙엽 교목. 은행나무."
  曽孫:
    孫の子ども。: 손자의 자식. 증손.
  孫子:
    "①孫と子。 ②子孫(シソン)。": "① 손자와 자식. ② 자손."
害:
  害悪:
    他の害となる悪いこと。害毒。: 다른 것에 해가 되는 나쁜 일. 해악.
  害なう:
    傷つける。さまたげる。害する。: 상하게 하다. 방해하다. 해치다.
  害する:
    "①そこなう。悪くする。 ②殺す。 ③さまたげる。じゃまをする。": "① 해치다. 나쁘게 하다. ② 죽이다. ③ 방해하다. 훼방하다."
  害虫:
    人間・家畜・農作物・樹木などに害を与える虫。ダニ・アブラムシ・ハエなど。: 사람·가축·농작물·나무 등에 해를 주는 벌레. 해충.
  害毒:
    心身や社会に悪い影響を与えるもの。害悪。: 심신이나 사회에 나쁜 영향을 주는 것. 해독.
  干害:
    ひでりのための水不足で起こる、農作物などの被害。: 가뭄으로 인한 물 부족 때문에 생기는 농작물 등의 피해. 한해.
徒:
  徒刑:
    罪人を労役につかせる刑罰。中国古代に行われた五刑の一つ。: 죄인을 노역에 종사하게 하는 형벌. 중국 고대에 시행된 오형의 하나.
  徒手:
    手だけ。手に何も持たないこと。素手。: 손뿐인 것. 손에 아무것도 들지 않은 것. 맨손.
  徒食:
    仕事をせずに、ぶらぶらと遊んで日々を暮らすこと。: 일하지 않고 빈둥거리며 나날을 보내는 것.
  徒弟:
    "①弟子。門人。 ②商人や職人の家に住み込みで働く見習いの少年。": "① 제자. 문인. ② 상인이나 장인의 집에 들어가 숙식하며 일하는 견습 소년. 도제."
  徒党:
    一緒に事を行うために集まる仲間や一味。: 함께 일을 하기 위해 모인 무리나 일당.
  徒歩:
    乗り物などを使わずに、足で歩くこと。かち。: 탈것 등을 쓰지 않고 걸어서 가는 것. 도보.
  徒に:
    ( 形容動詞「いたずらなり」の連用形の副詞化 ) 何ら目的、理由、原因などがないのに、物事をしたり、また、状態が進行したりするさまが甚だしいさまを表わす語。むやみやたらに。わけもなく。ただひたすら。: 아무 목적·이유·원인 없이 일을 하거나 상태가 심하게 진행되는 모양을 나타내는 말. 공연히. 덧없이. 그저 한결같이.
  徒:
    "《「直」と同語源》［名］１ 取り立てて値打ちや意味がないこと。普通。２ 何事もなく、そのままであること。無事。３ （只）代金のいらないこと。また、報酬のないこと。無料。［形動ナリ］１ ありきたり。また、ありのまま。〈源・宿木〉２ 何事もないさま。〈和泉式部日記〉[補説]3は「只」の字を「ロ」と「ハ」とに分け、俗に「ろは」という。": "① 특별한 값어치나 의미가 없는 것. 보통. ② 아무 일 없이 그대로인 것. 무사함. ③ 대금이 필요 없는 것. 또는 보수가 없는 것. 무료. ④ 흔한 모양. 있는 그대로의 모양."
特:
  特色:
    他と異なる点。他よりすぐれている箇所。: 다른 것과 다른 점. 다른 것보다 뛰어난 부분. 특색.
  加特力:
    キリスト教の一派。カトリック教会。また、その信仰や信者。: "기독교의 한 파. 가톨릭교회. 또는 그 신앙이나 신자."
  特牛:
    大きくて丈夫な雄のウシ。頑強で重荷を背負うことのできるウシ。ことい。こっていうし。こといのうし。: 크고 튼튼한 수소. 완강하여 무거운 짐을 질 수 있는 소.
  特異:
    特に他とちがっていること。また、特にすぐれていること。: 특히 다른 것과 다른 것. 또는 특히 뛰어난 것. 특이.
  特技:
    特別の技能。特にすぐれた技量。: 특별한 기능. 특히 뛰어난 기량. 특기.
  特産:
    特に、その地で生産・産出されること。また、そのもの。: 특히 그 지역에서 생산·산출되는 것. 또는 그 물건. 특산.
  孤特:
    孤独。〔管子、形勢解〕亂は、其の百姓を失ひ、外國に信ぜられず、外皆失ひ、特にして黨無し。故に國くして辱めらる。字通「孤」の項目を見る。: 고독함.
案:
  案下:
    手紙のわきづけの一種。あて名に書き添えて相手への敬意を表す語。: 편지의 부기 말의 하나. 수신인 이름 옆에 덧붙여 상대에 대한 경의를 나타내는 말.
  案出:
    よい考えを編み出すこと。考え出すこと。: 좋은 생각을 짜내는 것. 생각해 내는 것. 안출.
  案文:
    もとになる文章。下書き文。: 바탕이 되는 글. 초안문.
  案:
    読んだり書いたりするときに使う台。: 읽거나 쓸 때 쓰는 받침대. 책상.
  案山子:
    ①農作物を荒らす鳥獣をおどすため田畑に立てるタケや藁(わら)で作った人形。: 농작물을 해치는 새나 짐승을 쫓기 위해 논밭에 세우는 대나무나 짚으로 만든 인형. 허수아비.
  案外:
    予想とちがって。意外にも。思いのほか。: 예상과 달리. 뜻밖에도. 의외로.
梅:
  入梅:
    "「入梅(ニュウバイ)」に同じ。": 입매와 같음. 장마철에 들어감.
    梅雨の季節に入ること。また、梅雨の季節。つゆ入り。: 장마철에 들어가는 것. 또는 장마철.
  梅:
    バラ科の落葉高木。中国原産。早春、葉より先に紅や白色の香りのよい花をつける。果実は球形で、初夏に熟し、食用。: "장미과의 낙엽 교목. 중국 원산으로 이른 봄 잎보다 먼저 붉은색이나 흰색의 향기로운 꽃이 피고, 열매는 초여름에 익어 식용한다."
  金縷梅:
    マンサク科の落葉小高木。山地に自生。早春、葉より先に黄色いひも状の花が咲く。: "조록나무과의 낙엽 소교목. 산지에 자생하며 이른 봄 잎보다 먼저 노란 끈 모양 꽃이 핀다. 풍년화."
  空梅雨:
    梅雨の時期にあまり雨が降らないこと。照り梅雨: 장마철에 비가 별로 오지 않는 것. 마른장마.
  茶梅:
    ツバキ科の常緑小高木。: "차나무과의 상록 소교목. 산다화."
  梅花:
    "① うめの花。② 薫物の名。①の香を擬したという。沈香・占唐香・甲香・甘松香・白檀香・丁字香・麝香・薫陸香などを練り合わせて作る。六種(むくさ)の薫物の一つ。春に用いる。梅花香。梅花方。③ ＝ばいか（梅花）の油〔日葡辞書（1603‐04）〕④ 風窓(かざまど)の作り方の一種。梅花形で、中心の釘をまわすと一弁ずつ開くように造ったもの。〔随・嬉遊笑覧（1830）〕⑤ 楊弓・大弓などで銭を賭(か)ける時に五銭をいう隠語。おすが。〔随筆・一話一言（1779‐1820頃）〕": "① 매화꽃. ② 매화 향을 본떴다고 하는 향의 이름. ③ 매화 기름. ④ 매화꽃 모양으로 만든 풍창 방식의 하나. ⑤ 양궁이나 대궁 등에서 돈을 걸 때 오전을 이르던 은어."
帯:
  一帯:
    "①そのあたり全域。 ②ひとつらなり。ひとつづき。": "① 그 부근 전체. 일대. ② 하나로 이어진 것."
  温帯:
    地球上の、寒帯と熱帯との間の温暖な地帯。緯度による区分では、緯度二三・二七度（回帰線）から六六・三三度（極圏）までの地域。: "지구상에서 한대와 열대 사이의 온난한 지대. 위도상 회귀선부터 극권까지의 지역. 온대."
  帯刀:
    刀を腰にさすこと。また、その刀。: 칼을 허리에 차는 것. 또는 그 칼. 대도.
    "①「帯刀(タイトウ)」に同じ。 ②古代、春宮(とうぐう)坊の舎人(とねり)のなかで、特に刀を身につけて皇太子の護衛をした役人。武芸に秀でた者が選ばれた。": "① 대도와 같음. ② 고대에 동궁방의 도네리 가운데 특히 칼을 차고 황태자를 호위하던 관리."
  帯同:
    いっしょに連れて行くこと。: 함께 데리고 가는 것. 대동.
  帯:
    "①和服の上から胴に巻いて結ぶ細長い布。 ②物に巻く、細長い形をしたもの。": "① 일본옷 위로 허리에 감아 묶는 가늘고 긴 천. 띠. ② 물건에 감는 가늘고 긴 모양의 것."
  着帯:
    女性が懐妊して五か月目に、胎児を正常な位置に保つため、腹部に岩田帯(いわたおび)をしめること。また、その祝いの式。: 여성이 임신 다섯 달째에 태아를 정상 위치에 유지하기 위해 배에 이와타오비를 매는 것. 또는 그 축하 의식.
  帯びる:
    "[ 文語形 ]お・ぶ ( 古くは四段活用。→帯ぶ )① 身につける。着用する。携帯する。〔書陵部本名義抄（1081頃）〕② 雨露などを身に受けて持つ。③ 任務などを身に負う。引き受ける。(オ)びて」〈樋口一葉〉一二)④ 細長くまわりにまきつける。めぐらす。⑤ ある色、味、様子、性質などをその中に含む。": "① 몸에 지니다. 착용하다. 휴대하다. ② 비나 이슬 등을 몸에 받다. ③ 임무 등을 맡다. ④ 가늘고 길게 둘레에 감다. 둘러치다. ⑤ 어떤 색·맛·모양·성질 등을 안에 포함하다."
郡:
  郡部:
    都道府県内の、郡に属する地域。: 도도부현 안에서 군에 속하는 지역. 군부.
  郡:
    郡(グン)の古称。国（現在の県）を小分けしたもの。郷・村などを含む。: 군의 옛 이름. 나라, 곧 현재의 현을 작게 나눈 것으로 향·마을 등을 포함했다.
  郡衙:
    古代の郡を取り締まるための役所。: "고대의 군을 관할하기 위한 관청. 군아."
  郡奉行:
    江戸時代、諸藩の職名。郡の代官を統轄し、政務を執行した。郡代。: "에도 시대 여러 번의 직명. 군의 대관을 통괄하고 정무를 집행했다."
  郡県:
    "① 郡と県。郡(こおり)と県(あがた)。② 「ぐんけんせいど（郡県制度）」の略。": "① 군과 현. ② 군현제도의 준말."
候:
  気候:
    ある一定の地域の気象の平均状態。温度・湿度・風速・晴雨などの長期間にわたる観測から総合したもの。: 일정 지역의 기상 평균 상태. 온도·습도·풍속·맑음과 비 등의 장기간 관측을 종합한 것. 기후.
  候鳥:
    季節によってすむ土地を変える鳥。渡り鳥。: 계절에 따라 사는 곳을 바꾸는 새. 철새.
  候補:
    "①ある地位・身分につく意志をもっていること。または他から推されていること。また、その人。 ②ある基準に当てはまる見込みや資格のあるもの。また、その人。": "① 어떤 지위나 신분에 오를 뜻이 있거나 남에게 추천되어 있는 것. 또는 그 사람. 후보. ② 어떤 기준에 들어맞을 가능성이나 자격이 있는 것."
  伺候:
    "①高貴な人のそば近くに仕えること。 ②目上の人のもとへご機嫌うかがいに行くこと。": "① 고귀한 사람의 곁 가까이에서 섬기는 것. ② 윗사람에게 문안하러 가는 것."
  候う:
    さぐる。そっとようすをのぞく。: 살피다. 몰래 형편을 엿보다.
  候:
    "①はべる。ひかえる。目上の人のそばに仕える。 ②「有る」「居る」の丁寧語。また、謙譲語。 ③動詞の下について丁寧語となる。": "① 곁에 모시다. 대기하다. 윗사람 곁에서 섬기다. ② 「있다」의 정중어 또는 겸양어. ③ 동사 아래에 붙어 정중어가 되는 말."
  測候:
    気象を観測すること。〔宋書‐暦志〕: 기상을 관측하는 것. 측후.
跼:
  跼む:
    足や背などを曲げ、体をちぢこませる。せぐくまる。: 다리나 등을 굽혀 몸을 오그리다. 웅크리다.
  跼る:
    体をまげてちぢこませる。背を丸くしてかがむ。: 몸을 굽혀 오그리다. 등을 둥글게 하고 웅크리다.
  跼蹐:
    おそるおそる歩くこと。非常におそれるさま。「跼天蹐地」の略。: 조심조심 걷는 것. 매우 두려워하는 모양. 「跼天蹐地」의 준말.
  跼躅:
    行き悩むようす。: 나아가지 못하고 머뭇거리는 모양.
  跼足:
    足をかがめて待つ。〔戦国策、斉五〕今～兵を案(とど)めて後にらば、～則ち天下をぼさんこと、跼足して須(ま)つべきなり。字通「跼」の項目を見る。: 발을 굽힌 채 기다리는 것.
蹐:
  跼蹐:
    おそるおそる歩くこと。非常におそれるさま。「跼天蹐地」の略。: 조심조심 걷는 것. 매우 두려워하는 모양. 「跼天蹐地」의 준말.
  蹐: 소리 내지 않도록 살금살금 걷는 것. 발을 움츠려 조심히 걷는 것.
鍼:
  鍼灸:
    はりと灸(キュウ)を使って行う治療法。: 침과 뜸을 써서 하는 치료법. 침구.
  鍼:
    "①患部に刺して症状を治す医療用のはり。また、その術。 ②ぬいばり。": "① 환부에 찔러 증상을 치료하는 의료용 침. 또는 그 기술. ② 바느질 바늘."
  披鍼:
    "①平たい諸刃(もろは)で先のとがった外科用のメス。ランセット。 ②鍼術(シンジュツ)に用いる、諸刃で先がとがったはり。": "① 양날에 끝이 뾰족한 납작한 외과용 메스. 란셋. ② 침술에 쓰는 양날의 끝이 뾰족한 침."
  鍼師:
    はりを使って患者の治療を行う者。鍼術を行う者。また、その資格。: 침을 써서 환자를 치료하는 사람. 침술을 행하는 사람. 또는 그 자격.
  鍼線:
    縫針と糸。唐・崔〔七夕〕詩　長安中、、(しろぎぬ)の如し　家家、此の夜、鍼線を持つ字通「鍼」の項目を見る。: 바느질 바늘과 실.
料:
  料金: 물건을 쓰거나 서비스를 받은 대가로 내는 돈. 요금.
  料簡: "① 미루어 헤아려 생각을 돌리는 것. 생각. ② 용서하는 것. 참는 것. 인내."
  料る: "① 되로 재다. ② 세다. ③ 미루어 헤아리다. 추량하다. ④ 일을 적절히 처리하다. 주선하다."
  料紙: 필기에 쓰는 종이.
  料峭: 바람이 살갗에 차갑게 느껴지는 것.
  料地: 어떤 목적에 쓰는 토지.
  衣料: "① 입는 것. 의복. 의류. 또 천이나 실처럼 옷의 재료가 되는 것. ② 옷을 짓는 데 드는 비용."
笑:
  笑止: 웃지 않을 수 없는 모양. 어처구니없어 웃음이 날 정도인 일.
  笑納: 남에게 선물을 줄 때, 겸손하게 받아 달라는 뜻으로 쓰는 말.
  笑む: "① 싱글벙글하다. 웃다. ② 꽃봉오리가 벌어지다. 피어나다. ③ 열매가 익어 껍질이 벌어지다."
  笑う: "① 기쁨ㆍ우스움ㆍ쑥스러움 등의 표현으로 얼굴 근육을 풀거나 소리를 내다. ② 깔보다. 비웃다. ③ 열리다. 느슨해지다."
  可笑しい: "① 재미있다. 웃고 싶어지다. ② 이상하다. 수상하다."
  笑顔: 웃는 얼굴. 기뻐 보이는 얼굴.
訓:
  訓育: 가르쳐 기르는 것. 특히 도덕을 중시하여 아동이나 학생의 품성을 높이고 풍부한 사회성을 기르는 것을 목적으로 하는 교육. 덕육.
  訓読: "① 한자에 일본어 훈을 붙여 읽는 것. 훈읽기."
  訓える: 사물의 도리를 설명해 들려주다. 타이르다. 가르쳐 이끌다.
  訓む: 한자에 일본어 훈을 붙여 읽다. 한자를 훈독하다.
  訓戒: 사물의 선악을 가르쳐 깨우치고 경계하는 것. 또 그 경계.
  訓誨: 가르쳐 깨우치는 것. 교회.
  訓釈: "① 훈주와 같음. ② 훈주와 같음."
差:
  差額: 어떤 금액에서 다른 금액을 뺀 금액이나 수량.
  差遣: 사자를 보내는 것. 사람을 파견하는 것.
  差す: "① 빛이 비치다. 들어오다. ② 조수가 밀려오다. ③ 모습이나 기분이 나타나다. 또 표정에 드러나다. ④ 액체 등을 넣다. ⑤ 끼워 넣다. ⑥ 높이 들다."
  差異・差違: 다른 것과 다른 점. 차이.
  差益: 매매 수지나 환율 변동 등으로 생기는 이익.
  差金: 어떤 금액에서 빼고 남은 금액.
  差異: 다른 것과 차이가 있는 것. 또 그 차이.
席:
  寄席: 요세. 낙어ㆍ강담ㆍ浪曲 같은 대중 예능을 상연하는 곳.
  席: "① 사람이 앉는 곳. 또 앉기로 되어 있는 곳. ② 모임 등의 자리. 회장. ③ 요세."
  席次: "① 좌석의 순서. 자리 순서. ② 지위나 성적의 순위."
  席題: 단가나 하이쿠 등의 모임에서 그 자리에서 내는 제목.
  席亭: 상설 연예장. 요세. 또 그 경영자.
  席料: "① 방이나 회장 등을 빌릴 때의 요금. 자리값. ② 요세 등의 입장료."
  座席: "① 앉는 곳. 자리. 또 앉는 순서. ② 다다미방과 같음. ③ 어떤 행위의 장에서 주체가 배치되는 위치."
  席巻: 거적을 말듯이 남김없이 한쪽 끝에서부터 영토를 공격해 빼앗는 것. 거센 기세로 자기 세력 범위를 넓히는 것.
挙:
  挙行: 행사를 정식으로 치르는 것.
  挙動: 행동거지. 동작.
  挙用: 능력을 인정하여 끌어올려 쓰는 것.
  検挙: 범죄 사실을 조사하기 위해 용의자를 경찰서로 연행하는 것.
  枚挙: 하나하나 세어 드는 것.
  挙げる: "① 아래에서 위로 움직이다. ② 거행하다. 행동을 일으키다. ③ 골라 보이다. 거론하다. ④ 눈에 띄는 사람을 발탁하다."
  挙火: "① 아궁이에 불을 때 밥을 짓는 것. 나아가 생계를 꾸리는 것. ② 횃불이나 등불을 들어 올리는 것. 또 봉화를 올리는 것."
  挙国: 온 나라 전체. 국민 전부. 나라 전체가 하나가 되어 일에 임할 때 이르는 말.
  挙がる: 아래에서 위로 오르다. 드러나다. 이루어지다. 끝나다. 귀한 사람에게 물건이 바쳐지다. 동사에 붙어 완료나 격화의 뜻을 나타내다.
  挙って: 한 사람도 빠짐없이. 모두 함께.
  挙る: 모두 모이다. 한 사람도 빠짐없이 갖추어지다.
連:
  連呼: 몇 번이고 되풀이하여 큰 소리로 외치는 것.
  連行: 의사와 관계없이 데리고 가는 것.
  連合: 둘 이상의 것 또는 조직이 결합하여 하나가 되는 것.
  連なる: "① 붙어서 나란히 서다. 계속 이어지다. ② 연결되다. 관계되다."
  連れる: "① 함께 가다. 데리고 가다. ② 변화에 따라가다."
  黄連花: "[생물] 앵초과의 여러해살이풀."
  連ねる: "① 한 줄로 늘어서다. 이어지다. ② 동행하다. 함께 가다. ③ 줄을 만들다. 이어 늘어놓다. ④ 데리고 가다. ⑤ 계속되게 하다. 잇다. ⑥ 합쳐 하나로 만들다. ⑦ 미치게 하다. ⑧ 말을 늘어놓다. 시가를 읊다."
浴:
  浴室: 욕실. 목욕탕. 배스룸.
  湯浴み: 목욕하는 것. 입욕. 뜨거운 물에 들어가 몸을 데우고 씻는 것.
  浴びる: "① 물이나 뜨거운 물 등을 뒤집어쓰다. 목욕하다. ② 빛ㆍ연기ㆍ먼지 등을 몸에 받다. ③ 말이나 시선을 많이 받다. 입다."
  浴衣: 여름이나 목욕 뒤에 입는 무명 홑옷. 유카타.
  浴槽: 목욕물을 담는 큰 통. 욕조.
  浴びせる: "① 물이나 뜨거운 물 등을 몸에 끼얹게 하다. ② 상대에게 강한 타격이나 공격을 가하다. ③ 격한 말이나 태도를 상대에게 던지다. ④ 책임ㆍ악평ㆍ난문 등을 남에게 지우다. ⑤ 스모 등에서 상대에게 자기 몸을 덮치듯 실다."
倉:
  倉庫: 물품을 보관하고 저장해 두는 건물. 창고.
  倉: "① 곡물을 넣어 두는 건물. ② 물건을 안전하게 보관해 두는 건물."
  胸倉・胸座: 옷을 입었을 때 좌우 옷깃이 겹치는 부근. 멱살.
  叉倉: 기둥을 쓰지 않고 삼각형 등의 목재를 우물 정자 모양으로 쌓아 벽으로 만든 창고.
  倉稲魂: 오곡의 신. 특히 벼의 신.
  倉敷料: 창고에 물건을 보관하는 요금. 보관료.
残:
  残なう: 사람을 죽이거나 다치게 하고, 물건을 엉망으로 부수다. 또 멸망시키다.
  残す: "① 남도록 하다. 남겨 두다. ② 남는 것을 만들다. 남기다. ③ 후세에 전하다. ④ 스모에서 버티다."
  残る: "① 그 자리에 머물다. 상태가 계속되다. ② 후세에 전해지다. ③ 남다. ④ 스모에서 버티다."
  鱠残魚: "[생물] 뱅어과의 바닷물고기. 몸길이 약 10센티미터로 비늘이 없고 반투명하며, 봄에 하구를 거슬러 올라가 산란한다. 삶으면 희게 되고 식용한다."
  名残: "① 어떤 일이 지나간 뒤에 남는 기분이나 기척."
  残害: 해치는 것. 또 다치게 하거나 죽이는 것.
  残雪: 녹지 않고 남아 있는 눈. 또 봄이 되어도 아직 녹지 않고 남은 눈.
  残壊: 부서지는 것. 또 부수는 것.
借:
  借財: 빌린 재물. 빚. 부채.
  借りる: "① 돌려줄 것을 전제로 남의 것을 잠시 쓰다. ② 다른 사람의 도움을 받다."
  借上: 가마쿠라 시대부터 무로마치 시대 초기에 걸친 고리대금업자.
  借方: "① 빌리는 쪽 사람. 차용자. ② 빌리는 방법이나 수단. ③ 복식 부기에서 자산 증가, 부채나 자본 감소, 손실 등을 적는 장부의 왼쪽 부분. 차변."
  借銀: 돈을 빌리는 것. 또 빌린 돈.
  借家: 집세를 내고 빌려 사는 집. 또 집을 빌리는 것.
陸:
  陸: "① 육지. 육상. ② 벼루에서 먹을 가는 부분."
  商陸: "[생물] 자리공과의 여러해살이풀. 중국 원산으로 야생화되어 있으며, 뿌리는 독이 있지만 한방에서 이뇨약으로 쓴다."
  常陸: "[지명] 옛 나라 이름의 하나. 현재의 이바라키현. 조슈."
  馬陸: "[생물] 노래기류 절지동물의 총칭. 습한 곳에 살며, 몸은 지네와 비슷하고 건드리면 둥글게 말리며 냄새를 낸다."
  陸稲: 밭에서 재배하는 벼. 밭벼.
  陸奥: "[지명] 무쓰ㆍ리쿠젠ㆍ리쿠추ㆍ이와키ㆍ이와시로를 합친 오슈 다섯 나라의 옛 이름."
  陸地: 지구 표면에서 물로 덮여 있지 않은 곳. 육지. 뭍.
敗:
  敗北: "① 싸움에 져서 달아나는 것. 패배."
  敗れる: 싸움이나 다툼에서 지다. 실패하다. 꺾이다.
  敗醬: "[생물] 마타리과의 여러해살이풀."
  敗荷: 잎이 찢어진 연잎.
  敗因: 패배한 원인.
  敗毀: 허물어져 부서지는 것. 부수고 망가뜨리는 것.
票:
  票決: 찬반을 투표로 결정하는 것.
  票田: 선거에서 어떤 당이나 후보자의 득표가 많이 예상되는 지역을 논밭에 비유해 이르는 말.
  開票: 투표함을 열어 투표 결과를 집계하는 것.
  散票: 표가 한 후보자에게 모이지 않고 여러 후보자에게 흩어지는 것. 또 그 표.
  青票: 국회에서 기명투표를 할 때 반대의 뜻을 나타내는 의원이 던지는 푸른색 표.
  伝票: 은행ㆍ회사ㆍ상점 등에서 금전의 수지 계산이나 거래 내용 전달 등을 적는 종잇조각. 전표.
  軍票: 군용 수표의 준말.
鹿:
  逐鹿: 권력의 자리나 지위 등을 얻으려고 다투는 것.
  鹿: "[생물] 사슴과 포유동물의 총칭. 숲이나 초원 등에 널리 살며 초식성이고, 수컷에는 가지가 갈라진 뿔이 있다."
  鹿驚: "① 새나 짐승이 논밭을 해치는 것을 막기 위해 세우는 허수아비."
  鹿杖: "① 끝이 두 갈래로 된 지팡이. ② 손잡이 부분이 T자 모양인 지팡이. ③ 사슴뿔을 손잡이 부분에 붙인 지팡이."
  鹿砦: 적의 침입을 막기 위해 가시 있는 나뭇가지나 끝을 뾰족하게 한 나뭇가지를 사슴뿔처럼 엮어 만든 울타리.
  鹿茸: 녹용과 같음.
  鹿角: "① 사슴의 뿔. 한방에서 강장제로 쓴다. ② 옛날 군진의 도구. 사슴뿔을 닮은 철제 갈퀴로, 물건을 걸어 끌어당기는 데 썼다. ③ 녹각채의 준말."
副:
  副業: 본업을 하면서 곁들여 하는 일. 부업. 내직.
  副本: "① 원본의 사본."
  副う: 곁에 붙어 따르다. 옆에서 돕다.
  副え木: "① 식물 등이 기울거나 쓰러지지 않도록 받치는 나무. ② 골절 부위를 고정하기 위해 대는 판. 부목."
  副寺・副司: "[불교] 선종 사찰에서 회계를 담당하는 직책의 승려."
  副作用: 약이 치료를 목적으로 하는 본래 작용과 함께 일으키는 다른 작용. 주로 나쁜 작용을 이른다.
  副賞: 정식 상에 덧붙여 주는 것. 부상.
  副因: 주된 원인이 아닌 이차적인 원인. 간접적인 원인.
崎:
  崎嶇: "① 산길이 구불구불하고 험한 모양. ② 세상살이가 험난한 모양."
  州崎: 모래톱이 바다나 강 가운데까지 길게 튀어나와 곶이 된 곳.
  洲崎: 모래톱이 바다나 강 가운데까지 길게 튀어나와 곶이 된 곳.
  崎: "① 육지가 바다나 호수 등으로 튀어나온 곳. 곶. ② 육지에서 산이나 언덕이 평지로 튀어나온 곳."
埼:
  埼: "① 바다나 호수로 튀어나온 육지의 끝. 곶. ② 산이나 언덕의 튀어나온 부분."
梨:
  梨花: 배나무의 꽃.
  梨: "[생물] 장미과의 낙엽 교목. 예부터 과수로 재배되며, 늦봄에 흰 다섯잎 꽃이 피고 큰 둥근 열매는 식용한다."
  花梨: "[생물] 장미과의 낙엽 소교목. 중국 원산으로 봄에 연분홍 꽃이 피고 노란 타원형 열매를 맺으며, 설탕절임ㆍ과실주ㆍ기침약 등에 쓴다."
  消梨: 배의 한 품종. 과즙이 매우 많다.
  鉄脚梨: "[생물] 장미과의 낙엽 관목."
  棠梨: "[생물] 장미과의 낙엽 소교목. 산지에 자생하며 전체에 가시가 있고, 봄에 흰 다섯잎 꽃이 피며 노란색 또는 붉은색 둥근 열매를 맺는다."
貨:
  貨車: 화물을 운송하는 철도 차량. 컨테이너차ㆍ탱크차 따위.
  貨幣: 상품 교환의 매개로 사회에 유통되는 것. 동전ㆍ지폐 따위. 돈.
  貨: "① 금전. ② 가치 있는 물품. 상품으로 다루는 물품."
  貨財: 화폐와 재물. 금전과 가치 있는 것.
  貨殖: 재산을 늘리는 것.
  貨物: "① 물자. 특히 화차ㆍ트럭ㆍ배 등으로 운송하는 짐. ② 화물열차의 준말."
  貨宝: 보물. 재보.
康:
  安康: 세상이 잘 다스려져 평온하고 무사한 것.
  健康: "① 몸의 상태. ② 몸과 마음이 건전한 것."
  康い: 튼튼하고 평안한 모양. 걱정이 없고 온화한 모양.
  康衢: 번화한 큰길.
  小康: "① 병이 더 진행되지 않는 것. 또 조금 나아지는 것. ② 세상이 한동안 무사히 안정되어 있는 것."
望:
  怨望: 원망스럽게 생각하는 것. 원망.
  願望: 실현되기를 바라고 원하는 것. 또 그 소원.
  既望: 음력 16일 밤. 또 그 밤의 달. 특히 8월 16일을 이른다.
  人望: 세상의 많은 사람들이 보내는 신뢰와 존경.
  望見: 멀리서 바라보는 것. 또 아득히 먼 곳을 바라보는 것.
  望む: "① 먼 곳을 바라보다. ② 희망하다. 바라다. ③ 우러러보다. 사모하다."
巣:
  営巣: 동물이 둥지를 짓는 것.
  巣窟: 악인 등이 숨어 사는 곳. 소굴.
  巣: "① 짐승ㆍ새ㆍ벌레 등이 사는 곳. ② 악인 등이 모이는 곳. 은신처. ③ 사람이 살아가는 곳. 가정."
  巣くう: "① 새 등이 둥지를 만들어 살다. ② 소굴로 삼다. ③ 좋지 않은 것이 퍼져 자리 잡다."
  帰巣性: 동물이 멀리 떨어져 있어도 둥지나 태어난 곳으로 돌아가는 본능.
  懸巣: "[생물] 까마귀과의 새. 산림에 살며 겨울에는 평지에서도 보이고, 다른 새의 울음소리를 흉내 낸다."
  病巣: 몸에서 병적 변화가 일어나고 있는 부위.
側:
  側聞: 남에게서 전해 듣는 것. 얼핏 귀에 듣는 것.
  側面: "① 물체의 앞뒤와 위아래가 아닌 면. 좌우의 면. ② 옆쪽 방면. 곁."
  側近: 권력자나 신분이 높은 사람 곁에서 섬기는 사람. 또 가까이 곁에 있는 사람.
  側:
    "①相対するものの一方。また、物事の一面や一方の立場。 ②かたわら。わき。また、わきにいる人。 ③外のふち。周りをつつんでいる部分。": "① 서로 마주하는 것의 한쪽. 또 사물의 한 면이나 한쪽 입장. ② 곁. 옆. 또 곁에 있는 사람. ③ 바깥 가장자리. 둘레를 감싸는 부분."
    "①近くのところ。付近。 ②「側(はた)」に同じ。 ③動詞の下について、時間のあまり経過していないようす。": "① 가까운 곳. 부근. ② 곁과 같음. ③ 동사 뒤에 붙어 시간이 얼마 지나지 않은 모양을 나타냄."
  側ら: 곁. 옆.
  側耳: 귀를 기울이는 것.
健:
  健康: "① 몸의 상태. ② 몸과 마음이 건전한 것."
  健啖: 음식을 많이 먹는 모양. 대식.
  剛健: 몸과 마음이 모두 강하고 씩씩한 것. 또 그런 모양.
  健やか: 몸이 튼튼한 모양. 또 몸과 마음이 건강한 모양.
  健し: 활기차고 힘차다. 씩씩하고 든든한 모양.
  健駄羅: "[지명] 고대 인도의 지명. 현재 파키스탄 북동부 페샤와르 부근으로, 2~3세기 무렵 그리스 문화의 영향을 받은 불교 예술이 번성했다."
  健か: "① 단단하고 확실한 모양. ② 분량이 많은 모양. 매우 많음. ③ 정도가 심한 모양. 대단한 모양. ④ 매우 강한 모양. 용맹한 모양. ⑤ 겉보기와 달리 만만치 않은 능력이 있어 쉽게 뜻대로 되지 않는 사람의 모양."
菜:
  菜園: 채소를 기르는 밭. 채소밭.
  菜: "① 채소로 잎이나 줄기를 먹는 초본류의 총칭. 푸성귀. ② 유채."
  眼子菜: "[생물] 가래과의 여러해살이풀."
  牛尾菜: "[생물] 백합과의 덩굴성 여러해살이풀. 산야에 자생하며, 어린순은 모양과 맛이 아스파라거스와 비슷하다."
  御数・御菜: 주식에 곁들여 먹는 음식. 반찬. 부식.
  恭菜: "[생물] 명아주과의 한해살이풀 또는 두해살이풀. 남유럽 원산으로 채소로 재배한다."
  菜料: "① 밥의 반찬으로 쓰는 것. 반찬. ② 반찬의 재료. 또 그것을 사는 비용."
械:
  械繫: 죄인에게 차꼬를 채워 감옥에 넣는 것.
  器械: "① 도구. 기구. ② 간단한 구조의 기계."
  械: 죄인의 손발이나 목에 채워 몸의 자유를 빼앗는 형구.
  機械: 동력으로 일을 하는 장치. 또 장치가 있는 기구.
清:
  清水: 땅속에서 솟아나는 맑고 깨끗한 물.
  清潔: "① 더러움이 없는 것. 깨끗한 것. ② 행동이나 마음에 속임이 없고 순수한 것."
  清い: 더러움이 없어 깨끗한 모양. 흐림이 없어 맑은 모양.
  清める: 더러움이나 부정을 없애 깨끗하게 하다.
  清か: "① 또렷하게 맑은 모양. 밝고 잘 보이는 모양. ② 소리나 목소리가 맑고 또렷하게 들리는 모양."
  清む: "① 액체나 기체 등의 탁함이 없어져 깨끗해지다. 흐림이 없어져 또렷하게 보이다. ② 깨끗하다. ③ 소리에 탁함이 없어 잘 들리다. ④ 마음의 잡념이나 미혹이 없어지다."
  清まる: 맑고 깨끗해지다. 더러움 등을 씻어 깨끗해지다. 재계하다.
産:
  産: 태어난 그대로의. 태어났을 때의.
  産む: "① 모체가 알이나 새끼를 몸 밖으로 내다. ② 무언가를 만들어 내다. 생기게 하다."
  産土: "① 태어난 땅. 출생지. ② 산토신의 준말."
  産土神: 태어난 땅의 수호신. 진수의 신.
  産霊神: "① 자연계의 모든 것을 낳는 신. ② 인연을 맺어 주는 신."
  土産: "① 다른 집을 방문할 때 가지고 가는 선물. ② 외출지나 여행지에서 가져오는 그 지방의 산물."
  産卵: 알을 낳는 것.
唱:
  唱歌: "① 노래를 부르는 것. 또 그 노래."
  唱道: 의견 등을 남보다 앞장서서 주장하는 것.
  唱和: "① 한 사람의 소리에 맞추어 많은 사람이 함께 외는 것. ② 상대의 시가에 답하여 시가를 짓는 것."
  唱う: 가락을 붙여 길게 노래하다. 목소리를 높여 노래하다.
  唱える: "① 소리 내어 가락을 붙여 읽다. ② 큰 소리로 외치다. ③ 남보다 앞서 자기 의견을 주장하다."
  唱曲: 가곡을 부르는 것. 또 그 가곡.
最:
  最高: "① 높이ㆍ정도ㆍ지위 등이 가장 높은 것. ② 가장 뛰어난 것."
  最も: 정도가 가장 높은 모양. 더할 나위 없이. 최고로.
  最寄り: 가장 가까운 곳. 근처.
  最恵国: 그 나라와 통상 조약이나 항해 조약을 맺은 나라들 가운데 가장 유리한 대우를 받는 나라.
  最敬礼: 상대를 공경하여 하는 가장 정중한 절.
  最後: "① 이어지는 사물의 맨 끝. 또 그 위치에 있는 것."
散:
  散乱: "① 여기저기 흩어지는 것. ② 파동이나 입자선 등이 물체에 부딪혀 진행 방향을 바꾸며 흩어지는 것."
  散らかす: 물건을 정돈하지 않고 여기저기 어지럽게 놓아두다.
  散らす: "① 흩어지게 하다. ② 마구 ...하다."
  散る: "① 꽃이나 잎이 가지에서 떨어져 흩날리다. ② 나뉘어 흩어지다. 사방으로 퍼지다. ③ 깨끗이 죽다."
  散: "① 본래 한데 모여 있는 것을 하나하나 나누는 것. 또 그 물건. ② 산전의 준말."
  散逸・散佚: 한데 모여 있던 것이 뿔뿔이 흩어져 없어지는 것.
  散らかる: "① 이것저것 마음이 옮겨 안정되지 않다. ② 뿔뿔이 흩어지다. ③ 여기저기 어지럽게 펼쳐지다. ④ 주위로 발산하다."
焼:
  焼却: 태워서 처분하는 것.
  焼べる: 태우기 위해 물건을 불 속에 넣다.
  焼く: "① 불로 태우다. ② 불로 가열하다. 굽다. ③ 햇빛 등으로 피부를 검게 하다. ④ 사진 원판에 빛을 쬐어 양화를 만들다. ⑤ 마음을 쓰다. 손을 들이다."
  急焼: 급수와 같음.
  出石焼: "[지명] 효고현 도요오카시 이즈시초에서 나는 도자기. 흰 자기와 염부가 많다."
  信楽焼: "[지명] 시가현 시가라키 지방에서 만들어지는 도기."
  焼ける: "① 불이 붙어 타다. 불타 없어지다. ② 불에 닿아 뜨거워지거나 익다. ③ 햇빛을 받아 마르거나 변색되다. ④ 강한 마찰로 뜨거워지다. ⑤ 마음이 어지럽거나 감정이 타오르다. ⑥ 질투가 나다."
量:
  推量: 남의 생각이나 사정 등을 미루어 헤아리는 것. 또 그 내용.
  度量: "① 길이와 용적. 또 자와 되. ② 남의 말과 행동을 받아들이는 너그러운 마음."
  容量: 그릇 안에 들어가는 분량. 용기 안의 용적.
  量器: "① 물건의 양을 재는 도구. 되. ② 쓸모 있는 재능. 유용한 재기. 기량."
  量: "① 되의 눈금. 용적. ② 사람됨의 크기. 역량."
  量る: "① 무게ㆍ용적ㆍ면적 등을 조사하다. ② 예측하다. 추량하다."
  計量: "① 길이나 무게 등 물건의 수량을 재는 것. ② 어떠한지, 어떻게 될지 등을 생각하거나 예측하는 것. ③ 거리 공간의 거리."
街:
  街: 상점 등이 늘어서 있는 번화한 지역. 시가지.
  街衢: 인가 등이 늘어선 땅. 거리. 길거리.
  街娼: 거리에서 손님을 부르는 매춘부. 거리의 창부.
  街道: "① 주요 지역을 잇는 큰길. 또 대로. ② 인생길. 삶을 걸어가는 길."
  街灯: 도로 옆에 설치한 전등. 가로등.
  街頭: 거리의 길 위. 길모퉁이.
給:
  給仕: "① 음식을 내고 돌보는 것. 또 그 사람. ② 직장에서 잡일을 하는 것. 또 그 사람."
  給付: 금품을 주거나 건네는 것. 특히 국가나 단체 등이 지급ㆍ교부하는 것.
  給料: 근무나 노동에 대해 고용주가 지급하는 보수. 월급ㆍ일급 따위.
  給う: "① 주시다. 「주다」, 「수여하다」의 존경어. ② ...하시다. 동작에 대한 존경을 나타내는 말. ③ 남성이 가벼운 명령을 할 때 쓰는 말."
  給金: 급료로 지급되는 돈.
  給源: 공급하는 근원. 공급원.
  給油: "① 엔진에 연료유를 공급하는 것. 비행기나 자동차에 휘발유ㆍ경유 등의 연료를 공급하는 것. ② 기계류의 마찰 부분에 윤활유를 주입하는 것."
  給る: "① 물건이나 말을 받는다는 뜻의 겸양어. 받다. ② 특히 신에게 통행의 허락을 받다. ③ 중세 이후, 물건 등을 준다는 뜻의 존경어. 주시다."
富:
  富裕: 부유하고 풍요롭게 번성한 것.
  富: "① 많은 재산이나 재물. ② 풍부한 자원이나 물자. ③ 복권의 일종인 도미쿠지와 같음."
  富む: "① 많은 재산을 가지다. 부자가 되다. ② 풍부하게 포함하다. 풍요롭다."
  富籤: 에도 시대에 유행한 복권의 일종. 사찰이나 신사에서 번호가 붙은 표를 사고 추첨으로 당첨자가 상금을 받는 방식.
  富魚: "[생물] 큰가시고기과의 민물고기. 북일본의 맑은 못 등에 살며, 등지느러미에 아홉 개 안팎의 가시가 있다."
  富貴: 재산이 많고 사회적 지위가 높은 것.
賀:
  賀詞: 신년이나 장수 축하 때 하는 축하의 말.
  賀ぶ: 물건이나 말을 보내 축복하다. 축하하다. 축원하다.
  賀筵・賀宴: 축하 잔치 자리. 축연.
  賀春: 새해를 축하하는 것.
  賀正: 새해를 축하하는 것.
  賀状: "① 축하 편지. ② 연하장."
  賀州: "[지명] 이가국, 곧 현재 미에현 서부의 별칭."
滋:
  滋育: "① 곡물 등이 늘어나며 자라는 것. ② 풀과 나무 등을 기르는 것. 또 자라는 것."
  滋味: "① 맛있는 맛. 미미. ② 영양이 있는 음식. ③ 마음을 풍요롭게 하는 깊은 맛."
  滋目結: 사각형 무늬를 전면에 물들여 총조리개로 만든 것.
  滋養: 몸의 영양이 되는 것. 또 그 물질.
  滋雨: 윤택하게 하는 비.
  滋る: "① 풀과 나무가 무성하게 자라 가지와 잎이 겹쳐지는 것. 번무하다. ② 양이 많아지다. 늘다."
極:
  極言: 극단적인 말투. 극단적인 의견.
  極限: 아슬아슬한 지점. 그 이상은 없는 한도.
  極端: "① 물건의 가장 끝."
  極印: "① 에도 시대 금은 화폐에 찍은 도장. ② 사라지지 않는 증거. 영구히 지울 수 없는 표식."
  極まる:
    "①結論に到達する。最終的に決定する。 ②当初ねらったとおりの結果になる。 ③必ず…する。当然…だ。": "① 결론에 이르다. 최종적으로 결정되다. ② 처음 의도한 대로 결과가 되다. ③ 반드시 ...하다. 당연히 ...이다."
    "①極限に達する。 ②最もすぐれている。決定的である。": "① 극한에 이르다. ② 가장 뛰어나다. 결정적이다."
  磁極: "① 자석 양끝에서 자기력이 가장 강한 곳. ② 지구 자기장이 솟아나는 지점."
  極み: 극에 이른 곳. 사물이 다다르는 곳. 극한. 한계.
  極める:
    "［動マ下一］［文］きは・む［マ下二］１ （極める）これより先はないというところまで行き着く。２ （極める・窮める）極点に達した状態になる。この上もない程度までそうなる。３ （極める）残るところなく尽くす。４ （究める・窮める）深く研究して、すっかり明らかにする。５ 終わらせる。〈源・明石〉６ 決める。定める。〈虎寛狂・鬮罪人〉７ 「きわまる」に同じ。〈新撰六帖・一〉": "① 더 갈 곳이 없을 정도까지 이르다. ② 극점에 달한 상태가 되다. ③ 남김없이 다하다. ④ 깊이 연구하여 완전히 밝히다. ⑤ 끝내다. ⑥ 정하다."
    "[ 文語形 ]き・む ① 従うべき規則などをはっきり作る。また、いくつかの中から選んでこれを定める。決定する。決心する。② 強くとがめる。しかる。また、詰問する。きめつける。③ 刀や脇差を差す。また、きちんと格好よく身じたくをする。④ 飲食する。⑤ 確かめる。確認する。念を押す。⑥ ( 「…を決める」の形で ) ある行動や態度をする。気取る。きめこむ。⑦ 歌舞伎の演技や舞踊で、最高潮に達したり、一区切りついたとき、演者が動きを止めて形をつける。⑧ 囲碁で、幾つかの手段があって打たないでおいた所を、方針を決めて打ってしまう。⑨ 相撲などで、相手の関節を逆にとり、動きを封じる。": "① 따라야 할 규칙 등을 분명히 만들다. 또 여럿 중에서 골라 정하다. 결정하다. 결심하다. ② 심하게 꾸짖다. 나무라다. 추궁하다. ③ 칼이나 와키자시를 차다. 또 몸차림을 말끔하고 멋지게 갖추다. ④ 먹고 마시다. ⑤ 확인하다. 다짐하다. ⑥ 어떤 행동이나 태도를 취하다. 폼을 잡다. ⑦ 가부키나 무용에서 절정이나 단락에서 동작을 멈추고 자세를 잡다. ⑧ 미뤄 둔 곳을 방침을 정해 두다. ⑨ 상대의 관절을 꺾어 움직임을 막다."
    "① 従うべき規則などをはっきり作る。また、いくつかの中から選んでこれを定める。決定する。決心する。② 強くとがめる。しかる。また、詰問する。きめつける。③ 刀や脇差を差す。また、きちんと格好よく身じたくをする。④ 飲食する。⑤ 確かめる。確認する。念を押す。⑥ ( 「…を決める」の形で ) ある行動や態度をする。気取る。きめこむ。⑦ 歌舞伎の演技や舞踊で、最高潮に達したり、一区切りついたとき、演者が動きを止めて形をつける。⑧ 囲碁で、幾つかの手段があって打たないでおいた所を、方針を決めて打ってしまう。⑨ 相撲などで、相手の関節を逆にとり、動きを封じる。": "① 따라야 할 규칙 등을 분명히 만들다. 또 여럿 중에서 골라 정하다. 결정하다. 결심하다. ② 심하게 꾸짖다. 나무라다. 추궁하다. ③ 칼이나 와키자시를 차다. 또 몸차림을 말끔하고 멋지게 갖추다. ④ 먹고 마시다. ⑤ 확인하다. 다짐하다. ⑥ 어떤 행동이나 태도를 취하다. 폼을 잡다. ⑦ 가부키나 무용에서 절정이나 단락에서 동작을 멈추고 자세를 잡다. ⑧ 미뤄 둔 곳을 방침을 정해 두다. ⑨ 상대의 관절을 꺾어 움직임을 막다."
景:
  景観: 경치. 풍경. 특히 운치 있는 전망.
  景品: "① 상품에 덧붙여 손님에게 무료로 주는 물품. 덤."
  景色: 산천이나 풍물 등 자연의 전망. 풍경.
  景天: "[생물] 돌나물과의 여러해살이풀. 산지에 자생하며 잎은 두껍고, 여름부터 가을에 연분홍 작은 꽃이 빽빽이 핀다."
  淑景舎: "① 헤이안쿄에 있던 뇨고ㆍ고이의 거처. ② 그곳에 살던 뇨고ㆍ고이."
  景迹: "① 행실. 행적. ② 추측하다. 미루어 헤아리다."
  景運: 시운. 시대의 운세.
結:
  結構: "① 구조나 짜임. ② 훌륭한 것. 뛰어난 것. ③ 충분한 것. 만족스러운 것. ④ 완전하지는 않지만 그럭저럭 되는 것."
  結合: 서로 맺어지는 것. 여러 물건이 하나가 되는 것.
  結実: "① 식물이 열매를 맺는 것."
  結く: 실이나 새끼줄을 엮어 잇다.
  結ぶ: "① 잇다. 또 끈으로 매다. ② 약속하다. ③ 끝맺다. ④ 어떤 상태가 생기다. ⑤ 단단히 닫다. ⑥ 한패가 되다."
  結う: "① 실이나 끈처럼 가는 것으로 묶다. 동여매다. ② 머리를 보기 좋게 묶어 올리다."
  起承転結: 한시의 구성법 중 하나. 절구에서는 제1구가 기, 제2구가 승, 제3구가 전, 제4구가 결이며, 시문이나 사물의 구성에도 비유된다.
  結わえる: 묶다. 동여매다. 잡아매다.
覚:
  覚悟: "① 좋지 않은 일이나 중대한 일을 앞두고 마음의 준비를 하는 것. ② 미혹을 벗어나 진리를 깨닫는 것."
  覚醒: "① 잠에서 깨는 것. 눈을 뜨는 것. ② 미혹에서 깨어 자기 잘못을 깨닫는 것."
  感覚: "① 눈ㆍ코ㆍ귀ㆍ혀ㆍ피부 등으로 외부 자극을 느끼는 것. 또 그 자극으로 생기는 의식. ② 사물을 느끼는 마음의 작용. 센스."
  覚える: "① 마음에 새기다. 기억하다. ② 배워서 몸에 익히다. ③ 느끼다. 의식하다."
  覚り: 이해하는 것. 알아차리는 것.
  覚る: 분명히 알다. 또 문득 깨닫다. 눈치채다.
  覚ます: "① 잠에서 깨게 하다. ② 미혹을 정상적인 상태로 돌아오게 하다. 깨닫게 하다. ③ 술기운을 없애다."
  覚める: "① 꿈이나 잠, 또는 졸려 흐릿한 상태에서 현실로 돌아오다. ② 잠들지 않고 있다. ③ 기절한 상태에서 제정신으로 돌아오다. ④ 미혹이 풀리다. ⑤ 술기운이 사라지다. ⑥ 뚜렷이 자각하다."
媛:
  媛: 얌전하고 아름다운 여성. 또 신분 높은 사람의 딸.
  嬋媛: 고운 자태로 아름다운 모양. 곱고 윤기 있는 모양.
  才媛: 뛰어난 재능이나 학문이 있는 여성.
  歌媛: 노래하는 여인. 가희.
満:
  満悦: 만족하여 기뻐하는 것. 크게 기뻐함.
  満開: 꽃이 완전히 활짝 피는 것. 꽃이 한창인 때.
  満腹: 배가 가득 차는 것. 배부름.
  満たす: 가득 채우다.
  満ちる: "① 가득 차다. ② 널리 퍼지다. ③ 모자람 없이 완전해지다. ④ 기한이 차다. ⑤ 조수가 밀려오다."
  満江紅: "[생물] 생이가래과의 여러해살이 양치식물. 논이나 못 등에 자생하며 잎은 비늘 모양이고 붉은색이다."
博:
  博愛: 모든 사람을 평등하게 사랑하는 것.
  博徒: 도박을 하는 사람. 노름꾼.
  博い: "① 널리 두루 미쳐 있는 모양. ② 사물에 널리 통달한 모양."
  博士: "① 어떤 분야에 매우 밝은 사람. ② 박사와 같음."
  博奕: 도박과 같음.
  博雅: 널리 사물을 알고 행실이 바른 것. 또 그런 사람.
然:
  厳然: 엄숙하고 장엄한 모양. 움직일 수 없는 모양.
  然諾: 맡아 승낙하는 것.
  然し: "① 그러나. 그렇지만. 앞말과 대립하는 일을 말할 때 쓴다. ② 그건 그렇고. 감탄을 담은 말."
  然も: "① 게다가. 또한. ② 그런데도. 그럼에도 불구하고."
  然り: 그 말 그대로. 그러하다.
  然程: 그 정도. 그렇게까지. 그다지.
隊:
  軍隊: 일정한 규율을 가진 군인 조직. 병사의 집단.
  隊商: 낙타에 짐을 싣고 사막을 넘어 행상하는 단체. 캐러밴.
  隊伍: 가지런히 대열을 이루어 늘어선 무리. 대열.
  隊列: 대를 이룬 것들의 줄. 대의 늘어섬.
  横隊: 가로로 늘어선 대열.
  楽隊: 퍼레이드나 식전 등에서 여러 악기로 합주하는 단체. 음악대.
順:
  順応: 환경이나 처지에 맞도록 행동이나 성질을 바꾸는 것.
  順う: 그대로 따르고 거스르지 않다.
  順位: 어떤 기준에 따라 순서를 매긴 위치나 지위.
  順延: 예정된 날짜를 차례로 뒤로 미루는 것.
  順縁: "① 나이 든 사람부터 차례로 죽는 것. ② 좋은 행위가 불도에 들어가는 인연이 되는 것."
  順化: 자연에 순응하는 것. 새로운 기후 풍토에 익숙해지는 것.
達:
  達人: "① 학술이나 기예에서 그 길에 특히 뛰어난 사람."
  達成: 목적을 이루는 것.
  通達: "① 알려 전하는 것. 특히 상위 관청이 하급 기관에 내리는 알림. ② 깊이 통달해 있는 것."
  伝達: 명령이나 지시를 전해 알리는 것. 연락 사항을 전달해 보내는 것.
  達: 사람이나 동물을 나타내는 말에 붙어 복수를 나타내는 말.
  達る: "① 막힘없이 나아가 통하다. 꿰뚫다. 이르다. ② 멀리까지 전해져 닿다. 두루 미치다. ③ 사물이나 도리에 통달해 있다."
  四通八達: 길이 어느 방향으로나 통하는 것. 나아가 번화한 땅이나 사람 왕래가 많은 곳.
飯:
  飯台: 식사를 하는 상. 밥상. 식탁.
  飯米: 밥을 지어 먹는 쌀. 식용 쌀.
  飯:
    "「飯(めし)」に同じ。": "밥과 같음."
    "①米や麦を炊いたもの。ごはん。いい。まま。 ②食事のこと。ごはん。まま。": "① 쌀이나 보리를 지은 것. 밥. ② 식사."
  乾飯: 건반, 곧 말린 밥과 같음.
無:
  絶無: 전혀 없는 것. 하나도 없는 것.
  無我: "① 사심이나 사욕이 없는 것. ② 자신을 잊는 것."
  無い: 존재하지 않다. 없다. 또 소유하지 않다.
  益無し: 무익하다. 헛되다. 시시하다.
  無花果: "[생물] 뽕나무과의 낙엽 소교목. 서아시아 원산으로, 열매는 식용한다."
  無頼: 주소나 직업을 정하지 않고 떠돌며 협박 등을 하는 불량배.
愛:
  愛護: 귀여워하고 소중히 보호하는 것.
  愛好: 좋아하여 애정을 쏟는 것.
  愛惜: 소중히 여겨 상하거나 잃는 것을 아까워하는 것.
  愛しい:
    "①かわいくてたまらない。恋しい。 ②かわいそうだ。気の毒だ。": "① 귀여워서 견딜 수 없다. 그립다. ② 가엾다. 딱하다."
    "[ 文語形 ]かなし 対象への真情が痛切にせまってはげしく心が揺さぶられるさまを広く表現する。悲哀にも愛憐にもいう。⇔うれしい。① 死、別離など、人の願いにそむくような事態に直面して心が強くいたむ。なげかわしい。いたましい。② ( 愛 ) 男女、親子などの間での切ない愛情を表わす。身にしみていとおしい。かわいくてたまらない。いとしい。③ 関心や興味を深くそそられて、感慨を催す。心にしみて感ずる。しみじみと心を打たれる。④ ( 連用形を副詞的に用いることが多い ) みごとだ。あっぱれだ。⑤ ( 連用形を副詞的に用いることが多い ) 他から受けた仕打ちがひどく心にこたえるさま。残念だ。くやしい。しゃくだ。⑥ 貧苦が身にこたえるさま。貧しくてつらい。⑥のような「貧しい」という意味が生じた。悲しいの派生語かなし‐が・る悲しいの派生語かなし‐げ悲しいの派生語かなしげ‐さ悲しいの派生語かなし‐さ": "① 죽음이나 이별처럼 바람과 어긋나는 일을 맞아 마음이 몹시 아프다. 슬프고 애처롭다. ② 남녀ㆍ부모 자식 사이의 애절한 사랑을 나타낸다. 사무치게 사랑스럽다. ③ 깊은 관심이나 감흥을 불러 마음에 사무치다. ④ 훌륭하다. 장하다. ⑤ 남에게 당한 일이 마음에 심하게 사무쳐 분하다. ⑥ 가난이 몸에 사무쳐 괴롭다."
  愛い: 귀엽다. 갸륵하다. 마음가짐이 좋다.
  愛しむ: 아까워 소중히 여기다. 놓기 어려워 애틋하게 여기다.
  愛育: 귀여워하며 기르는 것. 소중히 기르는 것.
  愛慕: 깊이 사랑하고 사모하는 것.
  愛子: "① 사랑하는 아이. ② 아이를 귀여워하는 것."
  愛でる: "① 마음이 끌려 사랑스럽거나 귀엽게 여기다. ② 마음이 끌려 훌륭하다고 느끼다. 감동하다. 칭찬하다. ③ 기쁘고 좋은 일이라고 여기다. 축하할 일로 여기다."
続:
  続続: 계속 이어져 끊이지 않는 모양.
  続く: "① 같은 행위나 상태 등이 이어지다. 계속되다. ② 사이를 두지 않고 일어나다. ③ 바로 뒤를 따르다. ④ 바로 뒤에 위치하다."
  接続草: "[생물] 속새과의 양치식물. 쇠뜨기."
  続飯: 밥알을 으깨어 개어 만든 끈끈한 풀.
  続断: "[생물] 산토끼꽃과의 두해살이풀."
  続出: 계속해서 나오거나 일어나는 것.
  続ける: "① 시간적ㆍ공간적으로 사물이나 일이 끊어지지 않도록 같은 상태를 유지하게 하다. ② 어떤 일을 앞의 일 바로 뒤에 일으키다. ③ 말을 이어 하다. 앞말의 계속을 말하다. ④ 어떤 것을 다른 것에 잇다."
  続ぐ: "① 나란히 이어지다. 앞의 것 뒤에 계속되다. ② 끊어진 것을 이어 붙이다. 꿰매 붙이다. ③ 부족하거나 없어진 것을 보태다. ④ 그릇에 액체 등을 붓다. ⑤ 뒤를 이어 계속하다. 계승하다. 전하다."
置:
  安置: 장소를 정해 소중히 모셔 두는 것. 특히 신불의 상이나 유해 등에 많이 쓴다.
  処置: "① 처리하여 마무리하는 것. 조처."
  放置: 둔 채로 두는 것. 내버려 두는 것.
  置く: "① 사람이나 사물 등을 어떤 곳에 두다. 위치시키다. 설치하다. ② 사람을 함께 살게 하다. 또 고용하다. ③ 사이를 두다. ④ 방치하다. 중지하다. ⑤ 동작이나 상태를 그대로 두다. ⑥ 남기다. ⑦ 서리나 이슬 등이 내리다."
  日置流: "궁술의 한 유파. 무로마치 시대에 헤키 단조 마사쓰구가 창시했다."
  置炬燵: 옮길 수 있는 고타쓰.
群:
  群集: 사람이나 물건 등이 떼 지어 모이는 것. 또 그 모임.
  群生: 같은 종류의 식물이 어떤 지역에 무리 지어 자라는 것.
  群れる: 많은 생물이 한곳에 모여 있다. 무리를 이루다.
  群衆: 한곳에 조직적이지 않게 떼 지어 모인 많은 사람들.
  群小: 많은 작은 것. 하찮은 많은 것 또는 사람.
  群青色: 선명하고 짙은 푸른색. 남색에 가까운 푸른색.
  群雄: 수많은 영웅. 여러 호걸.
  群れ: "① 많은 사람이나 생물이 모여 있는 상태. 모임. 떼. ② 동료. 같은 무리."
戦:
  舌戦: 말다툼하는 것. 설전.
  戦争: "① 무력으로 다투는 것. 특히 국가 간의 무력 싸움. ② 사회생활상의 격렬한 혼란이나 경쟁의 비유."
  戦慄: 두려움으로 떠는 것. 두려워 벌벌 떠는 것.
  戦: 싸움. 전쟁.
  戦く: 두려움이나 추위로 몸이 떨리다.
  戦ぐ: 풀 등이 바람에 흔들려 희미한 소리를 내다.
  戦う: "① 서로 때리며 승부를 다투다. ② 서로 군사를 내어 공격하다. 전쟁하다. ③ 서로 기술ㆍ힘ㆍ지혜 등을 겨루다. ④ 장애나 곤란에 맞서 이겨 내려고 하다."
辞:
  辞去: 작별 인사를 하고 방문한 곳을 떠나는 것. 하직 인사.
  辞書: 말을 모아 일정한 순서로 배열하고 그 읽기ㆍ뜻ㆍ용법 등을 설명한 책. 사전.
  辞職: 스스로 직무를 그만두는 것.
  辞: 언어. 문장. 단어를 이은 문장으로 표현된 것.
  辞める: 직무나 지위 등에서 물러나다.
  称辞: 칭찬하는 말. 찬사.
働:
  労働: 체력이나 지력을 써서 일하는 것.
  働く: "① 일을 하다. ② 활동하다. 활약하다. ③ 작용하다. 효과가 나타나다. ④ 활용하다. 어미가 변화하다. ⑤ 좋지 않은 일을 하다."
  稼働・稼動: "① 벌이를 위해 일하는 것."
  実働: 실제로 노동하는 것.
節:
  音節: 말을 구성하는 요소로서의 소리 단위. 발음할 때 하나씩 묶이는 최소 단위.
  関節: 뼈와 뼈의 이음매로, 움직일 수 있는 부분.
  時節: "① 계절. 시후. ② 좋은 기회. 시기. ③ 시대. 세상의 정세."
  節制: 욕망을 적당히 억제하는 것. 삼가는 것.
  節操: 믿는 주의나 주장을 굳게 지켜 나가는 것. 절개.
  符節: 나무 등의 패에 글자를 쓰고 도장을 찍어 나눈 것으로, 나중에 맞추어 증명으로 삼는 것. 부절.
  節句: 한 해의 마디가 되는 연중행사와 그날.
  節: "① 식물의 줄기나 대에 솟거나 부풀어 오른 마디. ② 일반적으로 물건이 솟거나 혹처럼 되어 구분점이 되는 부분. ③ 물건을 가르거나 구분하는 것. ④ 결. 이치. ⑤ 다른 것과 구별되는 일이나 지점. ⑥ 단락. ⑦ 어떤 때. 시기. 기회. ⑧ 음악이나 노래의 곡조. 선율. ⑨ 가사의 문구."
塩:
  塩蔵: 소금에 절여 보존하는 것. 또 그렇게 만든 식품.
  塩: "① 염화나트륨을 주성분으로 하는 흰 결정체. 바닷물이나 암염에서 얻는다. ② 짠맛. 소금 간."
  塩汁: 정어리나 도루묵을 소금에 절여 발효시킨 뒤 배어 나온 즙으로 만든 조미료. 아키타 특산.
  堅塩: 정제하지 않은 고형 소금.
  塩梅: "① 요리의 간. ② 몸의 상태. ③ 형편. 사정."
  塩基: 산을 중화하여 염을 만드는 화합물. 대부분은 금속의 수산화물이다.
  塩田: 바닷물에서 소금을 얻기 위해 논처럼 정지한 모래톱. 염전.
  塩酸: 염화수소의 수용액. 1가의 강산으로, 발연성이 있고 자극적인 냄새가 나는 무색 액체.
試:
  試験: "① 물건의 성질이나 능력을 시험하는 것. ② 학력이나 지식 등의 능력을 문제에 답하게 하여 평가하는 것. 시험."
  試作: 시험 삼아 만들어 보는 것. 또 그 물건.
  試みる: 시험해 보다. 실제로 해 보다.
  試す: 실제로 해 보다. 실험해 보다.
  試合: 스포츠나 무예 등에서 서로 능력이나 기술을 겨루어 승부를 다투는 것.
  試案: 시험 삼아 세운 임시 안.
照:
  照射: "① 햇빛이 내리쬐는 것. ② 광선ㆍ방사선 등을 비추어 쬐는 것."
  照らす: "① 빛을 비추어 밝게 하다. ② 견주어 조사하다."
  照る: "① 해나 달이 밝게 빛나다. 나아가 날이 개다. ② 윤이 나며 빛나다."
  照れる: 부끄러워 어색해하다. 수줍어하다.
  四照花: "[생물] 층층나무과의 낙엽 교목. 산지에 자생하며 초여름에 꽃잎 같은 흰 포 네 장을 낸다."
  照応: 두 문장 등이 서로 관련되고 대응하는 것.
管:
  管轄: 관청이나 기관 등이 권한에 따라 지배하는 것. 또 그 범위.
  管見: "① 좁은 견문이나 식견. 대롱 구멍으로 사물을 본다는 뜻에서. ② 자기 식견을 겸손하게 이르는 말."
  彩管: 그림을 그리기 위한 붓. 그림붓.
  管: "① 가늘고 긴 통. 파이프. ② 베를 짤 때 씨실을 감아 북에 넣는 심. ③ 실잣는 물레의 가락에 꽂아 뽑아낸 실을 감는 축."
  煙管: "① 살담배를 채워 불을 붙여 피우는 도구. 담뱃대. ② 철도에서 중간 일부 구간을 무임승차하는 부정 승차."
  只管: 오직 그 일에만 전념하는 모양. 한결같이.
  管弦: "① 관악기와 현악기. 피리류와 비파ㆍ거문고류 악기의 총칭. 또 그 음악. ② 아악의 합주를 하는 것. 음악을 연주하는 것. ③ 아악 합주의 양식을 이르는 말."
徳:
  徳義: 도덕상 지켜야 하는 일.
  徳用: 값에 비해 이익이 많은 것.
  徳化: 사람들을 덕으로 감화하여 좋게 만드는 것. 덕에 의한 교화.
  徳育: 덕성을 기르고 키우는 교육. 도덕 교육.
  徳性: 도덕심을 가진 품성. 도덕적 의식.
  徳政: "① 은혜로운 정치."
種:
  種子: 종자식물의 밑씨가 수분 뒤 성숙한 것. 씨앗.
  種痘: 천연두 예방 접종. 우두를 인체에 접종하여 면역성을 갖게 하는 방법.
  種える: 식물의 모종이나 씨를 땅속에 묻다. 씨를 뿌리다.
  種:
    "①物事を生み出すもと。材料。たね。 ②種類。品目。しな。": "① 사물을 생겨나게 하는 바탕. 재료. 씨앗. ② 종류. 품목."
    "①植物の芽の出るもととなるもの。種子。 ②動物の精子。 ③血統。血筋を受けつぐ。 ④物事の発生するもと。原因。 ⑤話・記事などの材料。ねた。 ⑥手品の仕掛け。 ⑦料理の材料。具。": "① 식물의 싹이 트는 바탕이 되는 것. 종자. ② 동물의 정자. ③ 혈통. 핏줄을 잇는 것. ④ 사물이 발생하는 바탕. 원인. ⑤ 이야기나 기사 등의 재료. 소재. ⑥ 마술의 장치. ⑦ 요리의 재료. 속."
  斎種: 풍작을 빌며 부정 타지 않게 정결히 한 벼의 씨앗. 깨끗한 종자.
  種目: 종류에 따라 나눈 항목. 종류의 명목.
旗:
  旗下: "① 장군 직속의 가신. 하타모토. ② 휘하에 있는 것. 또 그 사람."
  旗: 천이나 종이 등으로 만들어 주로 장대에 달아 내거는 것. 글자나 도안을 그려 단체나 나라의 상징, 축하ㆍ장식ㆍ표식 등에 쓴다.
  旗魚: "[생물] 청새치과와 황새치과 바닷물고기의 총칭. 열대에서 온대 외양에 분포하며 식용한다."
  旗艦: 함대 사령관이 타고 지휘하는 군함. 기함.
  旗鼓: "① 군기와 군의 진퇴 신호로 쓰인 북. ② 군대. 군세."
  旗幟: "① 옛날 전장에서 자기 존재를 분명히 하기 위해 세운 깃발과 표지. ② 태도. 주의 주장."
察:
  察知: 미루어 헤아려 아는 것.
  察る: 사물을 세심하게 조사하다. 자세히 관찰하다. 상세히 조사하다.
  察察: "① 더러움이 없는 모양. 결백한 모양. ② 번거로울 만큼 세세한 모양."
  察する: "① 사정을 미루어 느껴 알다. ② 남의 마음을 추측하고 배려하다. 동정하다."
  苛察: 세세한 일까지 엄격하게 조사하는 것.
  監察: 행정ㆍ경영 등의 업무에 부정이 없도록 조사하여 단속하는 것.
  察問: 자세히 묻는 것.
静:
  静止: 가만히 있어 움직이지 않는 것. 그 자리에 머물러 움직이지 않는 것.
  静: 조용한 모양, 차분한 모양을 나타내는 말.
  静か: "① 소리나 목소리 등이 나지 않아 고요한 모양. ② 사물의 움직임이 느긋한 모양. 시끄럽지 않은 모양. ③ 정신이나 태도가 차분한 모양. 얌전한 모양."
  静める: "① 소리나 목소리를 작게 하다. 조용하게 하다. ② 감정을 가라앉히다."
  一人静: "[생물] 홀아비꽃대과의 여러해살이풀. 산야에 자생하며 이른 봄 흰 작은 꽃이 핀다."
  静寂: 정적과 같음.
  静まる: "① 소리가 그쳐 조용해지다. ② 세력이 약해지다. ③ 소동이나 혼란이 없어져 평온해지다. ④ 마음의 흐트러짐이나 몸의 아픔 등이 없어지다. ⑤ 신령이 자리 잡다. ⑥ 태도 등이 차분해지다."
説:
  小説: 문학 형식의 하나. 작가가 상상력과 구상력으로 인간이나 사회의 모습을 표현하는 산문체 작품.
  説明: 사물의 내용ㆍ이유ㆍ의의 등을 알기 쉽게 말하는 것.
  説く: "① 해석하다. 설명하다. ② 가르쳐 깨우치다. 조리 있게 설득하다. ③ 논하다."
  説道: 세상 사람들이 말하기를. 들리는 바에 따르면.
  説懌: 기뻐하는 것. 「説」도 「懌」도 기뻐한다는 뜻.
  説教: "① 경전이나 교의를 설명하여 들려주는 것."
  新説: 새롭게 세운 논설이나 학설. 또 참신한 의견.
漁:
  漁色: 잇달아 여성을 좇는 것.
  漁る:
    "①魚介類をとる。 ②探し回る。 ③むさぼり求める。": "① 어패류를 잡다. ② 찾아 돌아다니다. ③ 탐하여 구하다."
    魚介類をとる。漁(リョウ)をする。いさる。: 어패류를 잡다. 고기잡이를 하다.
  漁り: 어패류를 잡는 것. 고기잡이를 하는 것.
  漁り火: 밤에 물고기를 유인하기 위해 배 위에서 피우는 불. 어화.
  漁獲: 어패류나 해조류 등 수산물을 잡는 것. 또 잡은 것.
  漁業: 어패류나 해조류를 잡거나 양식하여 수입을 얻는 일.
熊:
  熊掌: 곰 발바닥의 고기. 중국에서 맛있는 음식의 하나로 여겨진다.
  熊: "[생물] 곰과 포유동물의 총칭. 유라시아와 남북 아메리카에 분포하며, 몸이 크고 사지는 굵고 짧다."
  熊谷草: "[생물] 난초과의 여러해살이풀. 숲 등에 자생하며 봄에 입술꽃잎이 주머니처럼 부푼 연분홍 꽃을 피운다."
  熊襲: 고대에 규슈 남부에 살았다고 하는 종족 이름.
  熊川: 조선에서 수입한 찻사발. 비파색 유약이 입혀져 있고 몸통은 깊으며 가장자리가 젖혀져 있다.
  熊猫: "[생물] 판다과 포유동물. 자이언트판다와 레서판다 두 종류의 총칭."
関:
  関係: "① 사물과 사물이 연결이나 관련을 가지는 것. 또 그 연결."
  関鍵: "① 빗장과 열쇠. ② 문이나 현관의 잠금. ③ 사물의 중요한 부분. 요점. 급소."
  関節: 뼈와 뼈의 이음매로 움직일 수 있는 부분.
  関門: "① 관문의 문. 또 관문. ② 통과하기 어려운 곳. 또 반드시 지나야 하는 곳."
  関わる: "① 관계하다. ② 관여하다."
  関: "① 사람의 행동 등을 가로막는 것. 막이. 칸막이. ② 관문."
億:
  億る: 추측하다. 이것저것 생각을 돌리다.
  億劫: 귀찮아서 일을 할 마음이 나지 않는 모양.
  巨億: 매우 많은 수량이나 금액.
  億載: 매우 오랜 세월. 또 영원한 세계.
  億測: 미루어 헤아리는 것.
課:
  考課: "① 일하는 태도나 성적을 조사하여 평가하는 것. ② 율령제에서 관리의 근무 평정."
  課外: 규정된 학과나 과정 이외의 것.
  課業: 학교나 직장 등에서 할당된 학과나 작업.
  課口: 율령제에서 요와 잡요의 과역을 부담하는 남자.
  課する: "① 할당하다. ② 명령하여 하게 하다."
  課税: 세금을 부과하는 것. 또 그 세금.
  課役: "① 율령제에서 조와 노역. ② 중세 이후 공령ㆍ장원에 부과된 여러 부담. ③ 과제나 일을 할당하는 것. 또 할당된 과제나 일."
  課長: 관청이나 회사 등에서 한 과의 사무를 총괄하고 부하를 통제ㆍ감독하는 직책. 또 그 사람.
潟:
  干潟: 수심이 얕은 바다에서 썰물 때 드러나는 얕은 곳. 갯벌.
  潟湖: 사취ㆍ사주ㆍ연안주 등으로 바다 일부가 외해와 갈라져 생긴 호수나 늪. 석호.
  潟: "① 수심이 얕은 해안에서 밀물과 썰물에 따라 숨었다 드러나는 땅. ② 포구. 만. 후미. ③ 사주 등이 뻗어 바다와 분리되어 생긴 호수나 늪."
縄:
  縄文: 끈이나 새끼줄로 토기 표면에 낸 무늬.
  縄: 짚이나 삼 등 식물 섬유 또는 화학 섬유를 꼬아 만든 끈.
  延縄: 하나의 긴 줄에 낚싯바늘을 많이 단 줄을 늘어뜨려 물고기를 잡는 도구. 주낙.
  縄暖簾: "① 새끼줄 여러 가닥을 늘어뜨려 만든 노렌. ② 그런 노렌이 가게 앞에 걸려 있던 데서, 선술집이나 간단한 밥집을 이르는 말."
  注連縄: 신전이나 신사 의식 장소에 부정이 들어오지 않도록 둘러 치는 새끼줄.
  麦索・麦縄: "① 밀가루와 쌀가루를 반죽해 줄 모양으로 가늘고 길게 꼬아 기름에 튀긴 과자. ② 우동 또는 냉보리국수."
  縄墨: "① 먹줄. ② 법도. 규칙. 규범. 표준."
  規矩準縄: 사물의 표준이 되는 것. 법칙, 본보기, 법도를 뜻한다.
  縄正: 먹줄로 바로잡는 것.
輪:
  日輪: 태양.
  輪禍: 자동차나 전차 등에 치이거나 받히는 재난.
  輪郭: "① 물건의 바깥 모양을 나타내는 선. ② 사물의 큰 줄거리. 개요."
  輪奐: 궁전 등의 건물이 장대하고 아름다운 모양.
  輪唱: 같은 선율을 각 성부가 몇 마디 간격을 두고 차례로 뒤따라 부르는 합창.
  輪: "① 원형의 것. 구부려 둥글게 만든 것. ② 차축 주위를 회전하여 차를 나아가게 하는 원형의 것. 바퀴. ③ 테."
  一輪: 둥근 것 하나를 가리켜 이르는 말. 태양이나 달, 핀 꽃 한 송이 또는 바퀴 하나를 말한다.
熱:
  熱湯: 펄펄 끓는 뜨거운 물.
  熱い: "① 온도가 높은 상태. ② 열심인 모양. 마음이 담긴 모양. ③ 남녀가 열렬히 사랑하는 모양."
  熱る:
    "①熱くなる。ほてる。熱気でむっとする。 ②興奮して怒る。いきまく。": "① 뜨거워지다. 달아오르다. 열기로 후끈하다. ② 흥분하여 화내다. 기세등등해지다."
    体や顔が熱くなる。また、そのように感じる。: 몸이나 얼굴이 뜨거워지다. 또 그렇게 느끼다.
  熱: "① 달아오름. 여열. ② 감정의 여세. ③ 사건이 끝난 뒤까지 이어지는 세상의 관심이나 소문."
  稲熱病: "[생물] 도열병균의 기생으로 생기는 벼 병해의 하나."
標:
  標記: "① 부호를 붙여 표지로 삼는 것. 또 그 부호나 문자. ② 표제를 쓰는 것. 제목을 붙이는 것. 또 그렇게 쓴 사항."
  標識: 안내나 전달의 표지. 표시.
  標準: "① 판단이나 비교의 기준이 되는 것. 본보기."
  標:
    "①土地の領有を示すため、また、場所を限るために木を立てたり縄を張ったりして、しるしとしたもの。 ②「標縄」の略。": "① 토지의 소유를 나타내거나 장소를 한정하기 위해 나무를 세우거나 줄을 쳐서 표시로 삼은 것. ② 표승의 준말."
    高くかかげて目につくようにしたもの。目じるし。まと。: 높이 내걸어 눈에 띄게 한 것. 표지. 표적.
    進むべき方向を指し示すもの。道案内となるもの。: 나아갈 방향을 가리키는 것. 길잡이가 되는 것.
  標す: "① 표시를 붙이다. 표지로 삼다. 또 흔적을 남기다. ② 전조를 나타내다. 조짐을 보이다."
選:
  選抜: 좋은 것을 골라 뽑는 것.
  選ぶ: "① 많은 것 가운데 목적이나 조건에 맞는 것을 골라내다. ② 알맞은 원고를 모아 책을 만들다. 편집하다."
  選る:
    よりわける。選出する。: 골라 나누다. 선출하다.
    多くのなかから優秀なものを選び出す。: 많은 것 가운데 뛰어난 것을 골라내다.
    選び出す。: 골라내다.
  選り好み: 자기가 좋아하는 것만 고르는 것. 가려 고름.
養:
  教養: "① 널리 학문이나 예술 등에서 얻는 사고방식이나 마음의 풍요로움. ② 전문 학문이나 지식이 깊은 것."
  養育: 기르고 키우는 것.
  養魚: 물고기를 사육하여 번식시키는 것.
  養子: 입양으로 다른 집에 들어가 그 집의 자식이 된 사람.
  養生: "① 몸을 소중히 하여 건강 유지와 증진에 힘쓰는 것. 섭생. ② 병이 낫도록 힘쓰고 병후 체력 회복을 도모하는 것. 보양."
  養う: "① 기르다. 부양하다. ② 동물을 기르다. 돌보다. ③ 체력이나 정신력 등을 차츰 단련하여 길러 내다. ④ 요양하다. 체력이나 기력을 회복하다."
  養い: "① 기르는 것. 양육. ② 영양이 되는 것. 영양물. ③ 한 집안이 살아가는 데 드는 비용. 또 아이의 양육비."
器:
  器械: "① 도구. 기구. ② 간단한 구조의 기계."
  器官: 여러 조직이 모여 생물체를 이루며 특정한 형태와 생리 기능을 가지는 부분.
  容器: 물건을 넣는 그릇. 용기.
  器: "① 그릇. 용기. ② 재능. 인물. 도량."
  厳器: 빗을 넣는 아름다운 작은 상자.
  胡銅器: 구리ㆍ주석ㆍ납의 합금. 또 그것으로 만든 불구나 용기.
  器才: 뛰어난 기량과 재능. 또 그 소유자.
積:
  積載: 배나 차 등에 짐을 싣는 것.
  蓄積: 모아 가는 것. 쌓아 두는 것. 또 쌓아 둔 것.
  積む: "① 물건을 겹쳐 놓다. ② 행위 등을 거듭하다. ③ 배나 차 등에 싣다. ④ 모아 두다."
  積もる: "① 차츰 겹쳐지다. 쌓여 높아지다. ② 겹쳐 많이 모이다. 쌓이다. ③ 어림하다. 견적하다."
  積痾: 오래 낫지 않는 병. 지병.
  積悪: 오래 계속해 온 악행. 쌓인 악행.
機:
  機会: 어떤 일을 하기에 꼭 알맞은 때. 적기. 기회.
  機関: "① 전력ㆍ화력 등의 에너지를 동력으로 바꾸는 장치. 원동기. 발동기. ② 어떤 목적이나 일을 이루기 위해 만들어진 조직이나 단체."
  機軸: "① 차바퀴 등의 중심봉이나 축. ② 조직이나 단체 활동의 중심. ③ 구상. 방식."
  機転: 때와 상황에 맞추어 재빨리 지혜나 머리가 작용하는 것.
  機関・機: "① 인형이나 기구를 움직이기 위해 실ㆍ태엽 등을 써서 만든 장치. ② 기계 등이 움직이는 구조. ③ 교묘하게 꾸민 계략."
  機: 베를 짜는 도구. 베틀.
  機業: 비단ㆍ무명 등 천을 짜는 사업. 직조 일.
  機穽: 장치가 있는 함정.
  機長: 항공기 승무원의 장. 기내 최고 책임자.
録:
  録音: 소리를 테이프ㆍ레코드ㆍCD 등에 기계를 써서 기록하는 것. 또 그렇게 기록된 소리.
  録す: 기록하다. 기재하거나 장부에 적어 뒤에 남기다.
  型録: 상품 등의 목록이나 설명서. 카탈로그.
  録画: 영상을 비디오테이프ㆍ디스크 등에 기록하는 것. 뒤에 재생할 수 있다.
  記録: "① 사실을 남기기 위해 문장이나 영상으로 남겨 두는 것. 또 그 자체. ② 경기 등의 성적. 특히 그 최고 성적."
  採録: 채택하여 기록하거나 녹음하는 것. 또 그 기록.
  実録: "① 실제 있었던 일을 있는 그대로 기록하는 것. ② 실제 있었던 일을 그대로 기록한 문서나 책. ③ 실제 있었던 일. 실화. ④ 편년사의 한 형식."
類:
  類型: "① 비슷한 성질의 것을 모아 공통점을 뽑아 정리한 형. 타입. ② 개성이 없는 흔한 것."
  類似: 둘 이상의 것 사이에 닮은 점이 있는 것.
  類別: 종류별로 나누는 것.
  類い: 같은 부류의 것. 닮은 것. 같은 종류.
  類える: 닮은 것을 나란히 놓고 비교하다. 비유하다.
  類縁: "① 혈연으로 이어진 인연. 일족. 친족."
験:
  効験: 효험. 좋은 징표.
  試験: "① 물건의 성질이나 능력을 시험하는 것. ② 학력이나 지식 등의 능력을 문제에 답하게 하여 평가하는 것. 시험."
  験: "① 효험. 효능. 효과. ② 신불 등의 영험."
  験す: 시험하다. 조사하다. 효과가 있는지 살피다.
  験算: 계산을 다시 하여 답을 확인하는 것. 검산.
  験者: 산중에서 영험을 얻기 위해 수험도를 수행하는 사람. 수험자.
観:
  偉観: 훌륭한 경관.
  観客: 연극이나 경기 등을 구경하는 사람.
  観念: "① 사물에 대한 생각. ② 사물을 의식했을 때 거기에 나타나는 의식 내용. 이념. 이데아. ③ 마음을 집중하여 불법의 진리를 생각하는 것. ④ 체념하는 것. 각오."
  観る: "① 넓게 바라보다. ② 구경하다. ③ 주의 깊게 보다."
  観閲: 보고 조사하는 것. 특히 군대 등에서 고관이 부대를 검열하는 것.
  観桜: 벚꽃을 보고 즐기는 것. 꽃놀이.
鏡:
  眼鏡: "① 시력을 바로잡거나 눈을 보호하기 위한 기구. 안경. ② 사물을 분별하는 힘."
  鏡台: 서랍 달린 상자 위에 거울을 붙인 화장대. 예전에는 손거울을 세워 두는 받침대.
  鏡: "① 빛의 반사를 이용하여 모습과 형태를 비추어 보는 도구. ② 술통의 뚜껑."
  海鏡: "[생물] 달조개과의 이매패. 얕은 바다 모래 바닥에 살며 식용한다."
  十寸鏡: 매우 맑고 깨끗한 거울.
  鏡板: "① 천장이나 문 등에 끼우는 표면이 매끈한 큰 판. ② 노 무대 정면의 배경이 되는 끼움판."
願:
  願望: 실현되기를 바라고 원하는 것. 또 그 소원.
  願う: "① 바라고 구하다. ② 신불에게 기원하다. ③ 관청 등에 신청하다. 청원하다."
  願書: "① 허가를 얻기 위해 제출하는 서류. ② 신불에게 비는 일을 적은 서면."
  願文: "① 부처나 보살의 본원을 적어 나타낸 것. ② 신불에게 비는 일을 적은 문서."
  願力: "① 신불에게 소원을 걸고 그 가호로 얻는 힘. 또 그 소원. 목적을 이루려는 정신력. ② [불교] 사람들을 구제하려는 아미타불의 서원의 힘."
  哀願: 상대의 동정을 살 듯이 애처롭게 부탁하는 것.
  願わくは: 바라건대. 원하는 바는. 부디.
競:
  競技: 서로 힘이나 기술의 우열을 겨루는 것. 특히 스포츠 시합.
  競売: 여러 구매자에게 값을 매기게 하여 최고가를 낸 사람에게 파는 것. 경매.
  競う:
    負けまいと張り合う。勢いこんであらそう。: 지지 않으려고 맞서 겨루다. 기세를 올려 다투다.
    互いにあらそう。張り合う。競争する。: 서로 다투다. 맞서 겨루다. 경쟁하다.
  競べる: 우열이나 승패를 겨루다.
  競る: "① 서로 상대에게 이기려고 다투다. ② 경매에서 구매자들이 다투어 값을 올리다. ③ 행상하다."
議:
  異議: "① 다른 의견. 반대 의견."
  議会: 공선된 의원으로 구성되어 법률 제도나 국가ㆍ지방자치단체의 정책을 심의ㆍ결정하는 합의제 기관.
  議る: 수단이나 대책을 세우기 위해 조리 있게 의논하다. 논하다.
  議案: 회의에서 의논하기 위해 내는 원안.
  議員: 국회나 지방자치단체 의회의 구성원으로, 주민이나 국민의 의사를 대표해 의결에 참여할 권리를 가진 사람.
  議決: 회의에서 합의로 결정하는 것. 또 그 결정 사항.
  県議: 현의회 의원 또는 현의회 의원의 준말.
