  やめる。ことわる。しりぞく。: 그만두다. 거절하다. 물러나다.
  別れを告げる。いとまごいをする。: 작별을 고하다. 하직 인사를 하다.
  日本文法で、それだけでは文節を構成しえない語。助詞・助動詞など。: 일본어 문법에서 그것만으로는 문절을 이룰 수 없는 말. 조사ㆍ조동사 따위.
