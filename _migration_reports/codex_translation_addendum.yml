---
meanings: {}
words:
  歯:
    歯垢:
      ? 歯の表面にこびりついたよごれ。多くは、食物のかすを栄養にする微生物からなる。虫歯の原因になり、歯石の母体ともなる。歯くそ。
      : 치아 표면에 달라붙은 때. 대개 음식 찌꺼기를 영양으로 삼는 미생물로 이루어지며, 충치의 원인이 되고 치석의 바탕이 되기도 한다.
    歯序:
      年齢をもとにした順序。としの順。: 나이를 기준으로 한 순서. 나이순.
    歯槽膿漏:
      ? 炎症などによって歯の周囲の組織が破壊され、歯茎からうみや血が出たり、歯がぐらつく疾患の総称。口臭や抜け歯の原因になる。
      : 염증 등으로 치아 주위 조직이 파괴되어 잇몸에서 고름이나 피가 나거나 이가 흔들리는 질환의 총칭. 입 냄새와 치아 탈락의 원인이 된다.
    歯石:
      歯の表面についた歯垢(シコウ)が石灰化したもの。歯塩。: 치아 표면에 붙은 치태가 석회화된 것. 치석.
    鋸歯:
      ? "①のこぎり状の歯。 ②植物で葉のふちが、のこぎり状に細かく切れこみとがっていること。ケヤキ・ヤマザクラなど。"
      : "① 톱니 모양의 이. ② [생물] 식물의 잎 가장자리가 톱니처럼 잘게 갈라져 뾰족한 것."
    齲・齲歯:
      口内の細菌が作り出した乳酸によって歯の組織が侵食される病気。また、その歯。: "[의학] 입안의 세균이 만들어 낸 젖산으로 치아 조직이 침식되는 병. 또는 그 치아."
    歯固め:
      ? "①昔、長寿を願って正月三が日の間、ダイコン・ウリ・押し鮎(あゆ)・イノシシの肉・鏡餅(かがみもち)などを食べた行事。近世には鏡餅を保存しておいて六月一日に食べる行事にもいう。 ②まだ歯の生えない乳児が、嚙(か)んだりしゃぶったりして歯茎をかためる玩具(ガング)。"
      : "① 옛날에 장수를 빌며 정월 초사흘 동안 무, 참외, 눌러 말린 은어, 멧돼지 고기, 가가미모치 등을 먹던 행사. 근세에는 가가미모치를 보관해 두었다가 6월 1일에 먹는 행사도 이른다. ② 아직 이가 나지 않은 영아가 물거나 빨며 잇몸을 단단하게 하는 장난감."
    歯嚙み:
      "①歯を強くかみ合わせること。 ②残念がること。はぎしり。": "① 이를 세게 악무는 것. ② 분해서 이를 악무는 것. 이를 갈기."
    歯痒い:
      思いどおりにならなくて、いらだたしい。じれったい。もどかしい。: 뜻대로 되지 않아 초조하고 답답하다. 안타깝다.
    歯軋り:
      ? "①睡眠中、歯を強くこすり合わせて音をたてること。 ②くやしくて歯を強くかみ合わせること。はがみ。"
      : "① 잠자는 동안 이를 세게 맞비벼 소리를 내는 것. ② 분해서 이를 세게 악무는 것."
    歯切れ:
      "①歯で食べ物をかみ切るときの感じ。 ②言い方の明確さの度合。": "① 이로 음식을 씹어 끊을 때의 느낌. ② 말투가 분명한 정도."
    歯茎:
      歯の根を包む筋肉で、粘膜におおわれている層。歯齦(シギン)。: 치아의 뿌리를 감싸는 조직으로, 점막에 덮여 있는 층. 잇몸.
  死:
    死刑:
      犯罪者の生命を絶つ、最も重い刑罰。: 범죄자의 생명을 끊는 가장 무거운 형벌.
    死去:
      人が死ぬこと。死んでこの世を去ること。死亡。 逝去: 사람이 죽는 것. 죽어서 세상을 떠나는 것. 사망.
    死守:
      命がけで守ること。必死に守ること。: 목숨을 걸고 지키는 것. 필사적으로 지키는 것.
    死期:
      "①死ぬとき。 ②命を投げだすべきとき。": "① 죽을 때. ② 목숨을 내놓아야 할 때."
    死活:
      死ぬことと生きること。死ぬか生きるか。: 죽는 것과 사는 것. 생사가 걸린 일.
    死灰復然:
      ? 一度衰えた勢力が再び盛り返すたとえ。また、一度収束したことが再発するたとえ。火の気のなくなった灰が再び燃えだす意から。「然」は「燃」に同じ。〈『史記』〉 寒灰復然
      : 한때 쇠퇴한 세력이 다시 살아나는 비유. 또는 한 번 가라앉은 일이 다시 일어나는 비유.
    死線:
      ? "①生きるか死ぬかの境。 ②牢獄(ロウゴク)などの周りに設けられ、越えると銃殺されるという限界の線。"
      : "① 생사의 갈림길. ② 감옥 등 주변에 설치되어 넘으면 총살된다는 한계선."
    死角:
      ? "①障害物のため見通しのきかない範囲。 ②鉄砲の構造上の理由や障害物のため、射程内でも弾丸の届かない区域。"
      : "① 장애물 때문에 보이지 않는 범위. ② 총기의 구조나 장애물 때문에 사정거리 안에서도 탄환이 닿지 않는 구역."
    死語:
      ? "①使われなくなった言葉。廃語。 活語 ②過去に使用された言語で、今では一般には使用されなくなったもの。古代ギリシャ語など。"
      : "① 더 이상 쓰이지 않게 된 말. 폐어. ② 과거에 쓰였으나 지금은 일반적으로 쓰이지 않는 언어."
    黒死病:
      ? ペスト菌の感染によっておこる感染症。ネズミについたノミにより媒介される。高熱を出し、死亡率が高い。
      : "[생물] 페스트균 감염으로 일어나는 감염병. 쥐에 붙은 벼룩이 매개하며, 고열이 나고 치명률이 높다."
  氷:
    氷州:
      大西洋北極圏付近の共和国。氷河・火山・温泉が多い。首都はレイキャビク。: "[나라] 대서양 북극권 부근의 공화국. 빙하, 화산, 온천이 많으며 수도는 레이캬비크."
    氷枕:
      氷をゴム製の袋に入れて、枕とするもの。水枕: 얼음을 고무 주머니에 넣어 베개로 쓰는 것. 얼음베개.
    氷菓子:
      牛乳・卵黄・砂糖・香料などをかきまぜ、空気を含ませながらこおらせた菓子。夏: 우유, 달걀노른자, 설탕, 향료 등을 섞어 공기를 머금게 하면서 얼린 과자.
    氷解:
      氷がとけるように、疑問や不満などがなくなること。: 얼음이 녹듯이 의문이나 불만 따위가 사라지는 것.
    氷雨:
      "①ひょう。夏 ②みぞれ。みぞれのような冷たい雨。あられ。冬": "① 우박. ② 진눈깨비. 진눈깨비처럼 차가운 비. 싸락눈."
  決:
    合決:
      ? 板を接(は)ぎ合わせるとき、板の端の厚みの半分ずつをけずり取って張り合わせる方法。ちがいはぎ。
      : 판자를 맞붙일 때 판자 끝 두께의 절반씩을 깎아 서로 맞물려 붙이는 방법.
    決別:
      いとまごいをしてきっぱり別れること。 「訣別」の書きかえ字。: 작별 인사를 하고 단호히 헤어지는 것.
    決壊:
      堤防などが破れてくずれること。また、切りくずすこと。 「決潰」の書きかえ字。: 제방 등이 터져 무너지는 것. 또는 잘라 무너뜨리는 것.
    決意:
      意志をしっかりと決めること。また、その覚悟。決心。: 뜻을 굳게 정하는 것. 또는 그 각오. 결심.
    決断:
      "①きっぱり決めること。 ②事の善し悪しを裁くこと。": "① 단호히 결정하는 것. ② 일의 옳고 그름을 판단하는 것."
    決然:
      覚悟を決めたさま。思いきったようす。: 각오를 굳힌 모양. 결연한 모습.
    決裂:
      切れさけること。意見がまとまらず、物別れに終わること。: 갈라져 터지는 것. 의견이 모이지 않아 결렬되는 것.
    決議:
      会議において、物事を決めること。また、決まった事柄。議決: 회의에서 일을 결정하는 것. 또는 결정된 사항.
    決起:
      決心して行動をおこすこと。 「蹶起」の書きかえ字。: 결심하고 행동을 일으키는 것. 궐기.
    溢決:
      川などの水があふれ、堤が切れること。: 강 등의 물이 넘쳐 제방이 터지는 것.
  油:
    油凪:
      海面が、油を流したように波がなく平らになった状態。べたなぎ。: 해면이 기름을 흘린 듯 파도 없이 평평해진 상태. 아주 잔잔한 바다.
    油染みる:
      油や人体から出る脂肪などが染みついて汚れる。: 기름이나 사람 몸에서 나온 지방 등이 배어 더러워지다.
    油桃:
      モモの一品種。: "[생물] 복숭아의 한 품종."
    油点草:
      ユリ科の多年草。: "[생물] 백합과의 여러해살이풀."
    油然:
      盛んにわき起こるさま。: 힘차게 솟아오르는 모양.
    油田:
      石油を埋蔵・産出している地域。: 석유를 매장하고 산출하는 지역.
    油絵:
      油絵の具で画布や板に描いた絵。油彩。水彩画: 유화 물감으로 캔버스나 판에 그린 그림. 유채화.
    油菜:
      ? アブラナ科の二年草。古く中国から渡来し、栽培されてきた。春に黄色い花が咲き、種子からは菜種油をとる。若葉は食用。花は「菜の花」と呼ばれる。
      : "[생물] 배추과의 두해살이풀. 봄에 노란 꽃이 피고 씨에서는 유채기름을 얻으며 어린잎은 식용한다."
    油蟬:
      ? セミ科の昆虫。最も一般的なセミで、体は黒く、はねは褐色で、油の染みついたような斑紋(ハンモン)がある。木の上で「ジージー」とやかましく鳴く。夏
      : "[생물] 매미과의 곤충. 몸은 검고 날개는 갈색이며 기름이 밴 듯한 무늬가 있다."
  波:
    小波:
      水面に立つ小さい波。さざれなみ。: 수면에 이는 작은 물결. 잔물결.
    波斯:
      イランの旧称。: "[나라] 이란의 옛 이름."
    波路:
      船の通る道。航路・船路: 배가 지나는 길. 항로.
    波長:
      ? "①波動の隣り合う山と山、谷と谷の距離。位相の等しい二点間の距離。 ②考え方・感じ方の調子。"
      : "① 파동에서 이웃한 마루와 마루, 골과 골 사이의 거리. 위상이 같은 두 점 사이의 거리. ② 생각이나 느낌의 조화."
    波頭:
      "① 波の上。海上。② なみがしら。": "① 파도 위. 해상. ② 파도의 머리 부분."
    波風:
      "①波と風。風によって波が立つこと。 ②苦労の多いたとえ。また、もめごとのたとえ。": "① 파도와 바람. 바람 때문에 파도가 이는 것. ② 고생이 많음을 비유하는 말. 또는 분쟁의 비유."
  注:
    注射:
      血管などに針を刺し、薬液を体内に入れること。: 혈관 등에 바늘을 찔러 약액을 몸 안에 넣는 것.
    注意:
      ? "①心にとめること。気を配って集中すること。注目・留意 ②相手に気をつけるように言うこと。 ③危険に対する用心。警戒。"
      : "① 마음에 두는 것. 신경을 쓰고 집중하는 것. ② 상대에게 조심하라고 말하는 것. ③ 위험에 대비해 조심함. 경계."
    注文:
      ? "①品物をあつらえること。種類・数・寸法などを指定して作らせたり、送らせたりすること。 ②依頼のとき、希望や条件を示すこと。また、その希望や条件。 「註文」の書きかえ字。"
      : "① 물건을 주문하는 것. 종류, 수량, 치수 등을 지정해 만들게 하거나 보내게 하는 것. ② 의뢰할 때 희망이나 조건을 제시하는 것. 또는 그 희망이나 조건."
    注脚:
      本文中に小さく二行で挿入した注釈。割り注。: 본문 속에 작은 글씨 두 줄로 끼워 넣은 주석. 할주.
    注視:
      じっと見つめること。注目: 가만히 뚫어지게 보는 것. 주시.
    注連縄:
      神前や神事の場所にけがれが入らないように、張り巡らす縄。: 신 앞이나 신사 의식 장소에 부정한 것이 들어오지 못하도록 둘러치는 새끼줄.
    注連飾り:
      正月などに、門や神棚に注連縄を張って飾ること。また、その飾り。新年: 새해 등에 문이나 신단에 금줄을 쳐 장식하는 것. 또는 그 장식.
  泳:
    泳者:
      泳ぐ人。泳ぎ手。: 헤엄치는 사람. 수영하는 사람.
    游泳:
      "①およぐこと。水泳 夏 ②世渡りのたとえ。処世": "① 헤엄치는 것. 수영. ② 세상을 살아가는 일의 비유. 처세."
    遠泳:
      海や川などで、長距離を泳ぎ続けること。また、その競技。: 바다나 강 등에서 긴 거리를 계속 헤엄치는 것. 또는 그 경기.
  洋:
    洋傘:
      金属性の細い骨に布やビニールを張り、持ち手をつけた雨傘。こうもりがさ。: 금속제 가는 살에 천이나 비닐을 씌우고 손잡이를 붙인 우산.
    洋墨:
      文字を書いたり印刷したりするときに用いる色のついた液体。インキ。: 글씨를 쓰거나 인쇄할 때 쓰는 색이 있는 액체. 잉크.
    洋妾:
      明治時代、日本に来ていた西洋人の妾(めかけ)になった女性をさげすんでいった語。: 메이지 시대에 일본에 온 서양인의 첩이 된 여성을 낮잡아 이르던 말.
    洋杯:
      水などを飲むための、円筒形でガラス製の容器。: 물 등을 마시기 위한 원통형 유리 용기. 컵.
    洋洋:
      ? "①水があふれんばかりに豊かで、果てしなく広がっているさま。 ②前途がひらけて、将来が希望に満ちているさま。"
      : "① 물이 넘칠 만큼 풍부하고 끝없이 넓게 펼쳐진 모양. ② 앞길이 열려 장래가 희망으로 가득한 모양."
    洋琴:
      ? 鍵盤(ケンバン)楽器の一種。大きな箱の中に金属の弦をはり、鍵盤をたたくとハンマーが弦を打って音を出す楽器。
      : 건반악기의 한 종류. 큰 상자 안에 금속 현을 치고, 건반을 누르면 해머가 현을 쳐 소리를 내는 악기.
    洋酒:
      ? オオムギ・ライムギなどを発酵させた液に、ネズの果実で香りをつけたアルコール度の高い蒸留酒。多く、カクテルの材料に用いる。
      : 보리나 호밀 등을 발효시킨 액에 주니퍼 열매로 향을 낸 도수가 높은 증류주. 주로 칵테일 재료로 쓴다.
    洋銀:
      ? "①銅・ニッケル・亜鉛からなる合金。銀白色でさびにくく、食器・装飾品・医療機器などに使用。 ②幕末に日本に入ってきた西洋の銀貨。"
      : "① 구리, 니켈, 아연으로 이루어진 합금. 은백색이고 녹슬기 어려워 식기, 장식품, 의료 기기 등에 쓰인다. ② 막말기에 일본에 들어온 서양 은화."
    洋風:
      西洋風。洋式。和風: 서양풍. 서양식.
    遠洋:
      陸地から遠く離れた海。: 육지에서 멀리 떨어진 바다. 원양.
    洋刀・洋剣:
      西洋風の細身の刀。第二次世界大戦まで、軍人や警官が腰に下げていた。: 서양식의 가느다란 칼. 제2차 세계대전 무렵까지 군인이나 경찰이 허리에 차고 다녔다.
  流:
    嫡流:
      本家の血筋。正統の家系。嫡統庶流: 본가의 혈통. 정통 가계.
    流会:
      会合がとりやめになること。: 회합이 취소되는 것.
    流儀:
      ? "①物事の独特のやり方。しきたり。 ②家や流派などに古くから伝えられている特有の型や方法。"
      : "① 사물의 독특한 방식. 관습. ② 집안이나 유파 등에 오래전부터 전해지는 고유한 형식이나 방법."
    流刑:
      罪人を遠い土地や離れ島に追放する昔の刑罰。流罪: 죄인을 먼 땅이나 외딴섬으로 추방하던 옛 형벌. 유배.
    流弾:
      ながれだま。それだま。流丸。: 빗나가 날아온 탄환. 유탄.
    流暢:
      言葉がすらすらと出て、とどこおらないこと。また、そのさま。: 말이 술술 나와 막힘이 없는 것. 또는 그런 모양.
    流民:
      故郷や故国を離れて、さすらい歩く人々。流浪(ルロウ)の民。流氓(リュウボウ): 고향이나 고국을 떠나 떠돌아다니는 사람들. 유랑민.
    流水:
      "① 流れる水。水の流れ。地学では河川を流れる水。川。② 「くるま（車）」の異称。": "① 흐르는 물. 물의 흐름. 지학에서는 하천을 흐르는 물. 강. ② 수레의 다른 이름."
    流行:
      その時々にもてはやされている物事。その時代の人々の好みや風潮。: 그때그때 유행하는 사물. 그 시대 사람들의 취향이나 풍조.
      "①社会に一時的に広く行われること。また、そのもの。 ②病気などが一時的に広がること。": "① 사회에 일시적으로 널리 퍼지는 것. 또는 그 자체. ② 병 등이 일시적으로 널리 퍼지는 것."
    流言:
      根拠のないうわさをいいふらすこと。また、そのうわさ。ねなしごと。浮言。流説。るげん。: 근거 없는 소문을 퍼뜨리는 것. 또는 그 소문. 유언비어.
  消:
    消化:
      ? "①体内に取り入れた食物を分解し、吸収しやすい状態に変えるはたらき。 ②読んだり聞いたりしたものを理解して、自分のものとすること。 ③物事を残さず処理すること。"
      : "① 몸 안에 들어온 음식을 분해해 흡수하기 쉬운 상태로 바꾸는 작용. ② 읽거나 들은 것을 이해해 자기 것으로 만드는 것. ③ 일을 남김없이 처리하는 것."
    消夏:
      夏の暑さをしのぐこと。 避暑 夏 「銷夏」の書きかえ字。: 여름 더위를 피하거나 견디는 것. 피서.
    消失:
      消えてなくなること。失(う)せること。: 사라져 없어지는 것. 소실.
    消梨:
      ナシの一品種。果汁がきわめて多い。: "[생물] 배의 한 품종. 과즙이 매우 많다."
    消極:
      自ら進んで行動を起こさないこと。控えめであること。 積極: 스스로 나서서 행동하지 않는 것. 소극적인 것.
    消炎:
      患部の炎症を抑え、とり去ること。: 환부의 염증을 억제하고 없애는 것.
    消閑:
      ひまをしのぐこと。ひまつぶし。: 한가한 시간을 달래는 것. 심심풀이.
    雪消・雪解:
      雪がとけ、消えること。雪どけ。: 눈이 녹아 사라지는 것. 눈 녹음.
  深:
    深交:
      深い交際。また、つきあいが深くかたいこと。: 깊은 교제. 또는 사귐이 깊고 굳건함.
    深刻:
      ? "①事態が差し迫って重大なこと。程度がはなはだしく重大なこと。 ②強く心にきざみつけられること。"
      : "① 사태가 절박하고 중대한 것. 정도가 몹시 심각한 것. ② 마음에 강하게 새겨지는 것."
    深化:
      物事の程度などが深まること。深めること。また深刻になること。: 사물의 정도 등이 깊어지는 것. 깊게 하는 것. 또는 심각해지는 것.
    深奥:
      奥深いさま。また物事の奥深いところ。 深遠: 깊고 그윽한 모양. 또는 사물의 깊숙한 곳.
    深更:
      夜更け。真夜中。 深夜: 깊은 밤. 한밤중.
    深海:
      "①深い海。海の深いところ。 ②水深二〇〇(メートル)以上の深い海。 ①②浅海": "① 깊은 바다. 바다의 깊은 곳. ② 수심 200미터 이상의 깊은 바다."
    深手・深傷:
      深い傷。大きなけが。傷が大きいこと。重傷。: 깊은 상처. 큰 부상. 상처가 큰 것. 중상.
    深山:
      奥山。人里はなれた奥深い山。: 깊은 산. 인가에서 멀리 떨어진 깊숙한 산.
    深山颪:
      奥深い山から吹きおろす強い風。: 깊은 산에서 아래로 세차게 불어 내려오는 바람.
    深山樒:
      ? ミカン科の常緑低木。山地に自生し、春に白い小花をつける。球形の実は赤く熟し美しいが有毒。
      : "[생물] 운향과의 상록 관목. 산지에 자생하며 봄에 흰 작은 꽃이 피고, 둥근 열매는 붉게 익어 아름답지만 독이 있다."
  温:
    微温い:
      "①少しあたたかい。 ②ゆるやかであるさま。きびしくない。": "① 조금 따뜻하다. 미지근하다. ② 느슨한 모양. 엄격하지 않다."
    温厚:
      ? "① 人あたりがやわらかくてまじめなさま。おだやかで情け深いさま。② おだやかでおちついたさま。"
      : "① 사람을 대하는 태도가 부드럽고 성실한 모양. 온화하고 인정이 깊은 모양. ② 온화하고 차분한 모양."
    温州:
      中国浙江(セッコウ)省南部の都市。絹織物などが特産で、茶やミカンの集散地。: "[지명] 중국 저장성 남부의 도시. 견직물 등이 특산이며 차와 귤의 집산지."
    温州蜜柑:
      ミカンの一品種。日本原産。一般にミカンと呼ばれているもの。酸味と種が少なく、美味。: "[생물] 귤의 한 품종. 일본 원산으로, 일반적으로 귤이라 부르는 것. 산미와 씨가 적고 맛이 좋다."
    温床:
      ? "①生長を早めるため、人工的に温度を高めた苗床(なえどこ)。冷床 ②よくない物事や風潮が発生しやすい環境。"
      : "① 생장을 빠르게 하려고 인공적으로 온도를 높인 모판. ② 좋지 않은 일이나 풍조가 생기기 쉬운 환경."
    温故:
      ? "( 「論語‐為政」の「温レ故而知レ新、可二以為一レ師矣」による。「故(ふる)きを温(たず)ねる」の意 ) 昔のことを調べること。歴史、由来を求めること。"
      : 옛일을 살펴보는 것. 역사나 유래를 찾아보는 것.
    温気:
      むっとするようなあたたかい空気。むし暑い空気。: 후텁지근하게 따뜻한 공기. 무더운 공기.
  港:
    定繫港:
      その船舶が、おもに繫留する港。船籍港。: 그 선박이 주로 계류하는 항구. 선적항.
    帰港:
      船が出発した港に戻ること。出港: 배가 출발했던 항구로 돌아오는 것. 귀항.
    星港:
      シンガポール共和国の首都。貿易港・工業都市として発展。: "[지명] 싱가포르 공화국의 수도. 무역항이자 공업 도시로 발전했다."
    母港:
      その船が出発した港。また、本拠地とする港。: 그 배가 출발한 항구. 또는 본거지로 삼는 항구.
    河港:
      河口または川岸に造られた港。河口港。海港: 하구 또는 강가에 만든 항구. 하항.
    港口:
      港の出入り口。みなとぐち。: 항구의 출입구.
    港湾:
      船が停泊し、乗客の乗り降りや荷物のあげおろしの設備がある海域。: 배가 정박하고 승객의 승하선이나 화물 하역 시설이 있는 해역.
    空港:
      航空輸送のため公共の用に供する場所。エアポート。〔現代語大辞典（1932）〕: 항공 수송을 위해 공공용으로 제공되는 장소. 공항.
    築港:
      交通や運輸の便をはかるために、船舶を停泊させる港をきずくこと。: 교통과 운수의 편의를 위해 선박을 정박시킬 항구를 만드는 것.
    鎖港:
      ? 港を閉じて船の出入りをさせないこと。また、外国船の出入りを禁止し、外国との貿易をしないこと。 開港
      : 항구를 닫아 배가 드나들지 못하게 하는 것. 또는 외국 선박의 출입을 금지하고 외국과 무역하지 않는 것.
  湖:
    江湖:
      世の中。世間。社会。: 세상. 세간. 사회.
    湖沼:
      湖と沼。: 호수와 늪.
    湖海の士:
      在野の豪快な気性をもつ人物。〈『三国志』〉: 재야에 있으면서 호방한 기질을 지닌 인물.
  湯:
    探湯:
      ? 古代の裁きの方法。神に誓って、熱湯に手を入れさせ、火傷(やけど)をしたものは邪、火傷をしなかったものは正とした。
      : 고대의 재판 방법. 신에게 맹세하게 한 뒤 끓는 물에 손을 넣게 하여, 화상을 입으면 그르다고 하고 입지 않으면 옳다고 판정했다.
    湯治場:
      病気やけがなどの療養をする温泉場。: 병이나 상처 등을 요양하는 온천장.
    白湯:
      水を沸かしただけで何も加えない湯。: 물만 끓이고 아무것도 넣지 않은 더운물.
    盟神探湯:
      ? 古代、神に誓約してから熱湯に手を入れさせ、火傷(やけど)を負ったものを邪とし、火傷を負わないものを正とした裁きの方法。
      : 고대에 신에게 맹세한 뒤 끓는 물에 손을 넣게 하여, 화상을 입으면 그르다고 하고 입지 않으면 옳다고 판정하던 재판 방법.
    素湯:
      水を沸かしただけで何も入れていない、飲むための湯。: 물만 끓이고 아무것도 넣지 않은, 마시기 위한 더운물.
    誓湯:
      ? 古代の裁判の方法。神に誓約して熱湯に手を入れさせ、火傷(やけど)を負ったものを邪とし、負わないものを正とした。くがたち。
      : 고대의 재판 방법. 신에게 맹세하고 끓는 물에 손을 넣게 하여, 화상을 입으면 그르다고 하고 입지 않으면 옳다고 판정했다.
    湯浴み:
      風呂(フロ)に入ること。入浴。湯に入り、体を温め洗うこと。: 목욕탕에 들어가는 것. 입욕. 더운물에 들어가 몸을 데우고 씻는 것.
  漢:
    悪漢:
      悪事をはたらく男。わるもの。: 나쁜 짓을 하는 남자. 악한.
    没分暁漢:
      道理をわきまえない人。がんこで聞き分けのない人。: 도리를 모르는 사람. 완고하고 말을 알아듣지 않는 사람.
    漢口:
      ? 中国、湖北省武漢市の一地区。漢水が長江へ合流する地点の北岸に位置し、天津条約により開港した貿易港。京広鉄道が通じる。武漢三鎮の一つ。漢。
      : "[지명] 중국 후베이성 우한시의 한 지역. 한수가 장강에 합류하는 지점의 북안에 있는 무역항."
    漢堡:
      ドイツ北部の工業都市。エルベ川下流にあり、貿易港としても有名。: "[지명] 독일 북부의 공업 도시. 엘베강 하류에 있으며 무역항으로도 유명하다."
    漢竹:
      中国から渡来したタケ。カンチク・マダケ・ハチクなど。: "[생물] 중국에서 전래된 대나무. 한죽, 왕대, 솜대 등을 이른다."
    漢音:
      ? 漢字の音の一種。唐代の長安付近の音が、遣唐使などによって伝えられたもの。「日」を「ジツ」、「兄」を「ケイ」と読む類。
      : 한자음의 한 종류. 당나라 장안 부근의 발음이 견당사 등을 통해 전해진 것.
    羅漢松:
      ? マキ科の常緑高木。暖地に自生。葉は線形で先がとがる。秋、球形で白緑色の果実をつける。果実の下には球形の花床が赤紫色に熟し、食べられる。
      : "[생물] 나한송과의 상록 교목. 따뜻한 지방에 자라며, 가을에 둥근 흰녹색 열매를 맺는다."
    羅漢柏:
      ヒノキ科の常緑高木。: "[생물] 편백나무과의 상록 교목."
    雲漢:
      あまのがわ。銀河。天漢・天河: 은하수.
  炭:
    採炭:
      石炭を掘ってとること。石炭を採掘すること。: 석탄을 파내어 캐는 것. 석탄을 채굴하는 것.
    炭疽病:
      ? 炭疽菌が原因で発病する感染症。ウシ・ウマ・ヒツジなどに多く発生するが、人間にも感染する。内臓がはれ、敗血症を起こす。炭疽。
      : "[생물] 탄저균 때문에 발병하는 감염병. 소, 말, 양 등에 많이 발생하지만 사람에게도 감염된다."
    炭礦:
      炭鉱: 탄광.
    炭素:
      ? 高温では燃えて二酸化炭素となる元素。天然には石炭・ダイヤモンドなどが単体として存在する。
      : 고온에서 타면 이산화탄소가 되는 원소. 자연계에는 석탄이나 다이아몬드 등으로 단체 상태로 존재한다.
    炭酸:
      二酸化炭素が水にとけてできる弱い酸。: 이산화탄소가 물에 녹아 생기는 약한 산.
    炭鉱:
      石炭を採掘する鉱山。 「炭礦」の書きかえ字。: 석탄을 채굴하는 광산. 탄광.
    褐炭:
      質のよくない暗褐色の石炭。燃やすとすすが多く出る。: 질이 좋지 않은 암갈색 석탄. 태우면 그을음이 많이 난다.
    炭取・炭斗:
      炭を小出しにしておく容器。すみいれ。: 숯을 조금씩 꺼내 쓰도록 담아 두는 그릇.
  物:
    人物:
      "①ひと。 ②ひとがら。人品。 ③人格が高く、能力のすぐれた人。": "① 사람. ② 사람됨. 인품. ③ 인격이 높고 능력이 뛰어난 사람."
    作物所:
      平安時代、宮中の調度品の製造や修理を司(つかさど)った所。: 헤이안 시대 궁중의 집기 제작과 수리를 맡던 곳.
    物体:
      ? "① 具体的な形をもって存在しているもの。物質が集合してある形体をなしている物。② 哲学で、三次元的な空間的形成物。空間を占めるもの。哲学体系によってさまざまに解釈され、たとえば、認識的実在論では意識から独立した存在をさし、客観的現象論では形而上学的自体存在が現象したものをさす。"
      : "① 구체적인 형태를 가지고 존재하는 것. 물질이 모여 일정한 형체를 이룬 것. ② [철학] 3차원적 공간 형성물. 공간을 차지하는 것."
    物情:
      "①物の性質やありさま。 ②世間の様子。世人の心情。": "① 사물의 성질이나 모습. ② 세상의 형편. 세상 사람들의 심정."
    物情騒然:
      ? 世の中が騒がしくなり、人心が不安な状態になること。「物情」は世の中の様子。「騒然」は騒がしいさま。物議騒然
      : 세상이 소란해지고 사람들의 마음이 불안해지는 것.
    物我一体:
      物と我とが一つになること。また、物と心、他者と自己、客観と主観との対立を超えること。: 사물과 자아가 하나가 되는 것. 또는 사물과 마음, 타자와 자기, 객관과 주관의 대립을 넘어서는 것.
    物故:
      人が死ぬこと。死去。: 사람이 죽는 것. 사망.
    物納:
      租税などを物品でおさめること。金納: 조세 등을 물품으로 바치는 것. 물납.
    物色:
      "①多くのなかから適当な人物や事物を探すこと。 ②物の色や形。": "① 많은 것 가운데 적당한 사람이나 사물을 찾는 것. ② 사물의 빛깔이나 모양."
    果物・果:
      木や草にできる果実で食用となるもの。水菓子。: 나무나 풀에 맺히는 열매 가운데 먹을 수 있는 것. 과일.
    物洗貝:
      モノアラガイ科の巻貝。各地の池沼や小川の水草に付着。殻は卵形で半透明。殻口が広い。: "[생물] 물달팽이과의 권패류. 각지의 못이나 늪, 개울의 수초에 붙어 살며, 껍데기는 달걀 모양이고 반투명하며 입구가 넓다."
    物忌み:
      ? "①神をまつるとき、一定期間、飲食や行いなどを慎み、心身を清めて家にこもること。 ②不吉として、ある種の物事を避けること。縁起かつぎ。"
      : "① 신을 모실 때 일정 기간 음식이나 행동을 삼가고 몸과 마음을 깨끗이 하여 집에 머무는 것. ② 불길하다고 여겨 어떤 일을 피하는 것. 길흉을 따지는 일."
    物憂い:
      おっくうで、何をするにも気がすすまない。何となくゆううつで、けだるい。: 귀찮고 무엇을 하든 내키지 않다. 어쩐지 우울하고 나른하다.
    物怖じ:
      物事に対し、恐れること。おじけること。: 어떤 일에 대해 겁을 내는 것. 주눅 드는 것.
  球:
    剛球:
      野球で、投手の投げる球が速くて重いこと。: 야구에서 투수가 던지는 공이 빠르고 묵직한 것.
    卓球:
      中央にネットを張った長方形の台をはさんで、ラケットで小球を打ち合う競技。ピンポン。: 가운데에 네트를 친 직사각형 탁자를 사이에 두고 라켓으로 작은 공을 주고받는 경기. 탁구.
    地球:
      ? 太陽の惑星で、太陽系の内側から三番目にある。水と大気があり、人類をはじめとした各種生物が生存する。自転しながら、一年に一回太陽のまわりを公転し、衛星として月をもつ。
      : 태양의 행성으로 태양계 안쪽에서 세 번째에 있다. 물과 대기가 있으며 인류를 비롯한 여러 생물이 산다.
    好球:
      球技で、打ちやすく、受けやすく、蹴(け)りやすい、よいたま。: 구기에서 치기 쉽고 받기 쉽고 차기 쉬운 좋은 공.
    気球:
      空気より軽い気体や熱した空気を入れ、空に高く揚げる球形の袋。宣伝・観測用など。: 공기보다 가벼운 기체나 데운 공기를 넣어 하늘 높이 띄우는 공 모양의 주머니.
    球団:
      野球やサッカーのプロチームをつくり、その試合を見せるのを事業とする団体。: 야구나 축구 프로팀을 만들어 그 경기를 보여 주는 일을 사업으로 하는 단체.
    球戯:
      "①ボールを用いてする遊び。 ②たまつき。ビリヤード。": "① 공을 사용해 하는 놀이. ② 당구."
    球技:
      ボールを使って行う競技の総称。野球・サッカー・テニスなど。: 공을 사용해 하는 경기의 총칭. 야구, 축구, 테니스 등.
    球根:
      ? 多年生植物の地下にある根や茎などが、養分を蓄えるために球状になったもの。ユリ・ダリアなど。
      : "[생물] 여러해살이식물의 땅속 뿌리나 줄기 등이 양분을 저장하기 위해 공 모양이 된 것."
  由:
    事由:
      "①物事の理由。わけ。 ②法律用語で、直接の理由・原因となっている事実。": "① 사물의 이유. 까닭. ② [법률] 직접적인 이유나 원인이 되는 사실."
    由来:
      "①物事の経てきた過程や道筋。いわれ。来歴 ②もともと。元来・本来": "① 사물이 거쳐 온 과정이나 내력. 유래. ② 본래. 원래."
    由無い:
      "①根拠や理由がない。つまらない。 ②手段や方法がない。仕方がない。": "① 근거나 이유가 없다. 보잘것없다. ② 수단이나 방법이 없다. 어쩔 수 없다."
    由緒:
      ? "①物事のいわれ・起こり。物事の経てきた筋道。由来 ②筋道の正しいりっぱな来歴。また、名誉ある歴史。"
      : "① 사물의 유래나 기원. 사물이 거쳐 온 내력. ② 내력이 바르고 훌륭한 역사. 또는 명예로운 역사."
    由縁:
      物事のゆかり。由来: 사물의 연고. 유래.
    経由:
      "①ある地点を通って目的地に行くこと。 ②ある機関をへて事を行うこと。": "① 어떤 지점을 지나 목적지로 가는 것. ② 어떤 기관을 거쳐 일을 하는 것."
    縁由:
      "①ゆかり。縁故 ②法律で、人が意志を決定するに至った理由。動機。": "① 인연. 연고. ② [법률] 사람이 의사를 결정하게 된 이유. 동기."
  申:
    上申:
      上役や上の機関に、意見や事情を申し述べること。: 윗사람이나 상급 기관에 의견이나 사정을 말씀드리는 것.
    具申:
      上の人に意見や事情などを詳しく申し述べること。上申・進言: 윗사람에게 의견이나 사정 등을 자세히 말씀드리는 것.
    庚申塚:
      青面金剛(ショウメンコンゴウ)をまつった塚。多く、道ばたの石塚。: 청면금강을 모신 무덤 모양의 돌무더기. 대개 길가의 돌무더기이다.
    申告:
      国民が必要な事項を国・役所などに申し出ること。: 국민이 필요한 사항을 국가나 관청 등에 신고하는 것.
    申請:
      官庁などへ許可や認可を願い出ること。: 관청 등에 허가나 인가를 신청하는 것.
    申達:
      上級の官庁から下級の官庁に、文書で指令を出すこと。: 상급 관청에서 하급 관청에 문서로 지령을 내리는 것.
  界:
    境界:
      "①土地などのさかい目。境域②物事のさかい目。": "① 토지 등의 경계선. 경계 영역. ② 사물의 경계."
    学界:
      学問や学者の世界。: 학문이나 학자의 세계. 학계.
    業界:
      同じ業種・商売に従事する人々の社会。同業者仲間。: 같은 업종이나 장사에 종사하는 사람들의 사회. 동업자 세계.
    界域:
      境域。字通「界」の項目を見る。: 경계 안의 영역. 경역.
    界繫:
      ? 迷いの世界である、欲界・色界・無色界の三界(サンガイ)のいずれかに束縛され、自由にならないこと。
      : "[불교] 미혹의 세계인 욕계, 색계, 무색계의 삼계 가운데 어느 하나에 얽매여 자유롭지 못한 것."
    界隈:
      そのあたり一帯。近所。近辺・付近: 그 부근 일대. 근처. 주변.
    疆界:
      土地の境界。境域。さかい。: 토지의 경계. 경계 영역. 경계.
    眼界:
      "①目に見える範囲。視界 ②考えの及ぶ範囲。": "① 눈에 보이는 범위. 시야. ② 생각이 미치는 범위."
    花柳界:
      芸者や遊女の社会。いろまち。遊里。花柳の巷(ちまた)。: 기생이나 유녀의 사회. 유흥가. 화류계.
    角界:
      相撲の社会。: 스모계.
  病:
    疫病草:
      リンドウの古名。: "[생물] 용담의 옛 이름."
    病害:
      農作物や家畜の病気によってこうむる害。: 농작물이나 가축의 병으로 입는 피해.
    病根:
      "①病気のもと。病原・病因 ②悪い習慣の根本原因。": "① 병의 근원. 병원. 병인. ② 나쁜 습관의 근본 원인."
    病気:
      ? "① 生体が正常と異なった形態または機能を示す状態。多くの場合に自ら健康感の喪失ないし苦痛を覚える。体内の異常によるものとしては動脈硬化、血栓、心筋梗塞、腫瘍などがあり、外部からの侵襲によるものとしては外傷や感染症などがある。やまい。わずらい。いたつき。疾病。② 人の、悪いくせや行状。"
      : "① 생체가 정상과 다른 형태나 기능을 보이는 상태. 질병. ② 사람의 나쁜 버릇이나 행실."
    病痾:
      長びいていつまでも治らない病気。宿痾: 오래 끌며 좀처럼 낫지 않는 병. 숙환.
    病臥:
      病気で床につくこと。: 병으로 자리에 누움.
    病葉:
      ? 病気や害虫のために、変色したり枯れたりした葉。特に、夏のうちに赤や黄に色づいて縮まった葉。夏
      : 병이나 해충 때문에 변색되거나 마른 잎. 특히 여름에 붉거나 노랗게 물들어 오그라든 잎.
    病院:
      病人やけが人を収容し、医師が治療する施設。医院・診療所: 환자나 부상자를 수용하고 의사가 치료하는 시설. 병원.
    稲熱病:
      ? いもち病菌の寄生によるイネの病害の一つ。葉・茎に褐色の小さな斑点(ハンテン)ができて種子がつかなくなる。
      : "[생물] 도열병균의 기생으로 생기는 벼 병해의 하나. 잎과 줄기에 갈색의 작은 반점이 생기고 씨가 맺히지 않게 된다."
    黒死病:
      ? ペスト菌の感染によっておこる感染症。ネズミについたノミにより媒介される。高熱を出し、死亡率が高い。
      : "[생물] 페스트균 감염으로 일어나는 감염병. 쥐에 붙은 벼룩이 매개하며, 고열이 나고 치명률이 높다."
  発:
    愛発関:
      ? 越前(えちぜん)（現在の福井県東部）の愛発山の近辺にあった関所。古代北陸道の要衝で、鈴鹿(すずか)・不破(ふわ)とともに三関と呼ばれた。
      : "[지명] 에치젠의 아라치산 부근에 있던 관문. 고대 호쿠리쿠도의 요충지로 스즈카, 후와와 함께 삼관이라 불렸다."
    発射:
      "①弾丸・ロケットなどを撃ち出すこと。 ②矢を射ること。": "① 탄환이나 로켓 등을 쏘아 내는 것. ② 화살을 쏘는 것."
    発生:
      新たに生じること。生まれること。また、物事が始まること。: 새로 생기는 것. 태어나는 것. 또는 일이 시작되는 것.
    発表:
      表向きに知らせること。: 공개적으로 알리는 것. 발표.
    発見:
      それまで知られていなかった事物を、はじめて見つけ出すこと。: 그때까지 알려지지 않았던 사물을 처음 찾아내는 것.
    発覚:
      悪事や陰謀などが人に知られること。秘密がばれること。露見: 나쁜 일이나 음모 등이 남에게 알려지는 것. 비밀이 드러나는 것.
    発車:
      止まっていた汽車・電車・自動車などが動き出すこと。停車: 멈춰 있던 기차, 전차, 자동차 등이 움직이기 시작하는 것. 발차.
    発達:
      ? "①成長して、より完全なものになっていくこと。 ②技術などが進歩すること。また、規模が次第に大きくなること。"
      : "① 성장하여 더 완전한 것이 되어 가는 것. ② 기술 등이 진보하는 것. 또는 규모가 차츰 커지는 것."
    発条:
      ? "①鋼鉄などを巻いたり曲げたりして、弾力をもたせたもの。スプリング。 ②人の跳躍力や弾力性のたとえ。"
      : "① 강철 등을 감거나 구부려 탄력을 갖게 한 것. 스프링. ② 사람의 도약력이나 탄력성을 비유하는 말."
    発船:
      船が港を出発すること。船出。: 배가 항구를 출발하는 것. 출항.
  登:
    登坂:
      車両が坂道をのぼって走ること。: 차량이 비탈길을 올라 달리는 것.
    登場:
      舞台や映画・小説などの場面に人物が現れること。退場: 무대, 영화, 소설 등의 장면에 인물이 나타나는 것. 등장.
    登壇:
      壇に上がること。演壇にのぼること。降壇: 단에 오르는 것. 연단에 오르는 것.
    登山:
      ? "①山にのぼること。山登り ②山上の寺に参詣(サンケイ)すること。 ③修行するために、僧・修験者などが山にこもること。 ①～③下山"
      : "① 산에 오르는 것. 등산. ② 산 위의 절에 참배하는 것. ③ 수행을 위해 승려나 수행자가 산에 들어가는 것."
    登校:
      授業を受けるため、生徒・児童が学校に行くこと。下校: 수업을 받기 위해 학생이나 아동이 학교에 가는 것. 등교.
    登用:
      ? 人をひきあげ用いること。人材を官職などにあげ、また、高い地位などにひきあげ用いること。とよう。
      : 사람을 발탁하여 쓰는 것. 인재를 관직이나 높은 지위에 올려 쓰는 것.
    登記:
      民法上の権利などを公示するため、一定の事項を登記簿に記載すること。: "[법률] 민법상의 권리 등을 공시하기 위해 일정한 사항을 등기부에 기재하는 것."
    登載:
      "①文章などを、新聞・雑誌などにのせること。掲載 ②帳簿・台帳などに公式に記すこと。記載": "① 글 등을 신문이나 잡지 등에 싣는 것. 게재. ② 장부나 대장 등에 공식적으로 적는 것. 기재."
    登録:
      "①帳簿に記載すること。 ②一定の事項を公簿に記載すること。": "① 장부에 기재하는 것. ② 일정한 사항을 공적인 장부에 기재하는 것."
    登頂:
      山などの頂上にのぼること。: 산 등의 정상에 오르는 것.
  皮:
    厚皮香:
      ツバキ科の常緑高木。: "[생물] 차나무과의 상록 교목."
    檜皮:
      ? "①ヒノキの皮。 ②「檜皮葺(ぶ)き」の略。 ③襲(かさね)の色目の一つ。昔、衣服を重ねるときの色合いで表は黒ずんだ紅色、裏は淡い藍色(あいいろ)。"
      : "① 편백나무 껍질. ② 편백나무 껍질로 지붕을 이는 방식의 준말. ③ 옛 의복 배색의 하나."
    檜皮色:
      "①黒みがかった赤紫の染め色。 ②縦糸は浅葱(あさぎ)色、横糸には赤色を用いた織り色。": "① 검은빛이 도는 적자색 물감색. ② 세로실은 옅은 남색, 가로실은 붉은색을 쓴 직물색."
    牛皮凍:
      アカネ科のつる性多年草。: "[생물] 꼭두서니과의 덩굴성 여러해살이풀."
    生皮苧:
      ? 繭から生糸をとるときに出る糸くずなどを、集めて乾燥させたもの。絹糸紡績などの原料とする。
      : 고치에서 생사를 뽑을 때 나오는 실찌꺼기 등을 모아 말린 것. 견사 방적 등의 원료로 쓴다.
    皮相:
      "①上っ面。うわべ。 ②見方や考え方が浅く、本質をとらえていないさま。": "① 겉면. 겉모습. ② 보는 방식이나 생각이 얕아 본질을 파악하지 못한 모양."
    皮膚:
      動物の体の表面をおおい包んでいる組織。はだ。: 동물의 몸 표면을 덮고 감싸는 조직. 피부.
    皮茸:
      イボタケ科のキノコ。 革茸(こうたけ): "[생물] 굴뚝버섯과의 버섯."
    秦皮:
      ? モクセイ科の落葉高木。山地に自生。春、淡緑色の小花をつけ、翼のある実を結ぶ。材は弾力に富み、家具・バットなどにする。
      : "[생물] 물푸레나무과의 낙엽 교목. 산지에 자라며 재목은 탄력이 있어 가구나 배트 등에 쓴다."
    豆腐皮:
      豆乳(トウニュウ)を煮立て、表面に張った薄い皮をすくい上げて作った食品。うば。: 두유를 끓여 표면에 생긴 얇은 막을 건져 만든 식품. 유바.
  皿:
    器皿:
      食べ物を盛る皿や小鉢。食器。: 음식을 담는 접시나 작은 사발. 식기.
    皿鉢:
      浅い大きな磁器の皿。: 얕고 큰 자기 접시.
  相:
    相:
      ? "［音］ソウ（サウ）（呉）　ショウ（シャウ）（漢）　［訓］あい［学習漢字］3年〈ソウ〉１ 物の姿・ようす。「相貌そうぼう／形相ぎょうそう・血相・死相・色相・実相・諸相・真相・瑞相ずいそう・世相・人相・皮相・貧相・滅相・面相・様相」２ 物のありさまを見てその実相を判断する。「相術・相場そうば・相馬・相法」３ たがいに。「相違・相関・相互・相思・相似・相談・相当」４ 一方から他方へ。次から次と。「相承・相続・相伝」５ 相模さがみ国。「相州／武相」〈ショウ〉１ 君主を助ける大臣。「外相・宰相・首相・丞相じょうしょう・名相」２ そばに付き添う。「相伴」〈あい〉「相性あいしょう・相手・相宿／入相いりあい」［名のり］あう・さ・すけ・たすく・とも・はる・み・みる［難読］相模さがみ・相撲すもう・相応ふさわしい"
      : "① 사물의 모습이나 상태. ② 사물의 상태를 보고 실상을 판단하는 것. ③ 서로. ④ 한쪽에서 다른 쪽으로, 또는 차례차례. ⑤ 사가미국. ⑥ 군주를 돕는 대신. ⑦ 곁에서 따르는 것."
    相人:
      人相を見る人。人相見。相者。相工(そうこう)。: 사람의 관상을 보는 사람. 관상가.
    相合傘:
      一本のかさを二人でさすこと。おもに、仲の良い男女にいう。あいがさ。: 우산 하나를 두 사람이 함께 쓰는 것. 주로 사이좋은 남녀에게 이른다.
    相愛:
      互いに愛し合うこと。: 서로 사랑하는 것.
    相続:
      受け継ぐこと。特に、財産上の権利・義務を受け継ぐこと。: 이어받는 것. 특히 재산상의 권리와 의무를 이어받는 것.
    相部屋:
      旅館や寮などで、他の人と同じ部屋になること。: 여관이나 기숙사 등에서 다른 사람과 같은 방을 쓰게 되는 것.
    眉相:
      "①まゆ。 ②まゆとまゆとの間。眉間(ミケン)。": "① 눈썹. ② 눈썹과 눈썹 사이. 미간."
  県:
    県主:
      諸国にあった朝廷の領地の監督官。県を統治する地方長官。: 여러 지방에 있던 조정 영지의 감독관. 현을 다스리는 지방 장관.
    県令:
      "①県の長官。 ②旧制で県知事が出した命令。": "① 현의 장관. ② 구제도에서 현지사가 내린 명령."
    県営:
      県が経営、または設置・管理していること。: 현이 경영하거나 설치·관리하는 것.
    県政:
      県の行政。県の政治。県治。: 현의 행정. 현의 정치.
  真:
    猿真似:
      深く考えることなく、うわべだけ他人のまねをすること。: 깊이 생각하지 않고 겉모습만 남을 흉내 내는 것.
    真字:
      "① 楷書。真書。しん。② かなに対して漢字、また仮名混じり文に対して漢文をいう。まな。": "① 해서. 진서. ② 가나에 대한 한자, 또는 가나 섞인 글에 대한 한문."
    真実:
      "①本当のこと。うそいつわりのないこと。 虚偽 ②本当に。まったく。まことに。": "① 참된 것. 거짓이 없는 것. 진실. ② 정말로. 참으로."
    真性:
      ? "①生まれついた性質。 天性・天賦 ②疑いなく本当であること。多く、医学で用いられる語。 擬似・仮性"
      : "① 타고난 성질. 천성. ② 의심할 여지 없이 참된 것. 주로 의학에서 쓰는 말."
    真東風:
      真東から吹いてくる風。 春: 정동쪽에서 불어오는 바람.
    真田虫:
      ジョウチュウの別称。: "[생물] 촌충의 다른 이름."
    真砂:
      細かな砂。いさご。: 고운 모래.
    真葛:
      ? モクレン科のつる性常緑低木。暖地の山野に自生。葉は厚くてつやがある。夏、黄白色の花をつけ、赤い実を球状に結ぶ。ビナンカズラ。 秋
      : "[생물] 오미자과의 덩굴성 상록 관목. 따뜻한 지방의 산야에 자란다."
    真風:
      南または南西の風。まぜ。 夏: 남풍 또는 남서풍.
    真っ赤:
      "①非常に赤いさま。 ②まったく。まるっきり。まぎれもない。": "① 매우 붉은 모양. 새빨강. ② 완전히. 전적으로. 틀림없이."
  着:
    為着せ:
      ? "①季節ごとに使用人に衣服を与えること。また、その衣服。 ②一方的に与えられる事柄。会社や上司から与えられるきまりきった仕事など。"
      : "① 계절마다 사용인에게 의복을 주는 것. 또는 그 의복. ② 일방적으로 주어지는 일. 회사나 상사가 주는 판에 박힌 일 등."
    着実:
      落ちついて確実なこと。まじめで危なげのないこと。堅実・地道: 침착하고 확실한 것. 성실하고 위태로움이 없는 것. 착실함.
    着工:
      工事に取り掛かること。起工竣工(シュンコウ)・完工: 공사에 착수하는 것. 착공.
    着席:
      席につくこと。座席にすわること。着座。: 자리에 앉는 것. 착석.
    着心地:
      衣服を着た際の感じ。着ぐあい。: 옷을 입었을 때의 느낌. 착용감.
    着衣始:
      江戸時代、正月三が日中に日を選んで新しい衣服を着始めること。また、その儀式。新年: 에도 시대에 정월 초사흘 안에서 날을 골라 새 옷을 처음 입던 일. 또는 그 의식.
    着順:
      目的地点、目標などに到着した順序。: 목적지나 목표 등에 도착한 순서.
    表着:
      最も外側に着る衣服。下着: 가장 바깥쪽에 입는 옷. 겉옷.
  短:
    短所:
      劣っているところ。欠点長所: 뒤떨어지는 점. 결점.
    短手:
      神道の葬儀で、音を出さないように打つ柏手(かしわで)。: 신도의 장례에서 소리가 나지 않도록 치는 박수.
    短檠:
      丈の短い灯火具。また、それにともす灯火。: 키가 낮은 등잔 기구. 또는 거기에 켜는 등불.
    短歌:
      和歌で五・七・五・七・七の五句三一音からなる歌体。みそひともじ。長歌: 와카에서 5·7·5·7·7의 다섯 구, 서른한 음으로 이루어진 노래 형식. 단가.
    短褐:
      麻や木綿でつくった丈の短い着物。身分の低い人や貧しい人が着た衣服。: 삼베나 무명으로 만든 길이가 짧은 옷. 신분이 낮거나 가난한 사람이 입던 옷.
    短褐穿結:
      ? 貧しい人や卑しい人の衣服。貧者の粗末な身なりのようす。「穿結」は、破れていたり、結び合わせていたりすること。〈陶潜の文〉短褐不完
      : 가난하거나 신분이 낮은 사람의 옷. 가난한 사람의 초라한 차림을 이르는 말.
    短見:
      思慮の足りない、つまらない意見。未熟な考え。あさはかな考え。浅見: 사려가 부족한 보잘것없는 의견. 미숙하고 얕은 생각.
    短資:
      "「短期資金」の略。通常、一年以内の貸付資金。": "「단기 자금」의 준말. 보통 1년 이내의 대출 자금."
    短軀:
      背丈の低いこと。また、そのからだ。短身。長軀: 키가 작은 것. 또는 그런 몸. 단구.
  研:
    研修:
      "①学問や技術を修め、みがくこと。 ②仕事の執務能力を養成すること。": "① 학문이나 기술을 익히고 닦는 것. ② 직무 수행 능력을 기르는 것."
    研学:
      学問を深く修め、みがきをかけること。: 학문을 깊이 닦고 갈고닦는 것.
    研究:
      物事や問題をよく調べ考えて真理をつきつめること。また、その結論。: 사물이나 문제를 잘 조사하고 생각하여 진리를 파고드는 것. 또는 그 결론.
    研鑽:
      学問などを深くきわめること。地道に研究を続けること。: 학문 등을 깊이 파고드는 것. 꾸준히 연구를 계속하는 것.
    薬研:
      薬の材料を粉砕するための舟形の器具。金属性でおもに漢方で用いる。薬おろし。: 약재를 잘게 부수기 위한 배 모양의 기구. 주로 한방에서 쓰는 금속제 기구.
    研北:
      硯北。書状の脇付けに使う。読書・著述の場所。宋・晁補之〔事に感ず〕詩　干戈(かんくわ)牆東の客と作(な)ると雖も　疾ほ存す、北の身字通「研」の項目を見る。: 벼루의 북쪽. 편지에서 수신인 이름 곁에 덧붙이는 말. 독서나 저술을 하는 자리.
  礼:
    礼式:
      "①礼儀を表す法式。礼儀作法。マナー。礼法 ②礼意を表すために贈る品。": "① 예의를 나타내는 형식. 예법. ② 감사나 예의를 나타내기 위해 주는 물품."
    礼状:
      謝礼の手紙。感謝の意を記した書状。: 감사의 편지. 감사의 뜻을 적은 서장.
    礼盤:
      寺院で、導師が着座して読経(ドキョウ)する本尊の前の高い壇。: 절에서 도사가 앉아 독경하는 본존 앞의 높은 단.
    礼装:
      儀式に出るとき、礼式にかなった服装をすること。また、その服装。礼服: 의식에 나갈 때 예식에 맞는 복장을 하는 것. 또는 그 복장. 예복.
    礼賛:
      ? "［名］(スル)１ すばらしいものとして、ほめたたえること。また、ありがたく思うこと。「先人の偉業を礼賛する」「健康を礼賛する」２ 仏語。仏・法・僧の三宝さんぼうを礼拝らいはいし、その功徳くどくをたたえること。また、その行事。"
      : "① 훌륭한 것으로 칭송하는 것. 또는 고맙게 여기는 것. ② [불교] 불·법·승 삼보를 예배하고 그 공덕을 찬탄하는 것. 또는 그 의식."
    礼遇:
      礼儀を尽くした待遇。厚いもてなし。厚遇: 예의를 다한 대우. 후한 대접.
  神:
    主神:
      "①神の実体。神の正体。神体。 ②神事をつかさどる人。神主。": "① 신의 실체. 신의 본체. 신체. ② 신사를 맡아 제사를 주관하는 사람. 신관."
    惟神:
      神のみこころのままに。神のおぼしめしのままに。: 신의 뜻 그대로. 신의 뜻에 따라.
    灰神楽:
      火の気がある灰の中に湯や水などをこぼしたとき、勢いよく舞い上がる灰けむり。: 불기가 남은 재에 물이나 뜨거운 물을 쏟았을 때 세차게 피어오르는 재 연기.
    産土神:
      生まれた土地の守護神。鎮守(チンジュ)の神。うぶすな。 氏神(うじがみ): 태어난 땅의 수호신. 진수의 신.
    産霊神:
      "①自然界におけるすべてのものを生みだす神。むすひのかみ。 ②縁結びの神。": "① 자연계의 모든 것을 낳는 신. ② 인연을 맺어 주는 신."
    皇神:
      "①皇室の先祖にあたる神の尊称。 ②神の尊称。": "① 황실의 선조에 해당하는 신의 존칭. ② 신의 존칭."
    神:
      ? "① 宗教的、民俗的信仰の対象。世に禍福を降し、人に加護や罰を与えるという霊威。古代人が、天地万物に宿り、それを支配していると考えた存在。自然物や自然現象に神秘的な力を認めて畏怖し、信仰の対象にしたもの。② 神話上の人格神。③ 天皇、または天皇の祖先。④ 人為を越えて、人間に危害を及ぼす恐ろしいもの。特に蛇や猛獣。⑤ 神社。また、神社にまつられた信仰の対象。死後に神社などにまつられた霊や、死者の霊魂などをもいう。⑥ ( [英語] God の訳語 ) キリスト教で、宇宙と人間の造主であり、すべての生命と知恵と力との源である絶対者をいう。⑦ 雷。なるかみ。いかずち。⑧ ( 比喩的に ) 恩恵を与え、助けてくれる人、ありがたいものなどをいう。「救いの神」⑨ 他人の費用で妓楼に上り遊興する者。とりまき。転じて、素人の太鼓持。江戸がみ。⑩ 六をいう青物市場の符丁。神の語誌( 1 )同音語である「上」と同一語源と考える説と、別語源と考える説がある。同一語源説は、カミの元来の意味は「上」であり、「上方」という方向性を指し示す語であったものが、カミの毛（髪）、カミの存在（神）、というように用いられ、それが、カミだけで表わされるようになったとする。別語源説は、上代特殊仮名遣いにおける仮名の違い（神のカミのミは乙類、上のカミのミは甲類）と、上代における意味の類縁性の希薄さを根拠に、同一語源とは考え難いとする。( 2 )アイヌ語で「神」をさすカムイは、上代以前「カミ」が kamï の音をもっていた時代に日本語から借用したものか。( 3 )⑥の英語 God の訳語としての近代語「神」の成立には、聖書翻訳の問題が関わっている。中国でのキリスト教宣教師たちの God の訳語に関する議論では、「上帝」と「神」とで意見が分かれ、それぞれの訳語による聖書翻訳が行なわれた。「神」を採用したブリッジマンおよびカルバートソン訳の中国語訳聖書が、明治初期に来日したアメリカ人宣教師によって日本に持ち込まれ、これが God をカミと和訳するのに、決定的な影響力を持った。"
      : "① 종교적·민속적 신앙의 대상. 세상에 화복을 내리고 사람에게 가호나 벌을 준다고 여겨지는 영적 존재. ② 신화상의 인격신. ③ 천황 또는 천황의 조상. ④ 인간의 힘을 넘어 해를 끼치는 두려운 존재. ⑤ 신사 또는 신사에 모셔진 신앙 대상. ⑥ [종교] 기독교에서 우주와 인간의 창조주이며 모든 생명과 지혜와 힘의 근원인 절대자. ⑦ 천둥. 번개. ⑧ 비유적으로 은혜를 베풀고 도와주는 사람이나 고마운 것."
    神技:
      ふつうの人には考えられないきわめてすぐれたわざ。非凡な技術。かみわざ。: 보통 사람으로서는 생각할 수 없을 만큼 뛰어난 재주. 비범한 기술.
    神社:
      ? 日本人固有の信仰対象となっている神をまつり、法的に存立を認められた礼拝施設。明治以降、国家の祭祀として特別の保護、監督を受けてきたが、第二次世界大戦後は宗教法人令による宗教法人となり、その大半（約八万社）が神社本庁の包括下にある。やしろ。みや。
      : 일본 고유의 신앙 대상인 신을 모시는 예배 시설. 신사.
    阪神:
      ? "[ 一 ] 大阪と神戸。[ 二 ] 「はんしんちほう（阪神地方）」の略。[ 三 ] 「はんしんでんきてつどう（阪神電気鉄道）」の略。"
      : "① [지명] 오사카와 고베. ② 한신 지방의 준말. ③ 한신 전기철도의 준말."
  祭:
    学園祭:
      "⇒学祭": 학교 축제. 학원제.
    慰霊祭:
      死んだ人の魂をなぐさめるための祭り。: 죽은 사람의 영혼을 위로하기 위한 제사.
    祭典:
      ? "①神霊をまつる儀式。祭礼。 祭祀(サイシ)・祭儀 ②大がかりで華やかな行事。フェスティバル。"
      : "① 신령을 모시는 의식. 제례. ② 규모가 크고 화려한 행사. 축제."
    祭司:
      ? "①宗教上の儀式・典礼を執行する神官。 ②ユダヤ教で、エルサレムの神殿に奉仕して宗教上の職務を専門に司る人。"
      : "① 종교상의 의식과 전례를 집행하는 신관. ② [종교] 유대교에서 성전에 봉사하며 종교 직무를 맡은 사람."
    祭壇:
      祭事を行う高い壇。神霊をまつり、供え物をささげる高い壇。: 제사를 지내는 높은 단. 신령을 모시고 제물을 바치는 높은 단.
    祭政一致:
      ? 宗教上の祭事と政治が一体であるという考え。また、そのような政治形態。 政教一致 祭政分離・政教分離
      : 종교상의 제사와 정치가 하나라는 생각. 또는 그러한 정치 형태.
    祭文:
      ? "①祭祀(サイシ)のとき、神霊に告げる文章。 ②「歌(うた)祭文」の略。江戸時代、芸人などが三味線に合わせて世間の事件をおもしろく歌ったもの。"
      : "① 제사 때 신령에게 고하는 글. ② 에도 시대에 세상의 사건을 샤미센에 맞추어 흥미롭게 노래하던 것."
    祭礼:
      神社の祭り。祭りの儀式。祭典。 祭儀: 신사의 제사. 축제 의식. 제전.
    祭神:
      その神社にまつってある神。: 그 신사에 모셔져 있는 신.
    芋茎祭:
      ? 京都の北野天満宮で一○月一日～四日に行われる神事。ずいきで屋根をふき、野菜・米・麦などで飾った神輿(みこし)を担いで回る。
      : 교토 기타노텐만구에서 10월 1일부터 4일까지 열리는 신사 의식.
  福:
    福助:
      ? "①幸福を招くという男の人形。童顔で大きな頭にちょんまげを結い、裃(かみしも)を着て正座した人形。 ②①のように、頭がたいそう大きい人のたとえ。"
      : "① 행복을 부른다고 하는 남자 인형. ② 머리가 몹시 큰 사람의 비유."
    福引:
      商店の客寄せなどのために、くじ引きで景品を与えること。また、そのくじ。新年: 상점에서 손님을 끌기 위해 추첨으로 경품을 주는 것. 또는 그 추첨.
    福徳円満:
      財力も心の満足も、すべてが備わっていること。円満具足(グソク): 재물의 힘과 마음의 만족이 모두 갖추어져 있는 것.
    福相:
      いかにも幸福に恵まれているような人相。ふくぶくしい人相。貧相: 행복을 타고난 듯한 인상. 복스러운 얼굴.
    福祉:
      社会の構成員に等しくもたらされるべき幸福。特に、生活環境を安定させるもの。: 사회 구성원에게 고르게 주어져야 할 행복. 특히 생활환경을 안정시키는 것.
    福神漬:
      ? 漬物の一種。ダイコン・ナス・ナタマメなど七福神になぞらえた七種の野菜を細かく刻んで塩づけし、醬油(ショウユ)やみりんで煮つめたもの。
      : 무, 가지, 칼콩 등 일곱 가지 채소를 잘게 썰어 절인 뒤 간장과 미림으로 졸인 절임의 한 종류.
    福運:
      めでたい運命。しあわせな運。: 경사스러운 운명. 행복한 운.
    福音:
      ? "①キリスト教で、キリストが人類を救い、神の国を実現するという教え。ゴスペル。 ②喜ばしい知らせ。"
      : "① [종교] 기독교에서 그리스도가 인류를 구원하고 하느님의 나라를 실현한다는 가르침. 복음. ② 기쁜 소식."
  秒:
    分秒:
      一分一秒。きわめて短い時間。: 일분일초. 매우 짧은 시간.
    寸秒:
      非常に短い時間。 寸刻・寸時: 매우 짧은 시간. 촌각.
    秒速:
      運動するものの速度を、一秒あたりに進む距離で表したもの。一秒間に進む速さ。: 움직이는 물체의 속도를 1초 동안 나아가는 거리로 나타낸 것. 초속.
  究:
    学究:
      学問研究に専念すること。また、その人。: 학문 연구에 전념하는 것. 또는 그런 사람.
    探究:
      物事の真の姿や本質などを深く調べ、明らかにすること。: 사물의 참모습이나 본질 등을 깊이 조사해 밝히는 것.
    攻究:
      学問や芸術などをおさめきわめること。研究: 학문이나 예술 등을 닦아 깊이 파고드는 것. 연구.
    研究:
      物事や問題をよく調べ考えて真理をつきつめること。また、その結論。: 사물이나 문제를 잘 조사하고 생각하여 진리를 파고드는 것. 또는 그 결론.
    究明:
      道理・真理などを、つきつめ調べて明らかにすること。: 도리나 진리 등을 끝까지 조사해 밝히는 것.
    究極:
      物事をつきつめて、最後に行き着くところ。つまるところ。究竟(クッキョウ): 사물을 끝까지 파고들어 마지막에 이르는 곳. 궁극.
    究理:
      物事の道理をきわめること。: 사물의 도리를 끝까지 탐구하는 것.
    究竟:
      "①最上の境地。無上。 ②「究竟(クッキョウ)」に同じ。": "① [불교] 가장 높은 경지. 무상. ② 궁극."
      ? "①物事をきわめて尽くすこと。つまるところ。結局。畢竟(ヒッキョウ) ②もっともすぐれているさま。 ③非常に都合のよいこと。"
      : "① 사물을 끝까지 파고드는 것. 결국. ② 가장 뛰어난 모양. ③ 매우 형편이 좋은 것."
    考究:
      物事を深く考えて、研究すること。深いところまで考えきわめること。: 사물을 깊이 생각하여 연구하는 것. 깊은 곳까지 생각해 파고드는 것.
  章:
    印章:
      印。はんこ。印形(インギョウ)。印判。: 도장. 인장.
    周章てる:
      "①思いがけないことに出くわしてまごつく。うろたえる。 ②びっくりして急ぐ。": "① 뜻밖의 일을 만나 당황하다. 허둥대다. ② 놀라서 서두르다."
    文章:
      ? いくつかの文を連ね、まとまりのある思想や感情を表したもの。ふつうは、韻文に対する散文をいう。
      : 여러 문장을 이어 하나로 정리된 사상이나 감정을 나타낸 것. 보통 운문에 대한 산문을 이른다.
    玉章:
      "①相手の手紙に対する敬称。玉書 ②すぐれて美しい詩文。": "① 상대의 편지를 높여 이르는 말. ② 뛰어나고 아름다운 시문."
    章句:
      "①文章の章や句。 ②文章の段落や区切り。": "① 문장의 장과 구. ② 문장의 단락이나 구분."
    章程:
      規則・法度(ハット)を集めた箇条書き。おきて。のり。: 규칙이나 법도를 모아 조목조목 쓴 것. 규정.
    章節:
      論文など長い文章の、章や節の区切り。: 논문 등 긴 글의 장이나 절의 구분.
    表章:
      ? "① あらわして明らかにすること。ほめあらわすこと。② あることがらを、具体的・象徴的にあらわしている事物。"
      : "① 드러내어 밝히는 것. 칭송하여 나타내는 것. ② 어떤 일을 구체적·상징적으로 나타내는 사물."
    記章:
      ? "①身分・職業などを示すため、衣服や帽子などに付けるしるし。校章・社章などのバッジ。 ②記念として関係者に渡すしるし。メダル。 ①「徽章」の書きかえ字。"
      : "① 신분이나 직업 등을 나타내기 위해 옷이나 모자 등에 다는 표지. 배지. ② 기념으로 관계자에게 주는 표지. 메달."
  童:
    小童:
      子どもや年少者をののしっていう語。: 어린아이나 나이 어린 사람을 낮잡아 이르는 말.
    尸童:
      祈禱(キトウ)師が神霊を招き寄せ、乗り移らせる童子や人形。: 기도사가 신령을 불러 내려 붙게 하는 아이나 인형.
    御河童:
      少女の髪形の一つ。前髪はまゆの上で、後ろ髪は耳の下あたりで切りそろえたもの。: 소녀 머리 모양의 하나. 앞머리는 눈썹 위, 뒷머리는 귀 아래쯤에서 가지런히 자른 것.
    童男:
      男の子。少年。おのわらわ。: 남자아이. 소년.
    童謡:
      ? 古代、政治や社会を風刺、または予言したはやり歌。神が子どもの口を借りて歌わせると考えられた。上代歌謡の一種。
      : 고대에 정치나 사회를 풍자하거나 예언하던 유행가. 신이 아이의 입을 빌려 부르게 한다고 여겨졌다.
    童顔:
      "①子どもの顔。 ②子どものような顔つき。": "① 아이의 얼굴. ② 아이 같은 얼굴."
  第:
    及第:
      試験などに合格すること。一定の条件を満たすこと。落第: 시험 등에 합격하는 것. 일정한 조건을 충족하는 것.
    次第:
      ? "①順序。 ②由来。なりゆき。 ③…によって決まる。 ④なりゆきにまかせること。なるがまま。 ⑤…するとすぐ。"
      : "① 순서. ② 유래. 경위. ③ …에 따라 결정됨. ④ 형편에 맡김. 되는 대로. ⑤ …하자마자."
    第一:
      ? "①順序のいちばん初め。最初。 ②最も重要なこと。 ③最もすぐれていること。 ④何よりもまず。さしあたり。"
      : "① 순서의 맨 처음. 최초. ② 가장 중요한 것. ③ 가장 뛰어난 것. ④ 무엇보다 먼저. 우선."
    第一人者:
      ある社会や分野で、最もすぐれていると認められるほどの人。: 어떤 사회나 분야에서 가장 뛰어나다고 인정받는 사람.
    第一線:
      ? "①戦場で、敵に最も近い前線。最前線。 ②ある方面の重要なことが活発に行われているところ。"
      : "① 전장에서 적과 가장 가까운 전선. 최전선. ② 어떤 분야의 중요한 일이 활발히 이루어지는 곳."
    第三国:
      当面する事件や事柄に、直接関係のない国。当事国: 당면한 사건이나 사안에 직접 관계가 없는 나라. 제삼국.
    第六感:
      ? 五感（視覚・聴覚・嗅覚(キュウカク)・味覚・触覚）のほかにあると思われる感覚。理屈では説明できない、物事の本質を鋭く感じとる心のはたらき。直感。勘。
      : 오감 이외에 있다고 여겨지는 감각. 이치로 설명할 수 없이 사물의 본질을 날카롭게 느끼는 마음의 작용. 직감.
    第宅:
      大きくてりっぱな家。やしき。: 크고 훌륭한 집. 저택.
    邸第:
      "「邸宅」に同じ。第宅(テイタク)": 저택과 같음.
  筆:
    筆墨:
      ふでと墨。また、それで書き記したもの。: 붓과 먹. 또는 그것으로 써 적은 것.
    筆忠実:
      手紙や文章を面倒がらずに書くこと。また、その人。筆不精: 편지나 글을 귀찮아하지 않고 자주 쓰는 것. 또는 그런 사람.
    筆禍:
      ? 自分が書いて発表した文章が原因で、法律的・社会的に制裁や非難を受けること。また、その災難。舌禍
      : 자신이 써서 발표한 글 때문에 법적·사회적으로 제재나 비난을 받는 것. 또는 그 재난.
    筆談:
      口で話すかわりに、用件や意志を文字や文章に書いて伝え合うこと。: 말 대신 용건이나 의사를 글자로 써서 주고받는 것. 필담.
    筆陣:
      ? "①文章による鋭い論戦をすること。また、そのような文章。論陣 ②筆者の顔ぶれ。筆者の陣容。"
      : "① 글로 날카로운 논전을 벌이는 것. 또는 그런 글. ② 필자들의 구성."
    運筆:
      筆づかい。字や絵をかく筆などの動かし方。また、筆の運び方。: 붓놀림. 글씨나 그림을 쓸 때 붓 등을 움직이는 방식.
    筆遣い:
      "①ふでの運び方・つかい方。": "① 붓을 움직이는 방식. 붓을 쓰는 법."
  等:
    此方人等:
      おれたち。おれ。「自分たち」「自分」をぞんざいにいう語。: 우리들. 나. 「우리」나 「나」를 거칠게 이르는 말.
    等価:
      価値や価格がひとしいこと。また、その価値・価格。: 가치나 가격이 같은 것. 또는 그 가치나 가격.
    等分:
      "①ひとしく分けること。同じ分量で分けること。また、その分量。均分 ②同じ程度。": "① 똑같이 나누는 것. 같은 분량으로 나누는 것. 또는 그 분량. ② 같은 정도."
    等号:
      二つの数や式などの間にはさんで、両方が等しいことを表す記号。イコール。不等号: 두 수나 식 사이에 넣어 양쪽이 같음을 나타내는 기호. 등호.
    等温:
      温度がひとしいこと。同じ温度。: 온도가 같은 것. 같은 온도.
    等級:
      上下や優劣の段階。階級: 상하나 우열의 단계. 등급.
    等高線:
      ? "「等高曲線」の略。地図上で、高度や傾斜など、地形を表すために、標準海面からの高さがひとしい点を結んだ線。同高線。水平曲線。等深線"
      : 등고곡선의 준말. 지도에서 지형을 나타내기 위해 표준 해면으로부터 높이가 같은 점을 이은 선. 등고선.
    郎等:
      ? "① ( 現代は「ろうとう」とも ) 従者。身分的に主人に隷属する従僕。② 平安末期・鎌倉時代の武家社会で、主人と血縁関係のない従者。主人と血縁関係のある家の子とは区別していう。郎従。③ 一般に、武士の家来。従僕。召使い。④ 婚礼の時の花嫁の介添役を、長野県や千葉県君津郡でいう。①の意であったが、平安時代末からの武家社会では、②のように使われた。( 3 )江戸時代初期に開合の区別が失われたため、「とう（等）」と「たう（党）」がトウと同音になった結果、この時期以降「郎等」に加え「郎党」の表記も現われた。"
      : "① 종자. 신분적으로 주인에게 예속된 종복. ② 헤이안 말기·가마쿠라 시대 무가 사회에서 주인과 혈연관계가 없는 종자. ③ 일반적으로 무사의 가신이나 하인."
  箱:
    巾箱:
      ? "①書物などをいれておく布張りの小さな箱。 ②「巾箱本(キンソウボン)」の略。携帯用の小さな本。"
      : "① 책 등을 넣어 두는 천을 댄 작은 상자. ② 휴대용 작은 책."
    清箱:
      便器。大壺(おおつぼ)。おまる。: 변기. 요강.
    箱入り:
      ? "①箱に入っていること。また、入っているもの。 ②大事にすること。また、その人や物。 ③得意な物事。おはこ。"
      : "① 상자에 들어 있는 것. 또는 들어 있는 물건. ② 소중히 여기는 것. 또는 그런 사람이나 물건. ③ 잘하는 일. 장기."
    箱師:
      列車・電車など、乗り物のなかで専門にかせぐ掏摸(すり)。: 열차나 전차 등 탈것 안에서 전문적으로 소매치기하는 사람.
    箱書:
      ? 書画・器物などを収めた箱に、その中身の名称を書いたもの。また、作者や鑑定人などが、その品が本物であることを証明して署名・押印したもの。
      : 서화나 기물을 넣은 상자에 그 내용물의 이름을 쓴 것. 또는 작가나 감정인이 진품임을 증명해 서명·날인한 것.
    箱梯子:
      下部の空間を利用して、戸棚や引き出しなどを設けた階段。はこばし。: 아래쪽 공간을 이용해 찬장이나 서랍 등을 만든 계단.
    箱船:
      "①長方形の船。 ②『旧約聖書』のなかの「ノアの箱船」のこと。": "① 직사각형 배. ② 구약성서의 노아의 방주."
  級:
    冪級数:
      ある変数の累乗(ルイジョウ)の定数倍から成り立つ、無限級数。: 어떤 변수의 거듭제곱에 상수를 곱한 항들로 이루어진 무한급수. 멱급수.
    原級:
      ? "①進級できず、再び履修する学年。 ②欧米語の文法で、形容詞・副詞の比較級・最上級に対する基本の形。"
      : "① 진급하지 못해 다시 이수하는 학년. ② 서양어 문법에서 형용사·부사의 비교급·최상급에 대한 기본형."
    学級:
      学校で、授業のために、生徒を一定の人数に組分けしたもの。クラス。組。: 학교에서 수업을 위해 학생을 일정 인원으로 나눈 집단. 반.
    特級:
      一級より上の等級。最高級。また、そのもの。: 1급보다 위의 등급. 최고급. 또는 그런 것.
    等級:
      上下や優劣の段階。階級: 상하나 우열의 단계. 등급.
    級友:
      学校で同じ級の友だち。同級生。クラスメート。: 학교에서 같은 반인 친구. 동급생. 반 친구.
    級差:
      しな。等級。漢・揚雄〔大鴻臚の箴〕人に材能り、寮に差り。能をし官を授くるに、各宜しき攸(ところ)り。字通「級」の項目を見る。: 품등. 등급.
    級数:
      ? 数学で、法則にしたがって一定の順に並べた数を和の記号（加法記号）で順に結んだもの。等差級数・等比級数など。
      : "[수학] 법칙에 따라 일정한 순서로 배열한 수를 더하기 기호로 차례로 연결한 것. 급수."
    超弩級:
      大きさや強さが、同類の物よりずば抜けていること。: 크기나 강함이 같은 종류의 것보다 월등히 뛰어난 것.
    階級:
      "①地位・身分などの等級・段階。 ②社会における家柄・身分・財産などが同じ集団。階層": "① 지위나 신분 등의 등급·단계. ② 사회에서 가문, 신분, 재산 등이 같은 집단. 계층."
    飛び級:
      成績優秀者が、正規の課程をとび越えて、例外的により上の学年や課程に進級すること。: 성적 우수자가 정규 과정을 건너뛰어 예외적으로 더 높은 학년이나 과정으로 진급하는 것.
    首級・首:
      戦で討ち取った敵の首。: 전쟁에서 베어 얻은 적의 목.
  終:
    弥終:
      いちばんあと。最後。最終。: 가장 마지막. 최후. 최종.
    終夜:
      "「終夜(シュウヤ)」に同じ。": 밤새. 온밤.
    終日:
      一日中。朝から晩までずっと。 終夜(シュウヤ): 하루 종일. 아침부터 밤까지 줄곧.
      "「終日(シュウジツ)」に同じ。 終夜(よもすがら)": 하루 종일.
    終業:
      "①その日の仕事が終わること。 ②学校で、一定期間の授業が終わること。 ①②始業": "① 그날의 일이 끝나는 것. ② 학교에서 일정 기간의 수업이 끝나는 것."
    終演:
      芝居や映画などの上演が終わること。はね。 開演: 연극이나 영화 등의 상연이 끝나는 것. 종연.
    終点:
      一番最後となる所。特に電車やバスの路線の終着駅。 起点・始点: 가장 마지막이 되는 곳. 특히 전철이나 버스 노선의 종착역.
    終える:
      ? "[ 文語形 ]を・ふ （その時まで続けてきたことを）すませる。終わらせる。極めつくす。果たす。しとげる。(ヲ)へることが出来」〈国木田独歩〉下)"
      : 그때까지 이어 오던 일을 마치다. 끝내다. 끝까지 해내다. 완수하다.
  緑:
    緑啄木鳥:
      ? キツツキ科の鳥。日本特産で、本州以南の森林にすむ。背は緑色で、腹は白地に暗褐色の斑点(ハンテン)がある。雄は頭頂部全体、雌は後頭部が赤い。
      : "[생물] 딱따구리과의 새. 일본 특산으로 혼슈 이남의 숲에 산다."
    緑地:
      草木の茂っている土地。: 풀과 나무가 우거진 땅. 녹지.
    緑肥:
      草などを青いまま土中に敷きこんで肥料とするもの。草肥(くさごえ) 夏: 풀 등을 푸른 상태로 흙 속에 묻어 비료로 삼는 것. 녹비.
    緑藻類:
      ? 緑色をした藻類の総称。葉緑素をもち、光合成を行う。淡水に見られるのはヒビミドロ・クラミドモナスなど、海水ではミル・アオノリなど。緑藻植物。
      : "[생물] 녹색을 띤 조류의 총칭. 엽록소가 있어 광합성을 한다."
    緑酒:
      緑色の酒。上質の酒。うまい酒。: 녹색 술. 좋은 술. 맛있는 술.
    緑野:
      草や木が青々と茂った野原。: 풀과 나무가 푸르게 우거진 들판.
    緑風:
      初夏に、青葉を吹きわたるさわやかな風。夏: 초여름에 푸른 잎 사이로 불어오는 상쾌한 바람.
    緑鳩:
      ? ハト科の鳥。山地の森林にすむ。背は緑色で、胸は黄色。尺八のような哀調をおびた鳴き声を出す。
      : "[생물] 비둘기과의 새. 산지 숲에 살며 등은 녹색, 가슴은 노란색이다."
  練:
    練乳:
      ? 牛乳を煮詰めて濃縮したもの。無糖をエバミルク、加糖をコンデンスミルクという。 「煉乳」の書きかえ字。
      : 우유를 졸여 농축한 것. 무당은 에바밀크, 가당은 연유라고 한다.
    練兵:
      兵士を訓練すること。戦闘の練習をすること。: 병사를 훈련하는 것. 전투 연습을 하는 것.
    練墨:
      眉(まゆ)をかくのに用いる、練った墨。まゆずみ。: 눈썹을 그리는 데 쓰는 개어 만든 먹. 눈썹 먹.
    練成:
      技や心身をりっぱに鍛え上げること。錬磨育成。: 기술이나 심신을 훌륭하게 단련하여 기르는 것.
    練武:
      武道を練習すること。また、その練習。: 무도를 연습하는 것. 또는 그 연습.
    練炭:
      ? 石炭や木炭などの粉末をねり固めた燃料。太い円筒形で、燃焼効率を上げるため、縦に数個の穴があいている。 「煉炭」の書きかえ字。
      : 석탄이나 목탄 등의 가루를 개어 굳힌 연료. 굵은 원통형으로 세로 구멍이 여러 개 뚫려 있다.
    練熟:
      経験豊かで上手なこと。熟練: 경험이 풍부하고 능숙한 것. 숙련.
    練糸:
      ? 生糸の膠質（セリシン）を除去して、特有の光沢と手触りを出した絹糸。除去の程度により半練糸、本練糸にわける。
      : 생사의 교질을 제거해 특유의 광택과 촉감을 낸 견사.
    練習:
      学問や技芸が上達するように、繰り返し学習すること。稽古(ケイコ): 학문이나 기예가 늘도록 반복해 익히는 것. 연습.
    練達:
      習熟して高い水準に達すること。熟達: 익숙해져 높은 수준에 이르는 것. 숙달.
    手足れ・手練:
      腕前がすぐれていること。また、その人。: 기량이 뛰어난 것. 또는 그런 사람.
  羊:
    山羊鬚:
      ヤギのひげのように、あごの下に生やした長いひげ。: 염소 수염처럼 턱 아래에 기른 긴 수염.
    羊乳:
      ? キキョウ科のつる性多年草。山野に自生。つるや葉を切ると白い乳液が出る。根はチョウセンニンジンに似る。夏、淡緑色で、内側に紫褐色の斑点(ハンテン)のある鐘形の花をつける。
      : "[생물] 초롱꽃과의 덩굴성 여러해살이풀. 줄기나 잎을 자르면 흰 유액이 나온다."
    羊毛:
      羊や山羊(やぎ)などからとった毛。毛糸・毛織物の原料とする。: 양이나 염소 등에서 얻은 털. 털실이나 모직물의 원료로 쓴다.
    羊裘垂釣:
      ? 隠者の姿のこと。ヒツジの皮ごろもを着て釣り糸を垂れる意から。「裘」は獣の毛皮で作った服のこと。〈『後漢書(ゴカンジョ)』〉
      : 은자의 모습을 이르는 말. 양가죽 옷을 입고 낚싯줄을 드리운다는 뜻에서 온 말.
    羊質虎皮:
      ? 外見はりっぱだが中身がないたとえ。見かけだおし。実際はヒツジなのにトラの皮をかぶっている意から。〈『後漢書(ゴカンジョ)』〉
      : 겉보기는 훌륭하지만 속은 보잘것없음을 비유하는 말. 겉만 번지르르함.
    羊蹄:
      タデ科の多年草。原野に自生。夏、淡黄緑色の花を節ごとにつける。春: "[생물] 마디풀과의 여러해살이풀. 들판에 자라며 연한 황록색 꽃을 피운다."
    羊駝:
      ? ラクダ科の哺乳(ホニュウ)動物。南米のアンデス山地で家畜として飼育。背にこぶはなく、体高は一・二(メートル)ほど。荷物の運搬に用いる。肉は食用。アメリカラクダ。リャマ。
      : "[생물] 낙타과의 포유동물. 남미 안데스 산지에서 가축으로 기르며 짐 운반에 쓴다. 라마."
  美:
    美し国:
      よい国。すばらしい国。美しい国。: 좋은 나라. 훌륭한 나라. 아름다운 나라.
    美人局:
      女が夫や情夫と共謀し、他の男を誘惑して、それを口実に金品をゆすり取ること。: 여자가 남편이나 정부와 공모해 다른 남자를 유혹하고, 그것을 구실로 금품을 갈취하는 것.
    美化:
      "①美しく変えること。 ②実際以上に美しく認識したり、表現したりすること。": "① 아름답게 바꾸는 것. ② 실제보다 아름답게 인식하거나 표현하는 것."
    美味い:
      飲食物の味がよい。美味である。おいしい。不味(まず)い: 음식 맛이 좋다. 맛있다.
    美味しい:
      飲食物の味がよい。美味である。うまい。不味(まず)い: 음식 맛이 좋다. 맛있다.
    美感:
      美しいと感じる気持ち。美に対しての感覚。: 아름답다고 느끼는 마음. 아름다움에 대한 감각.
    美果:
      "①味がよい果物。 ②よい結果。": "① 맛이 좋은 과일. ② 좋은 결과."
    美点:
      美しい点。よい点。すぐれた所。長所。: 아름다운 점. 좋은 점. 뛰어난 점. 장점.
    美観:
      美しいながめ。美景: 아름다운 경관. 미관.
    美酒:
      味のよい酒。うまい酒。うまさけ。: 맛이 좋은 술. 좋은 술.
  習:
    寒復習:
      寒中の早朝などに芸事の復習や練習をすること。寒げいこ。冬: 한겨울 이른 아침 등에 예능을 복습하거나 연습하는 것. 한중 연습.
    復習う:
      教えられたことを繰り返して練習する。復習する。: 배운 것을 되풀이해 연습하다. 복습하다.
    習俗:
      ある時代や地域などで、社会的に行われている習慣や風俗。 慣習・風習: 어떤 시대나 지역 등에서 사회적으로 행해지는 습관이나 풍속.
    習合:
      異なる教義や主義などを取り入れて、一つにまとめること。: 서로 다른 교의나 주의 등을 받아들여 하나로 합치는 것.
    習字:
      ? 文字をならうこと。文字を、正しく、美しく、速く書くための学習。現在、小・中学校では書写といい、硬筆と毛筆によって指導され、毛筆中心の高等学校書道とは区別されている。
      : 글씨를 배우는 것. 글자를 바르고 아름답고 빠르게 쓰기 위한 학습. 습자.
    習得:
      技術などをならって覚え、身につけること。: 기술 등을 배워 익히고 몸에 익히는 것.
    習性:
      "①習慣で身についた特有の性質。くせ。 ②動物の行動に現れるきまった性質。": "① 습관으로 몸에 밴 특유의 성질. 버릇. ② [생물] 동물의 행동에 나타나는 일정한 성질."
    習熟:
      習ったことを十分に身につけていること。慣れて上手になっていること。 熟練・熟達: 배운 것을 충분히 몸에 익힌 것. 익숙해져 능숙해진 것.
    習癖:
      身についてしまっているくせ。特に、悪いくせをいうことが多い。 性癖: 몸에 배어 버린 버릇. 특히 나쁜 버릇을 이르는 경우가 많다.
    習練:
      よく習い、練習を続けること。: 잘 배우고 계속 연습하는 것.
  者:
    今者:
      "( 「者」は漢文で用いる助辞 ) いま。このごろ。今時。現今。今般。": 지금. 요즘. 현재. 금번.
    作者:
      ? "① ある詩歌、文章、絵画、彫刻などの芸術作品を作った人。また、古くは、広く物を作る人をいった。② 特に、勅撰集などに歌をえらばれた歌人。③ 特に、脚本を書く人。芝居狂言を作る人。④ 計画する人。陰謀などをはからう人。"
      : "① 시가, 문장, 회화, 조각 등 예술 작품을 만든 사람. 작자. ② 특히 각본을 쓰는 사람. ③ 계획하거나 음모를 꾸미는 사람."
    前者:
      並べて述べた二つのものの前のほう。 後者: 나란히 말한 두 가지 중 앞의 것. 전자.
    呆気者:
      愚か者。ぼんやりしている者。のろま。: 어리석은 사람. 멍한 사람. 굼뜬 사람.
    啞者:
      言葉の不自由な人。言葉が話せない人。: 말을 자유롭게 하지 못하는 사람. 말을 할 수 없는 사람.
    強者:
      "①非常に強い兵士。勇士。 ②ある方面で非常にすぐれている人。猛者。": "① 매우 강한 병사. 용사. ② 어떤 방면에서 매우 뛰어난 사람."
    従者:
      主人につきしたがう者。ともびと。: 주인을 따라다니는 사람. 수행원.
    易者:
      ? 算木・筮竹(ゼイチク)などを使い、易で占うことを職業とする人。 八卦見(ハッケみ)・占い師・売卜者(バイボクシャ)
      : 산가지나 시초 등을 써서 역점으로 점치는 일을 직업으로 하는 사람. 점쟁이.
    猛者:
      勇猛ですぐれた技をもち、精力的に活動する人。: 용맹하고 뛰어난 기술을 지녀 활발히 활동하는 사람.
    陳者:
      ? 申し上げますが。さて。候文(そうろうブン)の手紙で挨拶(アイサツ)のあと、本文に入るときに用いる語。
      : 말씀드리자면. 자, 이제. 옛 편지글에서 인사 뒤 본문으로 들어갈 때 쓰는 말.
  育:
    化育:
      天地自然が、万物をつくり育てること。: 천지자연이 만물을 만들고 기르는 것.
    成育:
      人や動物などが育つこと。生まれ育つこと。育って成熟すること。また、育てること。: 사람이나 동물 등이 자라는 것. 태어나 자라 성숙하는 것. 또는 기르는 것.
    矜育:
      子どもなどをあわれんで育てる。: 아이 등을 가엾이 여겨 길러 주다.
    紐育:
      ? アメリカ合衆国の北東部にある大西洋に面した州。また、その州にあるアメリカ最大の都市。国連本部があり、世界経済の中心地。
      : "[지명] 미국 북동부 대서양 연안의 주. 또는 그 주에 있는 미국 최대 도시. 뉴욕."
    育成:
      一人前に育てあげること。養成: 어엿하게 자라도록 길러 내는 것. 육성.
    育苗:
      苗床(なえどこ)で、農作物や草花の苗や苗木を育てること。: 모판에서 농작물이나 화초의 모 또는 묘목을 기르는 것.
    育英:
      ? "①才能ある青少年を教育すること。 ②青少年が学業に専心できるように経済上の援助をすること。"
      : "① 재능 있는 청소년을 교육하는 것. ② 청소년이 학업에 전념할 수 있도록 경제적으로 지원하는 것."
    鞠育:
      養い育てること。大切に育てること。鞠養・養育: 기르고 키우는 것. 소중히 기르는 것.
    阿育王・阿輸迦王:
      ? インドのマガダ国のマウリア朝第三代の王。紀元前三世紀ころ、初めてインドを統一。仏教を保護し広めた。
      : "[인명] 인도 마가다국 마우리아 왕조의 제3대 왕. 기원전 3세기 무렵 인도를 처음 통일하고 불교를 보호하여 널리 퍼뜨렸다."
  苦:
    苦境:
      追いつめられて、苦しく困難な環境。苦しい立場や境遇。逆境・窮地: 궁지에 몰려 괴롭고 어려운 환경. 괴로운 처지나 상황.
    苦学:
      苦労して学ぶこと。働いて学資を稼ぎながら勉強すること。: 고생하며 공부하는 것. 일해서 학비를 벌면서 공부하는 것.
    苦竹:
      イネ科のタケ。古く中国から渡来し各地に野生。竹の子は食用。材は細工・建築用。: "[생물] 벼과의 대나무. 오래전 중국에서 전래되어 각지에 야생한다."
    苦菜:
      ? キク科の多年草。山野に自生。夏、黄色い頭花を多数つける。茎や葉は切ると苦い乳液が出る。
      : "[생물] 국화과의 여러해살이풀. 줄기나 잎을 자르면 쓴 유액이 나온다."
      ? キク科の二年草。道端に自生。葉や茎を切ると乳液が出る。春から夏、黄色の頭花をつける。ケシアザミ。
      : "[생물] 국화과의 두해살이풀. 길가에 자라며 봄부터 여름에 노란 두상화를 피운다."
    苦言:
      厳しい忠告の言葉。耳が痛いが、ためになる忠言。甘言: 엄한 충고의 말. 듣기에는 거북하지만 도움이 되는 충언.
    苦棟樹・苦木:
      ? ニガキ科の落葉小高木。山地に自生。枝や葉はにがく、その樹液を駆虫薬や健胃薬にする。クボク。
      : "[생물] 니가키과의 낙엽 소교목. 산지에 자생하며 가지와 잎은 쓰고, 그 수액은 구충제나 건위제로 쓴다."
  荷:
    敗荷:
      葉のやぶれたハス。やれはちす。秋: 잎이 찢어진 연꽃.
    荷担:
      ? "①仲間になり、力を貸して助けること。加勢・左袒(サタン) ②荷物をになうこと。荷をかつぐこと。"
      : "① 한편이 되어 힘을 보태 돕는 것. 가담. ② 짐을 지는 것."
    荷拵え:
      荷作りをすること。: 짐을 꾸리는 것. 포장.
    荷轄:
      波の当たりを和らげるために、和船の船べりを覆うもの。むしろ・縄などで作る。: 파도의 충격을 줄이기 위해 일본식 배의 뱃전을 덮는 것. 거적이나 줄 등으로 만든다.
    荷重:
      ? "①トラックなどの貨物の重さ。 ②構造物や機械に外部から加わる力。また、構造物がたえられる限界の重さ。"
      : "① 트럭 등 화물의 무게. ② 구조물이나 기계에 외부에서 가해지는 힘. 또는 구조물이 견딜 수 있는 한계 무게."
    荷駄:
      ウマで運ぶ荷物。: 말로 나르는 짐.
    集荷:
      商品などの荷物を一か所に集めること。また、その荷物。 「蒐荷」の書きかえ字。: 상품 등의 짐을 한곳에 모으는 것. 또는 그 짐.
    荷物:
      "①持ち運んだり、運送したりする品物。に。 ②多くの形で、負担になるもの。やっかいもの。": "① 들고 다니거나 운송하는 물건. 짐. ② 부담이 되는 것. 성가신 것."
    荷役:
      船の貨物などの上げ下ろしをすること。また、その仕事に携わる人。: 배의 화물 등을 싣고 내리는 일. 또는 그 일에 종사하는 사람.
    入荷:
      店や市場に商品が入ること。: 가게나 시장에 상품이 들어오는 것. 입하.
  落:
    洒落:
      さっぱりしていて物事にこだわらないこと。 洒脱(シャダツ): 산뜻하고 사물에 얽매이지 않는 것. 소탈함.
    落手:
      "①手紙や品物などを受け取ること。落掌 ②碁や将棋で、やりそこなった手。悪手(アクシュ)": "① 편지나 물품 등을 받는 것. ② 바둑이나 장기에서 잘못 둔 수. 악수."
    落莫:
      もの寂しいさま。寂寞(セキバク): 쓸쓸한 모양. 적막함.
    落魄:
      おちぶれること。零落: 몰락하는 것. 영락.
  葉:
    一葉:
      ユリ科の多年草。: "[생물] 백합과의 여러해살이풀."
    七葉樹:
      トチノキ科の落葉高木。: "[생물] 칠엽수과의 낙엽 교목."
    全手葉椎:
      ブナ科の常緑高木。 馬刀葉椎(まてばしい): "[생물] 참나무과의 상록 교목."
    前葉:
      ? "① 本の、前の紙面。前ページ。② 大脳の底部にある脳下垂体の前の部分。〔人体の機能（1952）〕"
      : "① 책의 앞쪽 지면. 앞 페이지. ② [생물] 뇌하수체의 앞부분."
    大葉藻:
      ? ヒルムシロ科の多年草。浅い海底に群生。葉はひも状で長さ一(メートル)にもなる。昔、製塩に用いたことから「藻塩草(もしおぐさ)」ともいう。ウミヤナギ。アジモ。
      : "[생물] 거머리말과의 여러해살이풀. 얕은 바다 밑에 무리 지어 자란다."
    山梗葉:
      キキョウ科の多年草。: "[생물] 초롱꽃과의 여러해살이풀."
    末葉:
      "①時代の終わりのころ。末期(マッキ) ②祖先から遠い子孫。末裔(マツエイ)・末孫": "① 시대가 끝날 무렵. 말기. ② 조상으로부터 먼 후손. 말예."
    紅葉狩り:
      山野に出かけて紅葉を観賞すること。もみじみ。観楓(カンプウ) 秋: 산야에 나가 단풍을 감상하는 것. 단풍놀이.
    酸模・酸葉:
      ? タデ科の多年草。道端に自生。全体に赤紫色を帯びる。初夏、淡緑色の小花を多数つける。若い茎や葉は食用になる。スカンポ。
      : "[생물] 마디풀과의 여러해살이풀. 길가에 자생하며 전체가 붉은 자주색을 띤다. 초여름에 연한 황록색 작은 꽃이 많이 피고, 어린 줄기와 잎은 식용한다."
  薬:
    典薬頭:
      ? 律令(リツリョウ)制で、宮中の医療や医薬・薬園などをつかさどった典薬寮(テンヤクリョウ)の長官。
      : 율령제에서 궁중의 의료, 의약, 약원 등을 맡던 전약료의 장관.
    当薬:
      リンドウ科の二年草。: "[생물] 용담과의 두해살이풀."
    火薬:
      熱・衝撃・摩擦などのわずかな刺激によって爆発する薬物。: 열, 충격, 마찰 등의 작은 자극으로 폭발하는 약물. 화약.
    薬:
      ? キンポウゲ科の多年草。アジア北東部原産。初夏、茎頂にボタンに似た大形で美しい紅・白色の花を開く。観賞用。根は薬用。 夏
      : "[생물] 미나리아재비과의 여러해살이풀. 초여름에 모란을 닮은 큰 홍색 또는 흰색 꽃을 피우며 뿌리는 약용한다. 작약."
    薬剤:
      調合された薬。薬品: 조제된 약. 약품.
    薬害:
      ? 薬剤により、人畜や植物などに有害な作用があること。薬の副作用などによって健康をそこなったり、ほかの病気に感染したりすることなど。
      : 약제로 인해 사람, 가축, 식물 등에 해로운 작용이 생기는 것. 약의 부작용 등으로 건강을 해치는 일.
    薬殺:
      毒薬で殺すこと。毒殺: 독약으로 죽이는 것. 독살.
    薬食い:
      冬、滋養をつけるためにシカやイノシシ・クジラなどの肉を食べること。冬: 겨울에 몸을 보하기 위해 사슴, 멧돼지, 고래 등의 고기를 먹는 것.
    野山薬:
      ヤマノイモ科のつる性多年草。: "[생물] 마과의 덩굴성 여러해살이풀."
    鹿薬:
      ? ユリ科の多年草。山地の樹陰に自生。葉はササに似る。初夏、白い小花を円錐(エンスイ)状につける。若芽は食用。
      : "[생물] 백합과의 여러해살이풀. 산지의 나무 그늘에 자라며 어린싹은 식용한다."
  血:
    地血:
      アカネ科のつる性多年草。: "[생물] 꼭두서니과의 덩굴성 여러해살이풀."
    血塗ろ:
      "①一面血に染まるさま。血まみれ。 ②苦闘するさま。": "① 온통 피로 물든 모양. 피투성이. ② 고투하는 모양."
    血戦:
      血まみれになるほど、激しく戦うこと。また、その戦い。激戦・死闘: 피투성이가 될 만큼 격렬히 싸우는 것. 또는 그런 싸움.
    血液:
      ? 動物の血管内を循環する体液。脊椎動物ではヘモグロビンという色素を含み赤く見え、軟体動物、節足動物などの無脊椎動物では淡青色を呈する。組織に酸素、栄養物質、ホルモンなどを供給し、炭酸ガス、老廃物などの排出物を運び去る。また、免疫抗体を含み、体内にはいった病原菌を殺すなど病害から動物を保護する。脊椎動物では液状の血漿(けっしょう)と固形の血球からなる。
      : "[생물] 동물의 혈관 안을 순환하는 체액. 조직에 산소와 영양분 등을 공급하고 노폐물을 운반한다."
    血税:
      ? "①血の出るような苦労をして納めた税金。重い税金。 ②兵役義務。身を国にささげて税とする意から。"
      : "① 피나는 고생을 하여 낸 세금. 무거운 세금. ② 병역 의무."
    血肉:
      "①血と肉。 ②血筋のつながっている者。親子・兄弟。骨肉": "① 피와 살. ② 혈연으로 이어진 사람. 부모 자식이나 형제."
    血脈:
      師から弟子へ受けつがれる仏法の伝統。法統: "[불교] 스승에게서 제자에게 이어지는 불법의 전통. 법통."
    血合:
      ブリ・カツオなどに見られる魚肉の血を含んだ黒ずんだ部分。: "[생물] 방어·가다랑어 등에서 보이는, 피를 포함한 검붉은 살 부분."
    血忌日:
      暦法の一つ。出血や狩猟などを忌む日。: 역법의 하나. 출혈이나 사냥 등을 꺼리는 날.
    血煙:
      人を切ったときなどの、血が飛び散るようすをけむりにたとえた語。ちけぶり。: 사람을 베었을 때 피가 흩뿌려지는 모습을 연기에 비유한 말.
    血潮・血汐:
      "①流れ出る血。 ②熱情。": "① 흘러나오는 피. ② 뜨거운 열정."
    血筋:
      "①親子・兄弟などの血のつながり。": "① 부모와 자식, 형제 등으로 이어지는 혈연."
  表:
    儀表:
      手本。模範。: 본보기. 모범.
    図表:
      数量的な関係を線や数字などで見やすく表したもの。グラフ。: 수량적 관계를 선이나 숫자 등으로 보기 쉽게 나타낸 것. 그래프.
    表札:
      戸口や門などに掲げて、居住者の氏名を表示するふだ。門標: 현관이나 문 등에 걸어 거주자의 성명을 표시하는 패. 문패.
    表沙汰:
      ? "①事柄が世間に公然と知れわたること。 ②公開された争い。訴訟や裁判沙汰。公沙汰(おおやけザタ)内沙汰"
      : "① 일이 세상에 공개적으로 알려지는 것. ② 공개된 다툼. 소송이나 재판 문제."
    表現:
      ? 精神的なものを、表情・身振り・言語・文字・色・音・形などで表すこと。また、表されたもの。表出
      : 정신적인 것을 표정, 몸짓, 언어, 문자, 색, 소리, 형태 등으로 나타내는 것. 또는 나타난 것.
    表着:
      最も外側に着る衣服。下着: 가장 바깥쪽에 입는 옷. 겉옷.
    表紙:
      ? "① 巻物を巻いた時、表になる部分に貼る布帛や紙。また、掛絵の表装。表具。② 書籍や帳簿の中身の保護、内容表示、装飾のため外側につける覆い。紙製のほか革・布・合成樹脂製等があり、上製本用表紙、くるみ表紙等の種類がある。③ 書画軸の表装に使用される紙。"
      : "① 책이나 장부의 내용을 보호하고 표시·장식하기 위해 바깥쪽에 붙이는 덮개. 표지. ② 족자나 서화의 겉장식에 쓰는 종이."
    表芸:
      "①たしなみとして習得すべき技芸。 ②専門とする技芸。本業の技芸。裏芸": "① 교양으로 익혀야 할 기예. ② 전문으로 삼는 기예. 본업의 기예."
  詩:
    詩仙:
      "①天才的な大詩人。 ②漢詩で、特に李白(リハク)を指す。": "① 천재적인 대시인. ② 한시에서 특히 이백을 가리키는 말."
    詩伯:
      すぐれた詩人。特に漢詩の大家。 詩宗(シソウ)・詩豪: 뛰어난 시인. 특히 한시의 대가.
    詩吟:
      漢詩の訓(よ)み下し文に節をつけてうたうこと。また、そのうた。: 한시의 훈독문에 가락을 붙여 읊는 것. 또는 그 노래.
    詩囊:
      詩人の作詩のもとになる思想や感情。詩想。: 시인이 시를 짓는 바탕이 되는 사상이나 감정. 시상.
    詩情:
      "①詩のもっているような情緒。詩的な味わい。 詩趣 ②詩を作りたい気分。 詩興": "① 시와 같은 정취. 시적인 맛. ② 시를 짓고 싶은 기분."
    詩歌管弦:
      ? 詩歌を吟じ、楽器を奏でること。また、風雅な文学と音楽。「管弦」は管楽器と弦楽器。広く音楽のこと。
      : 시가를 읊고 악기를 연주하는 것. 또는 풍아한 문학과 음악.
    詩箋:
      詩を書きしるす紙。: 시를 적는 종이.
    詩聖:
      "①非常にすぐれた大詩人。 ②漢詩で、特に杜甫(トホ)を指す。": "① 매우 뛰어난 대시인. ② 한시에서 특히 두보를 가리키는 말."
    詩興:
      ? "①詩を作りたいと思う気持ち。また、詩を読んで呼び覚まされる興味。 詩情 ②詩のおもしろみ。 詩趣"
      : "① 시를 짓고 싶어지는 마음. 또는 시를 읽고 일어나는 흥취. ② 시의 재미."
    詩趣:
      "①詩に表された味わい。詩のおもしろみ。 詩興 ②詩のような味わい。詩情。": "① 시에 드러난 맛. 시의 정취. ② 시와 같은 맛."
  調:
    曲調:
      音楽のふしまわし。調子。曲節。〔文明本節用集（室町中）〕: 음악의 가락. 곡조.
    調剤:
      二種類以上の薬剤を調合して薬を作ること。調薬: 두 종류 이상의 약제를 조합하여 약을 만드는 것. 조제.
    調合:
      二種類以上の薬品を、定まった分量で混ぜ合わせること。調薬・調剤: 두 종류 이상의 약품을 정해진 분량으로 섞는 것. 조합.
    調教:
      ウマ・イヌ・猛獣などを慣らしたり、芸を仕こむなどの訓練をすること。: 말, 개, 맹수 등을 길들이거나 재주를 가르치는 훈련을 하는 것.
    調査:
      物事の実態や事実を明確にするために調べること。: 사물의 실태나 사실을 분명히 하기 위해 조사하는 것.
    調貢:
      諸侯や外国の使者が、朝廷にみつぎ物を献上すること。また、そのみつぎ物。: 제후나 외국 사신이 조정에 공물을 바치는 것. 또는 그 공물.
    調う:
      ? "[ 1 ] ① 秩序のある状態になる。調和がとれる。均整がとれる。きちんとする。また、楽器などの調子が合う。② 不足なくそろう。完備する。備わる。そろう。また、用意ができる。③ ぐあいのよい状態になる。望むようにしあがる。うまくいく。できあがる。成立する。"
      : "① 질서 있는 상태가 되다. 조화가 잡히다. 균형이 맞다. 반듯해지다. 또 악기 등의 음이 맞다. ② 부족함 없이 갖추어지다. 완비되다. 준비가 되다. ③ 상태가 좋아지다. 바라던 대로 이루어지다. 잘되다. 성립하다."
  談:
    会談:
      公的に会って話し合うこと。: 공식적으로 만나 의논하는 것. 회담.
    縁談:
      縁組みの相談。特に、結婚の縁組みをすすめるための相談。: 혼인 인연을 맺기 위한 상담. 특히 결혼을 추진하는 이야기.
    談判:
      物事の決着をつけたり取り決めをしたりするため、相手方と話し合うこと。かけあい。交渉: 일을 결말짓거나 약정을 하기 위해 상대와 의논하는 것. 교섭.
    談笑:
      笑いなどを交えて楽しく会話すること。歓談: 웃음을 섞어 즐겁게 이야기하는 것. 환담.
    談言微中:
      ? 物事をはっきりと言わず、それとなく遠回しに人の急所や弱みを突く話しぶりのこと。〈『史記』〉
      : 사물을 분명히 말하지 않고 은근히 에둘러 남의 급소나 약점을 찌르는 말투.
    談話:
      "①話を交わすこと。会話 ②形式ばらずに見解などを述べること。": "① 이야기를 주고받는 것. 회화. ② 격식을 차리지 않고 견해 등을 말하는 것. 담화."
    談論風発:
      ? 談話や議論がきわめて活発に行われること。「風発」は風が吹きまくるような盛んな勢いの意。議論百出・談論風生・百家争鳴(ヒャッカソウメイ)
      : 담화나 의논이 매우 활발하게 이루어지는 것.
  豆:
    大豆粕:
      ダイズから油をしぼりとった残りのかす。肥料や飼料に用いる。: 콩에서 기름을 짜낸 뒤 남은 찌꺼기. 비료나 사료로 쓴다.
    水豆児:
      ? タヌキモ科の多年生食虫植物。池沼や水田に浮かぶ。葉は糸状に分かれ、多数の捕虫袋をもち、全体にタヌキの尾のような形をなす。夏、黄色い唇形花をつける。
      : "[생물] 통발과의 여러해살이 식충식물. 못이나 논에 떠서 자라며 벌레잡이 주머니를 가진다."
    烏豆:
      ダイズの一種。豆の皮が黒いもの。正月料理などに用いる。秋: "[생물] 콩의 한 종류. 껍질이 검은 콩. 검은콩."
    菜豆:
      マメ科のつる性一年草。 隠元豆(インゲンまめ): "[생물] 콩과의 덩굴성 한해살이풀. 강낭콩."
    蚕豆:
      ? マメ科の二年草。世界各地で栽培。春、白色または紫色の蝶(チョウ)形花が咲き、長楕円(ダエン)形で大きなさやをつける。種子は食用。 夏
      : "[생물] 콩과의 두해살이풀. 봄에 흰색 또는 자주색 꽃이 피며 씨는 식용한다. 잠두."
    鵲豆:
      ? マメ科のつる性一年草。熱帯原産で広く栽培される。夏から秋、フジに似た紫色や白色の花をつける。若いさやと熟した種子は食用。 秋
      : "[생물] 콩과의 덩굴성 한해살이풀. 어린 꼬투리와 익은 씨를 식용한다."
  負:
    勝負:
      "①「勝敗」に同じ。 ②勝ち負けを決めること。": "① 승패와 같음. ② 이기고 짐을 결정하는 것. 승부."
    自負:
      自分で自分の才能や功績などに自信をもち、誇ること。 自慢・自賛: 스스로 자신의 재능이나 공적 등에 자신을 가지고 자랑스럽게 여기는 것. 자부.
    負んぶ:
      "①背負うこと。 ②人に頼ること。特に、費用を人に払ってもらうこと。": "① 업는 것. ② 남에게 의지하는 것. 특히 비용을 남에게 부담하게 하는 것."
    負債:
      他から金銭を借りること。また、借りた金銭。債務。: 남에게서 돈을 빌리는 것. 또는 빌린 돈. 채무.
    負傷:
      けがをすること。傷を負うこと。: 다치는 것. 상처를 입는 것.
    負数:
      零より小さい数。マイナスの数。⇔正数。〔数学ニ用ヰル辞ノ英和対訳字書（1889）〕: "[수학] 0보다 작은 수. 음수."
    負笈:
      ? 本を入れたかごを背負うこと。転じて、遠い土地へ遊学すること。笈(おい)を負う。〈『抱朴子(ホウボクシ)』〉
      : 책을 넣은 상자를 지는 것. 나아가 먼 곳으로 유학 가는 것.
    負荊:
      自分の罪を深くわびること。: 자신의 죄를 깊이 사죄하는 것.
    負荷:
      "①荷物をかつぐこと。転じて、責任を負うこと。 ②機械を動かして実際に仕事をする量。": "① 짐을 지는 것. 나아가 책임을 지는 것. ② 기계를 움직여 실제로 하는 일의 양. 부하."
  起:
    起因:
      ある事柄を起こす直接の原因となること。また、その原因。起こり。: 어떤 일을 일으키는 직접 원인이 되는 것. 또는 그 원인.
    起居:
      "①立つことと座ること。立居振る舞い。挙止・挙措 ②日々の生活。起臥(キガ)": "① 서고 앉는 일. 몸가짐. ② 일상생활."
    起床:
      寝床から起き出すこと。床を離れること。起きること。: 잠자리에서 일어나는 것. 기상.
    起案:
      もとになる案や文を作ること。原案を作ること。発案・起草: 바탕이 되는 안이나 글을 만드는 것. 원안을 작성하는 것.
    起稿:
      原稿を書き始めること。起草脱稿: 원고를 쓰기 시작하는 것.
    起臥:
      起きることと寝ること。日々の生活。起き伏し。起居: 일어나고 눕는 것. 일상생활.
    起龕:
      禅宗の葬儀で、棺(ひつぎ)を送り出すこと。また、その儀式。: "[불교] 선종 장례에서 관을 내보내는 것. 또는 그 의식."
  路:
    五十路:
      "①「五十(いそ)」に同じ。 ②五〇年。五〇歳。": "① 쉰. ② 50년. 50세."
    八十路:
      "①八〇。 ②八〇歳。": "① 여든. ② 80세."
    岐路:
      "①本通りから分かれた細い道。 ②物事の本筋を外れること。また、外れたところ。": "① 큰길에서 갈라진 좁은 길. ② 사물의 본줄기에서 벗어나는 것. 또는 벗어난 곳."
    当路:
      重要な地位にいること。また、その人。: 중요한 지위에 있는 것. 또는 그런 사람.
    海路:
      海上の船の通る道。航路。うみじ。陸路(くがじ): 바다 위에서 배가 지나는 길. 항로.
    理路:
      物事の道理。考えや話などの筋道。→理路整然。: 사물의 도리. 생각이나 말의 논리적 흐름. 이치.
    路加伝:
      "『新約聖書』の四福音書(フクインショ)の第三番目の書。ルカ福音書。": "[종교] 신약성서의 네 복음서 가운데 세 번째 책. 루카 복음서."
    長道・長路:
      長く遠い道のり。遠路。: 길고 먼 거리. 먼 길.
    天路・天道:
      ? "①天上にあるというみち。また天にのぼるみち。 ②六道の一つで、天上にあるとされる世界。天上界。"
      : "① 하늘 위에 있다고 하는 길. 또는 하늘로 올라가는 길. ② [불교] 육도 가운데 하나로, 하늘 위에 있다고 여겨지는 세계. 천상계."
    十字路:
      十文字に交差している道。四つつじ。四つかど。: 십자 모양으로 교차하는 길. 네거리.
  身:
    刀身:
      刀の、鞘(さや)におさまっている部分。刀のなかみ。〔五国対照兵語字書（1881）〕: 칼에서 칼집에 들어가는 부분. 칼날.
    文身:
      ? "①肌に針や刃物で傷をつけて色素を入れ、文字・模様・絵などを彫りつけること。彫り物。仕事師や遊び人などの間で行われた。 ②顔や腕に墨汁を刺し入れて、前科者の印としたもの。"
      : "① 살갗에 바늘이나 칼로 상처를 내 색소를 넣어 문자, 무늬, 그림 등을 새기는 것. 문신. ② 얼굴이나 팔에 먹물을 넣어 전과자의 표시로 삼던 것."
    正身:
      まさしくその人。本人。当人。: 바로 그 사람. 본인. 당사자.
    現身:
      この世に存在している身。生き身。現人(うつせみ): 이 세상에 존재하는 몸. 살아 있는 몸.
    自身:
      "①自分。 ②そのもの自体。": "① 자기 자신. ② 그 자체."
    身体:
      ? "①頭・胴・手足など、肉体のすべてをまとめていう語。五体。 ②胴の部分。 ③肉体の健康状態。"
      : "① 머리, 몸통, 팔다리 등 육체 전체. 몸. ② 몸통 부분. ③ 육체의 건강 상태."
    身動ぎ:
      体を少し動かすこと。みうごき。: 몸을 조금 움직이는 것. 몸짓.
    身柱:
      ? "①灸点(キュウテン)の一つ。えりくびの下で両肩の中央部分。 ②頭に血がのぼる幼児の病気。疳(カン)。"
      : "① 뜸자리의 하나. 목덜미 아래 양어깨 중앙 부분. ② 머리에 피가 몰리는 유아의 병."
    古身・古刃:
      昔つくられた刀。古刀。: 옛날에 만들어진 칼. 고도.
    身屋・身舎:
      "①寝殿造で、家屋の中央の間。 ②離れや物置に対して住居として用いる建物。おもや。": "① 신덴즈쿠리 건축에서 집의 중앙 방. ② 별채나 창고에 상대하여 주거로 쓰는 건물. 안채."
    身請け:
      ? 芸者や遊女の前借金を代わりに支払って、年季のすまないうちに、その勤めをやめさせて引き取ること。
      : 게이샤나 유녀의 선불 빚을 대신 갚아, 계약 기간이 끝나기 전에 일을 그만두게 하고 데려가는 것.
  転:
    不見転:
      ? "①あとさきを考えずに事を行うこと。 ②芸者などが金次第で、どんな相手にも容易に身をまかせること。また、そのような女性。"
      : "① 앞뒤를 생각하지 않고 일을 하는 것. ② 기생 등이 돈에 따라 어떤 상대에게도 쉽게 몸을 맡기는 것. 또는 그런 여성."
    反転:
      糸を繰る道具。: 실을 켜는 도구.
    変転:
      状態が移り変わること。: 상태가 이리저리 바뀌는 것.
    転た寝:
      寝るつもりもないのに、ついうとうとと寝ること。仮寝(かりね)。: 잘 생각이 없었는데 그만 꾸벅꾸벅 조는 것. 선잠.
    転倒:
      ? "①逆さになること。また、逆さにすること。 ②横倒しになること。ころんで倒れること。 ③びっくりしてうろたえること。 「顚倒」の書きかえ字。"
      : "① 거꾸로 되는 것. 또는 거꾸로 하는 것. ② 넘어져 쓰러지는 것. ③ 놀라서 허둥대는 것."
    転回:
      ? "①ぐるぐる回ること。また、回すこと。回転 ②大きく回って向きを変えること。大きく向きが変わること。"
      : "① 빙빙 도는 것. 또는 돌리는 것. ② 크게 돌아 방향을 바꾸는 것."
    転寝:
      寝具の準備や着がえをしないで、その場にごろっと横になって寝ること。: 침구를 준비하거나 옷을 갈아입지 않고 그 자리에서 눕고 자는 것.
    転居:
      住居を変えること。引っ越し。転宅・転住: 사는 곳을 옮기는 것. 이사.
  軽:
    軽快:
      "①軽やかですばやいこと。 ②心がはずむさま。 ③病気がよくなること。": "① 가볍고 재빠른 것. ② 마음이 들뜨는 모양. ③ 병이 좋아지는 것."
    軽挙妄動:
      ? 事の是非をわきまえずかるがるしく行動すること。「軽挙」は軽率な行い、「妄動」は考えなしに動く意。
      : 일의 옳고 그름을 가리지 않고 경솔하게 행동하는 것.
    軽易:
      "①簡単でたやすいこと。手軽なこと。簡易 ②相手を軽んじてあなどること。軽侮": "① 간단하고 쉬운 것. 손쉬운 것. ② 상대를 가볍게 보고 업신여기는 것."
    軽減:
      負担や刑罰などを減らして軽くすること。: 부담이나 형벌 등을 줄여 가볍게 하는 것.
    軽率:
      よく考えずに物事を行うさま。: 깊이 생각하지 않고 일을 하는 모양. 경솔함.
    軽石:
      ? 軽く水に浮く石。溶岩が急に冷えてかたまるとき、ガスが抜けて穴が多くできた石。かかとなどをこするのに使う。
      : 가벼워 물에 뜨는 돌. 용암이 급히 식어 굳을 때 가스가 빠져 구멍이 많이 생긴 돌. 부석.
    軽裘肥馬:
      ? 富貴な人の外出の装いの形容。また、たいそう富貴なさま。「軽裘」は軽くて高級な皮ごろも。「肥馬」は肥えたウマの意。〈『論語』〉
      : 부귀한 사람의 외출 차림을 형용하는 말. 또는 매우 부귀한 모양.
    軽視:
      軽く見ること。軽んじること。みくびること。重視: 가볍게 보는 것. 얕보는 것. 경시.
  農:
    営農:
      農業をいとなむこと。: 농업을 경영하는 것.
    農事:
      農業の仕事や農業に関する事柄。: 농업의 일이나 농업에 관한 사항.
    農圃:
      農作物を育てる田畑。農業を行う田畑。: 농작물을 기르는 논밭. 농사를 짓는 논밭.
    農奴:
      ? 中世ヨーロッパ封建社会の農民。領主に隷属し、与えられた土地を耕作して、賦役などを納めた。奴隷と異なり人格は認められていたが、移転などの自由はなく束縛されていた。
      : 중세 유럽 봉건사회에서 영주에게 예속되어 토지를 경작하고 부역 등을 바치던 농민. 농노.
    農本主義:
      農業を重んじ、農業を、国を建設していくうえでの産業の基本とする考え方。: 농업을 중시하고 농업을 국가 건설의 산업적 기본으로 삼는 사상.
    農業:
      ? 土地を利用して作物を作ったり家畜を飼ったりして、人間生活に必要な食品・嗜好(シコウ)品や工業資材を生産する産業。
      : 토지를 이용해 작물을 재배하거나 가축을 길러 생활에 필요한 식품, 기호품, 공업 자재를 생산하는 산업.
    農繁期:
      一年のうち、季節的に植えつけや収穫などで農事の最も忙しい時期。農閑期: 한 해 중 계절적으로 파종이나 수확 등 농사일이 가장 바쁜 시기.
    農芸:
      "①農業と園芸。 ②農作物を育て作ること。また、農業に関する技術。": "① 농업과 원예. ② 농작물을 기르고 생산하는 것. 또는 농업에 관한 기술."
    農薬:
      農業用の薬品。殺虫・殺菌や除草などに使う。: 농업용 약품. 살충, 살균, 제초 등에 쓴다.
    農閑期:
      一年のうち、季節的に農作業のひまな時期。農繁期: 한 해 중 계절적으로 농사일이 한가한 시기.
    農隙:
      農作業の合間。農間。: 농사일의 틈. 농한.
  返:
    三返:
      三度すること。三回繰り返すこと。みたび。: 세 번 하는 것. 세 차례 되풀이하는 것.
    返上:
      受け取らないこと。戻すこと。また、「返す」の謙譲語で、お返しすること。: 받지 않는 것. 돌려주는 것. 또는 「돌려드리다」의 겸양어.
    返信:
      返事の手紙や通信。 往信: 답장 편지나 회신.
    返却:
      借りた物や預かった物を戻すこと。返戻: 빌린 물건이나 맡은 물건을 돌려주는 것.
    返書:
      返事の手紙。返信・返状: 답장 편지. 회신.
    返杯:
      つがれた酒を飲みほして、相手に杯を返すこと。また、その杯。: 따라 준 술을 다 마시고 상대에게 술잔을 돌려주는 것. 또는 그 잔.
    返済:
      借りた金品を返すこと。: 빌린 돈이나 물품을 갚는 것. 변제.
    返照:
      "①光が照り返すこと。照り返し。 ②夕日の輝き。夕ばえ。夕照(セキショウ)": "① 빛이 반사되어 비치는 것. ② 석양의 빛. 저녁놀."
    返納:
      受け取ったものを、もとに返し納めること。: 받은 것을 원래 있던 곳에 돌려 바치는 것.
    返還:
      一時的に譲り受けた物や借りていた物をもとに戻すこと。: 일시적으로 넘겨받거나 빌렸던 것을 원래대로 돌려주는 것. 반환.
  追:
    追儺:
      "「追儺(ツイナ)」に同じ。": 역귀를 쫓는 의식. 추나.
    追加:
      あとからつけ加えること。また、そのもの。削減・削除: 나중에 덧붙이는 것. 또는 그 자체. 추가.
    追及:
      "①逃げる相手を追いかけること。 ②追いつめて問いただすこと。": "① 달아나는 상대를 뒤쫓는 것. ② 몰아붙여 따져 묻는 것."
    追従:
      こびへつらうこと。おべっか。諫言(カンゲン): 아첨하는 것. 알랑거림.
      人につきしたがうこと。人の言うままに行うこと。追随: 남을 따라다니는 것. 남이 말하는 대로 하는 것. 추종.
    追懐:
      昔のことをなつかしく思い出すこと。追憶・追想: 옛일을 그리워하며 떠올리는 것. 추억.
    追求:
      目的物を手に入れるために、追いもとめること。: 목적물을 손에 넣기 위해 뒤쫓아 구하는 것. 추구.
    追而書:
      手紙の本文のあとにつけ加えて書くこと。また、その文章。追伸。二伸。: 편지 본문 뒤에 덧붙여 쓰는 것. 또는 그 글. 추신.
    追討:
      敵を追いかけて討つこと。追っ手をつかわして賊を討ちとること。: 적을 뒤쫓아 치는 것. 추격해 토벌하는 것.
  送:
    移送:
      人や物を他の場所へ移し送ること。: 사람이나 물건을 다른 곳으로 옮겨 보내는 것.
    送信:
      無線電信や電話などで、通信を送ること。 受信: 무선 전신이나 전화 등으로 통신을 보내는 것. 송신.
    送別:
      別れて行く人を送ること。: 떠나가는 사람을 배웅하는 것. 송별.
    送故迎新:
      ? 前任者を送りだし、新任者を迎えること。人を見送り、迎えること。「故」は古い意。〈『漢書(カンジョ)』〉
      : 전임자를 보내고 신임자를 맞이하는 것. 사람을 보내고 맞이하는 것.
    送検:
      犯罪者や被疑者、また捜査の書類などを検察庁へ送ること。: 범죄자나 피의자, 수사 서류 등을 검찰청으로 보내는 것.
    送葬:
      死者をとむらい見送ること。野辺の送り。: 죽은 이를 장례 지내며 떠나보내는 것.
    送辞:
      卒業や転任などで、別れて行く人を送る言葉。 答辞: 졸업이나 전근 등으로 떠나가는 사람을 보내는 말. 송사.
    送迎:
      人を送ったり迎えたりすること。送り迎え。: 사람을 보내고 맞이하는 것. 송영.
    送還:
      人を送り返すこと。: 사람을 돌려보내는 것. 송환.
  速:
    速写:
      写真などを、すばやく写すこと。: 사진 등을 빠르게 찍는 것.
    速射:
      銃などを、短い間隔ですばやく発射すること。: 총 등을 짧은 간격으로 빠르게 발사하는 것.
    速度:
      "①物事の進むはやさ。スピード。 ②運動する物体の、単位時間当たりの位置の変化を表す量。": "① 사물이 나아가는 빠르기. 속도. ② 움직이는 물체의 단위 시간당 위치 변화량."
    速成:
      短期間に仕上がること。急いで仕上げること。: 짧은 기간에 완성되는 것. 서둘러 완성하는 것.
    速戦即決:
      ? 戦いを長びかせず、一気に勝負を決めること。また、すみやかに物事を解決すること。 短期決戦 緩兵の計
      : 싸움을 오래 끌지 않고 단번에 승부를 내는 것. 또는 일을 신속히 해결하는 것.
    速断:
      "①すみやかに決断すること。 ②はやまった判断をすること。": "① 신속히 결단하는 것. ② 성급하게 판단하는 것."
    速歩:
      ? "①普通よりはやく歩くこと。急ぎ足。 ②ウマの歩く速度で、一分間に二一〇(メートル)進むはやさ。"
      : "① 보통보다 빠르게 걷는 것. 빠른 걸음. ② 말의 보법 중 1분에 약 210미터 나아가는 속도."
    速香:
      すぐに燃え尽きてしまうような、質の悪い香。: 금방 타 버리는 질 낮은 향.
  進:
    進化:
      ? "①生物が長い年月の間に、より複雑で高等かつ多種類に変化すること。 ②物事が発達し、進歩すること。 退化"
      : "① [생물] 생물이 오랜 세월에 걸쳐 더 복잡하고 고등하며 다양한 형태로 변하는 것. ② 사물이 발달하고 진보하는 것."
    進取:
      新しいことにも進んで取り組むこと。 退嬰(タイエイ): 새로운 일에도 적극적으로 나아가 임하는 것.
    進取果敢:
      積極的で決断力と行動力に富むこと。 勇猛果敢 優柔不断: 적극적이고 결단력과 행동력이 풍부한 것.
    進境:
      進歩して至った境地。また進歩や上達の程度。: 진보하여 이른 경지. 또는 진보나 향상의 정도.
    進士:
      ? "①昔の中国で、科挙の科目の一つ。また、その合格者。 ②律令(リツリョウ)制で、式部省が課した官吏登用試験。また、それに及第した人。文章生(モンジョウショウ)。"
      : "① 옛 중국 과거의 과목 중 하나. 또는 그 합격자. ② 율령제에서 관리 등용 시험 또는 그 합격자."
    進学:
      上級の学校に進むこと。 春: 상급 학교로 진학하는 것.
    進撃:
      軍隊で、敵陣に向かって進み、攻撃すること。 進攻 退却・撤退: 군대가 적진을 향해 나아가 공격하는 것. 진격.
    進攻:
      積極的に軍隊をすすめて攻撃をしかけること。 進撃 退却・撤退: 적극적으로 군대를 전진시켜 공격을 거는 것. 진공.
    進行:
      ? "①前に向かって進んで行くこと。 ②病気の経過が悪いほうに進むこと。 ③物事がはかどること。 ①③停止"
      : "① 앞으로 나아가는 것. ② 병의 경과가 나쁜 쪽으로 나아가는 것. ③ 일이 진척되는 것."
    進言:
      位や立場が上の人に意見を申し述べること。: 지위나 입장이 높은 사람에게 의견을 말씀드리는 것.
    進講:
      天皇や高貴な人の前で学問などの講義をすること。: 천황이나 고귀한 사람 앞에서 학문 등을 강의하는 것.
  遊:
    交遊:
      親しくつきあうこと。親しい交際。: 친하게 사귀는 것. 친밀한 교제.
    遊休:
      設備・資金などが、活用されないままにあること。: 설비나 자금 등이 활용되지 않은 채 있는 것.
    遊学:
      よその土地や国に行って学問をすること。: 다른 지방이나 나라에 가서 공부하는 것. 유학.
    遊客:
      ? "①定まった職をもたず、遊んで暮らしている人。遊び人。遊民 ②遊覧客。 ③遊郭の客。遊女を相手に遊ぶ客。嫖客(ヒョウカク)"
      : "① 일정한 직업 없이 놀며 지내는 사람. ② 유람객. ③ 유곽의 손님."
    遊牝む:
      動物の雄と雌とが交尾する。: 동물의 수컷과 암컷이 교미하다.
    遊興:
      遊び楽しむこと。特に、酒場や料理屋で楽しむこと。: 놀며 즐기는 것. 특히 술집이나 요릿집에서 즐기는 것.
    遊軍:
      ? "①待機して必要に応じて出動する予備の軍隊。 ②一定の部署につかず何か起こったときになって活動する人。"
      : "① 대기하다가 필요에 따라 출동하는 예비 군대. ② 일정한 부서에 속하지 않고 일이 생기면 활동하는 사람."
    遊閑地:
      何にも利用されていない土地。空いている土地。休閑地: 아무 데도 이용되지 않는 땅. 빈 땅.
  運:
    運休:
      運転や運航をとりやめること。「運転休止」「運航休止」の略。: 운전이나 운항을 중지하는 것.
    運営:
      機構・組織などを動かしていくこと。 経営: 기구나 조직 등을 움직여 나가는 것. 운영.
    運斤成風:
      ? 神業(かみわざ)のようなすばらしい技術。また、それをもつ職人。「運斤」は斧(おの)を振るうこと。「成風」は風を起こす意。
      : 신기에 가까울 만큼 뛰어난 기술. 또는 그런 기술을 가진 장인.
    運根鈍:
      ? 成功するには、運が強いこと、根気があること、ねばり強いことの三つが必要であるという教え。
      : 성공하려면 운, 근기, 끈기의 세 가지가 필요하다는 가르침.
    運河:
      水上交通・灌漑(カンガイ)・排水などの目的で、陸地を人工的に掘って造った水路。: 수상 교통, 관개, 배수 등을 위해 육지를 인공적으로 파서 만든 수로. 운하.
    運算:
      数式のとおりに計算して、値を出すこと。演算: 수식에 따라 계산하여 값을 구하는 것. 연산.
    運航:
      船や航空機が定まった航路を進むこと。: 배나 항공기가 정해진 항로를 운행하는 것.
    運行:
      ? "①列車や路線バスが一定の道筋にしたがって動くこと。 ②天体がそれぞれきまった軌道を進むこと。"
      : "① 열차나 노선버스가 일정한 경로를 따라 움직이는 것. ② 천체가 정해진 궤도를 나아가는 것."
  部:
    俱楽部:
      同じ目的や趣味をもつ人々が作った団体。また、その集会所。: 같은 목적이나 취미를 가진 사람들이 만든 단체. 또는 그 집회소. 클럽.
    相部屋:
      旅館や寮などで、他の人と同じ部屋になること。: 여관이나 기숙사 등에서 다른 사람과 같은 방을 쓰게 되는 것.
    蛸部屋:
      労働者を監禁同様に拘束して働かせた飯場。: 노동자를 감금하듯 묶어 두고 일하게 하던 합숙소.
    部品:
      "「ぶぶんひん（部分品）」の略。": 부분품의 준말. 부품.
    部数:
      "① 書物や雑誌・新聞などの数。冊数。② 出版物の発行数。③ 部類の数。": "① 책, 잡지, 신문 등의 수. 권수. ② 출판물의 발행 수. ③ 부류의 수."
    部族:
      一定の地域で生活し、共通の言語・宗教・文化などをもっている共同体。: 일정한 지역에서 살며 공통의 언어, 종교, 문화 등을 가진 공동체. 부족.
    部署:
      組織の中でそれぞれに割り当てられた役目や場所。持ち場。: 조직 안에서 각각 맡겨진 역할이나 자리. 부서.
    部領:
      ? "①一部族の長。集団を統率する者。 ②古代、春宮(とうぐう)坊の帯刀(たちはき)の官。皇太子の護衛をし、陣の事務を執った。"
      : "① 한 부족의 우두머리. 집단을 통솔하는 사람. ② 고대에 황태자를 호위하고 진의 사무를 맡던 관직."
  都:
    都会:
      人口が密集した、にぎやかなまち。商工業の盛んな文化的設備の整った地。都市田舎: 인구가 밀집한 번화한 도시. 상공업이 활발하고 문화 시설이 갖추어진 곳.
    都営:
      東京都の経営。また、その経営になるもの。: 도쿄도가 경영하는 것. 또는 그 경영에 속한 것.
    都塵:
      都会のちり。都会のごみごみした騒々しい環境。都会の雑踏。: 도시의 먼지. 복잡하고 시끄러운 도시 환경. 도시의 혼잡.
    都府:
      みやこ。都会。都邑(トユウ): 수도. 도시.
    都度:
      毎回。そのたびごと。: 매번. 그때마다.
    都督:
      ? "①全体を統率すること。また、その人。統率者。総大将。 ②中国の官名で、地方の軍政官。転じて、大宰府(ダザイフ)の最高責任者、大宰大弐(ダイニ)の唐名。"
      : "① 전체를 통솔하는 것. 또는 그 사람. 총대장. ② 중국의 관명으로 지방 군정관."
    都鄙:
      都会と田舎。: 도시와 시골.
    都雅:
      姿や振る舞いの上品なこと。みやびやかなこと。また、そのさま。: 모습이나 행동이 품위 있는 것. 우아한 것. 또는 그런 모양.
    首都:
      その国の中央政府がある都市。首府。: 그 나라의 중앙정부가 있는 도시. 수도.
  配:
    配下:
      ある人の支配のもとにいる人。手下・部下: 어떤 사람의 지배 아래 있는 사람. 부하.
    配偶:
      "「配偶者」の略。夫婦の一方から他方をいう言葉。つれあい。": 배우자의 준말. 부부 중 한쪽이 다른 한쪽을 이르는 말.
    配剤:
      "①薬を調合すること。 ②ほどよく取り合わせること。": "① 약을 조합하는 것. ② 알맞게 배합하는 것."
    配所:
      罪をおかして流された土地。流罪の地。: 죄를 지어 유배된 땅. 유배지.
    配管:
      ガス・水道などを通すための管を取りつけること。: 가스나 수도 등을 통하게 할 관을 설치하는 것. 배관.
    配膳:
      料理の膳を客の前にくばること。また、食卓に料理を並べること。: 음식을 담은 상을 손님 앞에 나누어 놓는 것. 또는 식탁에 음식을 차리는 것.
    配色:
      いくつかの色を調和するように組み合わせること。また、その色合い。: 여러 색을 조화되게 배합하는 것. 또는 그 색의 조합.
    配達:
      物をくばり届けること。また、その人。: 물건을 나누어 배달하는 것. 또는 그 사람.
  酒:
    三鞭酒:
      炭酸の入った白ブドウ酒。祝い事などに飲む。シャンペン。: 탄산이 들어간 백포도주. 축하 자리 등에서 마시는 샴페인.
    御酒:
      酒の美称。特に、神前に供える酒。おみき。: 술의 미칭. 특히 신 앞에 바치는 술.
    掌酒:
      神に供える酒の醸造をする人。: 신에게 바치는 술을 빚는 사람.
    混合酒:
      ウイスキー・ブランデーなど数種類の洋酒に、果汁・香料などを混ぜ合わせた飲み物。: 위스키, 브랜디 등 여러 양주에 과즙이나 향료 등을 섞은 음료. 칵테일.
    火酒:
      ? ロシア原産のアルコール度の高い蒸留酒。オオムギ・ライムギ・トウモロコシなどを原料とする。
      : 러시아 원산의 도수가 높은 증류주. 보리, 호밀, 옥수수 등을 원료로 한다. 보드카.
    灰酒:
      ? 酸化を防ぐために灰汁(あく)を入れてつくる酒。糖分を多く含み、赤くてみりんに似る。飲料・調味料として用いる。熊本特産。赤酒(あかざけ)。
      : 산화를 막기 위해 잿물을 넣어 만든 술. 당분이 많고 붉으며 미림과 비슷하다.
    神酒:
      "①神に供える酒。 ②酒の美称。また、敬称。": "① 신에게 바치는 술. ② 술의 미칭 또는 존칭."
    醇酒:
      発酵させただけの、濃いどぶろく。濁(にご)り酒・煉(ね)り酒の類。: 발효만 시킨 진한 탁주. 흐린 술의 한 종류.
    酒頰・酒面:
      酒を飲んで赤くなった顔。また、酒を飲んだように赤い顔。: 술을 마셔 붉어진 얼굴. 또는 술을 마신 듯 붉은 얼굴.
  重:
    七重八重:
      数多く重なること。また、そのもの。「七重八重に包帯を巻く」: 여러 겹으로 많이 겹치는 것. 또는 그런 것.
    重:
      弓の、手でにぎる部分を黒漆で塗り、その上を(トウ)でぎっしり巻いたもの。: 활에서 손으로 잡는 부분에 검은 옻을 칠하고 그 위를 등나무로 촘촘히 감은 것.
    重任:
      "①責任の重い仕事。重要な任務。大任。 ②任期満了後も引き続き同じ任務につくこと。再任。": "① 책임이 무거운 일. 중요한 임무. ② 임기 만료 뒤에도 계속 같은 임무를 맡는 것. 재임."
    重厚:
      重々しくどっしりと落ち着いていること。また、そのさま。: 묵직하고 듬직하게 안정되어 있는 것. 또는 그런 모양.
    重心:
      物体の各部分に作用する重力の中心点。: 물체의 각 부분에 작용하는 중력의 중심점. 무게중심.
    重播:
      ? 古代の不法な行為の一つ。他人が穀物の種を播いた上にまた種を播き、穀物の生長を妨げること。
      : 고대의 불법 행위 중 하나. 남이 곡식 씨를 뿌린 곳에 다시 씨를 뿌려 곡식의 성장을 방해하는 것.
    重症:
      病気やけがの症状が重いこと。 軽症: 병이나 부상의 증상이 무거운 것. 중증.
    重視:
      重く見ること。大切なこととして注意して見ること。 軽視: 중요하게 보는 것. 소중한 일로 주의 깊게 보는 것.
    重手・重傷:
      "「重傷(ジュウショウ)」に同じ。": 중상과 같음. 심한 부상.
    重吹く:
      雨風がしきりに強く吹く。また、しぶきが飛び散る。: 비바람이 자꾸 세차게 불다. 또는 물보라가 흩날리다.
  鉄:
    鉄亜鈴:
      鉄の棒の両端に鉄球がついた運動用具。ダンベル。: 쇠막대 양끝에 쇠공이 붙은 운동 기구. 덤벨.
    鉄人:
      鉄のように強いからだを持った人。不死身の人。: 쇠처럼 강한 몸을 가진 사람. 불사신 같은 사람.
    鉄掃箒:
      マメ科の小低木状の多年草。: "[생물] 콩과의 작은 관목 모양 여러해살이풀."
    鉄漿:
      ? 歯を黒く染めること。また、それに使う液。奈良時代に上流の女性の間で始まり、平安後期には貴族の男性も行った。江戸時代には既婚の女性のしるしとなった。かねつけ。
      : 이를 검게 물들이는 것. 또는 거기에 쓰는 액.
    鉄脚梨:
      バラ科の落葉低木。: "[생물] 장미과의 낙엽 관목."
    鉄葉:
      錫(すず)でめっきした薄い鉄板。: 주석으로 도금한 얇은 철판. 양철.
    鉄鉱:
      鉄の原料となる鉱石。赤鉄鉱・磁鉄鉱など。: 철의 원료가 되는 광석. 적철광, 자철광 등.
  銀:
    銀:
      江戸初期、豪商が朱印船貿易や外国船貿易の商人を相手に行った金融。: 에도 초기 거상이 주인선 무역이나 외국선 무역 상인을 상대로 하던 금융.
    銀世界:
      一面雪におおわれて、白一色になった景色。冬: 온통 눈으로 덮여 흰빛 일색이 된 풍경. 은세계.
    銀婚式:
      結婚して二五年目を祝う式。: 결혼 25주년을 기념하는 의식. 은혼식.
    銀将:
      ? 将棋の駒の一つ。前後の斜め左右と前方とに一つずつ動けるもの。敵陣の三段め以内にはいって成ると金将と同じ働きをする。銀。
      : 쇼기 말의 하나. 앞뒤 대각선과 앞쪽으로 한 칸씩 움직이며, 적진 안에서 승격하면 금장과 같은 기능을 한다.
    銀河:
      夜空に光の川のように見える星の集まり。あまのがわ。銀漢 秋: 밤하늘에 빛의 강처럼 보이는 별들의 모임. 은하수.
    銀灰色:
      銀色がかった灰色。シルバーグレイ。: 은빛이 도는 회색. 실버 그레이.
    銀鉱:
      "①銀を含む鉱石。 ②銀の出る鉱山。銀山・銀脈": "① 은을 포함한 광석. ② 은이 나는 광산."
    銀魚:
      シラウオ科の海魚。: "[생물] 뱅어과의 바닷물고기."
  開:
    開会:
      ? "① 会議、集会、議会などを始めること。また、展覧会、博覧会など催しの会を開くこと。⇔閉会。② 団体を組織し、発足させること。"
      : "① 회의, 집회, 의회 등을 시작하는 것. 또는 전람회나 박람회 등의 행사를 여는 것. ② 단체를 조직하여 발족시키는 것."
    開化:
      人々の知識が高まり文化が進み、社会が進歩すること。開明: 사람들의 지식이 높아지고 문화가 발달하여 사회가 진보하는 것. 개화.
    開巻有益:
      読書はたいへんためになるものだということ。「開巻」は書物を開くこと。転じて、読書。: 독서는 매우 유익하다는 뜻. 책을 펼치는 것이 곧 이롭다는 말.
    開架:
      ? 図書館の閲覧形式の一つ。書棚を閲覧者に開放し、自由に本を取り出して利用できるようにしたもの。接架閉架
      : 도서관 열람 방식의 하나. 서가를 열람자에게 개방해 자유롭게 책을 꺼내 이용할 수 있게 한 것. 개가.
    開眼:
      見えなかった目が見えるようになること。また、見えるようにすること。: 보이지 않던 눈이 보이게 되는 것. 또는 보이게 하는 것.
    開豁:
      "①広々とひらけて、眺めのよいようす。 ②心が広く、さっぱりしているようす。": "① 넓게 트여 전망이 좋은 모양. ② 마음이 넓고 시원스러운 모양."
  院:
    参議院:
      ? 衆議院とともに国会を構成し、国民から選ばれた議員で組織する立法機関。予算の議決や条約の承認などで衆議院より権限が劣るが、国会審議を慎重なものにする機能をもつ。
      : "[정치] 중의원과 함께 일본 국회를 구성하는 입법 기관. 국민이 선출한 의원으로 조직된다."
    妓院:
      遊女屋。遊郭の茶屋。妓楼・妓館・娼家(ショウカ): 유녀가 있는 집. 유곽의 찻집. 기루.
    寺院:
      "「寺(てら)」に同じ。": 절과 같음. 사원.
    朱雀院:
      ? 平安時代の離宮の一つ。嵯峨(さが)天皇以後の歴代天皇が譲位後に住んだ。京都市内の朱雀大路にあった。
      : "[지명] 헤이안 시대의 이궁 중 하나. 사가 천황 이후 역대 천황이 양위 뒤 거주했다."
    翰林院:
      ? "①中国で唐代に設けられた官庁の一つ。初め学士院といい、学者・文人に詔勅などを作らせた。翰苑(カンエン) ②「アカデミー」の訳語。学問・芸術において指導的な役割をする人の団体。"
      : "① 중국 당대에 설치된 관청의 하나. 학자와 문인에게 조칙 등을 짓게 했다. ② 아카데미의 번역어. 학문·예술에서 지도적 역할을 하는 사람들의 단체."
    衆議院:
      ? 現行憲法下で、参議院とともに日本の国会を構成し、国民によって選挙された議員で組織する立法機関。予算の議決・条約の承認などで参議院に優越する。議員の任期は四年で参議院にはない解散がある。衆院。
      : "[정치] 현행 헌법 아래 참의원과 함께 일본 국회를 구성하는 입법 기관. 국민이 선출한 의원으로 조직된다."
    院参:
      院の御所へ参上すること。: 상왕이나 법황의 거처에 나아가는 것.
    院外団:
      国会議員以外の政党員で構成され、議会外で活動を行う集団。: 국회의원이 아닌 정당원으로 구성되어 의회 밖에서 활동하는 집단.
    院宣:
      院政で、上皇や法皇の命令を文書にしたもの。院の宣旨(センジ)。: 원정에서 상왕이나 법황의 명령을 문서로 만든 것.
    院政:
      ? "①上皇や法皇が天皇に代わって自分の御所（院）で政治を行ったこと。一○八六（応徳三）年白河上皇にはじまる。 ②現役を退いた人が陰で実権を握り、実際の指示を出すこと。"
      : "① 상왕이나 법황이 천황을 대신하여 자신의 거처에서 정치를 행한 것. ② 현역에서 물러난 사람이 뒤에서 실권을 잡고 지시하는 것."
    院長:
      院の称をつけた機関、法人、施設などの長。「病院長」をいう場合が多い。: 원이라는 명칭이 붙은 기관, 법인, 시설 등의 장. 주로 병원장을 이른다.
    麴院:
      酒をつくる所。酒坊。: 술을 만드는 곳. 주조장.
  陽:
    陽光:
      太陽の光線。日光。: 태양의 빛. 햇빛.
    陽動:
      ? 敵の注意をそらすために、わざと目立つように本来の目的とは違った動きをすること。〔五国対照兵語字書（1881）〕
      : 적의 주의를 돌리기 위해 일부러 눈에 띄게 본래 목적과 다른 움직임을 하는 것. 양동.
    陽射し:
      日光がさすこと。また、その光線。: 햇빛이 비치는 것. 또는 그 빛.
    陽春:
      "①うららかな春。暖かくなり、草木が芽ぐむ春。盛春。 春 ②陰暦一月の異名。": "① 화창한 봄. 따뜻해져 초목이 싹트는 봄. ② 음력 정월의 별명."
    陽狂:
      発狂したふりをすること。また、その人。: 미친 척하는 것. 또는 그런 사람.
    陽画:
      ? 陰画をとおして感光紙に焼き付けた写真。被写体と明暗や色彩などがそのまま現れる。ポジティブ。ポジ。陰画
      : 음화를 통해 감광지에 인화한 사진. 피사체의 명암이나 색채가 그대로 나타나는 양화. 포지티브.
    陽関三畳:
      ? 別れの歌、「陽関の曲」の第四句を三度反復してうたうこと。一説に、第二句以下の三句を二度繰り返してうたうこと。別れを繰り返し惜しむことにもいう。「畳」は繰り返す意。
      : 이별 노래인 「양관곡」을 반복해 부르는 것. 이별을 거듭 아쉬워한다는 뜻으로도 쓴다.
  階:
    地階:
      建造物で地下にある階。: 건축물에서 지하에 있는 층. 지하층.
    沿階草:
      ユリ科の多年草。: "[생물] 백합과의 여러해살이풀."
    越階:
      位階をとび越えて昇進すること。越任(オツニン)。: 위계를 뛰어넘어 승진하는 것.
    階位:
      ? "① 階級。位階。〔布令必用新撰字引（1869）〕② 仏語。発心してから悟りを得るまでの修行の階程。菩薩の五十二位、声聞の四向四果など。"
      : "① 계급. 위계. ② [불교] 발심에서 깨달음에 이르기까지의 수행 단계."
    階前万里:
      ? 遠くのことが手近にあるかのように分かること。天子が地方の政治状況を宮殿の階段の前にあるかのようによく知っていて、臣下は天子を欺くことができないこと。〈『新唐書(シントウジョ)』〉
      : 먼 곳의 일도 가까이 있는 것처럼 훤히 아는 것.
    階層:
      ? "①建物の上下の重なり。 ②社会の構成員を地位・財産・職業などで分類した場合のそれぞれの集団。階級"
      : "① 건물의 위아래 겹침. 층. ② 사회 구성원을 지위, 재산, 직업 등으로 분류했을 때의 각 집단. 계층."
    階梯:
      "①階段。はしご。 ②学問・芸術などを学ぶための順序。特に、初歩の段階。手引き。": "① 계단. 사다리. ② 학문이나 예술 등을 배우기 위한 순서. 특히 초보 단계의 안내."
    階級:
      "①地位・身分などの等級・段階。 ②社会における家柄・身分・財産などが同じ集団。階層": "① 지위나 신분 등의 등급·단계. ② 사회에서 가문, 신분, 재산 등이 같은 집단. 계층."
    音階:
      音楽に用いる音を一定の音程で高さの順に並べたもの。ドレミの類。: 음악에 쓰는 음을 일정한 음정으로 높이 순서에 따라 배열한 것. 음계.
  集:
    画集:
      絵を集めて一冊の本にしたもの。また、絵を複製印刷し、本に仕立てたもの。: 그림을 모아 한 권의 책으로 만든 것. 또는 그림을 복제 인쇄해 책으로 꾸민 것.
    集会:
      "①多くの人が集まること。また、その集まり。 ②衆徒が会合すること。": "① 많은 사람이 모이는 것. 또는 그 모임. ② 무리가 회합하는 것."
    集合:
      ? "①一か所に寄り合うこと。 解散 ②数学で、一定の条件・範囲にあてはまるものを一つの全体と見なしたもの。"
      : "① 한곳에 모이는 것. ② [수학] 일정한 조건이나 범위에 맞는 것을 하나의 전체로 본 것. 집합."
    集散:
      集まることと散らばること。: 모이는 것과 흩어지는 것.
    集結:
      一か所に集めること。また、集まること。 結集: 한곳에 모으는 것. 또는 모이는 것. 집결.
    集荷:
      商品などの荷物を一か所に集めること。また、その荷物。 「蒐荷」の書きかえ字。: 상품 등의 짐을 한곳에 모으는 것. 또는 그 짐.
    集計:
      数値を集めて合計すること。また、その数。: 수치를 모아 합산하는 것. 또는 그 수.
    集魚灯:
      ? 夜、魚が光に集まってくる習性を利用して、漁をするとき海上や海中にともす明かり。いさり火。
      : 밤에 물고기가 빛에 모이는 습성을 이용하여, 고기잡이할 때 바다 위나 물속에 켜는 등불.
  面:
    九面芋:
      サトイモの一品種。親芋を中心に小芋がたくさんできて大きな塊となる。茎と芋は食用。秋: "[생물] 토란의 한 품종. 어미 토란을 중심으로 작은 토란이 많이 생겨 큰 덩어리가 된다."
    圧面:
      ? 能面の一つ。下あごが大きく張り、上下の唇を強く食いしばり、目をむいた形相の面。天狗(テング)や鬼神・鬼畜に扮(フン)するときに用いる。
      : 노가면의 하나. 아래턱이 크게 벌어지고 입술을 굳게 다문 험한 표정의 가면.
    地面:
      "① 土地の表面。平地の面。地上。地表。じべた。② 土地。地所。宅地。": "① 땅의 표면. 지면. ② 토지. 대지."
    正面:
      "①まっすぐ向かい合うこと。ましょうめん。 ②きちんとして正常なこと。まじめ。": "① 똑바로 마주 보는 것. 정면. ② 바르고 정상적인 것. 성실함."
    真面:
      "①まっすぐに向かい合うこと。 ②正しく、きちんとしていること。まじめ。": "① 똑바로 마주 보는 것. ② 바르고 단정한 것. 성실함."
    紙面:
      ? "① 紙のおもて。紙の表面。〔色葉字類抄（1177‐81）〕② 紙に書いた文書、手紙の類。書面。また、その文面。③ 新聞などの記事の載っている面。また、その記事。紙上。"
      : "① 종이의 표면. ② 종이에 쓴 문서나 편지. ③ 신문 등의 기사가 실린 면. 또는 그 기사."
    面相:
      人の顔つき。顔かたち。人相: 사람의 얼굴 생김새. 인상.
    面談:
      直接会って話をすること。: 직접 만나 이야기하는 것. 면담.
    酒頰・酒面:
      酒を飲んで赤くなった顔。また、酒を飲んだように赤い顔。: 술을 마셔 붉어진 얼굴. 또는 술을 마신 듯 붉은 얼굴.
    出面・出頰:
      "①顔出しすること。 ②日雇い労働者の日給。": "① 얼굴을 내미는 것. 참석하거나 모습을 보이는 것. ② 일용 노동자의 하루 품삯."
  題:
    品題:
      経の内容を章や編に分けたもの。経の題目。: 경전의 내용을 장이나 편으로 나눈 것. 경전의 제목.
    問題:
      ? "①解答を必要とする問い。 ②解決すべき事柄。また、やっかいな事柄や争いの原因になるような事件。 ③人の注目を集めていること。論争やうわさを引き起こしている事柄。話題"
      : "① 해답이 필요한 물음. ② 해결해야 할 일. 또는 성가신 일이나 다툼의 원인이 되는 사건. ③ 사람들의 주목을 끄는 일. 화제."
    演題:
      演説や講演などの題目。: 연설이나 강연 등의 제목.
    解題:
      "①問題を解くこと。 ②書物の成立年代・著者・内容などについて解説すること。": "① 문제를 푸는 것. ② 책의 성립 연대, 저자, 내용 등을 해설하는 것."
    題名:
      題目の名。特に書物・詩文などの標題をいう。: 제목의 이름. 특히 책이나 시문 등의 표제.
    題字:
      書物や画幅、石碑などの上に題として記す文字。: 책, 그림, 비석 등에 제목으로 적는 글자.
    題画:
      絵に詩や文を書き加えたもの。また、詩や文の内容を表現した絵。: 그림에 시나 글을 덧쓴 것. 또는 시나 글의 내용을 표현한 그림.
    題目:
      ? "①書物や文章などの題名。表題。タイトル。 ②研究や討論などにおける問題点。主題。テーマ。 ③日蓮(にちれん)宗で唱える「南無妙法蓮華経(ナムミョウホウレンゲキョウ)」の七字。おだいもく。"
      : "① 책이나 글 등의 제목. 표제. ② 연구나 토론 등의 문제점. 주제. ③ [불교] 일련종에서 외는 「남묘호렌게쿄」 일곱 글자."
    題簽:
      和漢書などで、題名を書いて表紙にはる細長い紙や布。また、その題字や題名。: 일본·중국식 책 등에서 제목을 써 표지에 붙이는 길고 좁은 종이나 천. 또는 그 제목 글자.
    題詠:
      与えられた題から詩歌・俳句をよむこと。また、その詩歌・俳句。雑詠: 주어진 제목으로 시가나 하이쿠를 짓는 것. 또는 그 작품.
    題跋:
      書物・書画などの題辞と跋文(バツブン)。序文とあと書き。: 책이나 서화 등의 제사와 발문. 서문과 후기.
    題辞:
      書物の巻頭や画幅、石碑などの初めに記す言葉。題詞。題言。: 책의 첫머리나 그림, 비석 등의 처음에 적는 말. 제사.
  飲:
    痛飲:
      大いに酒を飲むこと。: 술을 실컷 마시는 것.
    長夜の飲:
      夜明けまで続けられるぜいたくな酒宴のこと。: 새벽까지 계속되는 호화로운 술잔치.
    飲水思源:
      ? 物事の基本を忘れてはならないたとえ。また、人から受けた恩を忘れてはいけないという戒め。水を飲むとき、その水源のことを思う意から。飲水懐源得魚忘筌(トクギョボウセン)
      : 사물의 근본을 잊어서는 안 된다는 비유. 또는 받은 은혜를 잊지 말라는 교훈.
    飲河満腹:
      ? 人にはそれぞれ分があり、分に応じて満足すべきことをいう。モグラが大河の水を飲んでも、小さな腹を満たしただけで満足するという意から。〈『荘子(ソウジ)』〉飲河の願い・偃鼠飲河(エンソインガ)
      : 사람에게는 각자 분수가 있어 그 분수에 맞게 만족해야 한다는 뜻.
    飲泣:
      ? 涙が流れ伝わって口にはいること。転じて、声を立てずに泣くこと。すすり泣き。しのび泣き。
      : 눈물이 흘러 입에 들어가는 것. 나아가 소리 내지 않고 우는 것. 흐느낌.
    飲灰洗胃:
      心の奥底から改心すること。灰を飲んで胃の中の汚れを洗い清める意から。: 마음속 깊은 곳에서부터 뉘우치고 고치는 것.
    飲至策勲:
      ? 勝ち戦のあと、祖先の廟(ビョウ)の前で報告し、祝杯をあげ、戦功を竹の札（策）に書き記すこと。〈『春秋左氏伝』〉
      : 승전 뒤 조상의 묘 앞에 보고하고 축배를 들며 전공을 기록하는 것.
    飲食:
      飲むことと食べること。また、食べ物と飲み物。: 마시는 것과 먹는 것. 또는 음식과 음료.
  館:
    公館:
      官庁の建物。特に、大使館・公使館・領事館など。: 관청의 건물. 특히 대사관, 공사관, 영사관 등.
    博物館:
      ? 歴史・芸術・民俗・科学などの資料を広く集めて保管・整理し、陳列して一般に公開する施設。
      : 역사, 예술, 민속, 과학 등의 자료를 널리 모아 보관·정리하고 전시하여 일반에 공개하는 시설. 박물관.
    帰館:
      やかたに戻ること。また、わが家に戻ること。帰宅: 관저나 집으로 돌아가는 것. 귀가.
    捐館:
      身分の高い人の死。: 신분이 높은 사람의 죽음.
    旅館:
      ? 人を宿泊させることを業とする家。また、旅先で泊まる家。やどや。はたごや。旅舎。旅宿。旅亭。旅店。
      : 사람을 숙박시키는 일을 업으로 하는 집. 또는 여행지에서 묵는 집. 여관.
    館第:
      ? やしき。〔唐書、韓滉伝〕石頭の五をく。～第數十を石頭に置き、井をつこと皆百尺なり。字通「館」の項目を見る。
      : 저택.
    館長:
      公民館、図書館、博物館など館と称する機関の長。: 공민관, 도서관, 박물관 등 관이라 부르는 기관의 장.
    鴻臚館:
      古代、北九州の筑紫(つくし)や平安京などに設けた、外国使節を応接する施設。: 고대에 북규슈의 쓰쿠시나 헤이안쿄 등에 설치한 외국 사절 접대 시설.
  駅:
    宿駅:
      ? 昔、交通の要所にあって旅客の宿泊やウマ・駕籠(かご)などを乗り換える設備のあった所。宿場。
      : 옛날 교통 요지에 있어 여행객 숙박과 말·가마 교체 시설을 갖춘 곳. 역참.
    駅亭:
      "①街道にあった宿駅の建物。駅舍 ②近世の宿場のやど。旅館。": "① 가도에 있던 역참의 건물. ② 근세 숙장의 여관."
    駅伝:
      ? "①「駅伝競走」の略。長い道のりを数区間に分け、各チームが一人一区間ずつを走り、総所要時間を競う競技。 ②「駅逓①」に同じ。 ③昔、宿場間で乗り継ぎに使ったウマ。"
      : "① 긴 거리를 여러 구간으로 나누어 각 팀이 한 사람씩 한 구간을 달려 총 시간을 겨루는 경기. 역전. ② 옛 역참 제도. ③ 옛날 숙장 사이에서 갈아타던 말."
    駅員:
      鉄道の駅の従業員。: 철도역의 직원. 역무원.
    駅舎:
      "①鉄道で、駅の建物。 ②「駅亭」に同じ。": "① 철도역의 건물. 역사. ② 역정과 같음."
    駱駅:
      人馬の往来が絶え間なく続くさま。: 사람과 말의 왕래가 끊임없이 이어지는 모양.
  鼻:
    鼻っ柱:
      人と張り合う気持ち。負けん気。向こう気。はなっぱし。はなばしら。: 남과 맞서려는 기질. 지기 싫어하는 마음.
    鼻元思案:
      目先だけの浅はかな考え。思いつき。: 눈앞의 일만 보는 얕은 생각. 즉흥적인 생각.
    鼻摘み:
      まわりの人からひどく嫌われること。また、その人。: 주변 사람들에게 몹시 미움을 받는 것. 또는 그런 사람.
    鼻白む:
      気おくれした顔つきや興ざめした顔つきをする。: 주눅 든 표정이나 흥이 깨진 표정을 짓다.
    鼻祖:
      物事を最初に始めた人。始祖。元祖。〈『漢書(カンジョ)』〉: 어떤 일을 처음 시작한 사람. 시조. 원조.
    鼻緒:
      下駄(ゲタ)や草履などのはき物の、足の指をかける部分。また、そのひも。: 게타나 짚신 등 신발에서 발가락을 걸치는 부분. 또는 그 끈.
    鼻茸:
      鼻の穴に、粘膜の炎症によりできるはれもの。: 코 안에 점막 염증으로 생기는 종기. 비용.
