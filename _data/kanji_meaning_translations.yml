薬:
  くすり。病気やけがの治療にききめのあるもの。: 약. 병이나 상처 치료에 효과가 있는 것.
  化学変化を起こさせる物質。: 화학 변화를 일으키는 물질.
血:
  ち。ちしお。: 피. 혈액.
  ちのつながり。ちを分けた間がら。ちすじ。: 피의 이어짐. 혈연 관계. 혈통.
  ちが出るほどはげしいさま。: 피가 날 정도로 격렬한 모양.
  いきいきとさかんなさま。: 생생하고 왕성한 모양.
表:
  おもて。うわべ。物事の外側にあらわれた部分。: 겉. 표면. 사물의 바깥쪽에 드러난 부분.
  あらわす。あらわれる。: 나타내다. 나타나다.
  しるし。めじるし。: 표식. 표지.
  のり。手本。: 법도. 본보기.
  主君や役所に申し出る文書。: 주군이나 관청에 아뢰는 문서.
  事柄が一目でわかるように整理して記したもの。: 일을 한눈에 알 수 있도록 정리해 적은 것.
詩:
  し。うた。心に感じたことを一定のリズムと形式にあてはめ、言葉で表したもの。: 시. 노래. 마음에 느낀 것을 일정한 리듬과 형식에 맞추어 말로 나타낸 것.
  からうた。漢文。: 중국 시. 한문.
調:
  ととのう。ととのえる。ほどよくする。つりあう。: 고르다. 가지런히 하다. 알맞게 하다. 조화를 이루다.
  やわらぐ。やわらげる。: 누그러지다. 누그러뜨리다.
  あざける。からかう。: 비웃다. 놀리다.
  しらべる。: 조사하다.
  しらべ。詩や音楽のリズム。: 가락. 시나 음악의 리듬.
  ようす。状態。: 모양. 상태.
  みつぎ。古代の税制の一つ。: 공물. 고대 세제의 하나.
談:
  かたる。はなす。はなし。はなしあい。: 말하다. 이야기하다. 이야기. 의논.
豆:
  まめ。マメ科の植物の総称。五穀の一つ。: "[생물] 콩. 콩과 식물의 총칭. 오곡의 하나."
  たかつき。食物を盛る脚のついた器。: 굽다리 그릇. 음식을 담는 다리 달린 그릇.
  "「伊豆(いず)の国」の略。": "「이즈국」의 준말."
負:
  おう。せおう。になう。: 지다. 등에 지다. 떠맡다.
  受ける。こうむる。: 받다. 입다.
  たよる。たのむ。たのみとする。: 의지하다. 믿다. 믿음으로 삼다.
  そむく。さからう。: 등지다. 거스르다.
  まける。戦いや競争にまける。: 지다. 싸움이나 경쟁에서 지다.
  〇より小さい数。マイナス。: 0보다 작은 수. 마이너스.
起:
  おきる。たつ。立ちあがる。: 일어나다. 서다. 몸을 일으키다.
  おこす。はじめる。: 일으키다. 시작하다.
  おこる。おこり。はじまり。: 일어나다. 발생하다. 시작. 원인.
路:
  みち。人や車の行き来するみち。: 길. 사람이나 차가 오가는 길.
  物事のすじみち。道理。: 사물의 조리. 이치.
  重要な地位。: 중요한 지위.
  くるま。: 수레.
身:
  み。からだ。: 몸. 신체.
  おのれ。みずから。じぶん。: 자기. 스스로. 자신.
  物のなかみ。本体。: 물건의 속. 본체.
転:
  ころがる。ころがす。まわる。まわす。: 구르다. 굴리다. 돌다. 돌리다.
  ころぶ。ひっくり返る。: 넘어지다. 뒤집히다.
  うつす。うつる。位置をかえる。: 옮기다. 옮겨지다. 위치를 바꾸다.
  うつる。うつりかわる。: 변하다. 옮겨 가다.
  うたた。ますます。: 더욱더. 점점 더.
軽:
  かるい。重量や程度が少ない。: 가볍다. 무게나 정도가 적다.
  かろやか。動きがなめらかである。: 경쾌하다. 움직임이 부드럽고 가볍다.
  かるがるしい。落ち着きがない。: 경솔하다. 침착하지 못하다.
  かろんじる。あなどる。: 가볍게 여기다. 업신여기다.
農:
  たがやす。作物をつくる。: 갈다. 농작물을 기르다.
  たがやす人。: 농사짓는 사람.
返:
  かえる。かえす。もとへ戻す。: 돌아가다. 돌려보내다. 원래대로 되돌리다.
  回数を数える語。: 횟수를 세는 말.
追:
  おいかける。あとをしたう。: 뒤쫓다. 뒤를 따르다.
  おいはらう。: 쫓아내다.
  たずね求める。: 캐묻고 추구하다.
  あとからつけ加える。: 나중에 덧붙이다.
  過去にさかのぼる。: 과거로 거슬러 올라가다.
送:
  おくる。: 보내다.
  人を見おくる。見おくり。: 사람을 배웅하다. 배웅.
  おくりとどける。: 보내어 닿게 하다.
速:
  はやい。すみやか。: 빠르다. 신속하다.
  はやさ。: 빠르기. 속도.
進:
  すすむ。すすめる。前へ出る。: 나아가다. 나아가게 하다. 앞으로 나오다.
  のぼる。上の段階へあがる。: 오르다. 윗단계로 올라가다.
  よくなる。向上する。: 좋아지다. 향상하다.
  "～": 내밀다. 올리다.
遊:
  あそぶ。楽しむ。: 놀다. 즐기다.
  勉学などのために他国へ行く。旅をする。: 배움 등을 위해 다른 나라나 지방으로 가다. 여행하다.
  自由に動きまわる。: 자유롭게 움직이다.
  使われずにいる。: 쓰이지 않은 채 있다.
  つきあう。: 사귀다.
  あそび。ゆとり。よゆう。: 놀이. 여유. 빈틈.
運:
  はこぶ。うつす。: 나르다. 옮기다.
  めぐる。まわる。うごく。: 돌다. 회전하다. 움직이다.
  めぐらす。動かす。する。: 돌리다. 움직이다. 운영하다.
  めぐりあわせ。さだめ。: 운수. 운명.
部:
  わける。また、分けたものの一つ一つ。: 나누다. 또는 나눈 것 하나하나.
  すべる。統率する。: 거느리다. 통솔하다.
  組織上の区分。くみ。: 조직상의 구분. 부서.
  集落。むれ。: 마을. 무리.
  つかさ。役所。: 관청. 관아.
  新聞や書物などの分量や冊数。: 신문이나 책 등의 분량이나 부수.
都:
  みやこ。: 도읍. 수도.
  天子の居城のあるところ。: 천자의 거성이 있는 곳.
  にぎやかな大きなまち。: 번화한 큰 도시.
  みやびやか。美しい。: 우아하다. 아름답다.
  統べる。まとめる。: 거느리다. 통괄하다.
  すべて。ことごとく。: 모두. 전부.
  東京都のこと。: 도쿄도를 이르는 말.
配:
  くばる。わりあてる。: 나누어 주다. 할당하다.
  ならぶ。ならべる。くみあわせる。とりあわせる。: 늘어서다. 늘어놓다. 조합하다. 배합하다.
  つれあい。夫婦の一方。: 배우자. 부부의 한쪽.
  したがえる。とりしまる。: 거느리다. 다스리다.
  ながす。島流しにする。: 유배 보내다.
酒:
  さけ。さけを飲む。さかもり。: 술. 술을 마시다. 술자리.
重:
  めかたがおもい。おもさ。: 무게가 무겁다. 무게.
  程度がはなはだしい。ひどい。: 정도가 심하다. 중하다.
  おもんじる。たいせつにする。: 중요하게 여기다. 소중히 하다.
  おもおもしい。: 무게감 있고 점잖다.
  "～": 거듭하다. 겹치다. 되풀이하다.
  軽: 겹. 겹친 것을 세는 말.
鉄:
  てつ。金属元素の一つ。くろがね。: 철. 금속 원소의 하나.
  刃物。兵器。: 칼붙이. 병기.
  てつのようにかたく強い。: 철처럼 단단하고 강하다.
  "「鉄道」の略。": 철도의 준말.
銀:
  ぎん。しろがね。金属元素の一つ。: 은. 금속 원소의 하나.
  ぎんに似た輝きのある白色。: 은과 비슷한 광택이 있는 흰색.
  貨幣。おかね。: 화폐. 돈.
  将棋の駒(こま)の一つ。: 장기 말의 하나.
開:
  ひらく。あく。あける。: 열리다. 열다.
  はじまる。はじめる。: 시작되다. 시작하다.
  閉: 트이다. 땅을 개척하다. 문화를 발전시키다.
院:
  かき。かきね。かこい。土べい。: 울타리. 담. 둘러친 것. 흙담.
  かきねをめぐらした庭や建物。宮殿・役所・寺・学校など。: 울타리를 두른 뜰이나 건물. 궁전, 관청, 절, 학교 등.
  上皇や法皇などの敬称。また、その御所。: 상황이나 법황 등의 경칭. 또는 그 거처.
陽:
  ひ。日の光。: 해. 햇빛.
  ひなた。日のあたる側。: 양지. 해가 드는 쪽.
  あたたかい。あかるい。: 따뜻하다. 밝다.
  易で、能動的・積極的なもの。: 역학에서 능동적이고 적극적인 것.
  いつわる。みせかける。: 속이다. 겉으로 꾸미다.
  電気・磁気の正極。プラス。: 전기나 자기의 양극. 플러스.
階:
  かいだん。きざはし。はしご。: 계단. 사다리.
  建物の層。: 건물의 층.
  等級。しな。くらい。: 등급. 품계. 지위.
集:
  あつまる。あつめる。つどう。よせあつめる。: 모이다. 모으다. 집합하다. 끌어모으다.
  あつまり。つどい。: 모임. 집회.
  作品をあつめたもの。: 작품을 모은 것.
面:
  おも。おもて。人の顔。つら。: 얼굴. 낯.
  顔につけるかぶり物。おめん。: 얼굴에 쓰는 덮개. 가면.
  向き合う。顔を合わせる。: 마주하다. 얼굴을 맞대다.
  うわべ。物のおもて。: 겉. 물건의 표면.
  文字などの記されたところ。: 문자 등이 적힌 곳.
  むき。方向。: 방향. 방면.
題:
  あたま。はじめ。書物などの巻頭。: 머리. 시작. 책 등의 권두.
  だい。書物や作品の名。見出し。しるし。: 제목. 책이나 작품의 이름. 표제. 표시.
  問い。解決を求められている事柄。: 물음. 해결을 요구받는 일.
  しるす。詩や文字などを書きしるす。: 적다. 시나 문자 등을 써 넣다.
  品さだめをする。: 품평하다.
飲:
  のむ。のみこむ。のみもの。: 마시다. 삼키다. 마실 것.
  こらえる。感情をかくす。: 참다. 감정을 숨기다.
館:
  やかた。やしき。: 저택. 집.
  やど。やどや。: 숙소. 여관.
  人の集まる建物。また、公共の施設。: 사람이 모이는 건물. 또는 공공시설.
駅:
  えき。鉄道の停車場。: 역. 철도의 정거장.
  はやうま。つぎうま。宿場ごとに用意して乗り継ぐウマ。また、舟や車など。: 빠른 말. 역참마다 준비해 갈아타는 말. 또는 배나 수레.
  うまや。馬継ぎ場。宿場。: 마구간. 말 갈아타는 곳. 역참.
鼻:
  はな。呼吸や嗅覚(キュウカク)をつかさどる器官。: 코. 호흡과 후각을 맡는 기관.
  はじめ。: 처음. 시초.
斜:
  ななめ。かたむき。はす。はすかい。: 비스듬함. 기울어짐. 비껴 있음. 대각선으로 엇갈림.
茅:
  かや。ススキ・すげなどイネ科やカヤツリグサ科の多年草の総称。: 지붕을 이는 데 쓰는 풀. 억새·사초 등 벼과나 사초과 여러해살이풀의 총칭.
葺:
  ふく。かや・かわらなどで屋根をおおう。: 지붕을 이다. 띠풀·기와 등으로 지붕을 덮다.
  つくろう。なおす。: 수리하다. 고치다.
啼:
  なく。鳥や獣などが鳴く。: 울다. 새나 짐승 등이 소리를 내다.
  人が涙を流して泣く。: 사람이 눈물을 흘리며 울다.
耨:
  くわ。くわで草をかる。くさぎる。すく。: 괭이. 괭이로 풀을 베다. 김매다. 갈다.
井:
  い。いど。: 우물.
  いげた（井桁）の形。また、いげたのように整っているさま。: 우물 정자 모양. 또는 우물 정자 모양처럼 반듯하게 정돈된 모양.
  まち。人が集まっている場所。: 마을. 사람이 모여 사는 곳.
欠:
  (A)ケツ ［缺］: 빠짐. 이 글자는 「缺」의 신자체로 쓰인다.
  かく。かける。あるべきものが足りない。: 빠지다. 이지러지다. 있어야 할 것이 모자라다.
夫:
  おとこ。一人前の男。: 남자. 성인 남자.
  おっと。: 남편.
不:
  …ず。…でない。…しない。打ち消しの助字。: …않다. …이 아니다. …하지 않는다. 부정을 나타내는 조자.
氏:
  うじ。みょう字。姓。同じ血族の集団。: 씨족. 성씨. 같은 혈족의 집단.
  人を表す語。おもに男性を指す。: 사람을 가리키는 말. 주로 남성을 가리킨다.
  姓名の下に添える敬称。: 성명 뒤에 붙이는 경칭.
失:
  うしなう。なくす。: 잃다. 없애다.
付:
  つける。つく。: 붙이다. 붙다.
  あたえる。わたす。: 주다. 건네다.
  たのむ。まかせる。: 부탁하다. 맡기다.
功:
  いさお。すぐれた仕事。てがら。: 공적. 뛰어난 일. 공로.
末:
  すえ。: 끝. 말미.
  枝の先。物のはし。: 가지 끝. 물건의 끝.
  つまらない。大切でない。: 하찮다. 중요하지 않다.
令:
  いいつける。命じる。いいつけ。: 명령하다. 시키다. 명령.
  のり。きまり。おきて。: 법. 규칙. 명령.
  おさ。長官。: 우두머리. 장관.
  よい。りっぱな。: 좋다. 훌륭하다.
  他人の親族に対する敬称。: 다른 사람의 친족에 대한 경칭.
札:
  ふだ。文字を書いた木や紙などのふだ。: 표찰. 글자를 쓴 나무나 종이 등의 패.
  かきもの。手紙。: 글. 편지.
  証拠となる文書。証文。: 증거가 되는 문서. 증서.
  競売や請負などで価格を書いて出すふだ。いれふだ。: 경매나 도급 등에서 가격을 써서 내는 표. 입찰표.
  さつ。紙幣。: 지폐.
  さね。よろいやかぶとの材料になる、鉄や革の小板。: 갑옷이나 투구의 재료가 되는 쇠나 가죽의 작은 판.
  わかじに。夭折(ヨウセツ)する。: 젊어서 죽다. 요절하다.
  乗車券。切符。: 승차권. 표.
包:
  つつむ。くるむ。つつみ。: 싸다. 감싸다. 꾸러미.
辺:
  あたり。ほとり。そば。: 근처. 물가. 곁.
  ふち。へり。: 가장자리. 테두리.
  はずれ。国ざかい。: 변두리. 국경.
  はて。かぎり。: 끝. 한계.
  多角形を作っている線分。: 다각형을 이루는 선분.
必:
  かならず。きっと。まちがいなく。: 반드시. 꼭. 틀림없이.
  ぜひともしなければならない。: 반드시 해야 한다.
以:
  …から。…より。時間・範囲・方向の起点を示す語。: …부터. …보다. 시간·범위·방향의 기점을 나타내는 말.
  もって。…を。…によって。目的・手段・原因を示す語。: …로써. …을. …에 의해. 목적·수단·원인을 나타내는 말.
  もってする。もちいる。使う。: 사용하다. 쓰다.
  おもう。おもうに。: 생각하다. 생각건대.
  ゆえ。理由。: 까닭. 이유.
司:
  つかさどる。役目としてとりおこなう。: 맡아 다스리다. 직무로서 처리하다.
  つかさ。役所。役人。: 관청. 관직. 관리.
  うかがう。観察する。: 살피다. 관찰하다.
未:
