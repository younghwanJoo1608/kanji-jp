name: Build and Deploy Jekyll

on:
  push:
    branches: ["feat"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, pages: write, id-token: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }  # 커밋 기록 필요

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1' # .ruby-version 파일이 있다면 그것을 따르는 것이 좋음

      # 커밋 시간 수집 → _data/lastmod.yml 생성 (Ruby 스크립트 사용)
      - name: Generate lastmod data
        run: ruby update_lastmod.rb

      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: _site
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
