  状態を表す形容詞のあとに添える語。: 상태를 나타내는 형용사 뒤에 붙이는 말.
  しかし。しかして。しからば。しかるに。接続の助字。: 그러나. 그리고. 그렇다면. 그런데. 접속을 돕는 글자.
  もえる。: 타다.
隊:
