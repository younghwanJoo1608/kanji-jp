<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ "/assets/css/kanji.css" | relative_url }}?v={{ site.time | date: "%s" }}">
    {{ head }}
  </head>
  <body>
    <header class="site-header">
      <a class="site-title" href="{{ "/" | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav">
        <a href="{{ "/kanken/" | relative_url }}"{% if page.url contains '/kanken/' %} class="active"{% endif %}>칸켄 급수별 한자 목록</a>
        <a href="{{ "/jis/" | relative_url }}"{% if page.url contains '/jis/' %} class="active"{% endif %}>JIS 수준별 한자 목록</a>
        <a href="{{ "/strokes/" | relative_url }}"{% if page.url contains '/strokes/' %} class="active"{% endif %}>획수별 한자 목록</a>
        <a href="{{ "/kokuji/" | relative_url }}"{% if page.url contains '/kokuji/' %} class="active"{% endif %}>일본의 국자</a>
        <a href="{{ "/search/" | relative_url }}"{% if page.url contains '/search/' %} class="active"{% endif %}>
          <svg class="nav-search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6"></circle>
            <path d="m16 16 4 4"></path>
          </svg>
          <span>검색</span>
        </a>
        <a href="{{ "/about/" | relative_url }}" class="about-link{% if page.url contains '/about/' %} active{% endif %}">About</a>
      </nav>
    </header>

    <main class="container">
      {{ content }}
    </main>

    <footer class="site-footer">
      <small>© {{ site.time | date: "%Y" }} {{ site.title }}</small>
    </footer>
  </body>
</html>
